<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Volné myšlenkové mapy – aplikace v jediném HTML souboru.">
<title>Myšlenkové mapy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b6ef0' stroke-width='2' stroke-linecap='round'%3E%3Ccircle cx='12' cy='6' r='3'/%3E%3Ccircle cx='5.5' cy='18' r='2.6'/%3E%3Ccircle cx='18.5' cy='18' r='2.6'/%3E%3Cpath d='M10 8.3 7 15.6M14 8.3l3 7.3M8.1 18h7.8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --bg-2:#ffffff; --bg-3:#eef0f4;
  --fg:#1c2024; --fg-2:#5b6470; --fg-3:#8b95a3;
  --line:#dfe3ea; --line-2:#c7ced9;
  --accent:#3b6ef0; --accent-fg:#ffffff; --accent-soft:#e6edff;
  --danger:#d9453d;
  --canvas:#f1f3f7; --dot:#d3d9e4;
  --shadow-1:0 1px 2px rgba(17,24,39,.06),0 1px 3px rgba(17,24,39,.08);
  --shadow-2:0 4px 12px rgba(17,24,39,.10),0 1px 3px rgba(17,24,39,.06);
  --shadow-3:0 18px 40px rgba(17,24,39,.16),0 2px 8px rgba(17,24,39,.08);
  --r-s:8px; --r-m:12px; --r-l:16px;
  --tap:40px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  --bg:#14171c; --bg-2:#1b1f26; --bg-3:#242a33;
  --fg:#e8ebf0; --fg-2:#a8b1bf; --fg-3:#798393;
  --line:#2c333d; --line-2:#3c4552;
  --accent:#6f95ff; --accent-fg:#0b1020; --accent-soft:#1e2a48;
  --danger:#ff6b61;
  --canvas:#101318; --dot:#272e38;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 4px 14px rgba(0,0,0,.45);
  --shadow-3:0 18px 40px rgba(0,0,0,.55);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --bg-2:#1b1f26; --bg-3:#242a33;
    --fg:#e8ebf0; --fg-2:#a8b1bf; --fg-3:#798393;
    --line:#2c333d; --line-2:#3c4552;
    --accent:#6f95ff; --accent-fg:#0b1020; --accent-soft:#1e2a48;
    --danger:#ff6b61;
    --canvas:#101318; --dot:#272e38;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 4px 14px rgba(0,0,0,.45);
    --shadow-3:0 18px 40px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- generic controls ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:36px;padding:0 12px;border-radius:var(--r-s);
  background:var(--bg-2);border:1px solid var(--line);color:var(--fg);
  font-size:14px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow-1);
  transition:background .12s,border-color .12s,transform .06s;
}
a.btn{text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--bg-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--bg-3)}
.btn.danger{color:var(--danger)}
.btn.icon{width:36px;min-height:36px;padding:0}
.btn.sm{min-height:30px;font-size:13px;padding:0 9px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;pointer-events:none}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;font-weight:600;letter-spacing:.02em;
  text-transform:uppercase;color:var(--fg-3);margin-bottom:5px}
.input,.textarea,.select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);
  padding:8px 10px;font-size:14px;
}
.textarea{resize:vertical;min-height:120px;font-family:var(--mono);font-size:13px;line-height:1.55}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.sep{width:1px;height:22px;background:var(--line);flex:none}
.muted{color:var(--fg-2)}
.tiny{font-size:12px;color:var(--fg-3)}

/* ---------- top bar ---------- */
.topbar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none;
  background:var(--bg-2);border-bottom:1px solid var(--line);z-index:30;
  padding-top:max(8px,env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em}
.brand svg{width:24px;height:24px}
.doc-title{
  font-weight:650;font-size:15px;border:1px solid transparent;border-radius:var(--r-s);
  padding:5px 8px;background:transparent;max-width:34vw;min-width:60px;
  text-overflow:ellipsis;
}
.doc-title:hover{border-color:var(--line)}
.doc-title:focus{border-color:var(--accent);background:var(--bg)}
.savestate{font-size:12px;color:var(--fg-3);white-space:nowrap}
.savestate.dirty{color:var(--accent)}

/* ---------- library ---------- */
.library{flex:1;overflow:auto;padding:22px 20px 60px}
.library.dropping{outline:3px dashed var(--accent);outline-offset:-10px;background:var(--accent-soft)}
.lib-inner{max-width:1180px;margin:0 auto}
.lib-hero{margin-bottom:22px}
.lib-hero h1{font-size:clamp(22px,4vw,30px);margin:0 0 6px;letter-spacing:-.02em}
.lib-hero p{margin:0;color:var(--fg-2);max-width:62ch}
.folderbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 14px;margin-bottom:18px;box-shadow:var(--shadow-1);
}
.folderbar .path{font-family:var(--mono);font-size:13px;color:var(--fg-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-m);
  overflow:hidden;box-shadow:var(--shadow-1);cursor:pointer;text-align:left;
  transition:transform .12s,box-shadow .12s,border-color .12s;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-2);border-color:var(--line-2)}
.card .thumb{aspect-ratio:16/10;background:var(--canvas);border-bottom:1px solid var(--line);
  display:block;width:100%}
.card .meta{padding:10px 12px 12px}
.card .meta h3{margin:0 0 3px;font-size:14.5px;font-weight:650;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta .sub{font-size:12px;color:var(--fg-3);display:flex;gap:8px;flex-wrap:wrap}
.card .acts{display:flex;gap:2px;padding:0 6px 7px;flex-wrap:wrap}
.card .acts .btn{width:32px;min-height:32px;padding:0;color:var(--fg-3)}
.card .acts .btn:hover{color:var(--fg)}
.card .acts .btn.danger:hover{color:var(--danger)}
.card.new{align-items:center;justify-content:center;min-height:190px;border-style:dashed;
  color:var(--fg-2);gap:8px;font-weight:600}
.card.new svg{width:26px;height:26px}
.empty{padding:50px 20px;text-align:center;color:var(--fg-2)}
.empty svg{width:46px;height:46px;opacity:.4;margin-bottom:10px}

/* ---------- editor shell ---------- */
.editor{flex:1;display:flex;min-height:0;position:relative}
.canvas-wrap{
  flex:1;position:relative;overflow:hidden;background:var(--canvas);
  touch-action:none;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:26px 26px;
}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.linking{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges .hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
.edges .wire{fill:none;stroke-linecap:round}
.edges g.sel .wire{stroke:var(--accent) !important;stroke-width:3}
.elabel{font-size:11px;fill:var(--fg-2);paint-order:stroke;stroke:var(--canvas);
  stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;
  pointer-events:none;font-family:var(--font)}

/* ---------- node ---------- */
.node{
  position:absolute;background:var(--bg-2);border:1.5px solid var(--line-2);
  border-radius:var(--r-m);box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;
  transition:box-shadow .12s,border-color .12s;
}
.node.shape-round{border-radius:999px}
.node.shape-round .n-head{padding:12px 20px}
.node.shape-note{border-radius:3px 14px 3px 3px}
.node.shape-plain{background:transparent;border-color:transparent;box-shadow:none}
.node.shape-plain .n-head{padding-left:2px;padding-right:2px}
.node:hover{box-shadow:var(--shadow-2)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-2)}
.node.drop{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.node.linksrc{outline:2px dashed var(--accent);outline-offset:3px}
.node .accent{height:4px;flex:none;background:var(--n-color,transparent);
  border-radius:10px 10px 0 0}
.node.shape-round .accent{display:none !important}
.n-head{display:flex;align-items:flex-start;gap:6px;padding:9px 10px;cursor:grab}
.node.dragging .n-head{cursor:grabbing}
.n-title{
  flex:1;min-width:0;font-weight:640;font-size:14.5px;line-height:1.35;
  letter-spacing:-.01em;word-break:break-word;white-space:pre-wrap;
  border-radius:4px;padding:1px 2px;
}
.n-title[contenteditable="true"]{background:var(--bg);outline:2px solid var(--accent);cursor:text}
.n-toggle{
  flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  color:var(--fg-3);margin-top:-1px;
}
.n-toggle:hover{background:var(--bg-3);color:var(--fg)}
.n-toggle svg{width:14px;height:14px;transition:transform .15s}
.node.open .n-toggle svg{transform:rotate(90deg)}
.n-img{display:block;width:100%;object-fit:cover;max-height:220px;background:var(--bg-3);
  border-radius:9px 9px 0 0}
.node.shape-round .n-img{border-radius:999px;max-height:150px}
.n-body{border-radius:0 0 9px 9px}
.n-body{
  border-top:1px dashed var(--line);padding:9px 11px 11px;font-size:13.5px;
  color:var(--fg-2);overflow:auto;max-height:420px;cursor:auto;
}
.n-body.empty-hint{color:var(--fg-3);font-style:italic}
.n-badge{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--fg-3)}
.n-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
  opacity:0;background:
    linear-gradient(135deg,transparent 50%,var(--line-2) 50%)}
.node.sel .n-resize{opacity:1}
.port{
  position:absolute;width:15px;height:15px;border-radius:50%;
  background:var(--bg-2);border:2px solid var(--accent);opacity:0;pointer-events:none;
  transition:opacity .12s,transform .12s;cursor:crosshair;touch-action:none;z-index:3;
}
.node.sel .port,.node:hover .port{opacity:1;pointer-events:auto}
.port:hover{transform:scale(1.35)}
.port.t{top:-8px;left:calc(50% - 7.5px)} .port.b{bottom:-8px;left:calc(50% - 7.5px)}
.port.l{left:-8px;top:calc(50% - 7.5px)} .port.r{right:-8px;top:calc(50% - 7.5px)}
/* na všech zařízeních s dotykem: buňka si nesmí ukrást tah kvůli rolování obsahu */
@media (any-pointer:coarse){
  .node{touch-action:none}
  .n-body{max-height:none;overflow:visible}
}
@media (pointer:coarse){
  /* vybranou buňku jde uchopit kdekoli, i za obsah */
  .node.sel .n-head,.node.sel .n-body{cursor:grab}
  .node.sel .n-body{-webkit-user-select:none;user-select:none}
  .node.dragging{opacity:.92;box-shadow:0 0 0 3px var(--accent-soft),var(--shadow-3)}
  .port{width:22px;height:22px;opacity:0;pointer-events:none}
  .node:hover .port{opacity:0;pointer-events:none}
  .node.sel .port{opacity:1;pointer-events:auto}
  .port.t{top:-12px;left:calc(50% - 11px)} .port.b{bottom:-12px;left:calc(50% - 11px)}
  .port.l{left:-12px;top:calc(50% - 11px)} .port.r{right:-12px;top:calc(50% - 11px)}
}
/* markdown inside node/preview */
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{color:var(--fg);letter-spacing:-.01em;line-height:1.3;margin:.8em 0 .35em}
.md h1{font-size:1.25em}.md h2{font-size:1.12em}.md h3{font-size:1em}
.md p{margin:.45em 0}
.md ul,.md ol{margin:.45em 0;padding-left:1.25em}
.md li{margin:.15em 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--bg-3);
  padding:.1em .35em;border-radius:4px}
.md pre{background:var(--bg-3);padding:9px 11px;border-radius:var(--r-s);overflow:auto;margin:.5em 0}
.md pre code{background:none;padding:0}
.md blockquote{margin:.5em 0;padding-left:10px;border-left:3px solid var(--line-2);color:var(--fg-3)}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:.7em 0}
.md table{border-collapse:collapse;margin:.5em 0;font-size:.95em}
.md th,.md td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.md img{max-width:100%;border-radius:6px}
.md li.task{list-style:none;margin-left:-1.15em;display:flex;align-items:flex-start;gap:7px}
.md li.task.done{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.md input[type=checkbox]{margin:.2em 0 0;flex:none}
.md input.md-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.md input.md-cb:not([disabled]):hover{transform:scale(1.15)}

/* ---------- toolbars ---------- */
.toolbar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
  display:flex;gap:6px;align-items:center;padding:6px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-3);max-width:calc(100% - 20px);overflow-x:auto;
}
.zoombar{position:absolute;right:14px;bottom:16px;z-index:20;display:flex;flex-direction:column;
  gap:4px;padding:5px;background:var(--bg-2);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow-2)}
.zoomval{font-size:11px;text-align:center;color:var(--fg-3);padding:2px 0}

/* ---------- inspector ---------- */
.inspector{
  width:330px;flex:none;background:var(--bg-2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:25;
}
.insp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.insp-head h2{font-size:14px;margin:0;font-weight:650}
.insp-body{overflow:auto;padding:14px 14px 30px;flex:1}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw[aria-pressed="true"]{border-color:var(--fg);transform:scale(1.05)}
.npreview{position:relative;border:1.5px solid var(--line-2);border-radius:var(--r-m);
  background:var(--bg);overflow:hidden;margin:0 0 12px;min-width:90px}
.npreview i{display:block;height:4px;background:var(--n-color,transparent);border-radius:10px 10px 0 0}
.npreview b{display:block;padding:8px 10px;font-size:14px;font-weight:640;letter-spacing:-.01em}
.npreview.shape-round{border-radius:999px}
.npreview.shape-round b{padding:10px 18px}
.npreview.shape-round i{display:none !important}
.npreview.shape-note{border-radius:3px 14px 3px 3px}
.npreview.shape-plain{background:transparent;border-color:transparent}
.npreview.shape-plain b{padding-left:2px}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:2px;gap:2px}
.seg button{flex:1;min-height:30px;border-radius:6px;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--bg-2);color:var(--fg);box-shadow:var(--shadow-1);font-weight:600}
.drag-handle{display:none}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:60;
  display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--bg-2);border-radius:var(--r-l);box-shadow:var(--shadow-3);
  width:min(560px,100%);max-height:86dvh;overflow:auto;border:1px solid var(--line)}
.modal header{padding:16px 18px 0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.modal .mbody{padding:12px 18px}
.modal footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:center}
kbd{font-family:var(--mono);font-size:12px;background:var(--bg-3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));
  background:var(--fg);color:var(--bg);padding:9px 15px;border-radius:99px;font-size:13.5px;
  z-index:80;box-shadow:var(--shadow-3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.ctxmenu{position:fixed;z-index:70;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--shadow-3);padding:5px;min-width:190px}
.ctxmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
  border-radius:7px;font-size:14px;text-align:left}
.ctxmenu button:hover{background:var(--bg-3)}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.syncbar{
  position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:26;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  background:var(--bg-2);border:1px solid var(--accent);border-radius:12px;
  padding:9px 12px;box-shadow:var(--shadow-3);max-width:min(620px,calc(100% - 24px));
  font-size:13.5px;line-height:1.35;
}
.syncbar span{flex:1 1 220px;min-width:0}
.syncbar .btn{flex:0 0 auto}
.syncbar.hidden{display:none}
@keyframes mmspin{to{transform:rotate(360deg)}}
#btnSync.spin .ico{animation:mmspin .9s linear infinite;transform-origin:50% 50%}

.marquee{position:absolute;border:1.5px solid var(--accent);background:var(--accent-soft);
  opacity:.5;pointer-events:none;z-index:5;border-radius:3px}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .doc-title{max-width:30vw}
  .inspector{
    position:absolute;left:0;right:0;bottom:0;width:auto;max-height:64dvh;
    border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    box-shadow:var(--shadow-3);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .drag-handle{display:block;width:40px;height:4px;border-radius:99px;background:var(--line-2);
    margin:7px auto 1px}
  .toolbar{bottom:calc(12px + env(safe-area-inset-bottom));border-radius:16px}
  .toolbar .lbl{display:none}
  .toolbar .btn{min-width:42px;min-height:42px;padding:0 10px}
  .zoombar{bottom:calc(70px + env(safe-area-inset-bottom));right:10px}
