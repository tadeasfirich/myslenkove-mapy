/* ----------------------------- historie ---------------------------------- */
function snapshot() {
  return JSON.stringify({ nodes: App.doc.nodes, edges: App.doc.edges, title: App.doc.title });
}
let lastSnap = null;
function pushUndo() {
  if (!App.doc) return;
  const s = lastSnap || snapshot();
  App.undoStack.push(s);
  if (App.undoStack.length > 120) App.undoStack.shift();
  App.redoStack.length = 0;
  lastSnap = null;
  updateHistoryButtons();
}
function applySnap(s) {
  const o = JSON.parse(s);
  App.doc.nodes = o.nodes; App.doc.edges = o.edges;
  if (o.title !== undefined) { App.doc.title = o.title; $('#docTitle').value = o.title; }
  App.sel.forEach((id) => { if (!getNode(id)) App.sel.delete(id); });
  renderNodes(); refreshSelection(); scheduleSave();
}
function undo() {
  if (!App.undoStack.length) return;
  App.redoStack.push(snapshot());
  applySnap(App.undoStack.pop());
  updateHistoryButtons();
}
function redo() {
  if (!App.redoStack.length) return;
  App.undoStack.push(snapshot());
  applySnap(App.redoStack.pop());
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('#btnUndo').disabled = !App.undoStack.length;
  $('#btnRedo').disabled = !App.redoStack.length;
}

/* ----------------------------- ukládání ---------------------------------- */
function setSaveState(txt, dirty) {
  els.saveState.textContent = txt;
  els.saveState.classList.toggle('dirty', !!dirty);
}
let saveFails = 0;
const doSave = debounce(async () => {
  if (!App.entry || App.suppressSave) return;
  try {
    syncSizes();
    await Store.write(App.entry);
    App.dirty = false;
    saveFails = 0;
    if (typeof Sync !== 'undefined' && Sync.barKind === 'save') Sync.hideBar();
    setSaveState('Uloženo ' + fmtDate(Date.now()), false);
  } catch (err) {
    console.error(err);
    saveFails++;
    App.dirty = true;
    const msg = (err && err.message ? err.message : String(err));
    setSaveState('Neuloženo! (' + saveFails + '. pokus)', true);
    if (typeof Sync !== 'undefined') {
      if (err && err.auth) {
        Sync.authLost = true; Sync.stop(); Sync.showAuthBar();
      } else {
        Sync.barKind = 'save';
        Sync.bar('Uložení se nepovedlo: ' + esc(msg.slice(0, 140)), [
          { label: 'Zkusit hned', primary: true, fn: () => { Sync.hideBar(); doSave(); } },
          { label: 'Stáhnout kopii', fn: () => downloadDoc(App.doc, App.entry ? App.entry.name : null) }
        ]);
        if (saveFails <= 5) setTimeout(() => doSave(), 4000 * saveFails);
      }
    }
  }
}, 500);

function scheduleSave() {
  if (!App.entry || App.suppressSave) return;
  App.dirty = true;
  setSaveState('Ukládám…', true);
  doSave();
}
async function saveNow() { doSave.cancel(); syncSizes(); await Store.write(App.entry).catch(() => {}); setSaveState('Uloženo ' + fmtDate(Date.now()), false); }

/** jednorázové vysvětlení, jak se na dotyku posouvají buňky */
function hintTouchDrag() {
  try {
    if (localStorage.getItem('mm.hint.touchdrag')) return;
    localStorage.setItem('mm.hint.touchdrag', '1');
  } catch (e) { /* soukromé okno */ }
  toast('Vybranou buňku teď posuneš tažením za kteroukoli její část', 4000);
}

/* ----------------------------- operace ----------------------------------- */
function addNode(x, y, opts) {
  pushUndo();
  const n = newNode(x, y, (opts && opts.title) !== undefined ? opts.title : '');
  App.doc.nodes.push(n);
  renderNodes();
  setSel(n.id);
  scheduleSave();
  return n;
}
/** spojí všechny zdrojové buňky s cílovou; vrací počet nově vzniklých vazeb */
function addEdges(fromIds, to) {
  const list = fromIds.filter((f) => f !== to && getNode(f));
  const fresh = list.filter((f) => !App.doc.edges.some(
    (e) => (e.from === f && e.to === to) || (e.from === to && e.to === f)));
  if (!fresh.length) return 0;
  pushUndo();
  fresh.forEach((f) => App.doc.edges.push(newEdge(f, to)));
  renderEdges(); scheduleSave();
  return fresh.length;
}

function addEdge(from, to) {
  if (from === to) return null;
  if (App.doc.edges.some((e) => (e.from === from && e.to === to) || (e.from === to && e.to === from))) {
    toast('Tyhle buňky už jsou spojené');
    return null;
  }
  pushUndo();
  const e = newEdge(from, to);
  App.doc.edges.push(e);
  renderEdges(); scheduleSave();
  return e;
}
function deleteSelection() {
  if (!App.sel.size && !App.selEdges.size) return;
  pushUndo();
  const ids = new Set(App.sel);
  const eids = new Set(App.selEdges);
  if (ids.size) App.doc.nodes = App.doc.nodes.filter((n) => !ids.has(n.id));
  App.doc.edges = App.doc.edges.filter(
    (e) => !eids.has(e.id) && !ids.has(e.from) && !ids.has(e.to));
  App.sel.clear(); App.selEdges.clear();
  renderNodes(); refreshSelection(); scheduleSave();
}

/** vybere všechny vazby, které se dotýkají daných buněk */
function selectEdgesOf(nodeIds) {
  const set = new Set(nodeIds);
  const ids = App.doc.edges.filter((e) => set.has(e.from) || set.has(e.to)).map((e) => e.id);
  if (!ids.length) { toast('Tyhle buňky nemají žádnou vazbu'); return; }
  setSelEdges(ids, false);
  openInspector();
  toast(ids.length + ' ' + plural(ids.length, 'vazba', 'vazby', 'vazeb') + ' vybráno');
}
function duplicateSelection() {
  if (!App.sel.size) return;
  pushUndo();
  const map = {}; const added = [];
  App.doc.nodes.filter((n) => App.sel.has(n.id)).forEach((n) => {
    const c = clone(n); c.id = uid('n'); c.x += 26; c.y += 26;
    map[n.id] = c.id; App.doc.nodes.push(c); added.push(c.id);
  });
  App.doc.edges.slice().forEach((e) => {
    if (map[e.from] && map[e.to]) {
      const c = clone(e); c.id = uid('e'); c.from = map[e.from]; c.to = map[e.to];
      App.doc.edges.push(c);
    }
  });
  renderNodes(); setSel(added); scheduleSave();
}
function toggleContent(n, force) {
  pushUndo();
  n.open = force === undefined ? !n.open : force;
  paintNode(n); measure(); scheduleSave();
}
function toggleAllContent(open) {
  pushUndo();
  App.doc.nodes.forEach((n) => { n.open = open && !!n.content; });
  renderNodes(); scheduleSave();
}

/* --------- protíná úsečka obdélník? (výběr vazeb rámečkem) --------- */
function segmentHitsRect(p1, p2, r) {
  const x1 = Math.min(r.x1, r.x2), x2 = Math.max(r.x1, r.x2);
  const y1 = Math.min(r.y1, r.y2), y2 = Math.max(r.y1, r.y2);
  if (Math.max(p1.x, p2.x) < x1 || Math.min(p1.x, p2.x) > x2) return false;
  if (Math.max(p1.y, p2.y) < y1 || Math.min(p1.y, p2.y) > y2) return false;
  const inside = (p) => p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  if (inside(p1) || inside(p2)) return true;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const hits = (a, b, c, d) => {
    const d1 = cross(a, b, c), d2 = cross(a, b, d), d3 = cross(c, d, a), d4 = cross(c, d, b);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  };
  const c1 = { x: x1, y: y1 }, c2 = { x: x2, y: y1 }, c3 = { x: x2, y: y2 }, c4 = { x: x1, y: y2 };
  return hits(p1, p2, c1, c2) || hits(p1, p2, c2, c3) || hits(p1, p2, c3, c4) || hits(p1, p2, c4, c1);
}

/* ----------------------------- editace názvu ----------------------------- */
let editingEl = null, editingOrig = '';
function editTitle(n) {
  const el = nodeEls.get(n.id); if (!el) return;
  const t = el.querySelector('.n-title');
  editingEl = t; editingOrig = n.title;
  t.textContent = n.title;
  t.setAttribute('contenteditable', 'true');
  t.focus();
  const r = document.createRange(); r.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  lastSnap = snapshot();
}
function stopEditTitle(save) {
  if (!editingEl) return;
  const el = editingEl; editingEl = null;
  const host = el.closest('.node');
  if (!host) return;
  const n = getNode(host.dataset.id);
  const val = el.textContent.replace(/\s+$/, '');
  el.removeAttribute('contenteditable');
  if (n) {
    if (save && val !== editingOrig) { pushUndo(); n.title = val; scheduleSave(); }
    else n.title = editingOrig;
    paintNode(n); measure();
  }
  updateInspector();
}

/* ============================================================
   Ukazovátko (myš i dotyk)
   ============================================================ */
/** dotyk nebo pero (na nich platí „nejdřív vyber, pak posouvej“) */
function isTouchPointer(ev) {
  if (ev.pointerType === 'touch' || ev.pointerType === 'pen') return true;
  if (!ev.pointerType && matchMedia('(pointer: coarse)').matches) return true;
  return false;
}

const pointers = new Map();
let gesture = null;   // {type, ...}
let pinch = null;
let spaceDown = false;

function initCanvasEvents() {
  const c = els.canvas;

  c.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  c.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    if (ev.ctrlKey || ev.metaKey || !ev.shiftKey) {
      zoomAt(ev.clientX, ev.clientY, Math.pow(0.9988, ev.deltaY));
    } else {
      const v = view(); v.x -= ev.deltaY; applyView(); scheduleSave();
    }
  }, { passive: false });

  c.addEventListener('dblclick', (ev) => {
    const nodeEl = ev.target.closest('.node');
    if (nodeEl) {
      if (ev.target.closest('.n-title')) { editTitle(getNode(nodeEl.dataset.id)); return; }
      if (ev.target.closest('.n-body')) { openInspector('content'); return; }
      return;
    }
    if (ev.target.closest('.toolbar,.zoombar,.inspector')) return;
    const p = screenToWorld(ev.clientX, ev.clientY);
    const n = addNode(p.x - NODE_W / 2, p.y - 20, { title: '' });
    setTimeout(() => editTitle(n), 10);
  });

  c.addEventListener('contextmenu', (ev) => {
    if (ev.target.closest('.toolbar,.zoombar')) return;
    ev.preventDefault();
    const nodeEl = ev.target.closest('.node');
    if (nodeEl && !App.sel.has(nodeEl.dataset.id)) setSel(nodeEl.dataset.id);
    showContextMenu(ev.clientX, ev.clientY, !!nodeEl);
  });

  /* přetažení obrázku do buňky */
  c.addEventListener('dragover', (ev) => { ev.preventDefault(); });
  c.addEventListener('drop', async (ev) => {
    ev.preventDefault();
    const f = ev.dataTransfer.files && ev.dataTransfer.files[0];
    if (!f || !/^image\//.test(f.type)) return;
    const data = await fileToDataURL(f);
    const nodeEl = ev.target.closest('.node');
    pushUndo();
    if (nodeEl) { getNode(nodeEl.dataset.id).image = data; }
    else {
      const p = screenToWorld(ev.clientX, ev.clientY);
      const n = newNode(p.x - NODE_W / 2, p.y - 20, f.name.replace(/\.[^.]+$/, ''));
      n.image = data; App.doc.nodes.push(n);
    }
    renderNodes(); scheduleSave();
  });
}

function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function onPointerDown(ev) {
  if (ev.target.closest('.toolbar,.zoombar,.inspector')) return;
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  if (pointers.size === 2) {           // pinch
    gesture = null;
    const [a, b] = Array.from(pointers.values());
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
      vx: view().x, vy: view().y, z: view().zoom };
    return;
  }
  if (pointers.size > 2) return;

  if (editingEl && !ev.target.closest('.n-title')) stopEditTitle(true);

  const port = ev.target.closest('.port');
  const resize = ev.target.closest('.n-resize');
  const nodeEl = ev.target.closest('.node');
  const hit = ev.target.closest('#edges g');

  /* 1) tažení nové vazby z uzlového bodu */
  if (port && nodeEl) {
    ev.preventDefault();
    const n = getNode(nodeEl.dataset.id);
    gesture = { type: 'link', from: n.id, sx: ev.clientX, sy: ev.clientY, moved: false };
    App.tempWire = svgEl('path', { class: 'wire', stroke: 'var(--accent)', 'stroke-width': 2,
      'stroke-dasharray': '6 5', d: '' });
    els.svg.appendChild(App.tempWire);
    els.canvas.classList.add('linking');
    return;
  }
  /* 2) změna šířky */
  if (resize && nodeEl) {
    ev.preventDefault();
    const n = getNode(nodeEl.dataset.id);
    lastSnap = snapshot();
    gesture = { type: 'resize', id: n.id, sx: ev.clientX, w0: n.w, moved: false };
    return;
  }
  /* 3) vazba – výběr */
  if (hit) {
    const eid = hit.dataset.id;
    if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
      if (App.selEdges.has(eid)) App.selEdges.delete(eid); else App.selEdges.add(eid);
      refreshSelection();
    } else {
      setSelEdges(eid, false);
    }
    gesture = { type: 'none' };
    return;
  }
  /* 4) buňka */
  if (nodeEl) {
    const id = nodeEl.dataset.id;
    if (App.tool === 'link') {
      const src = App.linkGroup || [];
      if (!src.length) {
        App.linkGroup = [id]; App.linkSticky = false;
        setSel(id); refreshSelection();
        toast('Teď klepni na buňku, se kterou se má spojit');
      } else if (src.length === 1 && src[0] === id) {
        App.linkGroup = []; refreshSelection(); toast('Spojování zrušeno');
      } else {
        const n = addEdges(src, id);
        if (!n) toast('Tyhle buňky už jsou spojené');
        else toast(n + ' ' + plural(n, 'nová vazba', 'nové vazby', 'nových vazeb') +
          (App.linkSticky ? ' · klepni na další buňku nebo Esc' : ''));
        if (App.linkSticky) { renderNodes(); refreshSelection(); }
        else { App.linkGroup = []; setSel(id); }
      }
      gesture = { type: 'none' };
      return;
    }
    if (ev.target.closest('.n-toggle')) { gesture = { type: 'none' }; return; }
    if (ev.target.closest('a')) { gesture = { type: 'none' }; return; }
    if (ev.target.closest('.md-cb')) { gesture = { type: 'none' }; return; }

    /* ---- prst nebo pero: napřed vyber, pak posouvej (a to celou buňkou) ---- */
    if (isTouchPointer(ev)) {
      if (!App.sel.has(id)) {
        /* nevybraná buňka se chová jako plátno – tažením se jen posouvá mapa,
           krátké ťuknutí ji vybere */
        gesture = { type: 'pan', sx: ev.clientX, sy: ev.clientY,
          vx: view().x, vy: view().y, tapNode: id, moved: false };
        els.canvas.classList.add('panning');
        return;
      }
      if (editingEl) { gesture = { type: 'none' }; return; }
      ev.preventDefault();
      lastSnap = snapshot();
      const startT = {};
      App.sel.forEach((sid) => { const n = getNode(sid); if (n) startT[sid] = { x: n.x, y: n.y }; });
      gesture = { type: 'drag', sx: ev.clientX, sy: ev.clientY, start: startT, moved: false, id };
      nodeEl.classList.add('dragging');
      return;
    }

    if (ev.target.closest('.n-body') && !ev.target.closest('.n-head')) {
      // myší smí uživatel v obsahu značit text
      if (!App.sel.has(id)) setSel(id, ev.shiftKey);
      gesture = { type: 'none' };
      return;
    }
    if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
      if (App.sel.has(id)) App.sel.delete(id); else App.sel.add(id);
      refreshSelection();
    } else if (!App.sel.has(id)) {
      setSel(id);
    }
    if (editingEl) return;
    ev.preventDefault();
    lastSnap = snapshot();
    const start = {};
    App.sel.forEach((sid) => { const n = getNode(sid); if (n) start[sid] = { x: n.x, y: n.y }; });
    gesture = { type: 'drag', sx: ev.clientX, sy: ev.clientY, start, moved: false, id };
    nodeEl.classList.add('dragging');
    return;
  }
  /* 5) prázdné plátno */
  const marquee = (App.tool === 'select' || ev.shiftKey) && !spaceDown;
  if (marquee) {
    ev.preventDefault();
    const box = document.createElement('div');
    box.className = 'marquee';
    els.canvas.appendChild(box);
    gesture = { type: 'marquee', sx: ev.clientX, sy: ev.clientY, box,
      base: ev.shiftKey ? Array.from(App.sel) : [],
      baseE: ev.shiftKey ? Array.from(App.selEdges) : [] };
  } else {
    if (!ev.shiftKey) { clearSel(); App.linkGroup = []; }
    gesture = { type: 'pan', sx: ev.clientX, sy: ev.clientY, vx: view().x, vy: view().y };
    els.canvas.classList.add('panning');
  }
}

function onPointerMove(ev) {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  if (pinch && pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const v = view();
    const z = clamp(pinch.z * (d / pinch.d), 0.12, 3.5);
    const r = els.canvas.getBoundingClientRect();
    v.x = (cx - r.left) - ((pinch.cx - r.left) - pinch.vx) * (z / pinch.z);
    v.y = (cy - r.top) - ((pinch.cy - r.top) - pinch.vy) * (z / pinch.z);
    v.zoom = z;
    applyView();
    return;
  }
  if (!gesture) return;
  const g = gesture;

  if (g.type === 'pan') {
    const v = view();
    if (Math.abs(ev.clientX - g.sx) + Math.abs(ev.clientY - g.sy) > 8) g.moved = true;
    v.x = g.vx + (ev.clientX - g.sx);
    v.y = g.vy + (ev.clientY - g.sy);
    applyView();
  } else if (g.type === 'drag') {
    const z = view().zoom;
    const dx = (ev.clientX - g.sx) / z, dy = (ev.clientY - g.sy) / z;
    if (Math.abs(dx) + Math.abs(dy) > 1) g.moved = true;
    for (const id in g.start) {
      const n = getNode(id); if (!n) continue;
      n.x = Math.round(g.start[id].x + dx);
      n.y = Math.round(g.start[id].y + dy);
      const el = nodeEls.get(id);
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    }
    renderEdges();
  } else if (g.type === 'resize') {
    const z = view().zoom;
    const n = getNode(g.id); if (!n) return;
    n.w = clamp(Math.round(g.w0 + (ev.clientX - g.sx) / z), 90, 900);
    g.moved = true;
    const el = nodeEls.get(n.id); el.style.width = n.w + 'px';
    App.sizes[n.id] = { w: el.offsetWidth, h: el.offsetHeight };
    renderEdges();
  } else if (g.type === 'link') {
    g.moved = true;
    const from = getNode(g.from);
    const p = screenToWorld(ev.clientX, ev.clientY);
    const a = anchor(nodeRect(from), p.x, p.y, from.shape === 'round');
    App.tempWire.setAttribute('d', 'M' + a.x + ',' + a.y + ' L' + p.x + ',' + p.y);
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const t = over && over.closest('.node');
    $$('.node.drop').forEach((e) => e.classList.remove('drop'));
    if (t && t.dataset.id !== g.from) t.classList.add('drop');
  } else if (g.type === 'marquee') {
    const x1 = Math.min(g.sx, ev.clientX), y1 = Math.min(g.sy, ev.clientY);
    const x2 = Math.max(g.sx, ev.clientX), y2 = Math.max(g.sy, ev.clientY);
    const r = els.canvas.getBoundingClientRect();
    Object.assign(g.box.style, {
      left: (x1 - r.left) + 'px', top: (y1 - r.top) + 'px',
      width: (x2 - x1) + 'px', height: (y2 - y1) + 'px'
    });
    const a = screenToWorld(x1, y1), b = screenToWorld(x2, y2);
    const hits = App.doc.nodes.filter((n) => {
      const s = nodeSize(n);
      return n.x < b.x && n.x + s.w > a.x && n.y < b.y && n.y + s.h > a.y;
    }).map((n) => n.id);
    const rect = { x1: a.x, y1: a.y, x2: b.x, y2: b.y };
    const hitsE = App.doc.edges.filter((e) => {
      const geo = edgeGeometry(e);
      return geo && segmentHitsRect(geo.p1, geo.p2, rect);
    }).map((e) => e.id);
    setSel(g.base.concat(hits), false);
    App.selEdges = new Set(g.baseE.concat(hitsE));
    refreshSelection();
  }
}

async function onPointerUp(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2 && pinch) { pinch = null; scheduleSave(); }
  if (!gesture) return;
  const g = gesture;

  if (g.type === 'pan') {
    els.canvas.classList.remove('panning');
    if (g.tapNode && !g.moved) {
      setSel(g.tapNode);
      hintTouchDrag();
    } else {
      scheduleSave();
    }
  } else if (g.type === 'drag') {
    const el = nodeEls.get(g.id); if (el) el.classList.remove('dragging');
    if (g.moved) { App.undoStack.push(lastSnap); App.redoStack.length = 0; updateHistoryButtons(); scheduleSave(); }
    lastSnap = null;
  } else if (g.type === 'resize') {
    if (g.moved) { App.undoStack.push(lastSnap); App.redoStack.length = 0; updateHistoryButtons(); measure(); scheduleSave(); }
    lastSnap = null;
  } else if (g.type === 'link') {
    els.canvas.classList.remove('linking');
    $$('.node.drop').forEach((e) => e.classList.remove('drop'));
    if (App.tempWire) { App.tempWire.remove(); App.tempWire = null; }
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const t = over && over.closest('.node');
    if (t && t.dataset.id !== g.from) {
      addEdge(g.from, t.dataset.id);
    } else if (g.moved && !t) {
      const p = screenToWorld(ev.clientX, ev.clientY);
      pushUndo();
      const n = newNode(p.x - NODE_W / 2, p.y - 18, '');
      App.doc.nodes.push(n);
      App.doc.edges.push(newEdge(g.from, n.id));
      renderNodes(); setSel(n.id); scheduleSave();
      setTimeout(() => editTitle(n), 10);
    }
  } else if (g.type === 'marquee') {
    g.box.remove();
  }
  gesture = null;
}

/* ============================================================
   Klávesnice
   ============================================================ */
function isTyping(t) {
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

function initKeys() {
  window.addEventListener('keydown', (ev) => {
    if (ev.key === ' ' && !isTyping(ev.target)) { spaceDown = true; }
    const mod = ev.ctrlKey || ev.metaKey;

    if (editingEl) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); stopEditTitle(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); stopEditTitle(false); }
      return;
    }
    if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); manualSave(); return; }
    if (isTyping(ev.target)) return;
    if ($('#editor').classList.contains('hidden')) return;

    if (mod && ev.key.toLowerCase() === 'z') {
      ev.preventDefault(); ev.shiftKey ? redo() : undo(); return;
    }
    if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
    if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); duplicateSelection(); return; }
    if (mod && ev.key.toLowerCase() === 'a') {
      ev.preventDefault();
      setSel(App.doc.nodes.map((n) => n.id));
      App.selEdges = new Set(App.doc.edges.map((e) => e.id));
      refreshSelection();
      return;
    }
    if (mod && ev.key.toLowerCase() === 'i') { ev.preventDefault(); toggleInspector(); return; }

    switch (ev.key) {
      case 'Delete': case 'Backspace':
        ev.preventDefault(); deleteSelection(); break;
      case 'Escape':
        hideContextMenu();
        if (App.linkGroup && App.linkGroup.length) {
          App.linkGroup = []; App.linkSticky = false; refreshSelection(); toast('Spojování zrušeno');
        } else clearSel();
        break;
      case 'Enter': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) { ev.preventDefault(); editTitle(n); }
        break;
      }
      case 'Tab': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) {
          ev.preventDefault();
          pushUndo();
          const s = nodeSize(n);
          const child = newNode(n.x + s.w + 70, n.y, '');
          App.doc.nodes.push(child);
          App.doc.edges.push(newEdge(n.id, child.id));
          renderNodes(); setSel(child.id); scheduleSave();
          setTimeout(() => editTitle(child), 10);
        }
        break;
      }
      case 'f': case 'F': fitView(true); break;
      case 'e': case 'E': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) toggleContent(n);
        break;
      }
      case '+': case '=': zoomAt(innerWidth / 2, innerHeight / 2, 1.2); break;
      case '-': case '_': zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2); break;
      case '0': if (!mod) { view().zoom = 1; applyView(); scheduleSave(); } break;
      case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': {
        if (!App.sel.size) return;
        ev.preventDefault();
        const step = ev.shiftKey ? 1 : 10;
        const dx = (ev.key === 'ArrowLeft' ? -step : ev.key === 'ArrowRight' ? step : 0);
        const dy = (ev.key === 'ArrowUp' ? -step : ev.key === 'ArrowDown' ? step : 0);
        pushUndo();
        App.sel.forEach((id) => { const n = getNode(id); if (n) { n.x += dx; n.y += dy; } });
        renderNodes(); scheduleSave();
        break;
      }
    }
  });
  window.addEventListener('keyup', (ev) => { if (ev.key === ' ') spaceDown = false; });
}

let inspKey = '';
let inspOpen = false;

const EDGE_STYLES = [{ id: 'solid', label: 'Plná' }, { id: 'dashed', label: 'Čárkovaná' }, { id: 'dotted', label: 'Tečkovaná' }];
const EDGE_ARROWS = [{ id: 'none', label: 'Bez' }, { id: 'to', label: 'Jedna' }, { id: 'both', label: 'Obě' }];

function toggleInspector(force) {
  inspOpen = force === undefined ? !inspOpen : force;
  $('#inspector').classList.toggle('hidden', !inspOpen);
  $('#editor').classList.toggle('panel-open', inspOpen);
  $('#tPanel').setAttribute('aria-pressed', String(inspOpen));
  if (inspOpen) { inspKey = ''; updateInspector(); revealSelected(); }
}

/** na mobilu odsune plátno tak, aby vybraná buňka nezůstala pod panelem */
function revealSelected() {
  if (innerWidth > 900 || App.sel.size !== 1) return;
  const n = getNode(Array.from(App.sel)[0]); if (!n) return;
  requestAnimationFrame(() => {
    const panel = $('#inspector').getBoundingClientRect();
    const canvas = els.canvas.getBoundingClientRect();
    const v = view(), s = nodeSize(n);
    const top = n.y * v.zoom + v.y;
    const bottom = top + s.h * v.zoom;
    const limit = panel.top - canvas.top - 12;
    if (bottom > limit) { v.y -= (bottom - limit); applyView(); }
    if (top < 12) { v.y += (12 - top); applyView(); }
  });
}
function openInspector(focus) {
  toggleInspector(true);
  if (focus === 'content') {
    const ta = $('#inspContent');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

function updateInspector(force) {
  if (!inspOpen || !App.doc) return;
  const body = $('#inspBody');

  const key = 'n:' + ns.join(',') + '|e:' + es.join(',');

  if (ns.length) parts.push(ns.length + ' ' + plural(ns.length, 'buňka', 'buňky', 'buněk'));

/* ---------- hromadná úprava výběru (buňky i vazby) ---------- */
function buildBulkInspector(body, ns, es) {
  const h = (txt) => {
    const d = document.createElement('div');
    d.className = 'tiny';
    d.style.cssText = 'margin:14px 0 8px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-2)';
    d.textContent = txt; body.appendChild(d);
  };
  const mk = (label, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.style.width = '100%'; b.style.marginBottom = '8px';
    b.textContent = label; b.addEventListener('click', fn); body.appendChild(b);
  };

  if (ns.length) {
    if (es.length) h(ns.length + ' ' + plural(ns.length, 'buňka', 'buňky', 'buněk'));
    body.appendChild(fieldWrap('Barva buněk', swatchRow(null, (id) => {
      pushUndo(); ns.forEach((i) => { const n = getNode(i); if (n) n.color = id; });
      renderNodes(); scheduleSave();
    })));
    body.appendChild(fieldWrap('Tvar buněk', segRow(SHAPES, null, (id) => {
      pushUndo(); ns.forEach((i) => { const n = getNode(i); if (n) n.shape = id; });
      renderNodes(); scheduleSave();
    })));
    if (ns.length > 1) {
      mk('Spojit řetězem', () => {
        pushUndo();
        for (let i = 0; i < ns.length - 1; i++) {
          if (!App.doc.edges.some((e) => (e.from === ns[i] && e.to === ns[i + 1]) || (e.from === ns[i + 1] && e.to === ns[i])))
            App.doc.edges.push(newEdge(ns[i], ns[i + 1]));
        }
        renderEdges(); scheduleSave();
      });
      mk('Zarovnat vodorovně', () => {
        pushUndo();
        const y = Math.round(ns.reduce((a, i) => a + getNode(i).y, 0) / ns.length);
        ns.forEach((i) => { getNode(i).y = y; });
        renderNodes(); scheduleSave();
      });
      mk('Zarovnat svisle', () => {
        pushUndo();
        const x = Math.round(ns.reduce((a, i) => a + getNode(i).x, 0) / ns.length);
        ns.forEach((i) => { getNode(i).x = x; });
        renderNodes(); scheduleSave();
      });
      mk('Rozmístit do kruhu', () => {
        pushUndo();
        const cx = ns.reduce((a, i) => a + getNode(i).x, 0) / ns.length;
        const cy = ns.reduce((a, i) => a + getNode(i).y, 0) / ns.length;
        const r = Math.max(160, ns.length * 34);
        ns.forEach((i, k) => {
          const a = (k / ns.length) * Math.PI * 2 - Math.PI / 2;
          const n = getNode(i);
          n.x = Math.round(cx + Math.cos(a) * r); n.y = Math.round(cy + Math.sin(a) * r);
        });
        renderNodes(); scheduleSave();
      });
    }
    mk('Nastavit jako výchozí pro nové buňky', () => {
      const n = getNode(ns[0]); if (!n) return;
      App.doc.defaults.node = { color: n.color, shape: n.shape, w: n.w };
      scheduleSave(); toast('Nové buňky budou vypadat takhle');
    });
    mk('Vybrat jejich vazby', () => selectEdgesOf(ns));
  }

  if (es.length) {
    h(es.length + ' ' + plural(es.length, 'vybraná vazba', 'vybrané vazby', 'vybraných vazeb'));
    const each = (fn) => { pushUndo(); es.forEach((i) => { const e = getEdge(i); if (e) fn(e); }); renderEdges(); scheduleSave(); };
    body.appendChild(fieldWrap('Čára', segRow(EDGE_STYLES, null, (id) => each((e) => { e.style = id; }))));
    body.appendChild(fieldWrap('Šipka', segRow(EDGE_ARROWS, null, (id) => each((e) => { e.arrow = id; }))));
    body.appendChild(fieldWrap('Barva vazeb', swatchRow(null, (id) => each((e) => { e.color = id; }))));
    const lab = document.createElement('input');
    lab.className = 'input'; lab.placeholder = 'společný popisek (prázdné = beze změny)';
    lab.addEventListener('change', () => each((e) => { e.label = lab.value; }));
    body.appendChild(fieldWrap('Popisek všech', lab));
    mk('Otočit směr všech', () => each((e) => { const t = e.from; e.from = e.to; e.to = t; }));
    mk('Nastavit jako výchozí pro nové vazby', () => {
      const e = getEdge(es[0]); if (!e) return;
      App.doc.defaults.edge = { style: e.style, arrow: e.arrow, color: e.color };
      scheduleSave(); toast('Nové vazby budou vypadat takhle');
    });
  }

  const del = document.createElement('button');
  del.className = 'btn danger'; del.style.width = '100%'; del.style.marginTop = '6px';
  del.textContent = ns.length && es.length ? 'Smazat celý výběr'
    : ns.length ? 'Smazat vybrané buňky' : 'Smazat vybrané vazby';
  del.addEventListener('click', () => deleteSelection());
  body.appendChild(del);
}

  /* ---- výchozí vzhled nové buňky ---- */
  sectionHead(body, 'Výchozí vzhled nové buňky');
  const dn = d.defaults.node;
  const npv = document.createElement('div');
  npv.className = 'npreview';
  npv.innerHTML = '<i></i><b>Nová buňka</b>';
  body.appendChild(npv);
  const drawN = () => {
    const col = colorHex(dn.color);
    npv.className = 'npreview shape-' + dn.shape;
    npv.style.setProperty('--n-color', col || 'transparent');
    npv.style.borderColor = col || '';
    npv.style.width = Math.round(Math.min(100, (dn.w / 560) * 100)) + '%';
    npv.querySelector('i').style.display = col ? 'block' : 'none';
  };
  drawN();
  const setN = (k, v) => { dn[k] = v; drawN(); scheduleSave(); };
  body.appendChild(fieldWrap('Barva', swatchRow(dn.color, (id) => setN('color', id))));
  body.appendChild(fieldWrap('Tvar', segRow(SHAPES, dn.shape, (id) => setN('shape', id))));
  const wr = document.createElement('input');
  wr.type = 'range'; wr.min = 110; wr.max = 560; wr.step = 5; wr.value = dn.w; wr.style.width = '100%';
  wr.addEventListener('input', () => setN('w', Number(wr.value)));
  body.appendChild(fieldWrap('Šířka', wr));

  const applyN = document.createElement('button');
  applyN.className = 'btn'; applyN.style.width = '100%'; applyN.style.marginBottom = '6px';
  applyN.textContent = 'Použít na všechny stávající buňky';
  applyN.addEventListener('click', () => {
    if (!App.doc.nodes.length) { toast('Mapa zatím nemá buňky'); return; }
    pushUndo();
    App.doc.nodes.forEach((n) => { n.color = dn.color; n.shape = dn.shape; n.w = dn.w; });
    renderNodes(); scheduleSave();
    toast('Upraveno ' + App.doc.nodes.length + ' ' + plural(App.doc.nodes.length, 'buňka', 'buňky', 'buněk'));
  });
  body.appendChild(applyN);

  const hd = sectionHead(body, 'Výchozí vzhled nové vazby');

  const de = d.defaults.edge;
  const prev = document.createElement('div');
  prev.style.cssText = 'margin:0 0 10px';
  const drawPrev = () => {
    const col = colorHex(de.color) || 'var(--line-2)';
    const dash = de.style === 'dashed' ? '7 6' : de.style === 'dotted' ? '1 6' : '';
    const head = (x, dir) => '<path d="M' + x + ',12 l' + (9 * dir) + ',-4.5 l0,9 Z" fill="' + col + '"/>';
    prev.innerHTML = '<svg viewBox="0 0 220 24" style="width:100%;height:26px">' +
      '<line x1="14" y1="12" x2="206" y2="12" stroke="' + col + '" stroke-width="2" stroke-linecap="round"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>' +
      (de.arrow === 'to' || de.arrow === 'both' ? head(206, -1) : '') +
      (de.arrow === 'both' ? head(14, 1) : '') + '</svg>';
  };
  drawPrev();
  body.appendChild(prev);

  const setD = (k, v) => { de[k] = v; drawPrev(); scheduleSave(); };
  body.appendChild(fieldWrap('Čára', segRow(EDGE_STYLES, de.style, (id) => setD('style', id))));
  body.appendChild(fieldWrap('Šipka', segRow(EDGE_ARROWS, de.arrow, (id) => setD('arrow', id))));
  body.appendChild(fieldWrap('Barva', swatchRow(de.color, (id) => setD('color', id))));

  const applyAll = document.createElement('button');
  applyAll.className = 'btn'; applyAll.style.width = '100%'; applyAll.style.marginBottom = '14px';
  applyAll.textContent = 'Použít na všechny stávající vazby';
  applyAll.addEventListener('click', () => {
    if (!App.doc.edges.length) { toast('Mapa zatím nemá vazby'); return; }
    pushUndo();
    App.doc.edges.forEach((e) => { e.style = de.style; e.arrow = de.arrow; e.color = de.color; });
    renderEdges(); scheduleSave();
    toast('Upraveno ' + App.doc.edges.length + ' ' + plural(App.doc.edges.length, 'vazba', 'vazby', 'vazeb'));
  });
  body.appendChild(applyAll);

  const mk = (label, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.style.width = '100%'; b.style.marginBottom = '8px';
    b.textContent = label; b.addEventListener('click', fn); body.appendChild(b);
  };
  mk('Rozbalit obsah všech buněk', () => toggleAllContent(true));
  mk('Sbalit obsah všech buněk', () => toggleAllContent(false));
  mk('Uložit teď', () => manualSave());
  mk('Stáhnout jako soubor', () => downloadDoc(App.doc, App.entry ? App.entry.name : null));
  mk('Vytisknout / uložit do PDF', () => { fitView(false); setTimeout(() => window.print(), 250); });
}

/* ============================================================
   Kontextová nabídka
   ============================================================ */
let ctxEl = null;
function ctxOutside(ev) { if (ctxEl && !ctxEl.contains(ev.target)) hideContextMenu(); }
function hideContextMenu() {
  if (!ctxEl) return;
  ctxEl.remove(); ctxEl = null;
  document.removeEventListener('pointerdown', ctxOutside, true);
  window.removeEventListener('blur', hideContextMenu);
}

function showContextMenu(x, y, onNode) {
  hideContextMenu();
  const m = document.createElement('div');
  m.className = 'ctxmenu';
  const item = (label, fn, danger) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (danger) b.style.color = 'var(--danger)';
    b.addEventListener('click', () => { hideContextMenu(); fn(); });
    m.appendChild(b);
  };
  const sep = () => m.appendChild(document.createElement('hr'));

  if (App.selEdges.size && !App.sel.size) {
    const es = Array.from(App.selEdges);
    const many = es.length > 1;
    item(many ? 'Upravit ' + es.length + ' vazeb' : 'Upravit vazbu', () => openInspector());
    item('Otočit směr', () => {
      pushUndo();
      es.forEach((i) => { const e = getEdge(i); if (e) { const t = e.from; e.from = e.to; e.to = t; } });
      renderEdges(); scheduleSave();
    });
    if (!many) {
      const e = getEdge(es[0]);
      item('Vybrat všechny vazby těchto buněk', () => selectEdgesOf([e.from, e.to]));
      item('Nastavit jako výchozí pro nové vazby', () => {
        App.doc.defaults.edge = { style: e.style, arrow: e.arrow, color: e.color };
        scheduleSave(); toast('Nové vazby budou vypadat takhle');
      });
    }
    sep();
    item(many ? 'Smazat vazby' : 'Smazat vazbu', () => deleteSelection(), true);
  } else if (onNode && App.sel.size) {
    const single = App.sel.size === 1 ? getNode(Array.from(App.sel)[0]) : null;
    if (single) {
      item('Přejmenovat', () => editTitle(single));
      item(single.open ? 'Skrýt obsah' : 'Ukázat obsah', () => toggleContent(single));
      item('Upravit obsah…', () => openInspector('content'));
      sep();
    }
    item(App.sel.size > 1 ? 'Vybrat vazby těchto buněk' : 'Vybrat vazby této buňky',
      () => selectEdgesOf(Array.from(App.sel)));
    item('Duplikovat', () => duplicateSelection());
    item('Dopředu', () => {
      pushUndo();
      const sel = App.doc.nodes.filter((n) => App.sel.has(n.id));
      App.doc.nodes = App.doc.nodes.filter((n) => !App.sel.has(n.id)).concat(sel);
      renderNodes(); scheduleSave();
    });
    item('Dozadu', () => {
      pushUndo();
      const sel = App.doc.nodes.filter((n) => App.sel.has(n.id));
      App.doc.nodes = sel.concat(App.doc.nodes.filter((n) => !App.sel.has(n.id)));
      renderNodes(); scheduleSave();
    });
    sep();
    item('Smazat', () => deleteSelection(), true);
  } else {
    const p = screenToWorld(x, y);
    item('Nová buňka sem', () => { const n = addNode(p.x - NODE_W / 2, p.y - 20, { title: '' }); setTimeout(() => editTitle(n), 10); });
    item('Vybrat vše', () => {
      setSel(App.doc.nodes.map((n) => n.id));
      App.selEdges = new Set(App.doc.edges.map((e) => e.id));
      refreshSelection();
    });
    item('Vybrat všechny vazby', () => {
      if (!App.doc.edges.length) { toast('Mapa zatím nemá vazby'); return; }
      setSelEdges(App.doc.edges.map((e) => e.id), false); openInspector();
    });
    sep();
    item('Vycentrovat mapu', () => fitView(true));
    item('Rozbalit vše', () => toggleAllContent(true));
    item('Sbalit vše', () => toggleAllContent(false));
  }

  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  ctxEl = m;
  document.addEventListener('pointerdown', ctxOutside, true);
  window.addEventListener('blur', hideContextMenu);
}

function modal(html, onReady) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
  scrim.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  if (onReady) onReady(scrim, close);
  const first = scrim.querySelector('input,button.primary');
  if (first) setTimeout(() => first.focus(), 30);
  return { el: scrim, close };
}

          'Aplikace si řekne jen o oprávnění <code>drive.file</code> – vidí tedy výhradně soubory, které sama vytvoří.</p>' +
          '<label class="field"><span>ID klienta</span>' +
          '<input class="input" id="setClientId" placeholder="123456789-abc.apps.googleusercontent.com" spellcheck="false"></label>' +
          '<p class="tiny">Do <strong>Authorized JavaScript origins</strong> v Google Cloud patří přesně: <code>' +
          esc(location.origin) + '</code></p>'
        : '<p class="tiny" style="margin-top:0;color:var(--danger)"><strong>Tady Disk nepůjde.</strong> ' +
          'Google povoluje přihlášení jen na adrese <code>https://…</code> nebo <code>http://localhost</code>. ' +
          'Tenhle soubor běží jako <code>' + esc(location.protocol) + '</code>, takže Disk se dá použít až ' +
          'z verze nahrané na web (např. GitHub Pages).</p>') +

      '<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">' +
      '<div class="tiny" style="font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--fg-2);margin-bottom:8px">Šifrování map</div>' +
      (Crypt.supported()
        ? '<p class="tiny" style="margin-top:0">Mapy se před uložením zašifrují heslem (AES-GCM 256, klíč z hesla přes PBKDF2). ' +
          'Kdo se dostane k souborům, uvidí jen nesmyslná data.<br>' +
          '<strong>Heslo nikde neleží a nejde obnovit – když ho zapomeneš, mapy jsou nenávratně pryč.</strong></p>' +
          (cryptOn
            ? '<p class="tiny" style="color:var(--accent)">Šifrování je <strong>zapnuté</strong>' +
              (Crypt.ready ? ' a odemčené.' : ', ale mapy jsou v téhle záložce zamčené.') + '</p>' +
              '<button class="btn" id="setCryptOff" style="width:100%">Vypnout šifrování (mapy se uloží čitelně)</button>'
            : '<label class="field"><span>Heslo</span><input class="input" type="password" id="setPass1" autocomplete="new-password"></label>' +
              '<label class="field"><span>Heslo znovu</span><input class="input" type="password" id="setPass2" autocomplete="new-password"></label>' +
              '<button class="btn" id="setCryptOn" style="width:100%">Zapnout šifrování</button>')
        : '<p class="tiny">Tenhle prohlížeč neumí WebCrypto, šifrování není k dispozici.</p>') +
      '<p class="tiny" id="setMsg" style="margin-top:10px"></p>' +
    '</div>' +
    '<footer><button class="btn primary" id="setOk">Hotovo</button></footer>';

  modal(html, (root, close) => {
    const msg = $('#setMsg', root);
    const ci = $('#setClientId', root);
    if (ci) ci.value = Drive.clientId || '';

    $('#setOk', root).addEventListener('click', () => {
      if (ci) Drive.saveConfig(ci.value);
      close(); renderLibrary();
    });

    const on = $('#setCryptOn', root);
    if (on) on.addEventListener('click', async () => {
      const a = $('#setPass1', root).value, b = $('#setPass2', root).value;
      if (a.length < 6) { msg.textContent = 'Heslo musí mít aspoň 6 znaků.'; return; }
      if (a !== b) { msg.textContent = 'Hesla se neshodují.'; return; }
      msg.textContent = 'Šifruji mapy…';
      if (ci) Drive.saveConfig(ci.value);
      await Crypt.enable(a);
      await Store.rewriteAll();
      close(); renderLibrary();
      toast('Mapy jsou od teď šifrované heslem');
    });

    const off = $('#setCryptOff', root);
    if (off) off.addEventListener('click', async () => {
      if (!Crypt.ready) { msg.textContent = 'Nejdřív mapy odemkni heslem.'; return; }
      if (!confirm('Opravdu vypnout šifrování? Mapy se uloží čitelně.')) return;
      msg.textContent = 'Přepisuji mapy…';
      Crypt.on = false; Crypt.saveSettings();
      await Store.rewriteAll();
      Crypt.disable();
      close(); renderLibrary();
      toast('Šifrování vypnuto');
    });
  });
}

/* ---------------------- odemknutí ---------------------- */
function showUnlock(after) {
  const locked = Store.entries.find((e) => e.doc && e.doc.locked);
  const html =
    '<header>Zadej heslo k mapám</header>' +
    '<div class="mbody">' +
      '<p class="tiny" style="margin-top:0">Mapy v tomhle úložišti jsou zašifrované. Bez hesla je nejde otevřít ani zobrazit náhled.</p>' +
      '<label class="field"><span>Heslo</span><input class="input" type="password" id="unlockPass" autocomplete="current-password"></label>' +
      '<p class="tiny" id="unlockMsg"></p>' +
    '</div>' +
    '<footer><button class="btn" id="unlockCancel">Zrušit</button>' +
    '<button class="btn primary" id="unlockOk">Odemknout</button></footer>';

  modal(html, (root, close) => {
    const inp = $('#unlockPass', root), msg = $('#unlockMsg', root);
    const go = async () => {
      msg.textContent = 'Ověřuji…';
      const salt = locked && locked.doc.salt ? locked.doc.salt : Crypt.salt;
      const iter = locked && locked.doc.iter ? locked.doc.iter : Crypt.ITER;
      await Crypt.unlock(inp.value, salt, iter);
      Crypt.on = true; Crypt.saveSettings();
      if (Store.drive) await Store.scan();
      else if (Store.dir) await Store.scan();
      else await Store.loadLocal();
      if (Store.locked) {
        Crypt.lock();
        msg.textContent = 'Špatné heslo.';
        return;
      }
      close(); renderLibrary();
      toast('Mapy odemčené');
      if (after) after();
    };
    $('#unlockOk', root).addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    $('#unlockCancel', root).addEventListener('click', close);
  });
}

/* ---- 57-sync.js ---- */
/* ============================================================
   Průběžná synchronizace – změny z jiného zařízení
   ------------------------------------------------------------
   Každých pár desítek vteřin (a hned po návratu do záložky)
   se zeptáme úložiště, jestli se něco nezměnilo. Stahuje se
   jen to, co má jiné datum změny.
   ============================================================ */

const Sync = {
  INTERVAL: 20000,       // jak často kontrolovat (ms)
  MIN_GAP: 4000,         // minimální odstup dvou kontrol
  timer: null,
  busy: false,
  last: 0,
  authLost: false,
  barKind: '',           // 'save' | 'conflict' | 'auth'
  conflict: null,        // {entry, doc}

  start() {
    this.stop();
    if (!Store.drive && !Store.dir) return;
    this.timer = setInterval(() => this.now(), this.INTERVAL);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  setStatus(txt) {
    const el = $('#syncState');
    if (!el) return;
    el.textContent = txt || '';
    el.classList.toggle('hidden', !txt);
  },

  async now(force) {
    if (this.busy || this.authLost) return;
    if (!Store.drive && !Store.dir) return;
    if (!force && document.hidden) return;
    if (!force && Date.now() - this.last < this.MIN_GAP) return;
    this.busy = true;
    const btn = $('#btnSync');
    if (btn) btn.classList.add('spin');
    try {
      const openEntry = $('#editor').classList.contains('hidden') ? null : App.entry;
      const res = await Store.poll(openEntry);
      this.last = Date.now();
      if (res && (res.changed.length || res.added.length || res.removed.length)) {
        this.apply(res);
      } else if (force) {
        toast('Nic nového, všechno je aktuální');
      }
    } catch (err) {
      const msg = String((err && err.message) || err);
      if ((err && err.auth) || /401|přihláš|invalid|token/i.test(msg)) {
        this.authLost = true; this.stop(); this.showAuthBar();
      } else {
        console.warn('synchronizace:', msg);
        if (force) toast('Nepodařilo se zkontrolovat změny: ' + msg.slice(0, 120), 4000);
      }
    } finally {
      this.busy = false;
      if (btn) btn.classList.remove('spin');
    }
  },

  apply(res) {
    const inEditor = !$('#editor').classList.contains('hidden');
    const mine = App.entry;

    if (mine && res.removed.indexOf(mine) >= 0) {
      toast('Tahle mapa byla smazaná na jiném zařízení', 5000);
      App.entry = null; App.doc = null;
      showLibrary();
      return;
    }

    const hit = res.changed.find((c) => c.entry === mine && c.doc);
    if (inEditor && hit) {
      if (App.dirty || App.undoStack.length && App.dirty) { this.showConflict(hit.entry, hit.doc); }
      else { this.adopt(hit.entry, hit.doc); toast('Mapa aktualizovaná podle jiného zařízení'); }
    }

    if (!inEditor) {
      renderLibrary();
      const n = res.changed.length + res.added.length + res.removed.length;
      this.setStatus('');
      toast(n === 1 ? 'Knihovna aktualizovaná' : 'Knihovna aktualizovaná (' + n + ' změn)');
    }
  },

  /** převezme cizí verzi otevřené mapy, ale nechá uživateli jeho výřez plátna */
  adopt(entry, doc) {
    if (doc.locked) { showLibrary(); return; }
    const keepView = clone(App.doc.view);
    const selNodes = Array.from(App.sel), selEdges = Array.from(App.selEdges);
    App.suppressSave = true;
    entry.doc = doc;
    App.doc = doc;
    App.doc.view = keepView;
    App.sizes = Object.create(null);
    nodeEls.forEach((el) => el.remove()); nodeEls.clear();
    App.undoStack.length = 0; App.redoStack.length = 0; updateHistoryButtons();
    $('#docTitle').value = doc.title;
    renderNodes();
    applyView();
    App.sel = new Set(selNodes.filter((id) => getNode(id)));
    App.selEdges = new Set(selEdges.filter((id) => getEdge(id)));
    refreshSelection();
    App.dirty = false;
    setSaveState('Načteno z úložiště ' + fmtDate(Date.now()), false);
    this.hideBar();
    requestAnimationFrame(() => { measure(); App.suppressSave = false; });
  },

  /* ---------------- lišta s hlášením ---------------- */
  bar(html, actions) {
    let b = $('#syncBar');
    if (!b) {
      b = document.createElement('div');
      b.id = 'syncBar'; b.className = 'syncbar';
      els.canvas.appendChild(b);
    }
    b.innerHTML = '<span>' + html + '</span>';
    (actions || []).forEach((a) => {
      const btn = document.createElement('button');
      btn.className = 'btn sm' + (a.primary ? ' primary' : '');
      btn.textContent = a.label;
      btn.addEventListener('click', a.fn);
      b.appendChild(btn);
    });
    b.classList.remove('hidden');
    return b;
  },
  hideBar() { const b = $('#syncBar'); if (b) b.classList.add('hidden'); this.barKind = ''; },

  showConflict(entry, doc) {
    this.conflict = { entry, doc };
    this.barKind = 'conflict';
    this.bar('Mapa se mezitím změnila na jiném zařízení a ty tu máš neuložené úpravy.', [
      { label: 'Načíst jejich verzi', fn: () => this.adopt(entry, doc) },
      { label: 'Nechat moji', primary: true, fn: async () => {
        this.hideBar();
        entry.remoteMod = null;
        await saveNow();
        toast('Uloženo – tvoje verze přepsala tu druhou');
      } }
    ]);
  },

  showAuthBar() {
    this.barKind = 'auth';
    this.bar('Přihlášení ke Google Disku vypršelo.', [
      { label: 'Přihlásit znovu', primary: true, fn: async () => {
        try {
          await Drive.signIn(true);
          this.authLost = false; this.hideBar(); this.start(); this.now(true);
          toast('Připojeno');
        } catch (e) { toast('Přihlášení se nezdařilo', 4000); }
      } }
    ]);
    if ($('#library').classList.contains('hidden')) return;
    toast('Přihlášení ke Google Disku vypršelo – klikni na Google Disk', 5000);
  },

  /* token si obnovíme potichu při běžném kliknutí uživatele, ať nic neblokuje popup */
  hookGestureRefresh() {
    let running = false;
    const h = async () => {
      /* při každém doteku zkontrolujeme, jestli nám něco neuteklo */
      if (Date.now() - this.last > this.INTERVAL) this.now();
      if (running || !Store.drive || !Drive.connected) return;
      if (Date.now() < Drive.expiresAt - 10 * 60 * 1000) return;
      running = true;
      try { await Drive.signIn(false); this.authLost = false; this.hideBar(); this.start(); }
      catch (e) { /* zkusíme příště */ }
      finally { running = false; }
    };
    document.addEventListener('pointerdown', h, true);
    document.addEventListener('keydown', h, true);
  }
};

/* ============================================================
   Knihovna listů, přepínání obrazovek, start aplikace
   ============================================================ */

function showLibrary() {
  if (App.entry) { doSave.flush(); }
  $('#library').classList.remove('hidden');
  $('#editor').classList.add('hidden');
  $$('.editor-only').forEach((e) => e.classList.add('hidden'));
  Sync.hideBar();
  renderLibrary();
  setTimeout(() => Sync.now(), 200);
}

function showEditor() {
  $('#library').classList.add('hidden');
  $('#editor').classList.remove('hidden');
  $$('.editor-only').forEach((e) => e.classList.remove('hidden'));
}

const ICONS = {
  pencil: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16Z"/><path d="m14.5 5.5 4 4"/></svg>',
  copy:   '<svg class="ico" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  download:'<svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 10.5 4.5 4.5 4.5-4.5"/><path d="M4 17v3h16v-3"/></svg>',
  trash:  '<svg class="ico" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/></svg>'
};

let libFilter = '';

function renderLibrary() {
  const grid = $('#libGrid');
  grid.textContent = '';
  const oldBanner = $('#lockBanner');
  if (oldBanner) oldBanner.remove();
  const q = libFilter.trim().toLowerCase();
  const list = !q ? Store.entries : Store.entries.filter((e) => {
    if ((e.title || e.name || '').toLowerCase().includes(q)) return true;
    if (!e.doc || e.doc.locked) return false;
    return e.doc.nodes.some((n) => (n.title + ' ' + n.content).toLowerCase().includes(q));
  });

  const addCard = document.createElement('button');
  addCard.className = 'card new';
  addCard.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Nová mapa</span>';
  addCard.addEventListener('click', createMap);
  grid.appendChild(addCard);

  list.forEach((entry) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (entry.doc && entry.doc.locked) {
      card.innerHTML =
        '<div class="thumb" style="display:grid;place-items:center">' +
        '<svg viewBox="0 0 24 24" style="width:34px;height:34px;fill:none;stroke:var(--fg-3);stroke-width:1.6">' +
        '<rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>' +
        '<div class="meta"><h3></h3><div class="sub"><span>zašifrovaná mapa</span><span>' +
        esc(fmtDate(entry.modified)) + '</span></div></div>';
      card.querySelector('h3').textContent = entry.name;
      card.addEventListener('click', () => showUnlock());
      grid.appendChild(card);
      return;
    }
    const nodes = entry.doc.nodes.length, edges = entry.doc.edges.length;
    card.innerHTML =
      thumbSVG(entry.doc, 320, 200) +
      '<div class="meta"><h3></h3><div class="sub"><span>' +
      nodes + ' ' + plural(nodes, 'buňka', 'buňky', 'buněk') + '</span><span>' +
      edges + ' ' + plural(edges, 'vazba', 'vazby', 'vazeb') + '</span><span>' +
      esc(fmtDate(entry.modified)) + '</span></div></div>' +
      '<div class="acts"></div>';
    card.querySelector('h3').textContent = entry.doc.title;
    card.querySelector('h3').title = entry.path || entry.name;

    const acts = card.querySelector('.acts');
    const mk = (icon, title, fn, danger) => {
      const b = document.createElement('button');
      b.className = 'btn ghost sm' + (danger ? ' danger' : '');
      b.innerHTML = icon; b.title = title; b.setAttribute('aria-label', title);
      b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
      acts.appendChild(b);
    };
    mk(ICONS.pencil, 'Přejmenovat mapu i soubor', async () => {
      const t = prompt('Nový název mapy:', entry.doc.title);
      if (t === null || !t.trim()) return;
      entry.doc.title = t.trim();
      await Store.write(entry);
      await Store.renameFile(entry);
      renderLibrary();
    });
    mk(ICONS.copy, 'Vytvořit kopii', async () => { await Store.duplicate(entry); renderLibrary(); toast('Kopie vytvořena'); });
    mk(ICONS.download, 'Stáhnout soubor mapy', () => downloadDoc(entry.doc, entry.name));
    mk(ICONS.trash, 'Smazat mapu', async () => {
      if (!confirm('Opravdu smazat mapu „' + entry.doc.title + '“?\nSoubor ' + entry.name + ' bude odstraněn.')) return;
      await Store.remove(entry); renderLibrary(); toast('Mapa smazána');
    }, true);

    card.addEventListener('click', () => openMap(entry));
    grid.appendChild(card);
  });

  $('#libEmpty').classList.toggle('hidden', list.length > 0);

  const fp = $('#folderPath');
  const count = Store.entries.length + ' ' + plural(Store.entries.length, 'mapa', 'mapy', 'map');
  const lock = Crypt.on ? (Crypt.ready ? '  ·  🔒 šifrováno' : '  ·  🔒 zamčeno') : '';
  const checked = Sync.last ? '  ·  ověřeno ' + fmtDate(Sync.last).replace('dnes ', '') : '';
  if (Store.drive) fp.innerHTML = 'Google Disk › <a href="' + Drive.folderUrl() +
    '" target="_blank" rel="noopener">' + esc(Drive.folderName) + '</a>  ·  ' + count + lock + checked;
  else if (Store.dir) fp.textContent = 'Složka: ' + Store.dirName + '  ·  ' + count + lock + checked;
  else if (!HAS_FS) fp.textContent = 'Mapy se ukládají do prohlížeče (tento prohlížeč neumí zapisovat přímo do složky).';
  else fp.textContent = 'Žádná složka není vybraná';

  const lead = $('#libLead');
  if (lead) {
    if (Store.drive) lead.textContent = 'Mapy se ukládají do složky na tvém Google Disku a jsou tak dostupné z každého počítače, kde se přihlásíš.';
    else if (Store.dir) lead.textContent = 'Mapy se ukládají do vybrané složky v počítači. Změny se zapisují průběžně samy.';
    else if (HAS_FS) lead.textContent = 'Vyber složku v počítači nebo se připoj ke Google Disku – aplikace v ní najde všechny mapy, zobrazí je jako miniatury a změny do nich průběžně ukládá.';
  }

  checkLeftovers();

  const od = $('#btnOpenDrive');
  if (od) {
    od.classList.toggle('hidden', !Store.drive);
    if (Store.drive) od.href = Drive.folderUrl();
  }

  const dl = $('#driveLabel');
  if (dl) dl.textContent = Store.drive ? 'Odpojit Disk' : (Drive.originOk() ? 'Google Disk' : 'Google Disk (jen na webu)');
  $('#btnDrive').setAttribute('aria-pressed', String(Store.drive));

  if (Store.locked && !Crypt.ready) {
    const b = document.createElement('div');
    b.className = 'empty'; b.id = 'lockBanner';
    b.innerHTML = '<p>Zašifrovaných map: ' + Store.locked + '. Zadej heslo a uvidíš je.</p>';
    const btn = document.createElement('button');
    btn.className = 'btn primary'; btn.textContent = 'Odemknout heslem';
    btn.addEventListener('click', () => showUnlock());
    b.appendChild(btn);
    $('#libEmpty').classList.add('hidden');
    grid.parentElement.appendChild(b);
  }
}

/** mapy, které zůstaly jen v prohlížeči, i když jsme připojení k Disku/složce */
async function checkLeftovers() {
  const old = $('#leftoverBar');
  if (old) old.remove();
  if (!(Store.drive || Store.dir)) return;
  let list = [];
  try { list = await Store.localOnly(); } catch (e) { return; }
  if (!list.length) return;
  const bar = document.createElement('div');
  bar.id = 'leftoverBar';
  bar.className = 'folderbar';
  bar.style.borderColor = 'var(--accent)';
  const txt = document.createElement('span');
  txt.className = 'tiny';
  txt.style.flex = '1';
  txt.innerHTML = '<strong>' + list.length + ' ' + plural(list.length, 'mapa je', 'mapy jsou', 'map je') +
    ' uložených jen v tomhle prohlížeči</strong>, ne v připojeném úložišti.';
  bar.appendChild(txt);
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  btn.textContent = Store.drive ? 'Nahrát je na Disk' : 'Přenést je do složky';
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Nahrávám…';
    try {
      const n = await Store.uploadLocal();
      await Store.scan();
      renderLibrary();
      toast('Přeneseno: ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map'));
    } catch (err) {
      toast('Přenos selhal: ' + (err && err.message ? err.message : err), 5000);
      btn.disabled = false; btn.textContent = 'Zkusit znovu';
    }
  });
  bar.appendChild(btn);
  const fb = $('.folderbar');
  fb.parentElement.insertBefore(bar, fb.nextSibling);
}

/* ----------------------------- otevření mapy ----------------------------- */
async function openMap(entry) {
  if (entry.doc && entry.doc.locked) { showUnlock(); return; }
  Sync.hideBar();
  App.entry = entry;
  App.doc = entry.doc;
  App.sel.clear(); App.selEdges.clear();
  App.undoStack.length = 0; App.redoStack.length = 0;
  App.sizes = Object.create(null);
  nodeEls.forEach((el) => el.remove()); nodeEls.clear();
  updateHistoryButtons();
  $('#docTitle').value = App.doc.title;
  showEditor();
  App.suppressSave = true;
  renderNodes();
  // přesně obnovíme uložený výřez plátna
  applyView();
  requestAnimationFrame(() => {
    measure();
    if (!App.doc.nodes.length) { fitView(false); }
    else if (!anythingVisible()) {
      fitView(false);
      toast('Uložený výřez byl mimo obrazovku – mapa je vycentrovaná', 3200);
    }
    App.suppressSave = false;
    setSaveState('Uloženo ' + fmtDate(entry.modified), false);
    inspKey = ''; updateInspector();
  });
}

/** je v aktuálním výřezu vidět aspoň kus mapy? (např. po otevření na mobilu) */
function anythingVisible() {
  const v = view(), cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
  return App.doc.nodes.some((n) => {
    const s = nodeSize(n);
    const x = n.x * v.zoom + v.x, y = n.y * v.zoom + v.y;
    return x < cw - 20 && x + s.w * v.zoom > 20 && y < ch - 20 && y + s.h * v.zoom > 20;
  });
}

async function createMap() {
  try {
    const entry = await Store.create('Nová mapa');
    const n1 = newNode(-105, -20, 'Ústřední téma');
    n1.color = 'blue';
    entry.doc.nodes.push(n1);
    await Store.write(entry);
    await openMap(entry);
    setTimeout(() => { setSel(n1.id); editTitle(n1); }, 60);
  } catch (err) {
    console.error(err);
    toast('Nepodařilo se vytvořit mapu: ' + err.message, 4000);
  }
}

async function manualSave() {
  if (!App.entry) return;
  await saveNow();
  if (App.entry.driveId) toast('Uloženo na Google Disk (' + App.entry.name + ')');
  else if (App.entry.handle) toast('Uloženo do souboru ' + App.entry.name);
  else { toast('Uloženo do prohlížeče – stahuji kopii'); downloadDoc(App.doc, App.entry.name); }
}

async function doImport(files) {
  if (!files || !files.length) return;
  toast('Načítám ' + files.length + ' ' + plural(files.length, 'soubor', 'soubory', 'souborů') + '…');
  let n = 0;
  try { n = await Store.importFiles(files); }
  catch (err) { toast('Import selhal: ' + (err && err.message ? err.message : err), 5000); return; }
  renderLibrary();
  if (n) toast('Naimportováno ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map'));
  else toast('V souborech nebyla nalezena žádná mapa (umím .mapa.json, .canvas, .orgpage, .edn)', 5000);
}

/* ----------------------------- Google Disk -------------------------------- */
async function connectDrive() {
  if (Store.drive) {
    Sync.stop();
    Store.disconnectDrive();
    await Store.loadLocal(true);
    renderLibrary();
    toast('Google Disk odpojen');
    return;
  }
  Drive.loadConfig();
  if (!Drive.originOk()) {
    toast('Přihlášení Googlem funguje jen na https nebo localhost – viz Nastavení', 5000);
    showSettings();
    return;
  }
  if (!Drive.clientId) { showSettings(); return; }
  const btn = $('#btnDrive');
  btn.disabled = true;
  $('#driveLabel').textContent = 'Připojuji…';
  try {
    await Store.connectDrive();
    localStorage.setItem('mm.drive.last', '1');
    Sync.authLost = false; Sync.start();
    renderLibrary();
    toast('Připojeno – složka „' + Drive.folderName + '“ na Google Disku');
    if (Store.locked && !Crypt.ready) showUnlock();
  } catch (err) {
    console.error(err);
    toast('Disk se nepřipojil: ' + (err && err.message ? err.message : err), 6000);
    renderLibrary();
  } finally {
    btn.disabled = false;
    renderLibrary();
  }
}

/* ----------------------------- složka ------------------------------------ */
async function pickFolder() {
  if (!HAS_FS) { $('#dirImport').click(); return; }
  try {
    await Store.pickFolder();
    $('#btnReconnect').classList.add('hidden');
    Sync.start();
    renderLibrary();
    toast('Složka „' + Store.dirName + '“ je připojená');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    console.error(err);
    toast('Složku se nepodařilo otevřít. Zkus soubory importovat tlačítkem Importovat.', 4500);
  }
}

/* ----------------------------- start ------------------------------------- */
async function init() {
  cacheEls();
  initTheme();
  initCanvasEvents();
  initKeys();

  /* horní lišta */
  $('#btnHome').addEventListener('click', () => { if (App.entry) doSave.flush(); showLibrary(); });
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnHelp').addEventListener('click', showHelp);
  $('#btnSync').addEventListener('click', () => Sync.now(true));

  const dt = $('#docTitle');
  dt.addEventListener('focus', () => { lastSnap = snapshot(); });
  dt.addEventListener('input', () => { App.doc.title = dt.value; scheduleSave(); });
  dt.addEventListener('blur', async () => {
    if (lastSnap) { App.undoStack.push(lastSnap); lastSnap = null; updateHistoryButtons(); }
    if (App.entry) { doSave.flush(); await Store.renameFile(App.entry); }
  });
  dt.addEventListener('keydown', (e) => { if (e.key === 'Enter') dt.blur(); });

  /* knihovna */
  $('#btnPickFolder').addEventListener('click', pickFolder);
  $('#btnReconnect').addEventListener('click', async () => {
    if (await Store.reconnect()) { $('#btnReconnect').classList.add('hidden'); renderLibrary(); }
  });
  $('#btnRescan').addEventListener('click', async () => {
    const btn = $('#btnRescan');
    btn.disabled = true;
    try {
      if (Store.drive || Store.dir) {
        await Store.scan();
        Sync.last = Date.now();
        toast(Store.drive ? 'Načteno z Google Disku (' + Store.entries.length + ' ' +
          plural(Store.entries.length, 'mapa', 'mapy', 'map') + ')' : 'Složka načtena znovu');
      } else {
        await Store.loadLocal(true);
        toast('Obnoveno');
      }
    } catch (err) {
      console.error(err);
      toast('Obnovení selhalo: ' + (err && err.message ? err.message : err), 5000);
    } finally {
      btn.disabled = false;
      renderLibrary();
    }
  });
  $('#libFilter').addEventListener('input', (e) => { libFilter = e.target.value; renderLibrary(); });
  $('#btnSettings').addEventListener('click', showSettings);
  $('#btnDrive').addEventListener('click', connectDrive);
  $('#btnImport').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', async (e) => {
    await doImport(e.target.files);
    e.target.value = '';
  });

  /* přetažení souborů rovnou do knihovny */
  const lib = $('#library');
  lib.addEventListener('dragover', (ev) => { ev.preventDefault(); lib.classList.add('dropping'); });
  lib.addEventListener('dragleave', (ev) => { if (ev.target === lib) lib.classList.remove('dropping'); });
  lib.addEventListener('drop', async (ev) => {
    ev.preventDefault(); lib.classList.remove('dropping');
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) await doImport(ev.dataTransfer.files);
  });
  $('#dirImport').addEventListener('change', async (e) => {
    const n = await Store.importFiles(e.target.files);
    e.target.value = '';
    renderLibrary();
    toast(n ? 'Načteno ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map') + ' ze složky' : 'Ve složce nejsou mapy');
  });

  /* nástrojová lišta */
  $('#tAdd').addEventListener('click', () => {
    const r = els.canvas.getBoundingClientRect();
    const p = screenToWorld(r.left + r.width / 2, r.top + r.height / 3);
    const n = addNode(p.x - NODE_W / 2, p.y, { title: '' });
    setTimeout(() => editTitle(n), 10);
  });
  $('#tLink').addEventListener('click', () => {
    App.tool = App.tool === 'link' ? 'pan' : 'link';
    if (App.tool === 'link') {
      App.linkGroup = Array.from(App.sel);
      App.linkSticky = App.linkGroup.length > 1;
      toast(App.linkGroup.length > 1
        ? 'Klepni na buňku, se kterou se spojí všech ' + App.linkGroup.length + ' vybraných'
        : (App.linkGroup.length === 1
            ? 'Klepni na buňku, se kterou se má vybraná spojit'
            : 'Klepni na dvě buňky a spojí se'));
    } else { App.linkGroup = []; App.linkSticky = false; }
    refreshSelection(); syncTools();
  });
  $('#tSelect').addEventListener('click', () => {
    App.tool = App.tool === 'select' ? 'pan' : 'select';
    syncTools();
  });
  $('#tFit').addEventListener('click', () => fitView(true));
  $('#tPanel').addEventListener('click', () => toggleInspector());
  $('#tMore').addEventListener('click', (ev) => {
    const r = ev.currentTarget.getBoundingClientRect();
    showContextMenu(r.left - 40, r.top - 12, App.sel.size > 0);
  });
  $('#inspClose').addEventListener('click', () => toggleInspector(false));
  $('#zIn').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1.25));
  $('#zOut').addEventListener('click', () => zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.25));

  /* odškrtnutí úkolu přímo v buňce */
  els.nodes.addEventListener('click', (ev) => {
    const cb = ev.target.closest('.md-cb');
    if (!cb) return;
    ev.preventDefault(); ev.stopPropagation();
    const host = cb.closest('.node'); if (!host) return;
    const n = getNode(host.dataset.id); if (!n) return;
    pushUndo();
    n.content = toggleTask(n.content, Number(cb.dataset.i));
    paintNode(n); measure(); scheduleSave();
    const ta = $('#inspContent');
    if (ta && App.sel.size === 1 && App.sel.has(n.id)) ta.value = n.content;
  });

  /* klik na šipku v buňce */
  els.nodes.addEventListener('click', (ev) => {
    const tog = ev.target.closest('.n-toggle');
    if (!tog) return;
    ev.stopPropagation();
    const n = getNode(tog.closest('.node').dataset.id);
    if (!n.content && !n.open) { setSel(n.id); openInspector('content'); n.open = true; paintNode(n); measure(); scheduleSave(); return; }
    toggleContent(n);
  });
  els.nodes.addEventListener('blur', (ev) => {
    if (ev.target.classList && ev.target.classList.contains('n-title') && editingEl === ev.target) stopEditTitle(true);
  }, true);

  window.addEventListener('resize', debounce(() => { measure(); }, 150));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (App.dirty) doSave.flush(); }
    else setTimeout(() => Sync.now(), 300);
  });
  window.addEventListener('focus', () => setTimeout(() => Sync.now(), 300));
  window.addEventListener('online', () => Sync.now());
  Sync.hookGestureRefresh();
  window.addEventListener('pagehide', () => { if (App.dirty) doSave.flush(); });
  window.addEventListener('beforeunload', (e) => {
    if (App.dirty) { doSave.flush(); e.preventDefault(); e.returnValue = ''; }
  });

  Drive.loadConfig();
  Crypt.loadSettings();

  /* obnovení posledně použité složky */
  if (!HAS_FS) {
    $('#pickLabel').textContent = 'Načíst složku s mapami';
    $('#libLead').textContent = 'Tento prohlížeč neumí zapisovat přímo do složky, proto se mapy ukládají ' +
      'do prohlížeče a kdykoli je můžeš stáhnout jako soubor. Pro plnou práci se složkou použij Chrome nebo Edge na počítači.';
    await Store.loadLocal();
  } else {
    const r = await Store.restoreFolder();
    if (r === 'needs-permission') {
      $('#btnReconnect').classList.remove('hidden');
      $('#folderPath').textContent = 'Složka „' + Store.dirName + '“ – potvrď prosím přístup';
    }
    if (!Store.dir) await Store.loadLocal(true);
  }
  if (Store.locked && !Crypt.ready) setTimeout(() => showUnlock(), 400);
  syncTools();
  showLibrary();
  Sync.start();
}

function syncTools() {
  $('#tLink').setAttribute('aria-pressed', String(App.tool === 'link'));
  $('#tSelect').setAttribute('aria-pressed', String(App.tool === 'select'));
}

document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
