<script>
/* ---- 00-util.js ---- */
/* ============================================================
   Myšlenkové mapy – utilitky
   ============================================================ */
'use strict';

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = (p) => (p || 'x') + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function debounce(fn, ms) {
  let t; const f = function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
  f.cancel = () => clearTimeout(t);
  f.flush = function (...a) { clearTimeout(t); fn.apply(this, a); };
  return f;
}

let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2600);
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const p = (n) => String(n).padStart(2, '0');
  if (sameDay) return 'dnes ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return p(d.getDate()) + '. ' + p(d.getMonth() + 1) + '. ' + d.getFullYear();
}

function plural(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

function slugify(s) {
  return (s || 'mapa').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'mapa';
}

/* ---------- theme ---------- */
function initTheme() {
  const saved = localStorage.getItem('mm.theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const now = cur ? cur : (sysDark ? 'dark' : 'light');
    const next = now === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('mm.theme', next);
  });
}

/* ============================================================
   Mini-Markdown (offline, bez knihoven)
   ============================================================ */
function mdInline(s) {
  let t = esc(s);
  // kód
  t = t.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
  // obrázek ![alt](src)
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => '<img src="' + u + '" alt="' + a + '">');
  // odkaz [text](url)
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m, a, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + a + '</a>');
  // tučné / kurzíva / škrtnuté
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // automatické odkazy
  t = t.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<)]+)/g,
    (m, pre, u) => pre + '<a href="' + (u.startsWith('www.') ? 'http://' + u : u) +
      '" target="_blank" rel="noopener">' + u + '</a>');
  return t;
}

let _mdCb = 0, _mdDepth = 0;
/** markdown(src, true) = zaškrtávátka jsou klikací (v buňce na plátně) */
function markdown(src, interactive) {
  if (!src || !src.trim()) return '';
  if (_mdDepth === 0) _mdCb = 0;
  _mdDepth++;
  try { return markdownBody(src, interactive); } finally { _mdDepth--; }
}

function markdownBody(src, interactive) {
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0, listStack = [];

  const closeLists = (toDepth) => {
    while (listStack.length > toDepth) out.push(listStack.pop() === 'ol' ? '</ol>' : '</ul>');
  };

  while (i < lines.length) {
    let line = lines[i];

    // blok kódu
    if (/^```/.test(line)) {
      closeLists(0);
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(esc(lines[i])); i++; }
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    // vodorovná čára
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { closeLists(0); out.push('<hr>'); i++; continue; }
    // nadpis
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if (m) {
      closeLists(0);
      const lvl = Math.min(m[1].length, 3);
      out.push('<h' + lvl + '>' + mdInline(m[2]) + '</h' + lvl + '>');
      i++; continue;
    }
    // citace
    if (/^\s*>\s?/.test(line)) {
      closeLists(0);
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + markdownBody(buf.join('\n'), interactive) + '</blockquote>');
      continue;
    }
    // tabulka
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      closeLists(0);
      const cells = (r) => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
      const head = cells(line); i += 2;
      let html = '<table><thead><tr>' + head.map((c) => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>';
      while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
        html += '<tr>' + cells(lines[i]).map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>';
        i++;
      }
      out.push(html + '</tbody></table>');
      continue;
    }
    // seznamy (včetně zanoření po 2 mezerách)
    m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line);
    if (m) {
      const depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2) + 1;
      const type = /\d/.test(m[2]) ? 'ol' : 'ul';
      while (listStack.length > depth) out.push(listStack.pop() === 'ol' ? '</ol>' : '</ul>');
      if (listStack.length < depth) {
        while (listStack.length < depth) { listStack.push(type); out.push('<' + type + '>'); }
      }
      let txt = m[3];
      const cb = /^\[( |x|X)\]\s*/.exec(txt);
      let prefix = '', liCls = '';
      if (cb) {
        const done = cb[1].toLowerCase() === 'x';
        prefix = '<input type="checkbox" class="md-cb" data-i="' + (_mdCb++) + '"' +
          (done ? ' checked' : '') + (interactive ? '' : ' disabled') + '>';
        liCls = ' class="task' + (done ? ' done' : '') + '"';
        txt = txt.slice(cb[0].length);
      }
      out.push('<li' + liCls + '>' + prefix + mdInline(txt) + '</li>');
      i++; continue;
    }
    // prázdný řádek
    if (!line.trim()) { closeLists(0); i++; continue; }
    // odstavec
    closeLists(0);
    const para = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*>|```|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
  }
  closeLists(0);
  return out.join('\n');
}

/** přepne N-té zaškrtávátko ve zdrojovém textu (- [ ] <-> - [x]) */
function toggleTask(src, index) {
  let k = 0;
  return String(src).replace(
    /^([ \t]*(?:>[ \t]*)*(?:[-*+]|\d+[.)])[ \t]+)\[([ xX])\]/gm,
    (m, pre, ch) => (k++ === index ? pre + '[' + (ch === ' ' ? 'x' : ' ') + ']' : m)
  );
}

/* prostý text z markdownu – pro miniatury a hledání */
function mdPlain(src) {
  return String(src || '').replace(/```[\s\S]*?```/g, ' ')
    .replace(/[#>*_`~\[\]()!-]/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ---- 10-model.js ---- */
/* ============================================================
   Datový model a formát souboru (.mapa.json)
   ------------------------------------------------------------
   Soubor je čitelný JSON. Kromě obsahu ukládá i KOMPLETNÍ
   rozmístění: souřadnice a šířku každé buňky, stav rozbalení
   obsahu, pořadí vykreslení i výřez plátna (posun + zoom).
   Po znovuotevření tedy mapa vypadá naprosto stejně.
   ============================================================ */

const FORMAT = 'volna-mysl-mapa';
const FORMAT_VERSION = 1;
const FILE_EXT = '.mapa.json';

const COLORS = [
  { id: 'none',   label: 'Bez barvy', hex: '' },
  { id: 'blue',   label: 'Modrá',     hex: '#3b6ef0' },
  { id: 'indigo', label: 'Modrofialová', hex: '#5b62c4' },
  { id: 'teal',   label: 'Tyrkysová', hex: '#12a594' },
  { id: 'green',  label: 'Zelená',    hex: '#3d9a50' },
  { id: 'lime',   label: 'Limetková', hex: '#7aa61a' },
  { id: 'amber',  label: 'Žlutá',     hex: '#e0a018' },
  { id: 'orange', label: 'Oranžová',  hex: '#e26a2c' },
  { id: 'red',    label: 'Červená',   hex: '#d9453d' },
  { id: 'purple', label: 'Fialová',   hex: '#8b5cf6' },
  { id: 'pink',   label: 'Růžová',    hex: '#db4a8b' },
  { id: 'gray',   label: 'Šedá',      hex: '#77808f' }
];
const colorHex = (id) => (COLORS.find((c) => c.id === id) || COLORS[0]).hex;

const SHAPES = [
  { id: 'card',  label: 'Karta' },
  { id: 'round', label: 'Oválná' },
  { id: 'note',  label: 'Lísteček' },
  { id: 'plain', label: 'Jen text' }
];

const NODE_W = 210;

const NODE_DEFAULT = { color: 'none', shape: 'card', w: NODE_W };

/** výchozí vzhled nové buňky – uložený v dokumentu */
function nodeDefaults() {
  const d = (typeof App !== 'undefined' && App.doc && App.doc.defaults && App.doc.defaults.node) || null;
  return {
    color: (d && d.color) || NODE_DEFAULT.color,
    shape: (d && d.shape) || NODE_DEFAULT.shape,
    w: (d && d.w) || NODE_DEFAULT.w
  };
}

function newNode(x, y, title) {
  const d = nodeDefaults();
  return {
    id: uid('n'),
    title: title === undefined ? 'Nová buňka' : title,
    content: '',
    open: false,          // je obsah viditelný?
    x: Math.round(x), y: Math.round(y),
    w: d.w, h: 0,
    color: d.color,
    shape: d.shape,
    image: null           // data URI nebo URL
  };
}

const EDGE_DEFAULT = { style: 'solid', arrow: 'none', color: 'none' };

/** výchozí vzhled nové vazby – uložený v dokumentu */
function edgeDefaults() {
  const d = (typeof App !== 'undefined' && App.doc && App.doc.defaults && App.doc.defaults.edge) || null;
  return {
    style: (d && d.style) || EDGE_DEFAULT.style,
    arrow: (d && d.arrow) || EDGE_DEFAULT.arrow,
    color: (d && d.color) || EDGE_DEFAULT.color
  };
}

function newEdge(from, to) {
  const d = edgeDefaults();
  return { id: uid('e'), from, to, label: '', style: d.style, arrow: d.arrow, color: d.color };
}

function newDoc(title) {
  const now = Date.now();
  return {
    format: FORMAT,
    version: FORMAT_VERSION,
    id: uid('map'),
    title: title || 'Nová mapa',
    created: now,
    modified: now,
    view: { x: 0, y: 0, zoom: 1 },      // přesný výřez plátna
    defaults: { edge: Object.assign({}, EDGE_DEFAULT), node: Object.assign({}, NODE_DEFAULT) },
    nodes: [],
    edges: []
  };
}

/** Doplní chybějící pole, ověří formát. Vrací null, když to není mapa. */
function normalizeDoc(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (!Array.isArray(raw.nodes)) return null;
  const d = {
    format: FORMAT,
    version: FORMAT_VERSION,
    id: raw.id || uid('map'),
    title: typeof raw.title === 'string' && raw.title.trim() ? raw.title : 'Bez názvu',
    created: raw.created || Date.now(),
    modified: raw.modified || Date.now(),
    view: {
      x: Number(raw.view && raw.view.x) || 0,
      y: Number(raw.view && raw.view.y) || 0,
      zoom: clamp(Number(raw.view && raw.view.zoom) || 1, 0.1, 4)
    },
    defaults: {
      edge: {
        style: ['solid', 'dashed', 'dotted'].includes(raw.defaults && raw.defaults.edge && raw.defaults.edge.style)
          ? raw.defaults.edge.style : 'solid',
        arrow: ['none', 'to', 'both'].includes(raw.defaults && raw.defaults.edge && raw.defaults.edge.arrow)
          ? raw.defaults.edge.arrow : 'none',
        color: COLORS.some((c) => c.id === (raw.defaults && raw.defaults.edge && raw.defaults.edge.color))
          ? raw.defaults.edge.color : 'none'
      },
      node: {
        color: COLORS.some((c) => c.id === (raw.defaults && raw.defaults.node && raw.defaults.node.color))
          ? raw.defaults.node.color : 'none',
        shape: SHAPES.some((c) => c.id === (raw.defaults && raw.defaults.node && raw.defaults.node.shape))
          ? raw.defaults.node.shape : 'card',
        w: clamp(Number(raw.defaults && raw.defaults.node && raw.defaults.node.w) || NODE_W, 90, 900)
      }
    },
    nodes: [],
    edges: []
  };
  const ids = new Set();
  raw.nodes.forEach((n) => {
    if (!n || typeof n !== 'object') return;
    const id = n.id && !ids.has(n.id) ? n.id : uid('n');
    ids.add(id);
    d.nodes.push({
      id,
      title: typeof n.title === 'string' ? n.title : '',
      content: typeof n.content === 'string' ? n.content : '',
      open: !!(n.open !== undefined ? n.open : n.expanded),
      x: Number(n.x) || 0,
      y: Number(n.y) || 0,
      w: clamp(Number(n.w) || NODE_W, 90, 900),
      h: Number(n.h) > 0 ? clamp(Number(n.h), 20, 4000) : 0,
      color: COLORS.some((c) => c.id === n.color) ? n.color : 'none',
      shape: SHAPES.some((s) => s.id === n.shape) ? n.shape : 'card',
      image: typeof n.image === 'string' && n.image ? n.image : null
    });
  });
  (Array.isArray(raw.edges) ? raw.edges : []).forEach((e) => {
    if (!e || !ids.has(e.from) || !ids.has(e.to) || e.from === e.to) return;
    d.edges.push({
      id: e.id || uid('e'),
      from: e.from, to: e.to,
      label: typeof e.label === 'string' ? e.label : '',
      style: ['solid', 'dashed', 'dotted'].includes(e.style) ? e.style : 'solid',
      arrow: ['none', 'to', 'both'].includes(e.arrow) ? e.arrow : 'none',
      color: COLORS.some((c) => c.id === e.color) ? e.color : 'none'
    });
  });
  return d;
}

function serialize(doc) {
  return JSON.stringify(doc, null, 2);
}

function docBounds(doc, estH) {
  if (!doc.nodes.length) return { x: 0, y: 0, w: 1, h: 1 };
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  doc.nodes.forEach((n) => {
    const h = estH ? estH(n) : (n.open ? 120 : 44);
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + h);
  });
  return { x: x1, y: y1, w: Math.max(1, x2 - x1), h: Math.max(1, y2 - y1) };
}

/* ---------- miniatura listu jako SVG (kreslí se ze skutečného rozmístění) ---------- */
function thumbEstH(n) {
  return n.h || ((n.image ? 78 : 0) + (n.open ? 76 : 0) + 34);
}

function thumbSVG(doc, W, H) {
  W = W || 320; H = H || 200;
  const pad = 12;
  const b = docBounds(doc, thumbEstH);
  const s = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h, 1);
  const ox = pad + (W - pad * 2 - b.w * s) / 2 - b.x * s;
  const oy = pad + (H - pad * 2 - b.h * s) / 2 - b.y * s;
  const X = (v) => +(v * s + ox).toFixed(1);
  const Y = (v) => +(v * s + oy).toFixed(1);
  const pos = {};
  doc.nodes.forEach((n) => { pos[n.id] = { cx: n.x + n.w / 2, cy: n.y + thumbEstH(n) / 2 }; });

  let g = '';
  doc.edges.forEach((e) => {
    const a = pos[e.from], c = pos[e.to];
    if (!a || !c) return;
    const col = colorHex(e.color);
    g += '<line x1="' + X(a.cx) + '" y1="' + Y(a.cy) + '" x2="' + X(c.cx) + '" y2="' + Y(c.cy) +
      '" style="stroke:' + (col || 'currentColor') + ';stroke-opacity:' + (col ? '.75' : '.38') +
      '" stroke-width="1.1"' + (e.style === 'dashed' ? ' stroke-dasharray="3 3"' :
        e.style === 'dotted' ? ' stroke-dasharray="1 3"' : '') + '/>';
  });

  let imgs = 0;
  doc.nodes.slice(0, 120).forEach((n) => {
    const h = thumbEstH(n), w = n.w;
    const x = X(n.x), y = Y(n.y), pw = +(w * s).toFixed(1), ph = +(h * s).toFixed(1);
    const col = colorHex(n.color);
    const rx = n.shape === 'round' ? ph / 2 : Math.min(3, ph / 3);
    const plain = n.shape === 'plain';
    if (!plain) {
      g += '<rect x="' + x + '" y="' + y + '" width="' + pw + '" height="' + ph + '" rx="' + rx +
        '" style="fill:var(--bg-2);stroke:' + (col || 'var(--line-2)') + ';stroke-opacity:' +
        (col ? '.95' : '.7') + '" stroke-width="1"/>';
    }
    let cy = y + 2;
    if (n.image && imgs < 12 && pw > 16) {
      const ih = Math.min(ph * 0.55, pw * 0.62);
      g += '<image href="' + esc(n.image) + '" x="' + (x + 1) + '" y="' + (cy) + '" width="' + (pw - 2) +
        '" height="' + ih.toFixed(1) + '" preserveAspectRatio="xMidYMid slice"/>';
      cy += ih + 2;
      imgs++;
    }
    const title = (n.title || '').trim();
    if (title && pw >= 46) {
      const fs = Math.max(5.5, Math.min(10, 13 * s));
      const max = Math.max(3, Math.floor((pw - 8) / (fs * 0.52)));
      const txt = title.length > max ? title.slice(0, max - 1) + '…' : title;
      g += '<text x="' + (x + 4) + '" y="' + (cy + fs) + '" style="fill:var(--fg);font-weight:600;' +
        'font-size:' + fs.toFixed(1) + 'px;font-family:' + 'sans-serif">' + esc(txt) + '</text>';
      cy += fs + 3;
    } else if (title) {
      g += '<rect x="' + (x + 2) + '" y="' + (cy + 2) + '" width="' + Math.max(4, pw * 0.62) +
        '" height="' + Math.max(1.6, 3 * s) + '" rx="1" style="fill:' + (col || 'var(--fg-2)') +
        ';fill-opacity:.85"/>';
      cy += Math.max(3, 5 * s);
    }
    if (n.open && n.content) {
      const lines = Math.min(4, Math.max(1, Math.round((y + ph - cy) / Math.max(3, 6 * s))));
      for (let i = 0; i < lines; i++) {
        const lw = pw * (i === lines - 1 ? 0.45 : 0.8) - 8;
        if (lw < 3 || cy + 2 > y + ph - 2) break;
        g += '<rect x="' + (x + 4) + '" y="' + cy.toFixed(1) + '" width="' + lw.toFixed(1) +
          '" height="' + Math.max(1.2, 2 * s).toFixed(1) + '" rx="1" style="fill:var(--fg-3);fill-opacity:.5"/>';
        cy += Math.max(3, 6 * s);
      }
    }
  });

  if (!doc.nodes.length) {
    g = '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="13" ' +
      'style="fill:var(--fg-3);fill-opacity:.7" font-family="sans-serif">prázdná mapa</text>';
  }
  return '<svg class="thumb" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" ' +
    'style="color:var(--fg-3)" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

/* ---- 12-import.js ---- */
/* ============================================================
   Import map z jiných programů
   ------------------------------------------------------------
   *.orgpage / *.edn  – export z OrgPadu ve formátu EDN (věrnější)
   *.canvas           – JSON Canvas (Obsidian a spol.)
   ============================================================ */

/* ---------------------- čtečka EDN ---------------------- */
function parseEDN(src) {
  let i = 0;
  const isWs = (c) => c === ' ' || c === '\n' || c === '\t' || c === '\r' || c === ',';
  const isDelim = (c) => c === undefined || isWs(c) || '()[]{}"'.indexOf(c) >= 0 || c === ';';

  function skipWs() {
    for (;;) {
      while (i < src.length && isWs(src[i])) i++;
      if (src[i] === ';') { while (i < src.length && src[i] !== '\n') i++; continue; }
      if (src[i] === '#' && src[i + 1] === '_') { i += 2; readValue(); continue; }
      return;
    }
  }
  function readString() {
    i++; let out = '';
    while (i < src.length && src[i] !== '"') {
      if (src[i] === '\\') {
        i++;
        const e = src[i];
        if (e === 'n') out += '\n';
        else if (e === 't') out += '\t';
        else if (e === 'r') out += '\r';
        else if (e === 'u') { out += String.fromCharCode(parseInt(src.substr(i + 1, 4), 16)); i += 4; }
        else out += e;
        i++;
      } else { out += src[i]; i++; }
    }
    i++;
    return out;
  }
  function readToken() { const s = i; while (!isDelim(src[i])) i++; return src.slice(s, i); }
  function readSeq(close) {
    const a = [];
    for (;;) {
      skipWs();
      if (i >= src.length) break;
      if (src[i] === close) { i++; break; }
      a.push(readValue());
    }
    return a;
  }
  function readValue() {
    skipWs();
    const c = src[i];
    if (c === undefined) return undefined;
    if (c === '"') return readString();
    if (c === '[') { i++; return readSeq(']'); }
    if (c === '(') { i++; return readSeq(')'); }
    if (c === '{') {
      i++;
      const o = Object.create(null);
      for (;;) {
        skipWs();
        if (i >= src.length) break;
        if (src[i] === '}') { i++; break; }
        const k = readValue();
        const v = readValue();
        o[String(k)] = v;
      }
      return o;
    }
    if (c === '#') {
      i++;
      if (src[i] === '{') { i++; return readSeq('}'); }      // množina
      readToken();                                            // #uuid, #inst … značku zahodíme
      return readValue();
    }
    if (c === ':') { i++; return ':' + readToken(); }
    const tok = readToken();
    if (tok === 'nil') return null;
    if (tok === 'true') return true;
    if (tok === 'false') return false;
    if (/^[-+]?(\d|\.\d)/.test(tok)) {
      const n = Number(tok.replace(/[NM]$/, ''));
      if (!isNaN(n)) return n;
    }
    return tok;
  }
  return readValue();
}

/* ---------------------- hiccup -> Markdown ---------------------- */
function hicAttrs(n) {
  return (n[1] && typeof n[1] === 'object' && !Array.isArray(n[1])) ? n[1] : null;
}
function hicKids(n) { return n.slice(hicAttrs(n) ? 2 : 1); }

function hiccupInline(n) {
  if (n == null) return '';
  if (typeof n === 'string') return n;
  if (typeof n === 'number') return String(n);
  if (!Array.isArray(n)) return '';
  const tag = n[0];
  const at = hicAttrs(n) || {};
  const kids = hicKids(n).map(hiccupInline).join('');
  switch (tag) {
    case ':a': {
      const href = at[':href'] || at.href || '';
      const label = kids.trim() || href;
      return href ? '[' + label + '](' + href + ')' : label;
    }
    case ':b': case ':strong': return kids ? '**' + kids + '**' : '';
    case ':i': case ':em': return kids ? '*' + kids + '*' : '';
    case ':code': case ':kbd': return kids ? '`' + kids + '`' : '';
    case ':del': case ':s': return kids ? '~~' + kids + '~~' : '';
    case ':br': return '\n';
    case ':img': return '![](' + (at[':src'] || at.src || '') + ')';
    default: return kids;
  }
}

function hiccupBlocks(list, indent) {
  const out = [];
  const pad = '  '.repeat(indent || 0);
  (Array.isArray(list) ? list : [list]).forEach((n) => {
    if (n == null) return;
    if (typeof n === 'string') { if (n.trim()) out.push(pad + n.trim()); return; }
    if (!Array.isArray(n)) return;
    const tag = n[0];
    const kids = hicKids(n);
    if (tag === ':ul' || tag === ':ol') {
      let k = 0;
      kids.forEach((li) => {
        if (!Array.isArray(li)) return;
        const inline = [], nested = [];
        hicKids(li).forEach((ch) => {
          if (Array.isArray(ch) && (ch[0] === ':ul' || ch[0] === ':ol')) nested.push(ch);
          else inline.push(ch);
        });
        k++;
        const bullet = tag === ':ol' ? k + '. ' : '- ';
        const txt = inline.map(hiccupInline).join('').replace(/\s+$/, '');
        out.push(pad + bullet + txt);
        nested.forEach((nn) => { const s = hiccupBlocks([nn], (indent || 0) + 1); if (s) out.push(s); });
      });
    } else if (/^:h[1-6]$/.test(tag)) {
      out.push(pad + '#'.repeat(Math.min(3, Number(tag[2]))) + ' ' + kids.map(hiccupInline).join('').trim());
    } else if (tag === ':blockquote') {
      out.push(pad + '> ' + kids.map(hiccupInline).join('').trim());
    } else if (tag === ':pre') {
      out.push('```\n' + kids.map(hiccupInline).join('') + '\n```');
    } else if (tag === ':hr') {
      out.push('---');
    } else if (tag === ':table') {
      out.push(kids.map(hiccupInline).join(' ').trim());
    } else if (tag === ':p' || tag === ':div' || tag === ':span') {
      const t = kids.map(hiccupInline).join('').trim();
      if (t) out.push(pad + t);
    } else {
      const t = hiccupInline(n).trim();
      if (t) out.push(pad + t);
    }
  });
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}

/* ---------------------- barvy ---------------------- */
const ORG_COLORS = {
  ':color/lime': 'lime', ':color/green': 'green', ':color/teal': 'teal', ':color/mint': 'teal',
  ':color/blue': 'blue', ':color/sky': 'blue', ':color/blueberry': 'indigo', ':color/indigo': 'indigo',
  ':color/purple': 'purple', ':color/violet': 'purple', ':color/magenta': 'pink', ':color/pink': 'pink',
  ':color/red': 'red', ':color/ruby': 'red', ':color/orange': 'orange', ':color/amber': 'amber',
  ':color/yellow': 'amber', ':color/gold': 'amber', ':color/gray': 'gray', ':color/grey': 'gray',
  ':color/silver': 'gray', ':color/black': 'gray', ':color/white': 'none'
};
function orgColor(c) { return (c && ORG_COLORS[c]) || 'none'; }

const CANVAS_PRESET = { '1': 'red', '2': 'orange', '3': 'amber', '4': 'green', '5': 'teal', '6': 'purple' };
/* barvy, které používá export z OrgPadu – ať .canvas vyjde stejně jako .orgpage */
const KNOWN_HEX = {
  '#677f05': 'lime', '#a3cb04': 'lime', '#7654ad': 'purple', '#a46bff': 'purple',
  '#2f7ba7': 'blue', '#4aa3d8': 'blue', '#545ca8': 'indigo', '#6f79e0': 'indigo',
  '#a7362f': 'red', '#d94f45': 'red', '#b06a12': 'orange', '#e0912b': 'orange',
  '#1f7a63': 'teal', '#2fae8f': 'teal', '#a33a6d': 'pink', '#d4629b': 'pink',
  '#6b7280': 'gray', '#9aa3ae': 'gray'
};
function nearestColor(hex) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return 'none';
  let h = m[1];
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  let best = 'none', bestD = Infinity;
  COLORS.forEach((c) => {
    if (!c.hex) return;
    const cr = parseInt(c.hex.slice(1, 3), 16), cg = parseInt(c.hex.slice(3, 5), 16), cb = parseInt(c.hex.slice(5, 7), 16);
    const d = (r - cr) * (r - cr) * 0.3 + (g - cg) * (g - cg) * 0.59 + (b - cb) * (b - cb) * 0.11;
    if (d < bestD) { bestD = d; best = c.id; }
  });
  return best;
}
function canvasColor(c) {
  if (!c) return 'none';
  const key = String(c).trim().toLowerCase();
  if (CANVAS_PRESET[key]) return CANVAS_PRESET[key];
  if (KNOWN_HEX[key]) return KNOWN_HEX[key];
  return nearestColor(c);
}

/* ---------------------- OrgPad (.orgpage / EDN) ---------------------- */
function orgpageToDoc(text, fallbackName) {
  let root;
  try { root = parseEDN(text); } catch (e) { return null; }
  const units = root && root[':orgpage/units'];
  if (!units || typeof units !== 'object') return null;

  const doc = newDoc(root[':orgpage/title'] || fallbackName || 'Mapa z OrgPadu');
  const idMap = Object.create(null);
  const books = [];

  Object.keys(units).forEach((uid) => {
    const u = units[uid];
    if (!u || u[':unit/type'] !== ':unit/book') return;
    books.push(uid);
    const pos = Array.isArray(u[':unit/pos']) ? u[':unit/pos'] : [0, 0];
    const n = newNode(Math.round(pos[0]), Math.round(pos[1]), u[':unit/title'] || '');
    n.shape = 'card';
    n.w = 240;

    const parts = [];
    const kids = u[':unit/child-unit-ids'] || [];
    kids.forEach((kid) => {
      const pg = units[kid];
      if (pg && pg[':unit/content']) {
        const md = hiccupBlocks(pg[':unit/content'], 0).replace(/^\n+|\s+$/g, '');
        if (md) parts.push(md);
      }
    });
    if (u[':unit/content']) {
      const md = hiccupBlocks(u[':unit/content'], 0).replace(/^\n+|\s+$/g, '');
      if (md) parts.push(md);
    }
    n.content = parts.join('\n\n').trim();
    n.open = !!n.content;

    const props = u[':unit/props'] || {};
    n.color = orgColor(props[':props/color']);
    if (props[':props/title-size'] === ':props/h1') n.w = 280;

    idMap[uid] = n.id;
    doc.nodes.push(n);
  });

  /* vazby */
  const links = root[':orgpage/links'] || {};
  Object.keys(links).forEach((lid) => {
    const l = links[lid];
    const ep = l && l[':link/endpoint-ids'];
    if (!Array.isArray(ep) || ep.length < 2) return;
    const a = idMap[ep[0]], b = idMap[ep[1]];
    if (!a || !b || a === b) return;
    const e = newEdge(a, b);
    const props = l[':link/props'] || {};
    const head = props[':props/arrowhead'];
    e.arrow = head === ':props/single' ? 'to' : (head === ':props/double' || head === ':props/both') ? 'both' : 'none';
    e.style = props[':props/dashed'] ? 'dashed' : 'solid';
    e.color = orgColor(props[':props/color']);
    if (typeof l[':link/title'] === 'string') e.label = l[':link/title'];
    doc.edges.push(e);
  });

  /* zanořené jednotky v OrgPadu spojíme čárou rodič -> dítě */
  books.forEach((uid) => {
    const u = units[uid];
    const par = u[':unit/parent-id'];
    if (!par || !idMap[par] || !idMap[uid]) return;
    const a = idMap[par], b = idMap[uid];
    if (doc.edges.some((e) => (e.from === a && e.to === b) || (e.from === b && e.to === a))) return;
    const e = newEdge(a, b);
    e.style = 'solid'; e.arrow = 'to'; e.color = 'none';
    doc.edges.push(e);
  });

  return doc.nodes.length ? doc : null;
}

/* ---------------------- JSON Canvas (.canvas) ---------------------- */
function canvasToDoc(text, fallbackName) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || !Array.isArray(o.nodes)) return null;

  const doc = newDoc(fallbackName || 'Mapa z Canvasu');
  const idMap = Object.create(null);

  o.nodes.forEach((cn) => {
    if (!cn || typeof cn !== 'object') return;
    let title = '', content = '';
    if (cn.type === 'file') {
      title = String(cn.file || '').split('/').pop().replace(/\.[^.]+$/, '');
      content = cn.file ? '`' + cn.file + '`' : '';
    } else if (cn.type === 'link') {
      title = String(cn.url || '').replace(/^https?:\/\//, '').split('/')[0];
      content = cn.url ? '[' + cn.url + '](' + cn.url + ')' : '';
    } else if (cn.type === 'group') {
      title = cn.label || 'Skupina';
    } else {
      const t = String(cn.text || '').replace(/\r\n?/g, '\n').trim();
      const lines = t.split('\n');
      const h = /^(#{1,6})\s+(.*)$/.exec(lines[0] || '');
      if (h) { title = h[2].trim(); content = lines.slice(1).join('\n').trim(); }
      else if (lines.length === 1) { title = t.slice(0, 140); }
      else if (lines[0].length <= 70) { title = lines[0].trim(); content = lines.slice(1).join('\n').trim(); }
      else { content = t; }
    }
    const n = newNode(Math.round(Number(cn.x) || 0), Math.round(Number(cn.y) || 0), title);
    n.shape = cn.type === 'group' ? 'plain' : 'card';
    n.content = content;
    n.open = !!content;
    const w = Number(cn.width) || 0;
    n.w = w >= 110 ? clamp(Math.round(w), 110, 560) : 240;
    n.color = canvasColor(cn.color);
    idMap[cn.id] = n.id;
    doc.nodes.push(n);
  });

  (Array.isArray(o.edges) ? o.edges : []).forEach((ce) => {
    if (!ce) return;
    const a = idMap[ce.fromNode], b = idMap[ce.toNode];
    if (!a || !b || a === b) return;
    const e = newEdge(a, b);
    const toArrow = ce.toEnd !== 'none';       // podle specifikace je výchozí šipka na cíli
    const fromArrow = ce.fromEnd === 'arrow';
    e.arrow = (toArrow && fromArrow) ? 'both' : toArrow ? 'to' : 'none';
    e.style = 'solid';
    e.label = typeof ce.label === 'string' ? ce.label : '';
    e.color = canvasColor(ce.color);
    doc.edges.push(e);
  });

  return doc.nodes.length ? doc : null;
}

/* ---------------------- rozcestník ---------------------- */
const IMPORT_EXT = /\.(json|mapa\.json|canvas|orgpage|edn)$/i;

/** rozpozná formát a vrátí dokument, nebo null */
async function importAnyToDoc(text, filename) {
  const base = String(filename || '').replace(/\.[^.]+$/, '');
  const t = text.replace(/^﻿/, '').trim();

  if (/\.orgpage$|\.edn$/i.test(filename || '') || /^\{\s*:orgpage\//.test(t)) {
    return orgpageToDoc(t, base);
  }
  if (/\.canvas$/i.test(filename || '')) {
    return canvasToDoc(t, base);
  }
  /* .json – nejdřív náš formát, pak Canvas */
  const own = await textToDoc(t);
  if (own && (own.locked || own.nodes)) return own;
  return canvasToDoc(t, base);
}

/* ---- 15-crypt.js ---- */
/* ============================================================
   Volitelné šifrování map heslem (AES-GCM 256 + PBKDF2)
   ------------------------------------------------------------
   Soubor se uloží jako JSON obálka:
   { "enc":"AES-GCM", "v":1, "kdf":"PBKDF2-SHA256", "iter":210000,
     "salt":"…base64…", "iv":"…base64…", "data":"…base64…" }
   Heslo se nikam neukládá – žije jen v paměti záložky.
   ============================================================ */

const B64 = {
  enc(buf) {
    const b = new Uint8Array(buf); let s = '';
    for (let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  },
  dec(str) {
    const s = atob(str); const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
};

const Crypt = {
  ITER: 210000,
  on: false,          // má se šifrovat při ukládání?
  salt: null,         // Uint8Array
  key: null,          // CryptoKey (jen v paměti)
  _cache: Object.create(null),

  get ready() { return !!this.key; },
  supported() { return !!(window.crypto && crypto.subtle); },

  /* nastavení pro aktuální zdroj (složka / Disk) si pamatujeme v prohlížeči */
  storeKey() { return 'mm.crypt.' + (Store.sourceId ? Store.sourceId() : 'default'); },
  loadSettings() {
    try {
      const raw = localStorage.getItem(this.storeKey());
      if (!raw) { this.on = false; this.salt = null; this.key = null; return; }
      const o = JSON.parse(raw);
      this.on = !!o.on;
      this.salt = o.salt ? B64.dec(o.salt) : null;
      this.key = null;
    } catch (e) { this.on = false; }
  },
  saveSettings() {
    try {
      localStorage.setItem(this.storeKey(), JSON.stringify({
        on: this.on, salt: this.salt ? B64.enc(this.salt) : null
      }));
    } catch (e) { /* soukromé okno – nevadí */ }
  },

  async derive(pass, salt, iter) {
    const cacheId = B64.enc(salt) + '|' + iter + '|' + pass.length;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
      'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter || this.ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },

  /** zapne šifrování novým heslem */
  async enable(pass) {
    this.salt = crypto.getRandomValues(new Uint8Array(16));
    this.key = await this.derive(pass, this.salt, this.ITER);
    this.on = true;
    this.saveSettings();
  },
  /** odemkne existující šifrované mapy; vrací true při správném heslu */
  async unlock(pass, salt, iter) {
    const s = salt || this.salt;
    if (!s) return false;
    this.key = await this.derive(pass, s, iter || this.ITER);
    this.salt = s;
    return true;
  },
  lock() { this.key = null; },
  disable() { this.on = false; this.key = null; this.salt = null; this.saveSettings(); },

  isEncrypted(o) { return !!(o && typeof o === 'object' && o.enc === 'AES-GCM' && o.data); },

  async encrypt(text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key,
      new TextEncoder().encode(text));
    return JSON.stringify({
      enc: 'AES-GCM', v: 1, kdf: 'PBKDF2-SHA256', iter: this.ITER,
      salt: B64.enc(this.salt), iv: B64.enc(iv), data: B64.enc(ct)
    }, null, 1);
  },

  async decrypt(o) {
    if (!this.key) throw new Error('LOCKED');
    const txt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: B64.dec(o.iv) }, this.key, B64.dec(o.data));
    return new TextDecoder().decode(txt);
  }
};

/** text -> dokument (rozšifruje, když je potřeba); vrací null u cizích souborů,
 *  nebo {locked:true, meta} když chybí heslo */
async function textToDoc(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return null; }
  if (Crypt.isEncrypted(raw)) {
    if (!Crypt.key) {
      if (!Crypt.salt) { Crypt.salt = B64.dec(raw.salt); Crypt.on = true; Crypt.saveSettings(); }
      return { locked: true, iter: raw.iter, salt: B64.dec(raw.salt) };
    }
    try {
      return normalizeDoc(JSON.parse(await Crypt.decrypt(raw)));
    } catch (e) { return { locked: true, iter: raw.iter, salt: B64.dec(raw.salt) }; }
  }
  return normalizeDoc(raw);
}

/** dokument -> text pro uložení (zašifruje, když je zapnuté šifrování) */
async function docToText(doc) {
  const plain = serialize(doc);
  if (Crypt.on && Crypt.key) return Crypt.encrypt(plain);
  return plain;
}

/* ---- 20-store.js ---- */
/* ============================================================
   Úložiště: složka v počítači (File System Access API)
   + záložní režim pro prohlížeče, které ji neumí (Safari, mobil)
   ============================================================ */

const HAS_FS = typeof window.showDirectoryPicker === 'function';

/* ---------------- IndexedDB (ukazatel na složku + záloha map) ------------- */
const IDB = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open('mysli-mapy', 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('maps')) db.createObjectStore('maps');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(store, mode, fn) {
    try {
      const db = await open();
      return await new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
      });
    } catch (e) { console.warn('IndexedDB nedostupná', e); return null; }
  }
  return {
    get: (s, k) => tx(s, 'readonly', (o) => o.get(k)),
    set: (s, k, v) => tx(s, 'readwrite', (o) => o.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', (o) => o.delete(k)),
    all: (s) => tx(s, 'readonly', (o) => o.getAll()),
    keys: (s) => tx(s, 'readonly', (o) => o.getAllKeys())
  };
})();

/* ---------------------------- Store -------------------------------------- */
/* Tři možné zdroje map:
     'fs'    – složka v počítači (File System Access API)
     'drive' – složka na Google Disku
     'local' – jen paměť prohlížeče (záloha pro Safari a mobily)          */

const Store = {
  dir: null,          // FileSystemDirectoryHandle
  dirName: '',
  drive: false,       // pracujeme s Google Diskem?
  entries: [],
  locked: 0,          // kolik map je zamčených (chybí heslo)

  sourceId() {
    if (this.drive) return 'drive:' + (Drive.folderId || '?');
    if (this.dir) return 'fs:' + this.dirName;
    return 'local';
  },
  get mode() { return this.drive ? 'drive' : (this.dir ? 'fs' : 'local'); },

  /* --- oprávnění ke složce --- */
  async ensurePermission(handle, write) {
    if (!handle || !handle.queryPermission) return true;
    const opts = { mode: write ? 'readwrite' : 'read' };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  },

  /* --- výběr složky v počítači --- */
  async pickFolder() {
    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mysli-mapy' });
    this.drive = false;
    this.dir = h; this.dirName = h.name;
    await IDB.set('kv', 'dirHandle', h);
    Crypt.loadSettings();
    await this.scan();
    return h;
  },

  async restoreFolder() {
    if (!HAS_FS) return false;
    const h = await IDB.get('kv', 'dirHandle');
    if (!h) return false;
    this.dir = h; this.dirName = h.name;
    const ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
    if (!ok) return 'needs-permission';
    Crypt.loadSettings();
    await this.scan();
    return true;
  },

  async reconnect() {
    if (!this.dir) return false;
    const ok = await this.ensurePermission(this.dir, true);
    if (ok) { Crypt.loadSettings(); await this.scan(); return true; }
    return false;
  },

  /* --- připojení Google Disku --- */
  async connectDrive() {
    await Drive.signIn(true);
    await Drive.ensureFolder();
    this.drive = true;
    this.dir = null; this.dirName = '';
    Crypt.loadSettings();
    await this.scan();
  },
  disconnectDrive() {
    Drive.signOut();
    this.drive = false;
    this.entries = [];
  },

  /* --- načtení obsahu zdroje --- */
  async scan() {
    this.locked = 0;
    if (this.drive) return this.scanDrive();
    this.entries = [];
    if (!this.dir) return;
    const walk = async (dirHandle, prefix, depth) => {
      for await (const [name, handle] of dirHandle.entries()) {
        if (name.startsWith('.')) continue;
        if (handle.kind === 'directory') {
          if (depth < 3) await walk(handle, prefix + name + '/', depth + 1);
          continue;
        }
        if (!/\.json$/i.test(name)) continue;
        try {
          const file = await handle.getFile();
          if (file.size > 25 * 1024 * 1024) continue;
          const doc = await textToDoc(await file.text());
          if (!doc) continue;
          if (doc.locked) { this.locked++; }
          this.entries.push({
            key: prefix + name, name, path: prefix + name,
            title: doc.locked ? name : doc.title,
            handle, dirHandle, doc, local: false, modified: file.lastModified
          });
        } catch (e) { /* není to naše mapa – přeskoč */ }
      }
    };
    await walk(this.dir, '', 1);
    this.entries.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },

  async scanDrive() {
    this.entries = [];
    const files = await Drive.list();
    const out = [];
    for (let i = 0; i < files.length; i += 6) {
      const chunk = files.slice(i, i + 6);
      /* eslint-disable no-await-in-loop */
      const docs = await Promise.all(chunk.map(async (f) => {
        try {
          const txt = await Drive.download(f.id);
          return await textToDoc(typeof txt === 'string' ? txt : JSON.stringify(txt));
        } catch (e) { return null; }
      }));
      chunk.forEach((f, k) => {
        const doc = docs[k];
        if (!doc) return;
        if (doc.locked) this.locked++;
        out.push({
          key: 'drive:' + f.id, name: f.name, path: f.name,
          title: doc.locked ? f.name : doc.title,
          handle: null, driveId: f.id, doc, local: false, remoteMod: f.modifiedTime,
          modified: f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now()
        });
      });
    }
    this.entries = out.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },

  /* --- lokální (záložní) režim --- */
  async loadLocal(force) {
    if ((this.drive || this.dir) && !force) return;   // pojistka: nepřepiš připojené úložiště
    const keys = (await IDB.keys('maps')) || [];
    const vals = (await IDB.all('maps')) || [];
    const out = [];
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      const doc = normalizeDoc(v.doc) || newDoc();
      out.push({
        key: keys[i], name: v.name || (slugify(doc.title) + FILE_EXT), title: doc.title,
        path: v.name, handle: null, doc, local: true, modified: v.modified || doc.modified
      });
    }
    this.entries = out.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },

  /* --- jedinečné jméno souboru --- */
  uniqueName(title, exceptKey) {
    const base = slugify(title);
    let name = base + FILE_EXT, i = 2;
    const taken = new Set(this.entries.filter((e) => e.key !== exceptKey).map((e) => e.name.toLowerCase()));
    while (taken.has(name.toLowerCase())) { name = base + '-' + i + FILE_EXT; i++; }
    return name;
  },

  /* --- založení mapy z hotového dokumentu --- */
  async createFrom(doc) {
    const name = this.uniqueName(doc.title);
    const text = await docToText(doc);
    if (this.drive) {
      const f = await Drive.createFile(name, text);
      const entry = { key: 'drive:' + f.id, name, path: name, title: doc.title,
        handle: null, driveId: f.id, doc, local: false, remoteMod: f.modifiedTime,
        modified: f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now() };
      this.entries.unshift(entry);
      return entry;
    }
    if (this.dir) {
      const handle = await this.dir.getFileHandle(name, { create: true });
      const w = await handle.createWritable(); await w.write(text); await w.close();
      const entry = { key: name, name, path: name, title: doc.title, handle,
        dirHandle: this.dir, doc, local: false, modified: Date.now() };
      this.entries.unshift(entry);
      return entry;
    }
    const entry = { key: uid('loc'), name, path: name, title: doc.title,
      handle: null, doc, local: true, modified: Date.now() };
    await IDB.set('maps', entry.key, { name, doc, modified: entry.modified });
    this.entries.unshift(entry);
    return entry;
  },

  async create(title) { return this.createFrom(newDoc(title)); },

  /* --- zápis --- */
  async write(entry) {
    const doc = entry.doc;
    doc.modified = Date.now();
    doc.title = doc.title || 'Bez názvu';
    entry.title = doc.title;
    entry.modified = doc.modified;
    const text = await docToText(doc);
    if (entry.driveId) {
      const r = await Drive.updateFile(entry.driveId, text);
      if (r && r.modifiedTime) { entry.remoteMod = r.modifiedTime; entry.modified = Date.parse(r.modifiedTime); }
    } else if (entry.handle) {
      const w = await entry.handle.createWritable();
      await w.write(text);
      await w.close();
      try { entry.modified = (await entry.handle.getFile()).lastModified; } catch (e) { /* nevadí */ }
    } else if (this.drive || this.dir) {
      /* mapa zatím nemá soubor v aktuálním úložišti – založíme ho tam,
         ať se nikdy nestane, že by se ukládalo potichu jen do prohlížeče */
      const oldKey = entry.key;
      const name = entry.name || this.uniqueName(doc.title);
      if (this.drive) {
        const f = await Drive.createFile(name, text);
        entry.driveId = f.id; entry.key = 'drive:' + f.id;
        entry.remoteMod = f.modifiedTime;
        entry.modified = f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now();
      } else {
        const h = await this.dir.getFileHandle(name, { create: true });
        const w = await h.createWritable(); await w.write(text); await w.close();
        entry.handle = h; entry.dirHandle = this.dir; entry.key = name;
        try { entry.modified = (await h.getFile()).lastModified; } catch (e) { /* nevadí */ }
      }
      entry.name = name; entry.path = name; entry.local = false;
      if (oldKey && String(oldKey).indexOf('loc') === 0) IDB.del('maps', oldKey);
    } else {
      await IDB.set('maps', entry.key, { name: entry.name, doc, modified: doc.modified });
    }
    return true;
  },

  /* --- přejmenování souboru podle názvu mapy --- */
  async renameFile(entry) {
    const want = this.uniqueName(entry.doc.title, entry.key);
    if (want.toLowerCase() === entry.name.toLowerCase()) return;
    if (entry.driveId) {
      try { await Drive.renameFile(entry.driveId, want); entry.name = want; entry.path = want; }
      catch (e) { console.warn('přejmenování selhalo', e); }
      return;
    }
    if (!entry.handle || !entry.dirHandle) { entry.name = want; entry.path = want; return; }
    try {
      const nh = await entry.dirHandle.getFileHandle(want, { create: true });
      const w = await nh.createWritable();
      await w.write(await docToText(entry.doc));
      await w.close();
      await entry.dirHandle.removeEntry(entry.name);
      const old = entry.name;
      entry.handle = nh; entry.name = want;
      entry.key = entry.key.replace(new RegExp(old.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'), want);
      entry.path = entry.key;
    } catch (e) { console.warn('přejmenování selhalo', e); }
  },

  async remove(entry) {
    if (entry.driveId) await Drive.trashFile(entry.driveId);
    else if (entry.handle && entry.dirHandle) await entry.dirHandle.removeEntry(entry.name);
    else await IDB.del('maps', entry.key);
    this.entries = this.entries.filter((e) => e !== entry);
  },

  async duplicate(entry) {
    const doc = clone(entry.doc);
    doc.id = uid('map');
    doc.title = entry.doc.title + ' (kopie)';
    doc.created = doc.modified = Date.now();
    return this.createFrom(doc);
  },

  /* --- import souborů z disku (.mapa.json, .canvas, .orgpage, .edn) --- */
  async importFiles(fileList) {
    let n = 0, skipped = 0;
    for (const file of fileList) {
      if (file.size > 25 * 1024 * 1024) { skipped++; continue; }
      try {
        const doc = await importAnyToDoc(await file.text(), file.name);
        if (!doc || doc.locked || !doc.nodes || !doc.nodes.length) { skipped++; continue; }
        doc.id = uid('map');
        doc.created = doc.modified = Date.now();
        await this.createFrom(doc);
        n++;
      } catch (e) { console.warn('import selhal:', file.name, e); skipped++; }
    }
    this.lastImportSkipped = skipped;
    return n;
  },

  /* --- rychlý soupis souborů bez stahování obsahu --- */
  async statAll() {
    if (this.drive) {
      const files = await Drive.list();
      return files.map((f) => ({ key: 'drive:' + f.id, name: f.name, driveId: f.id,
        stamp: f.modifiedTime || '', modified: f.modifiedTime ? Date.parse(f.modifiedTime) : 0 }));
    }
    if (this.dir) {
      const out = [];
      const walk = async (dirHandle, prefix, depth) => {
        for await (const [name, handle] of dirHandle.entries()) {
          if (name.startsWith('.')) continue;
          if (handle.kind === 'directory') { if (depth < 3) await walk(handle, prefix + name + '/', depth + 1); continue; }
          if (!/\.json$/i.test(name)) continue;
          try {
            const f = await handle.getFile();
            out.push({ key: prefix + name, name, handle, dirHandle,
              stamp: String(f.lastModified), modified: f.lastModified });
          } catch (e) { /* přeskoč */ }
        }
      };
      await walk(this.dir, '', 1);
      return out;
    }
    return null;   // lokální režim se sám od sebe nemění
  },

  /** načte obsah jednoho souboru a vrátí dokument */
  async readEntry(stat) {
    if (stat.driveId) {
      const txt = await Drive.download(stat.driveId);
      return textToDoc(typeof txt === 'string' ? txt : JSON.stringify(txt));
    }
    const file = await stat.handle.getFile();
    return textToDoc(await file.text());
  },

  /** porovná úložiště s tím, co máme načtené; vrátí seznam změn.
   *  skipEntry = právě otevřená mapa (její obsah přebírá až Sync, ať se nepřepíšou úpravy) */
  async poll(skipEntry) {
    const stats = await this.statAll();
    if (!stats) return null;
    const byKey = Object.create(null);
    this.entries.forEach((e) => { byKey[e.key] = e; });
    const seen = Object.create(null);
    const changed = [], added = [];
    for (const st of stats) {
      seen[st.key] = 1;
      const cur = byKey[st.key];
      if (!cur) { added.push(st); continue; }
      const mine = cur.remoteMod != null ? cur.remoteMod : String(cur.modified || '');
      if (st.stamp && st.stamp !== mine) changed.push({ st, entry: cur });
    }
    const removed = this.entries.filter((e) => !seen[e.key]);
    if (!changed.length && !added.length && !removed.length) return { changed: [], added: [], removed: [] };

    /* stáhneme jen to, co se opravdu změnilo */
    this.locked = 0;
    for (const c of changed) {
      try {
        const doc = await this.readEntry(c.st);
        if (!doc) continue;
        c.doc = doc;
        c.entry.remoteMod = c.st.stamp;
        c.entry.modified = c.st.modified;
        if (c.st.name) { c.entry.name = c.st.name; c.entry.path = c.st.key; }
        if (c.entry !== skipEntry) {
          c.entry.doc = doc;
          c.entry.title = doc.locked ? c.entry.name : doc.title;
        }
      } catch (e) { /* příště */ }
    }
    for (const a of added) {
      try {
        const doc = await this.readEntry(a);
        if (!doc) continue;
        const entry = { key: a.key, name: a.name, path: a.key, title: doc.locked ? a.name : doc.title,
          handle: a.handle || null, dirHandle: a.dirHandle || null, driveId: a.driveId || null,
          doc, local: false, remoteMod: a.stamp, modified: a.modified };
        this.entries.push(entry);
        a.entry = entry;
      } catch (e) { /* příště */ }
    }
    if (removed.length) this.entries = this.entries.filter((e) => removed.indexOf(e) < 0);
    this.entries.forEach((e) => { if (e.doc && e.doc.locked) this.locked++; });
    this.entries.sort((a, b) => (b.modified || 0) - (a.modified || 0));
    return { changed, added, removed };
  },

  /* --- mapy, které zůstaly jen v prohlížeči --- */
  async localOnly() {
    const keys = (await IDB.keys('maps')) || [];
    const vals = (await IDB.all('maps')) || [];
    return vals.map((v, i) => ({ key: keys[i], name: v.name, doc: v.doc, modified: v.modified }))
      .filter((x) => x && x.doc);
  },

  /** přenese mapy z prohlížeče do připojeného úložiště (Disk / složka) */
  async uploadLocal() {
    if (!this.drive && !this.dir) return 0;
    const list = await this.localOnly();
    let n = 0;
    for (const l of list) {
      try {
        const doc = normalizeDoc(l.doc);
        if (!doc) continue;
        await this.createFrom(doc);
        await IDB.del('maps', l.key);
        n++;
      } catch (e) { console.warn('nahrání selhalo', e); }
    }
    return n;
  },

  /* --- znovu uloží všechny mapy (po zapnutí/vypnutí šifrování) --- */
  async rewriteAll(onProgress) {
    let i = 0;
    for (const e of this.entries) {
      if (e.doc && !e.doc.locked) { await this.write(e); }
      i++;
      if (onProgress) onProgress(i, this.entries.length);
    }
  }
};

/* --- stažení souboru (záložní uložení) --- */
function downloadDoc(doc, name) {
  const blob = new Blob([serialize(doc)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || (slugify(doc.title) + FILE_EXT);
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- 25-drive.js ---- */
/* ============================================================
   Google Disk – přihlášení a práce se soubory
   ------------------------------------------------------------
   Používá jediné oprávnění drive.file: aplikace vidí výhradně
   soubory, které sama vytvořila. Ke zbytku Disku se nedostane.
   Token žije jen v paměti záložky, nikam se neukládá.
   ============================================================ */

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_MIME = 'application/vnd.google-apps.folder';
const DEFAULT_FOLDER_NAME = 'Myšlenkové mapy';

function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = src; s.async = true; s.defer = true;
    s.dataset.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('Nepodařilo se načíst ' + src));
    document.head.appendChild(s);
  });
}

const Drive = {
  clientId: '',
  token: null,
  expiresAt: 0,
  folderId: null,
  folderName: DEFAULT_FOLDER_NAME,
  tokenClient: null,
  connected: false,

  /** OAuth funguje jen na https nebo localhost – ne na otevřeném souboru */
  originOk() {
    return location.protocol === 'https:' ||
      ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0;
  },

  loadConfig() {
    const cfg = (window.MM_CONFIG && window.MM_CONFIG.clientId) || '';
    this.clientId = localStorage.getItem('mm.drive.clientId') || cfg || '';
    this.folderId = localStorage.getItem('mm.drive.folderId') || null;
    this.folderName = localStorage.getItem('mm.drive.folderName') || DEFAULT_FOLDER_NAME;
    return this.clientId;
  },
  saveConfig(clientId) {
    this.clientId = (clientId || '').trim();
    if (this.clientId) localStorage.setItem('mm.drive.clientId', this.clientId);
    else localStorage.removeItem('mm.drive.clientId');
  },
  rememberFolder(id, name) {
    this.folderId = id; this.folderName = name || DEFAULT_FOLDER_NAME;
    localStorage.setItem('mm.drive.folderId', id);
    localStorage.setItem('mm.drive.folderName', this.folderName);
  },
  forgetFolder() {
    this.folderId = null;
    localStorage.removeItem('mm.drive.folderId');
    localStorage.removeItem('mm.drive.folderName');
  },

  /* ---------------- přihlášení ---------------- */
  async initClient() {
    if (this.tokenClient) return;
    if (!this.clientId) throw new Error('Chybí ID klienta Google');
    await loadScript('https://accounts.google.com/gsi/client');
    if (!(window.google && google.accounts && google.accounts.oauth2))
      throw new Error('Knihovna Google se nenačetla');
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: this.clientId,
      scope: DRIVE_SCOPE,
      callback: () => {}
    });
  },

  authError(msg) { const e = new Error(msg); e.auth = true; return e; },

  /** interactive=false zkusí obnovit token potichu */
  async signIn(interactive) {
    await this.initClient();
    return new Promise((resolve, reject) => {
      this.tokenClient.callback = (resp) => {
        if (resp && resp.access_token) {
          this.token = resp.access_token;
          this.expiresAt = Date.now() + (Number(resp.expires_in || 3600) - 90) * 1000;
          this.connected = true;
          resolve(true);
        } else {
          reject(this.authError((resp && (resp.error_description || resp.error)) || 'Přihlášení se nezdařilo'));
        }
      };
      this.tokenClient.error_callback = (err) => {
        reject(this.authError((err && (err.message || err.type)) || 'Přihlášení bylo zrušeno'));
      };
      try {
        this.tokenClient.requestAccessToken({ prompt: '' });
      } catch (e) { e.auth = true; reject(e); }
    });
  },

  signOut() {
    try {
      if (this.token && window.google && google.accounts && google.accounts.oauth2)
        google.accounts.oauth2.revoke(this.token, () => {});
    } catch (e) { /* nevadí */ }
    this.token = null; this.expiresAt = 0; this.connected = false;
  },

  async ensureToken() {
    if (this.token && Date.now() < this.expiresAt) return this.token;
    await this.signIn(false);
    return this.token;
  },

  /* ---------------- volání API ---------------- */
  async api(url, opts) {
    await this.ensureToken();
    const o = Object.assign({}, opts);
    o.headers = Object.assign({ Authorization: 'Bearer ' + this.token }, o.headers || {});
    let r = await fetch(url, o);
    if (r.status === 401) {                       // token vypršel – jeden pokus znovu
      this.token = null;
      await this.ensureToken();
      o.headers.Authorization = 'Bearer ' + this.token;
      r = await fetch(url, o);
    }
    if (!r.ok) {
      const txt = await r.text().catch(() => '');
      const e = new Error('Google Disk (' + r.status + '): ' + txt.slice(0, 160));
      if (r.status === 401 || r.status === 403) e.auth = (r.status === 401);
      throw e;
    }
    const ct = r.headers.get('content-type') || '';
    return ct.indexOf('json') >= 0 ? r.json() : r.text();
  },

  /* ---------------- složka ---------------- */
  async ensureFolder() {
    if (this.folderId) {
      try {
        const f = await this.api('https://www.googleapis.com/drive/v3/files/' +
          encodeURIComponent(this.folderId) + '?fields=id,name,trashed');
        if (f && !f.trashed) { this.folderName = f.name; return this.folderId; }
      } catch (e) { /* složka zmizela nebo k ní nemáme přístup – založíme novou */ }
      this.forgetFolder();
    }
    const q = "mimeType='" + DRIVE_FOLDER_MIME + "' and name='" +
      DEFAULT_FOLDER_NAME.replace(/'/g, "\\'") + "' and trashed=false";
    const found = await this.api('https://www.googleapis.com/drive/v3/files?q=' +
      encodeURIComponent(q) + '&fields=files(id,name)&pageSize=10');
    if (found.files && found.files.length) {
      this.rememberFolder(found.files[0].id, found.files[0].name);
      return this.folderId;
    }
    const made = await this.api('https://www.googleapis.com/drive/v3/files?fields=id,name', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DEFAULT_FOLDER_NAME, mimeType: DRIVE_FOLDER_MIME })
    });
    this.rememberFolder(made.id, made.name);
    return this.folderId;
  },

  /** připojí konkrétní složku podle ID (z adresy složky na Disku) */
  async useFolder(id) {
    const clean = String(id || '').trim()
      .replace(/^https?:\/\/drive\.google\.com\/drive\/(u\/\d+\/)?folders\//, '')
      .replace(/[?#].*$/, '');
    if (!clean) throw new Error('Prázdné ID složky');
    const f = await this.api('https://www.googleapis.com/drive/v3/files/' +
      encodeURIComponent(clean) + '?fields=id,name,mimeType');
    if (f.mimeType !== DRIVE_FOLDER_MIME) throw new Error('To není složka');
    this.rememberFolder(f.id, f.name);
    return f;
  },

  /* ---------------- soubory ---------------- */
  async list() {
    const q = "'" + this.folderId + "' in parents and trashed=false and mimeType!='" + DRIVE_FOLDER_MIME + "'";
    const res = await this.api('https://www.googleapis.com/drive/v3/files?q=' +
      encodeURIComponent(q) +
      '&fields=files(id,name,modifiedTime,size)&orderBy=modifiedTime desc&pageSize=300');
    return (res.files || []).filter((f) => /\.json$/i.test(f.name));
  },

  async download(id) {
    return this.api('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?alt=media');
  },

  multipart(meta, text) {
    const b = '-------mm' + Math.random().toString(36).slice(2);
    const body =
      '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      JSON.stringify(meta) + '\r\n' +
      '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
      text + '\r\n--' + b + '--';
    return { body, type: 'multipart/related; boundary=' + b };
  },

  /* keepalive drží požadavek naživu, i když uživatel zavře záložku (limit ~64 kB) */
  keep(body) { return typeof body === 'string' && body.length < 55000; },

  async createFile(name, text) {
    const mp = this.multipart({ name, parents: [this.folderId] }, text);
    return this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',
      { method: 'POST', headers: { 'Content-Type': mp.type }, body: mp.body, keepalive: this.keep(mp.body) });
  },

  async updateFile(id, text) {
    return this.api('https://www.googleapis.com/upload/drive/v3/files/' +
      encodeURIComponent(id) + '?uploadType=media&fields=id,name,modifiedTime',
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: text, keepalive: this.keep(text) });
  },

  async renameFile(id, name) {
    return this.api('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id) + '?fields=id,name',
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
  },

  /** do koše, ne natrvalo */
  async trashFile(id) {
    return this.api('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(id),
      { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ trashed: true }) });
  },

  folderUrl() {
    return this.folderId ? 'https://drive.google.com/drive/folders/' + this.folderId : '';
  }
};

/* ---- 30-canvas.js ---- */
/* ============================================================
   Plátno: vykreslení buněk a vazeb, posun a přiblížení
   ============================================================ */

const App = {
  entry: null,
  doc: null,
  sel: new Set(),
  selEdges: new Set(),
  linkGroup: [],
  linkSticky: false,
  tool: 'pan',
  sizes: Object.create(null),   // id -> {w,h}
  undoStack: [],
  redoStack: [],
  dirty: false,
  suppressSave: false
};

const els = {};
function cacheEls() {
  els.canvas = $('#canvas'); els.world = $('#world');
  els.svg = $('#edges'); els.nodes = $('#nodes');
  els.zVal = $('#zVal'); els.saveState = $('#saveState');
}

const nodeEls = new Map();

/* --------------------------- pohled (view) ------------------------------- */
function view() { return App.doc.view; }

function applyView() {
  const v = view();
  els.world.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.zoom + ')';
  els.zVal.textContent = Math.round(v.zoom * 100) + ' %';
}

function screenToWorld(px, py) {
  const r = els.canvas.getBoundingClientRect();
  const v = view();
  return { x: (px - r.left - v.x) / v.zoom, y: (py - r.top - v.y) / v.zoom };
}

function zoomAt(px, py, factor) {
  const v = view();
  const z2 = clamp(v.zoom * factor, 0.12, 3.5);
  if (z2 === v.zoom) return;
  const r = els.canvas.getBoundingClientRect();
  const cx = px - r.left, cy = py - r.top;
  v.x = cx - (cx - v.x) * (z2 / v.zoom);
  v.y = cy - (cy - v.y) * (z2 / v.zoom);
  v.zoom = z2;
  applyView(); scheduleSave();
}

function nodeSize(n) {
  const s = App.sizes[n.id];
  return { w: (s && s.w) || n.w, h: (s && s.h) || n.h || 44 };
}

/** zapíše naměřené výšky buněk do dokumentu (kvůli přesným miniaturám) */
function syncSizes() {
  if (!App.doc) return;
  App.doc.nodes.forEach((n) => {
    const s = App.sizes[n.id];
    if (s && s.h) n.h = Math.round(s.h);
  });
}

function fitView(animate) {
  const d = App.doc;
  if (!d.nodes.length) { d.view.x = els.canvas.clientWidth / 2 - 100; d.view.y = 120; d.view.zoom = 1; applyView(); return; }
  const b = docBounds(d, (n) => nodeSize(n).h);
  const cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
  const pad = 60;
  const z = clamp(Math.min((cw - pad * 2) / b.w, (ch - pad * 2) / b.h), 0.12, 1.4);
  d.view.zoom = z;
  d.view.x = (cw - b.w * z) / 2 - b.x * z;
  d.view.y = (ch - b.h * z) / 2 - b.y * z;
  if (animate) {
    els.world.style.transition = 'transform .28s cubic-bezier(.2,.7,.3,1)';
    setTimeout(() => { els.world.style.transition = ''; }, 320);
  }
  applyView(); scheduleSave();
}

/* --------------------------- vykreslení buněk ---------------------------- */
const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

function buildNodeEl(n) {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = n.id;
  el.innerHTML =
    '<div class="accent"></div>' +
    '<img class="n-img hidden" alt="">' +
    '<div class="n-head">' +
      '<div class="n-title" spellcheck="false"></div>' +
      '<button class="n-toggle" title="Zobrazit/skrýt obsah" tabindex="-1">' + ICON_CHEVRON + '</button>' +
    '</div>' +
    '<div class="n-body md hidden"></div>' +
    '<div class="port t" data-port="t"></div><div class="port r" data-port="r"></div>' +
    '<div class="port b" data-port="b"></div><div class="port l" data-port="l"></div>' +
    '<div class="n-resize" title="Změnit šířku"></div>';
  els.nodes.appendChild(el);
  nodeEls.set(n.id, el);
  return el;
}

function paintNode(n) {
  let el = nodeEls.get(n.id) || buildNodeEl(n);
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.style.width = n.w + 'px';
  el.className = 'node shape-' + n.shape + (n.open ? ' open' : '') +
    (App.sel.has(n.id) ? ' sel' : '') +
    (App.linkGroup && App.linkGroup.indexOf(n.id) >= 0 ? ' linksrc' : '');
  const hex = colorHex(n.color);
  el.style.setProperty('--n-color', hex || 'transparent');
  const acc = el.querySelector('.accent');
  acc.style.display = hex ? 'block' : 'none';
  if (hex) el.style.borderColor = hex;
  else el.style.borderColor = '';

  const img = el.querySelector('.n-img');
  if (n.image) { img.src = n.image; img.classList.remove('hidden'); }
  else { img.removeAttribute('src'); img.classList.add('hidden'); }

  const t = el.querySelector('.n-title');
  if (t.getAttribute('contenteditable') !== 'true') t.textContent = n.title || '';
  t.dataset.empty = n.title ? '' : '1';
  if (!n.title) t.innerHTML = '<span style="opacity:.45">Bez názvu</span>';

  const tog = el.querySelector('.n-toggle');
  tog.style.opacity = n.content ? '1' : '.4';

  const body = el.querySelector('.n-body');
  if (n.open) {
    body.classList.remove('hidden');
    if (n.content) { body.innerHTML = markdown(n.content, true); body.classList.remove('empty-hint'); }
    else { body.textContent = 'Zatím bez obsahu – klepni sem a piš.'; body.classList.add('empty-hint'); }
  } else {
    body.classList.add('hidden');
    body.innerHTML = '';
  }
  return el;
}

function renderNodes() {
  const alive = new Set();
  App.doc.nodes.forEach((n) => { alive.add(n.id); paintNode(n); });
  nodeEls.forEach((el, id) => { if (!alive.has(id)) { el.remove(); nodeEls.delete(id); delete App.sizes[id]; } });
  // pořadí vykreslení podle pořadí v dokumentu
  App.doc.nodes.forEach((n) => els.nodes.appendChild(nodeEls.get(n.id)));
  measure();
}

function measure() {
  nodeEls.forEach((el, id) => {
    App.sizes[id] = { w: el.offsetWidth, h: el.offsetHeight };
  });
  renderEdges();
}

/* --------------------------- vazby --------------------------------------- */
function nodeRect(n) {
  const s = nodeSize(n);
  return { x: n.x, y: n.y, w: s.w, h: s.h, cx: n.x + s.w / 2, cy: n.y + s.h / 2 };
}

/** průsečík úsečky střed->cíl s obdélníkem (nebo elipsou u oválných buněk) */
function anchor(r, tx, ty, round) {
  const dx = tx - r.cx, dy = ty - r.cy;
  if (!dx && !dy) return { x: r.cx, y: r.cy };
  if (round) {
    const a = r.w / 2, b = r.h / 2;
    const k = 1 / Math.sqrt((dx * dx) / (a * a) + (dy * dy) / (b * b));
    return { x: r.cx + dx * k, y: r.cy + dy * k };
  }
  const sx = dx === 0 ? Infinity : (r.w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (r.h / 2) / Math.abs(dy);
  const k = Math.min(sx, sy);
  return { x: r.cx + dx * k, y: r.cy + dy * k };
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function edgeGeometry(e) {
  const a = App.doc.nodes.find((n) => n.id === e.from);
  const b = App.doc.nodes.find((n) => n.id === e.to);
  if (!a || !b) return null;
  const ra = nodeRect(a), rb = nodeRect(b);
  const p1 = anchor(ra, rb.cx, rb.cy, a.shape === 'round');
  const p2 = anchor(rb, ra.cx, ra.cy, b.shape === 'round');
  return { p1, p2 };
}

function arrowPath(from, to, size) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  const s = size || 9;
  const bx = to.x - ux * s, by = to.y - uy * s;
  const px = -uy * s * 0.52, py = ux * s * 0.52;
  return 'M' + to.x + ',' + to.y + ' L' + (bx + px) + ',' + (by + py) + ' L' + (bx - px) + ',' + (by - py) + ' Z';
}

function renderEdges() {
  const svg = els.svg;
  svg.textContent = '';
  const frag = document.createDocumentFragment();
  App.doc.edges.forEach((e) => {
    const g = edgeGeometry(e);
    if (!g) return;
    const stroke = colorHex(e.color) || 'var(--line-2)';
    const grp = svgEl('g', { 'data-id': e.id });
    if (App.selEdges.has(e.id)) grp.setAttribute('class', 'sel');
    const d = 'M' + g.p1.x + ',' + g.p1.y + ' L' + g.p2.x + ',' + g.p2.y;
    grp.appendChild(svgEl('path', { class: 'hit', d }));
    const wire = svgEl('path', {
      class: 'wire', d, stroke, 'stroke-width': 2,
      'stroke-dasharray': e.style === 'dashed' ? '7 6' : (e.style === 'dotted' ? '1 6' : '')
    });
    grp.appendChild(wire);
    if (e.arrow === 'to' || e.arrow === 'both')
      grp.appendChild(svgEl('path', { d: arrowPath(g.p1, g.p2), fill: stroke, stroke: 'none' }));
    if (e.arrow === 'both')
      grp.appendChild(svgEl('path', { d: arrowPath(g.p2, g.p1), fill: stroke, stroke: 'none' }));
    if (e.label) {
      const t = svgEl('text', {
        class: 'elabel', x: (g.p1.x + g.p2.x) / 2, y: (g.p1.y + g.p2.y) / 2
      });
      t.textContent = e.label;
      grp.appendChild(t);
    }
    frag.appendChild(grp);
  });
  svg.appendChild(frag);
  if (App.tempWire) svg.appendChild(App.tempWire);
}

/* --------------------------- výběr --------------------------------------- */
function setSel(ids, addTo) {
  if (!addTo) { App.sel.clear(); App.selEdges.clear(); }
  (Array.isArray(ids) ? ids : [ids]).forEach((id) => { if (id) App.sel.add(id); });
  refreshSelection();
}
/** výběr vazeb; addTo = přidat k současnému výběru */
function setSelEdges(ids, addTo) {
  if (!addTo) { App.selEdges.clear(); App.sel.clear(); }
  (Array.isArray(ids) ? ids : [ids]).forEach((id) => { if (id) App.selEdges.add(id); });
  refreshSelection();
}
function clearSel() { App.sel.clear(); App.selEdges.clear(); refreshSelection(); }
function selCount() { return App.sel.size + App.selEdges.size; }
function refreshSelection() {
  nodeEls.forEach((el, id) => {
    el.classList.toggle('sel', App.sel.has(id));
    el.classList.toggle('linksrc', !!(App.linkGroup && App.linkGroup.indexOf(id) >= 0));
  });
  $$('#edges g').forEach((g) => g.classList.toggle('sel', App.selEdges.has(g.dataset.id)));
  updateInspector();
}
function getNode(id) { return App.doc.nodes.find((n) => n.id === id); }
function getEdge(id) { return App.doc.edges.find((e) => e.id === id); }

/* ============================================================
