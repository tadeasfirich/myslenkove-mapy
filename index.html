    const h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'mysli-mapy' });
    this.drive = false;
    this.dir = h; this.dirName = h.name;
    await IDB.set('kv', 'dirHandle', h);
    Crypt.loadSettings();
    await this.scan();
    return h;
  },

  async restoreFolder() {
    if (!HAS_FS) return false;
    const h = await IDB.get('kv', 'dirHandle');
    if (!h) return false;
    this.dir = h; this.dirName = h.name;
    const ok = (await h.queryPermission({ mode: 'readwrite' })) === 'granted';
    if (!ok) return 'needs-permission';
    Crypt.loadSettings();
    await this.scan();
    return true;
  },

  async reconnect() {
    if (!this.dir) return false;
    const ok = await this.ensurePermission(this.dir, true);
    if (ok) { Crypt.loadSettings(); await this.scan(); return true; }
    return false;
  },

  /* --- připojení Google Disku --- */
  async connectDrive() {
    await Drive.signIn(true);
    await Drive.ensureFolder();
    this.drive = true;
    this.dir = null; this.dirName = '';
    Crypt.loadSettings();
    await this.scan();
  },
  disconnectDrive() {
    Drive.signOut();
    this.drive = false;
    this.entries = [];
  },

  /* --- načtení obsahu zdroje --- */
  async scan() {
    this.locked = 0;
    if (this.drive) return this.scanDrive();
    this.entries = [];
    if (!this.dir) return;
    const walk = async (dirHandle, prefix, depth) => {
      for await (const [name, handle] of dirHandle.entries()) {
        if (name.startsWith('.')) continue;
        if (handle.kind === 'directory') {
          if (depth < 3) await walk(handle, prefix + name + '/', depth + 1);
          continue;
        }
        if (!/\.json$/i.test(name)) continue;
        try {
          const file = await handle.getFile();
          if (file.size > 25 * 1024 * 1024) continue;
          const doc = await textToDoc(await file.text());
          if (!doc) continue;
          if (doc.locked) { this.locked++; }
          this.entries.push({
            key: prefix + name, name, path: prefix + name,
            title: doc.locked ? name : doc.title,
            handle, dirHandle, doc, local: false, modified: file.lastModified
          });
        } catch (e) { /* není to naše mapa – přeskoč */ }
      }
    };
    await walk(this.dir, '', 1);
    this.entries.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },

  async scanDrive() {
    const files = await Drive.list();
    const prev = Object.create(null);
    this.entries.forEach((e) => { if (e.driveId) prev[e.driveId] = e; });
    const out = [];
    let failed = 0;
    const now = Date.now();
    for (let i = 0; i < files.length; i += 4) {
      const chunk = files.slice(i, i + 4);
      /* eslint-disable no-await-in-loop */
      const docs = await Promise.all(chunk.map(async (f) => {
        try {
          /* 1) mapu už máme načtenou a nezměnila se  2) je v mezipaměti zařízení  3) stáhnout */
          const p = prev[f.id];
          if (p && p.remoteMod === f.modifiedTime && p.doc && !p.doc.locked) return p.doc;
          let txt = await DocCache.get(f.id, f.modifiedTime);
          if (txt == null) {
            txt = await Drive.downloadText(f.id);
            DocCache.put(f.id, f.modifiedTime, txt);
          }
          return await textToDoc(txt);
        } catch (e) {
          if (e && e.auth) throw e;
          console.warn('mapu se nepodařilo načíst:', f.name, e);
          failed++;
          return prev[f.id] ? prev[f.id].doc : null;
        }
      }));
      chunk.forEach((f, k) => {
        const doc = docs[k];
        if (!doc) return;
        if (doc.locked) this.locked++;
        /* stejný objekt záznamu necháváme žít dál – může na něj čekat rozpracované uložení */
        const entry = prev[f.id] || { handle: null, driveId: f.id, local: false };
        const stale = prev[f.id] && prev[f.id].doc === doc && prev[f.id].remoteMod !== f.modifiedTime;
        Object.assign(entry, {
          key: 'drive:' + f.id, name: f.name, path: f.name,
          title: doc.locked ? f.name : doc.title, doc
        });
        if (!stale) {
          entry.remoteMod = f.modifiedTime;
          entry.modified = f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now();
          entry.checked = now;
        }
        out.push(entry);
      });
    }
    this.scanErrors = failed;
    this.entries = out.sort((a, b) => (b.modified || 0) - (a.modified || 0));
    DocCache.prune(new Set(files.map((f) => f.id)));
  },

  /* --- lokální (záložní) režim --- */
  async loadLocal(force) {
    if ((this.drive || this.dir) && !force) return;   // pojistka: nepřepiš připojené úložiště
    const keys = (await IDB.keys('maps')) || [];
    const vals = (await IDB.all('maps')) || [];
    const out = [];
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      const doc = normalizeDoc(v.doc) || newDoc();
      out.push({
        key: keys[i], name: v.name || (slugify(doc.title) + FILE_EXT), title: doc.title,
        path: v.name, handle: null, doc, local: true, modified: v.modified || doc.modified
      });
    }
    this.entries = out.sort((a, b) => (b.modified || 0) - (a.modified || 0));
  },

  /* --- jedinečné jméno souboru --- */
  uniqueName(title, exceptKey) {
    const base = slugify(title);
    let name = base + FILE_EXT, i = 2;
    const taken = new Set(this.entries.filter((e) => e.key !== exceptKey).map((e) => e.name.toLowerCase()));
    while (taken.has(name.toLowerCase())) { name = base + '-' + i + FILE_EXT; i++; }
    return name;
  },

  /* --- založení mapy z hotového dokumentu --- */
  async createFrom(doc) {
    const name = this.uniqueName(doc.title);
    const text = await docToText(doc);
    if (this.drive) {
      const f = await Drive.createFile(name, text);
      const entry = { key: 'drive:' + f.id, name, path: name, title: doc.title,
        handle: null, driveId: f.id, doc, local: false, remoteMod: f.modifiedTime,
        modified: f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now(),
        touched: Date.now(), checked: Date.now() };
      DocCache.put(f.id, f.modifiedTime, text);
      this.entries.unshift(entry);
      return entry;
    }
    if (this.dir) {
      const handle = await this.dir.getFileHandle(name, { create: true });
      const w = await handle.createWritable(); await w.write(text); await w.close();
      const entry = { key: name, name, path: name, title: doc.title, handle,
        dirHandle: this.dir, doc, local: false, modified: Date.now(), touched: Date.now() };
      try { entry.modified = (await handle.getFile()).lastModified; } catch (e) { /* nevadí */ }
      this.entries.unshift(entry);
      return entry;
    }
    const entry = { key: uid('loc'), name, path: name, title: doc.title,
      handle: null, doc, local: true, modified: Date.now() };
    await IDB.set('maps', entry.key, { name, doc, modified: entry.modified });
    this.entries.unshift(entry);
    return entry;
  },

  async create(title) { return this.createFrom(newDoc(title)); },

  /* --- zápis ---
     opts.guard = před zápisem na Disk ověř, že soubor mezitím nezměnilo jiné zařízení
                  (jinak by ho tiché automatické ukládání přepsalo)                       */
  async write(entry, opts) {
    const doc = entry.doc;
    doc.modified = Date.now();
    doc.title = doc.title || 'Bez názvu';
    entry.title = doc.title;
    entry.modified = doc.modified;
    const text = await docToText(doc);
    entry.writing = true;
    try {
      let done = false;
      if (entry.driveId) {
        try {
          if (opts && opts.guard && entry.remoteMod && Date.now() - (entry.checked || 0) > this.GUARD_AGE) {
            const st = await Drive.stat(entry.driveId);
            if (st.trashed) { const e = new Error('Soubor je na Disku v koši'); e.gone = true; throw e; }
            if (st.modifiedTime && st.modifiedTime !== entry.remoteMod) {
              const e = new Error('Mapa se mezitím změnila na jiném zařízení'); e.conflict = true; throw e;
            }
          }
          const r = await Drive.updateFile(entry.driveId, text);
          if (r && r.modifiedTime) {
            entry.remoteMod = r.modifiedTime; entry.modified = Date.parse(r.modifiedTime);
            DocCache.put(entry.driveId, r.modifiedTime, text);
          }
          entry.checked = Date.now();
          done = true;
        } catch (e) {
          /* soubor na Disku už není (smazaný jinde) – úpravy nezahodíme, založíme ho znovu */
          if (!(e && (e.status === 404 || e.gone))) throw e;
          DocCache.del(entry.driveId);
          entry.driveId = null; entry.remoteMod = null; entry.recreated = true;
        }
      }
      if (done) {
        /* hotovo */
      } else if (entry.handle) {
        const w = await entry.handle.createWritable();
        await w.write(text);
        await w.close();
        try { entry.modified = (await entry.handle.getFile()).lastModified; } catch (e) { /* nevadí */ }
      } else if (this.drive || this.dir) {
        /* mapa zatím nemá soubor v aktuálním úložišti – založíme ho tam,
           ať se nikdy nestane, že by se ukládalo potichu jen do prohlížeče */
        const oldKey = entry.key;
        const name = entry.name || this.uniqueName(doc.title);
        if (this.drive) {
          const f = await Drive.createFile(name, text);
          entry.driveId = f.id; entry.key = 'drive:' + f.id;
          entry.remoteMod = f.modifiedTime;
          entry.modified = f.modifiedTime ? Date.parse(f.modifiedTime) : Date.now();
          entry.checked = Date.now();
          DocCache.put(f.id, f.modifiedTime, text);
        } else {
          const h = await this.dir.getFileHandle(name, { create: true });
          const w = await h.createWritable(); await w.write(text); await w.close();
          entry.handle = h; entry.dirHandle = this.dir; entry.key = name;
          try { entry.modified = (await h.getFile()).lastModified; } catch (e) { /* nevadí */ }
        }
        entry.name = name; entry.path = name; entry.local = false;
        if (oldKey && String(oldKey).indexOf('loc') === 0) IDB.del('maps', oldKey);
        if (oldKey && oldKey !== entry.key) Draft.clear(oldKey, true);
      } else {
        await IDB.set('maps', entry.key, { name: entry.name, doc, modified: doc.modified });
      }
    } finally {
      entry.writing = false;
      entry.wseq = (entry.wseq || 0) + 1;
      entry.touched = Date.now();
    }
    return true;
  },

  /* --- přejmenování souboru podle názvu mapy --- */
  async renameFile(entry) {
    const want = this.uniqueName(entry.doc.title, entry.key);
    if (want.toLowerCase() === entry.name.toLowerCase()) return;
    if (entry.driveId) {
      entry.writing = true;
      try {
        const r = await Drive.renameFile(entry.driveId, want);
        entry.name = want; entry.path = want;
        /* přejmenování posune datum změny – bez tohohle by to vypadalo jako cizí úprava */
        if (r && r.modifiedTime) {
          const old = entry.remoteMod;
          entry.remoteMod = r.modifiedTime; entry.modified = Date.parse(r.modifiedTime);
          entry.checked = Date.now();
          const txt = old ? await DocCache.get(entry.driveId, old) : null;
          if (txt != null) DocCache.put(entry.driveId, r.modifiedTime, txt);
        }
      } catch (e) { console.warn('přejmenování selhalo', e); }
      finally { entry.writing = false; entry.wseq = (entry.wseq || 0) + 1; entry.touched = Date.now(); }
      return;
    }
    if (!entry.handle || !entry.dirHandle) { entry.name = want; entry.path = want; return; }
    entry.writing = true;
    try {
      const nh = await entry.dirHandle.getFileHandle(want, { create: true });
      const w = await nh.createWritable();
      await w.write(await docToText(entry.doc));
      await w.close();
      await entry.dirHandle.removeEntry(entry.name);
      const old = entry.name, oldKey = entry.key;
      entry.handle = nh; entry.name = want;
      entry.key = entry.key.replace(new RegExp(old.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'), want);
      entry.path = entry.key;
      /* nový soubor má nové datum změny – bez tohohle by vypadal jako cizí úprava */
      try { entry.modified = (await nh.getFile()).lastModified; } catch (e) { /* nevadí */ }
      Draft.clear(oldKey, true);
    } catch (e) { console.warn('přejmenování selhalo', e); }
    finally { entry.writing = false; entry.wseq = (entry.wseq || 0) + 1; entry.touched = Date.now(); }
  },

  async remove(entry) {
    if (entry.driveId) { await Drive.trashFile(entry.driveId); DocCache.del(entry.driveId); }
    else if (entry.handle && entry.dirHandle) await entry.dirHandle.removeEntry(entry.name);
    else await IDB.del('maps', entry.key);
    Draft.clear(entry.key, true);
    this.entries = this.entries.filter((e) => e !== entry);
  },

  async duplicate(entry) {
    const doc = clone(entry.doc);
    doc.id = uid('map');
    doc.title = entry.doc.title + ' (kopie)';
    doc.created = doc.modified = Date.now();
    return this.createFrom(doc);
  },

  /* --- import souborů z disku (.mapa.json, .canvas, .orgpage, .edn) --- */
  async importFiles(fileList) {
    let n = 0, skipped = 0;
    for (const file of fileList) {
      if (file.size > 25 * 1024 * 1024) { skipped++; continue; }
      try {
        const doc = await importAnyToDoc(await file.text(), file.name);
        if (!doc || doc.locked || !doc.nodes || !doc.nodes.length) { skipped++; continue; }
        doc.id = uid('map');
        doc.created = doc.modified = Date.now();
        await this.createFrom(doc);
        n++;
      } catch (e) { console.warn('import selhal:', file.name, e); skipped++; }
    }
    this.lastImportSkipped = skipped;
    return n;
  },

  /* --- rychlý soupis souborů bez stahování obsahu --- */
  async statAll() {
    if (this.drive) {
      const files = await Drive.list();
      return files.map((f) => ({ key: 'drive:' + f.id, name: f.name, driveId: f.id,
        stamp: f.modifiedTime || '', modified: f.modifiedTime ? Date.parse(f.modifiedTime) : 0 }));
    }
    if (this.dir) {
      const out = [];
      const walk = async (dirHandle, prefix, depth) => {
        for await (const [name, handle] of dirHandle.entries()) {
          if (name.startsWith('.')) continue;
          if (handle.kind === 'directory') { if (depth < 3) await walk(handle, prefix + name + '/', depth + 1); continue; }
          if (!/\.json$/i.test(name)) continue;
          try {
            const f = await handle.getFile();
            out.push({ key: prefix + name, name, handle, dirHandle,
              stamp: String(f.lastModified), modified: f.lastModified });
          } catch (e) { /* přeskoč */ }
        }
      };
      await walk(this.dir, '', 1);
      return out;
    }
    return null;   // lokální režim se sám od sebe nemění
  },

  /** načte obsah jednoho souboru a vrátí dokument */
  async readEntry(stat) {
    if (stat.driveId) {
      let txt = stat.stamp ? await DocCache.get(stat.driveId, stat.stamp) : null;
      if (txt == null) {
        txt = await Drive.downloadText(stat.driveId);
        if (stat.stamp) DocCache.put(stat.driveId, stat.stamp, txt);
      }
      return textToDoc(txt);
    }
    const file = await stat.handle.getFile();
    return textToDoc(await file.text());
  },

  /** porovná úložiště s tím, co máme načtené; vrátí seznam změn.
   *  skipEntry = právě otevřená mapa (její obsah přebírá až Sync, ať se nepřepíšou úpravy) */
  async poll(skipEntry) {
    /* číslo zápisu každé mapy před dotazem – když se během dotazu sami trefíme do souboru,
       je odpověď Disku o krok pozadu a nesmí se tvářit jako cizí změna */
    const seq = new Map();
    this.entries.forEach((e) => seq.set(e, e.wseq || 0));
    const stats = await this.statAll();
    if (!stats) return null;
    const now = Date.now();
    const byKey = Object.create(null);
    this.entries.forEach((e) => { byKey[e.key] = e; });
    const seen = Object.create(null);
    const changed = [], added = [];
    for (const st of stats) {
      seen[st.key] = 1;
      const cur = byKey[st.key];
      if (!cur) { added.push(st); continue; }
      if (cur.writing || !seq.has(cur) || (cur.wseq || 0) !== seq.get(cur)) continue;
      const mine = cur.remoteMod != null ? cur.remoteMod : String(cur.modified || '');
      if (st.stamp && st.stamp !== mine) changed.push({ st, entry: cur });
      else cur.checked = now;
    }
    /* Nový soubor se v seznamu Disku umí objevit až za chvíli. Čerstvě založené nebo
       právě zapisované mapy proto za smazané nepovažujeme. */
    let removed = this.entries.filter((e) => !seen[e.key] && seq.has(e) && !e.writing &&
      (e.wseq || 0) === seq.get(e) && now - (e.touched || 0) > 120000 && (e.driveId || e.handle));
    if (skipEntry && skipEntry.driveId && removed.indexOf(skipEntry) >= 0) {
      /* otevřenou mapu nezavřeme uživateli pod rukama, dokud si to neověříme napřímo */
      let gone = false;
      try { const st = await Drive.stat(skipEntry.driveId); gone = !!(st && st.trashed); }
      catch (e) { gone = !!(e && e.status === 404); }
      if (!gone) removed = removed.filter((e) => e !== skipEntry);
    }
    if (!changed.length && !added.length && !removed.length) return { changed: [], added: [], removed: [] };

    /* stáhneme jen to, co se opravdu změnilo */
    this.locked = 0;
    for (const c of changed) {
      try {
        const doc = await this.readEntry(c.st);
        if (!doc) continue;
        if (c.entry.writing || (c.entry.wseq || 0) !== seq.get(c.entry)) continue;   // mezitím jsme zapsali sami
        c.doc = doc;
        if (c.entry.driveId) c.entry.remoteMod = c.st.stamp;
        c.entry.modified = c.st.modified;
        c.entry.checked = now;
        if (c.st.name) { c.entry.name = c.st.name; c.entry.path = c.st.key; }
        if (c.entry !== skipEntry) {
          c.entry.doc = doc;
          c.entry.title = doc.locked ? c.entry.name : doc.title;
        }
      } catch (e) { /* příště */ }
    }
    for (const a of added) {
      try {
        const doc = await this.readEntry(a);
        if (!doc) continue;
        const entry = { key: a.key, name: a.name, path: a.key, title: doc.locked ? a.name : doc.title,
          handle: a.handle || null, dirHandle: a.dirHandle || null, driveId: a.driveId || null,
          doc, local: false, remoteMod: a.driveId ? a.stamp : undefined, modified: a.modified, checked: now };
        if (this.entries.some((e) => e.key === a.key)) continue;   // mezitím ji založila tahle záložka
        this.entries.push(entry);
        a.entry = entry;
      } catch (e) { /* příště */ }
    }
    if (removed.length) {
      this.entries = this.entries.filter((e) => removed.indexOf(e) < 0);
      removed.forEach((e) => { if (e.driveId) DocCache.del(e.driveId); });
    }
    this.entries.forEach((e) => { if (e.doc && e.doc.locked) this.locked++; });
    this.entries.sort((a, b) => (b.modified || 0) - (a.modified || 0));
    return { changed, added, removed };
  },

  /* --- mapy, které zůstaly jen v prohlížeči --- */
  async localOnly() {
    const keys = (await IDB.keys('maps')) || [];
    const vals = (await IDB.all('maps')) || [];
    return vals.map((v, i) => ({ key: keys[i], name: v.name, doc: v.doc, modified: v.modified }))
      .filter((x) => x && x.doc);
  },

  /** přenese mapy z prohlížeče do připojeného úložiště (Disk / složka) */
  async uploadLocal() {
    if (!this.drive && !this.dir) return 0;
    const list = await this.localOnly();
    let n = 0;
    for (const l of list) {
      try {
        const doc = normalizeDoc(l.doc);
        if (!doc) continue;
        await this.createFrom(doc);
        await IDB.del('maps', l.key);
        n++;
      } catch (e) { console.warn('nahrání selhalo', e); }
    }
    return n;
  },

  /* --- znovu uloží všechny mapy (po zapnutí/vypnutí šifrování) --- */
  async rewriteAll(onProgress) {
    let i = 0;
    for (const e of this.entries) {
      if (e.doc && !e.doc.locked) { await this.write(e); }
      i++;
      if (onProgress) onProgress(i, this.entries.length);
    }
  }
};

/* --- stažení souboru (záložní uložení) --- */
function downloadDoc(doc, name) {
  const blob = new Blob([serialize(doc)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name || (slugify(doc.title) + FILE_EXT);
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---- 25-drive.js ---- */
/* ============================================================
   Google Disk – přihlášení a práce se soubory
   ------------------------------------------------------------
   Používá jediné oprávnění drive.file: aplikace vidí výhradně
   soubory, které sama vytvořila. Ke zbytku Disku se nedostane.
   Token žije jen v paměti záložky, nikam se neukládá.

   Na co si tenhle soubor dává pozor:
   · přechodné chyby Disku (500/502/503/504, 429, 403 rateLimit)
     se opakují s prodlužující se pauzou, ne hned a ne napořád,
   · přihlášení běží vždy jen jedno – víc souběžných volání
     si počká na stejný token,
   · soubory nad ~4,5 MB jdou přes „resumable upload“
     (obyčejné nahrání Google garantuje jen do 5 MB).
   ============================================================ */

const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FOLDER_MIME = 'application/vnd.google-apps.folder';
const DEFAULT_FOLDER_NAME = 'Myšlenkové mapy';
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const DRIVE_FIELDS = 'id,name,modifiedTime';
const JSON_TYPE = 'application/json; charset=UTF-8';

function loadScript(src) {
  return new Promise((res, rej) => {
    const old = document.querySelector('script[data-src="' + src + '"]');
    if (old && old.dataset.ok) return res();
    if (old) old.remove();                       // minule se nenačetl (offline) – zkusíme znovu
    const s = document.createElement('script');
    s.src = src; s.async = true; s.defer = true;
    s.dataset.src = src;
    s.onload = () => { s.dataset.ok = '1'; res(); };
    s.onerror = () => { s.remove(); rej(new Error('Nepodařilo se načíst knihovnu pro přihlášení Googlem (jsi online?)')); };
    document.head.appendChild(s);
  });
}

const Drive = {
  clientId: '',
  token: null,
  expiresAt: 0,
  folderId: null,
  folderName: DEFAULT_FOLDER_NAME,
  tokenClient: null,
  connected: false,
  hint: '',                         // e-mail účtu – jen aby se tiché obnovení neptalo, kterým účtem
  _signing: null,                   // právě běžící přihlášení (sdílí se)
  RETRIES: 5,                       // kolikrát zkusit jedno volání (pauzy 1, 2, 4, 8 s)
  SIMPLE_MAX: 4.5 * 1024 * 1024,    // nad tuhle velikost nahráváme přes resumable upload

  /** OAuth funguje jen na https nebo localhost – ne na otevřeném souboru */
  originOk() {
    return location.protocol === 'https:' ||
      ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0;
  },

  loadConfig() {
    const cfg = (window.MM_CONFIG && window.MM_CONFIG.clientId) || '';
    this.clientId = localStorage.getItem('mm.drive.clientId') || cfg || '';
    this.folderId = localStorage.getItem('mm.drive.folderId') || null;
    this.folderName = localStorage.getItem('mm.drive.folderName') || DEFAULT_FOLDER_NAME;
    this.hint = localStorage.getItem('mm.drive.hint') || '';
    return this.clientId;
  },
  saveConfig(clientId) {
    const next = (clientId || '').trim();
    if (next !== this.clientId) this.tokenClient = null;      // jiné ID = nový klient
    this.clientId = next;
    if (this.clientId) localStorage.setItem('mm.drive.clientId', this.clientId);
    else localStorage.removeItem('mm.drive.clientId');
  },
  rememberFolder(id, name) {
    this.folderId = id; this.folderName = name || DEFAULT_FOLDER_NAME;
    localStorage.setItem('mm.drive.folderId', id);
    localStorage.setItem('mm.drive.folderName', this.folderName);
  },
  forgetFolder() {
    this.folderId = null;
    localStorage.removeItem('mm.drive.folderId');
    localStorage.removeItem('mm.drive.folderName');
  },

  /* ---------------- přihlášení ---------------- */
  async initClient() {
    if (this.tokenClient) return;
    if (!this.clientId) throw new Error('Chybí ID klienta Google');
    await loadScript('https://accounts.google.com/gsi/client');
    if (!(window.google && google.accounts && google.accounts.oauth2))
      throw new Error('Knihovna Google se nenačetla');
    this.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: this.clientId,
      scope: DRIVE_SCOPE,
      callback: () => {}
    });
  },

  authError(msg) { const e = new Error(msg); e.auth = true; return e; },

  /** interactive=false zkusí obnovit token potichu (a nenechá se čekat donekonečna).
   *  Souběžná volání dostanou stejný příslib – nikdy neběží dvě přihlášení přes sebe. */
  signIn(interactive) {
    if (this._signing) return this._signing;
    const run = async () => {
      await this.initClient();
      return new Promise((resolve, reject) => {
        let done = false;
        let timer = null;
        const finish = (fn, v) => { if (done) return; done = true; clearTimeout(timer); fn(v); };
        if (!interactive) timer = setTimeout(() => finish(reject, this.authError('Přihlášení nedoběhlo')), 45000);
        this.tokenClient.callback = (resp) => {
          if (resp && resp.access_token) {
            this.token = resp.access_token;
            this.expiresAt = Date.now() + (Number(resp.expires_in || 3600) - 90) * 1000;
            this.connected = true;
            finish(resolve, true);
          } else {
            finish(reject, this.authError((resp && (resp.error_description || resp.error)) || 'Přihlášení se nezdařilo'));
          }
        };
        this.tokenClient.error_callback = (err) => {
          const t = err && err.type;
          finish(reject, this.authError(
            t === 'popup_failed_to_open' ? 'Prohlížeč zablokoval okno s přihlášením'
              : t === 'popup_closed' ? 'Okno s přihlášením se zavřelo dřív, než to doběhlo'
                : (err && (err.message || err.type)) || 'Přihlášení bylo zrušeno'));
        };
        try {
          const o = { prompt: '' };
          if (this.hint) o.login_hint = this.hint;
          this.tokenClient.requestAccessToken(o);
        } catch (e) { e.auth = true; finish(reject, e); }
      });
    };
    const p = run();
    this._signing = p;
    const clear = () => { if (this._signing === p) this._signing = null; };
    p.then(clear, clear);
    return p;
  },

  signOut() {
    try {
      if (this.token && window.google && google.accounts && google.accounts.oauth2)
        google.accounts.oauth2.revoke(this.token, () => {});
    } catch (e) { /* nevadí */ }
    this.token = null; this.expiresAt = 0; this.connected = false;
    this.hint = '';
    try { localStorage.removeItem('mm.drive.hint'); } catch (e) { /* nevadí */ }
  },

  async ensureToken() {
    if (this.token && Date.now() < this.expiresAt) return this.token;
    await this.signIn(false);
    return this.token;
  },

  /** zapamatuje si e-mail přihlášeného účtu (jen v tomhle prohlížeči), aby se příští
   *  obnovení tokenu obešlo bez výběru účtu */
  async rememberAccount() {
    try {
      const a = await this.api('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)', null, 1);
      const mail = a && a.user && a.user.emailAddress;
      if (mail) { this.hint = mail; localStorage.setItem('mm.drive.hint', mail); }
    } catch (e) { /* jen pohodlí navíc, obejdeme se bez něj */ }
  },

  /* ---------------- volání API ---------------- */
  backoff(attempt) { return Math.min(16000, 1000 * Math.pow(2, attempt)) + Math.random() * 700; },

  httpError(status, txt) {
    let msg = '';
    try { const j = JSON.parse(txt); msg = (j && j.error && (j.error.message || j.error.status)) || ''; }
    catch (e) { msg = String(txt || '').replace(/\s+/g, ' ').slice(0, 140); }
    const e = new Error('Google Disk (' + status + ')' + (msg ? ': ' + msg : ''));
    e.status = status;
    e.auth = status === 401;
    e.transient = status === 429 || status >= 500;
    return e;
  },

  /** Jedno volání s opakováním. Vrací odpověď (Response), nebo vyhodí chybu se .status.
   *  Disk čas od času odpoví 500/502/503/504 („Transient failure“) nebo 429 – správná
   *  reakce je chvíli počkat a zkusit to znovu, pokaždé s delší pauzou. */
  async request(url, opts, tries) {
    const max = tries || this.RETRIES;
    const base = Object.assign({}, opts);
    let reauthed = false;
    for (let a = 0; ; a++) {
      await this.ensureToken();
      const o = Object.assign({}, base);
      o.headers = Object.assign({}, base.headers || {}, { Authorization: 'Bearer ' + this.token });
      let r;
      try { r = await fetch(url, o); }
      catch (e) {
        if (base.keepalive) { base.keepalive = false; a--; continue; }   // keepalive má vlastní limity
        const err = new Error(navigator.onLine === false ? 'Zařízení je offline' : 'Spojení s Google Diskem vypadlo');
        err.network = true;
        if (a >= max - 1 || navigator.onLine === false) throw err;
        await sleep(this.backoff(a));
        continue;
      }
      if (r.ok) return r;
      if (r.status === 401 && !reauthed) {            // token vypršel – jeden pokus s novým
        reauthed = true; this.token = null; a--;
        continue;
      }
      const txt = await r.text().catch(() => '');
      const again = r.status === 429 || r.status >= 500 ||
        (r.status === 403 && /rateLimitExceeded|userRateLimitExceeded/i.test(txt));
      if (again && a < max - 1) {
        const ra = Number(r.headers.get('retry-after'));
        await sleep(ra > 0 ? Math.min(ra * 1000, 30000) : this.backoff(a));
        continue;
      }
      throw this.httpError(r.status, txt);
    }
  },

  async api(url, opts, tries) {
    const r = await this.request(url, opts, tries);
    const ct = r.headers.get('content-type') || '';
    return ct.indexOf('json') >= 0 ? r.json() : r.text();
  },

  /* ---------------- složka ---------------- */
  async ensureFolder() {
    if (this.folderId) {
      try {
        const f = await this.api(DRIVE_API + '/' + encodeURIComponent(this.folderId) + '?fields=id,name,trashed');
        if (f && !f.trashed) { this.folderName = f.name; return this.folderId; }
      } catch (e) {
        /* 404 = složka zmizela nebo k ní nemáme přístup – založíme novou.
           Cokoli jiného (výpadek, 503) není důvod zakládat druhou složku. */
        if (!(e && e.status === 404)) throw e;
      }
      this.forgetFolder();
    }
    const find = async (extra) => {
      const q = "mimeType='" + DRIVE_FOLDER_MIME + "' and trashed=false" + (extra || '');
      const res = await this.api(DRIVE_API + '?q=' + encodeURIComponent(q) +
        '&fields=files(id,name,createdTime)&orderBy=createdTime&pageSize=20');
      return (res && res.files) || [];
    };
    /* nejdřív složka s výchozím jménem; když ji uživatel přejmenoval a jsme na novém
       zařízení, vezmeme nejstarší složku, kterou aplikace vidí (vidí jen ty svoje) */
    let found = await find(" and name='" + DEFAULT_FOLDER_NAME.replace(/'/g, "\\'") + "'");
    if (!found.length) found = await find('');
    if (found.length) {
      this.rememberFolder(found[0].id, found[0].name);
      return this.folderId;
    }
    const made = await this.api(DRIVE_API + '?fields=id,name', {
      method: 'POST',
      headers: { 'Content-Type': JSON_TYPE },
      body: JSON.stringify({ name: DEFAULT_FOLDER_NAME, mimeType: DRIVE_FOLDER_MIME })
    });
    this.rememberFolder(made.id, made.name);
    return this.folderId;
  },

  /** připojí konkrétní složku podle ID (z adresy složky na Disku) */
  async useFolder(id) {
    const clean = String(id || '').trim()
      .replace(/^https?:\/\/drive\.google\.com\/drive\/(u\/\d+\/)?folders\//, '')
      .replace(/[?#].*$/, '');
    if (!clean) throw new Error('Prázdné ID složky');
    const f = await this.api(DRIVE_API + '/' + encodeURIComponent(clean) + '?fields=id,name,mimeType');
    if (f.mimeType !== DRIVE_FOLDER_MIME) throw new Error('To není složka');
    this.rememberFolder(f.id, f.name);
    return f;
  },

  /* ---------------- soubory ---------------- */
  /** soupis map ve složce – jen jména a data změny, žádný obsah (levný dotaz) */
  async list() {
    const q = "'" + this.folderId + "' in parents and trashed=false and mimeType!='" + DRIVE_FOLDER_MIME + "'";
    let out = [], page = '';
    do {
      const res = await this.api(DRIVE_API + '?q=' + encodeURIComponent(q) +
        '&fields=nextPageToken,files(id,name,modifiedTime,size)&orderBy=modifiedTime desc&pageSize=1000' +
        (page ? '&pageToken=' + encodeURIComponent(page) : ''));
      out = out.concat((res && res.files) || []);
      page = (res && res.nextPageToken) || '';
    } while (page && out.length < 5000);
    return out.filter((f) => /\.json$/i.test(f.name));
  },

  /** datum změny jednoho souboru (malý dotaz před zápisem) */
  async stat(id) {
    return this.api(DRIVE_API + '/' + encodeURIComponent(id) + '?fields=id,name,modifiedTime,trashed', null, 3);
  },

  async downloadText(id) {
    const r = await this.request(DRIVE_API + '/' + encodeURIComponent(id) + '?alt=media');
    return r.text();
  },

  multipart(meta, text) {
    const b = '-------mm' + Math.random().toString(36).slice(2);
    const body =
      '--' + b + '\r\nContent-Type: ' + JSON_TYPE + '\r\n\r\n' +
      JSON.stringify(meta) + '\r\n' +
      '--' + b + '\r\nContent-Type: ' + JSON_TYPE + '\r\n\r\n' +
      text + '\r\n--' + b + '--';
    return { body, type: 'multipart/related; boundary=' + b };
  },

  /* keepalive drží požadavek naživu, i když uživatel zavře záložku (limit 64 kB v bajtech) */
  keep(body) { return typeof body === 'string' && body.length < 60000 && byteLen(body) < 60000; },

  /** Nahrání velkého souboru nadvakrát: nejdřív se založí relace, pak se pošlou data.
   *  Vrací null, když relaci nejde založit – volající pak použije obyčejné nahrání. */
  async resumable(method, url, meta, text) {
    let last = null;
    for (let a = 0; a < 3; a++) {
      let loc = '';
      try {
        const init = await this.request(url + '?uploadType=resumable&fields=' + DRIVE_FIELDS, {
          method,
          headers: { 'Content-Type': JSON_TYPE, 'X-Upload-Content-Type': JSON_TYPE },
          body: JSON.stringify(meta || {})
        });
        loc = init.headers.get('Location') || '';
      } catch (e) {
        if (e && (e.auth || e.status === 404)) throw e;
        last = e;
      }
      if (!loc) return null;
      try {
        const r = await this.request(loc, { method: 'PUT', headers: { 'Content-Type': JSON_TYPE }, body: text }, 1);
        return await r.json();
      } catch (e) {
        if (e && e.auth) throw e;
        last = e;                       // relace se pokazila – podle Googlu se má založit nová
        if (a < 2) await sleep(this.backoff(a));
      }
    }
    throw last;
  },

  async createFile(name, text) {
    const meta = { name, parents: [this.folderId] };
    if (byteLen(text) > this.SIMPLE_MAX) {
      const r = await this.resumable('POST', DRIVE_UPLOAD, meta, text);
      if (r) return r;
    }
    const mp = this.multipart(meta, text);
    return this.api(DRIVE_UPLOAD + '?uploadType=multipart&fields=' + DRIVE_FIELDS,
      { method: 'POST', headers: { 'Content-Type': mp.type }, body: mp.body, keepalive: this.keep(mp.body) });
  },

  async updateFile(id, text) {
    const url = DRIVE_UPLOAD + '/' + encodeURIComponent(id);
    if (byteLen(text) > this.SIMPLE_MAX) {
      const r = await this.resumable('PATCH', url, null, text);
      if (r) return r;
    }
    return this.api(url + '?uploadType=media&fields=' + DRIVE_FIELDS,
      { method: 'PATCH', headers: { 'Content-Type': JSON_TYPE }, body: text, keepalive: this.keep(text) });
  },

  async renameFile(id, name) {
    return this.api(DRIVE_API + '/' + encodeURIComponent(id) + '?fields=' + DRIVE_FIELDS,
      { method: 'PATCH', headers: { 'Content-Type': JSON_TYPE }, body: JSON.stringify({ name }) });
  },

  /** do koše, ne natrvalo */
  async trashFile(id) {
    return this.api(DRIVE_API + '/' + encodeURIComponent(id),
      { method: 'PATCH', headers: { 'Content-Type': JSON_TYPE }, body: JSON.stringify({ trashed: true }) });
  },

  folderUrl() {
    return this.folderId ? 'https://drive.google.com/drive/folders/' + this.folderId : '';
  }
};
/* ---- 30-canvas.js ---- */
/* ============================================================
   Plátno: vykreslení buněk a vazeb, posun a přiblížení
   ============================================================ */

const App = {
  entry: null,
  doc: null,
  sel: new Set(),
  selEdges: new Set(),
  linkGroup: [],
  linkSticky: false,
  tool: 'pan',
  sizes: Object.create(null),   // id -> {w,h}
  undoStack: [],
  redoStack: [],
  dirty: false,
  suppressSave: false
};

const els = {};
function cacheEls() {
  els.canvas = $('#canvas'); els.world = $('#world');
  els.svg = $('#edges'); els.nodes = $('#nodes');
  els.zVal = $('#zVal'); els.saveState = $('#saveState'); els.saveTxt = $('#saveTxt');
}

const nodeEls = new Map();

/* --------------------------- pohled (view) ------------------------------- */
function view() { return App.doc.view; }

/* Posun a přiblížení plátna NEJSOU změna mapy. Dřív každé pohnutí obrazovkou nahrálo
   celý soubor znovu na Disk (včetně všech obrázků) – to bylo zbytečné a Disk na to
   odpovídal chybou 503. Výřez si teď pamatuje každé zařízení samo (telefon a počítač
   stejně potřebují každý jiný) a do souboru se propíše až s opravdovou úpravou. */
const ViewStore = {
  key(doc) { return 'mm.view.' + doc.id; },
  load(doc) {
    try {
      const o = JSON.parse(localStorage.getItem(this.key(doc)) || 'null');
      if (o && isFinite(o.x) && isFinite(o.y) && o.zoom > 0) return { x: o.x, y: o.y, zoom: clamp(o.zoom, 0.1, 4) };
    } catch (e) { /* soukromé okno */ }
    return null;
  },
  save: debounce(() => {
    if (!App.doc) return;
    const v = App.doc.view;
    try {
      localStorage.setItem(ViewStore.key(App.doc), JSON.stringify({
        x: Math.round(v.x), y: Math.round(v.y), zoom: +v.zoom.toFixed(4)
      }));
    } catch (e) { /* plné nebo zakázané úložiště – nevadí */ }
  }, 350)
};
/** výřez plátna se změnil (posun, zoom) – zapamatuj si ho v zařízení, nic neukládej na Disk */
function viewChanged() { if (App.doc && !App.suppressSave) ViewStore.save(); }

/** střed plátna na obrazovce (pro tlačítka přiblížení a vkládání nových buněk) */
function canvasCenter() {
  const r = els.canvas.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

function applyView() {
  const v = view();
  els.world.style.transform = 'translate(' + v.x + 'px,' + v.y + 'px) scale(' + v.zoom + ')';
  els.zVal.textContent = Math.round(v.zoom * 100) + ' %';
}

function screenToWorld(px, py) {
  const r = els.canvas.getBoundingClientRect();
  const v = view();
  return { x: (px - r.left - v.x) / v.zoom, y: (py - r.top - v.y) / v.zoom };
}

function zoomAt(px, py, factor) {
  const v = view();
  const z2 = clamp(v.zoom * factor, 0.12, 3.5);
  if (z2 === v.zoom) return;
  const r = els.canvas.getBoundingClientRect();
  const cx = px - r.left, cy = py - r.top;
  v.x = cx - (cx - v.x) * (z2 / v.zoom);
  v.y = cy - (cy - v.y) * (z2 / v.zoom);
  v.zoom = z2;
  applyView(); viewChanged();
}

function nodeSize(n) {
  const s = App.sizes[n.id];
  return { w: (s && s.w) || n.w, h: (s && s.h) || n.h || 44 };
}

/** zapíše naměřené výšky buněk do dokumentu (kvůli přesným miniaturám) */
function syncSizes() {
  if (!App.doc) return;
  App.doc.nodes.forEach((n) => {
    const s = App.sizes[n.id];
    if (s && s.h) n.h = Math.round(s.h);
  });
}

function fitView(animate) {
  const d = App.doc;
  if (!d.nodes.length) { d.view.x = els.canvas.clientWidth / 2 - 100; d.view.y = 120; d.view.zoom = 1; applyView(); return; }
  const b = docBounds(d, (n) => nodeSize(n).h);
  const cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
  const pad = Math.max(18, Math.min(60, cw * 0.06));
  const z = clamp(Math.min((cw - pad * 2) / b.w, (ch - pad * 2 - 40) / b.h), 0.12, 1.4);
  d.view.zoom = z;
  d.view.x = (cw - b.w * z) / 2 - b.x * z;
  d.view.y = (ch - b.h * z) / 2 - b.y * z;
  if (animate) {
    els.world.style.transition = 'transform .28s cubic-bezier(.2,.7,.3,1)';
    setTimeout(() => { els.world.style.transition = ''; }, 320);
  }
  applyView(); viewChanged();
}

/* --------------------------- vykreslení buněk ---------------------------- */
const ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';

function buildNodeEl(n) {

    '</div>' +

    '<div class="n-resize" title="Změnit šířku"></div>';

function paintNode(n) {

  const img = el.querySelector('.n-img');

         (jen překreslení; načtení obrázku není úprava mapy, takže se nic neukládá) */
      img.addEventListener('load', () => { measure(); }, { once: true });

    else { body.textContent = 'Zatím bez obsahu – klepni sem a piš.'; body.classList.add('empty-hint'); }
