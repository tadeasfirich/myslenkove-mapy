}

function renderNodes() {
  const alive = new Set();
  App.doc.nodes.forEach((n) => { alive.add(n.id); paintNode(n); });
  nodeEls.forEach((el, id) => { if (!alive.has(id)) { el.remove(); nodeEls.delete(id); delete App.sizes[id]; } });
  // pořadí vykreslení podle pořadí v dokumentu
  App.doc.nodes.forEach((n) => els.nodes.appendChild(nodeEls.get(n.id)));
  measure();
}

function measure() {
  nodeEls.forEach((el, id) => {
    App.sizes[id] = { w: el.offsetWidth, h: el.offsetHeight };
  });
  renderEdges();
}

/* --------------------------- vazby --------------------------------------- */
function nodeRect(n) {
  const s = nodeSize(n);
  return { x: n.x, y: n.y, w: s.w, h: s.h, cx: n.x + s.w / 2, cy: n.y + s.h / 2 };
}

/** Průsečík úsečky střed->cíl s obrysem buňky. Obrys je obdélník se zaoblenými rohy
 *  (rad = poloměr); když je poloměr větší než půlka kratší strany, vyjde z toho „pilulka“. */
function anchor(r, tx, ty, rad) {
  const dx = tx - r.cx, dy = ty - r.cy;
  if (!dx && !dy) return { x: r.cx, y: r.cy };
  const sx = dx === 0 ? Infinity : (r.w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (r.h / 2) / Math.abs(dy);
  const k = Math.min(sx, sy);
  const p = { x: r.cx + dx * k, y: r.cy + dy * k };
  const R = Math.min(rad || 0, r.w / 2, r.h / 2);
  if (R <= 0) return p;
  /* bod na rovné části obrysu je hotový; v rohu se průsečík hledá s obloukem */
  const inX = p.x < r.x + R || p.x > r.x + r.w - R;
  const inY = p.y < r.y + R || p.y > r.y + r.h - R;
  if (!(inX && inY)) return p;
  const ccx = p.x < r.cx ? r.x + R : r.x + r.w - R;
  const ccy = p.y < r.cy ? r.y + R : r.y + r.h - R;
  const ox = r.cx - ccx, oy = r.cy - ccy;
  const A = dx * dx + dy * dy, B = 2 * (ox * dx + oy * dy), C = ox * ox + oy * oy - R * R;
  const disc = B * B - 4 * A * C;
  if (disc < 0) return p;
  const tt = (-B + Math.sqrt(disc)) / (2 * A);
  return { x: r.cx + dx * tt, y: r.cy + dy * tt };
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

function edgeGeometry(e) {
  const a = App.doc.nodes.find((n) => n.id === e.from);
  const b = App.doc.nodes.find((n) => n.id === e.to);
  if (!a || !b) return null;
  const ra = nodeRect(a), rb = nodeRect(b);
  const p1 = anchor(ra, rb.cx, rb.cy, nodeRadius(a));
  const p2 = anchor(rb, ra.cx, ra.cy, nodeRadius(b));
  return { p1, p2 };
}

function arrowPath(from, to, size) {
  const dx = to.x - from.x, dy = to.y - from.y;
  const L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L;
  const s = size || 9;
  const bx = to.x - ux * s, by = to.y - uy * s;
  const px = -uy * s * 0.52, py = ux * s * 0.52;
  return 'M' + to.x + ',' + to.y + ' L' + (bx + px) + ',' + (by + py) + ' L' + (bx - px) + ',' + (by - py) + ' Z';
}

function renderEdges() {
  const svg = els.svg;
  svg.textContent = '';
  const frag = document.createDocumentFragment();
  App.doc.edges.forEach((e) => {
    const g = edgeGeometry(e);
    if (!g) return;
    const stroke = colorHex(e.color) || 'var(--line-2)';
    const grp = svgEl('g', { 'data-id': e.id });
    if (App.selEdges.has(e.id)) grp.setAttribute('class', 'sel');
    const d = 'M' + g.p1.x + ',' + g.p1.y + ' L' + g.p2.x + ',' + g.p2.y;
    grp.appendChild(svgEl('path', { class: 'hit', d }));
    const wire = svgEl('path', {
      class: 'wire', d, stroke, 'stroke-width': 2,
      'stroke-dasharray': e.style === 'dashed' ? '7 6' : (e.style === 'dotted' ? '1 6' : '')
    });
    grp.appendChild(wire);
    if (e.arrow === 'to' || e.arrow === 'both')
      grp.appendChild(svgEl('path', { d: arrowPath(g.p1, g.p2), fill: stroke, stroke: 'none' }));
    if (e.arrow === 'both')
      grp.appendChild(svgEl('path', { d: arrowPath(g.p2, g.p1), fill: stroke, stroke: 'none' }));
    if (e.label) {
      const t = svgEl('text', {
        class: 'elabel', x: (g.p1.x + g.p2.x) / 2, y: (g.p1.y + g.p2.y) / 2
      });
      t.textContent = e.label;
      grp.appendChild(t);
    }
    frag.appendChild(grp);
  });
  svg.appendChild(frag);
  if (App.tempWire) svg.appendChild(App.tempWire);
}

/* --------------------------- výběr --------------------------------------- */
function setSel(ids, addTo) {
  if (!addTo) { App.sel.clear(); App.selEdges.clear(); }
  (Array.isArray(ids) ? ids : [ids]).forEach((id) => { if (id) App.sel.add(id); });
  refreshSelection();
}
/** výběr vazeb; addTo = přidat k současnému výběru */
function setSelEdges(ids, addTo) {
  if (!addTo) { App.selEdges.clear(); App.sel.clear(); }
  (Array.isArray(ids) ? ids : [ids]).forEach((id) => { if (id) App.selEdges.add(id); });
  refreshSelection();
}
function clearSel() { App.sel.clear(); App.selEdges.clear(); refreshSelection(); }
function selCount() { return App.sel.size + App.selEdges.size; }
function refreshSelection() {
  nodeEls.forEach((el, id) => {
    el.classList.toggle('sel', App.sel.has(id));
    el.classList.toggle('linksrc', !!(App.linkGroup && App.linkGroup.indexOf(id) >= 0));
  });
  $$('#edges g').forEach((g) => g.classList.toggle('sel', App.selEdges.has(g.dataset.id)));
  updateInspector();
}
function getNode(id) { return App.doc.nodes.find((n) => n.id === id); }
function getEdge(id) { return App.doc.edges.find((e) => e.id === id); }

/* ---- 40-interact.js ---- */
/* ============================================================
   Ovládání: myš, dotyk, klávesnice, historie změn
   ============================================================ */

/* ----------------------------- historie ---------------------------------- */
/* Krok zpět je otisk celé mapy. Obrázky v něm ale být nesmějí – jedna fotka má stovky kB
   a 120 kroků by na telefonu sežralo paměť. Proto se v otisku nahrazují krátkou značkou
   a skutečná data leží jen jednou tady. */
const ImgPool = {
  MARK: '\u0001img:',
  ids: new Map(), list: [],
  put(data) {
    let i = this.ids.get(data);
    if (i === undefined) { i = this.list.length; this.list.push(data); this.ids.set(data, i); }
    return this.MARK + i;
  },
  get(v) {
    return (typeof v === 'string' && v.indexOf(this.MARK) === 0) ? (this.list[Number(v.slice(this.MARK.length))] || null) : v;
  },
  reset() { this.ids.clear(); this.list.length = 0; }
};

function snapshot() {
  return JSON.stringify({ nodes: App.doc.nodes, edges: App.doc.edges, title: App.doc.title },
    (k, v) => (k === 'image' && typeof v === 'string' && v.length > 1024 ? ImgPool.put(v) : v));
}
let lastSnap = null;
function commitUndo(snap) {
  App.undoStack.push(snap);
  if (App.undoStack.length > 120) App.undoStack.shift();
  App.redoStack.length = 0;
  updateHistoryButtons();
}
function pushUndo() {
  if (!App.doc) return;
  commitUndo(lastSnap || snapshot());
  lastSnap = null;
}
/** psaní do pole (název, obsah, popisek, šířka) = jeden krok zpět za celé psaní */
function beginTextEdit() { if (App.doc && !lastSnap) lastSnap = snapshot(); }
function endTextEdit() {
  if (!lastSnap || !App.doc) { lastSnap = null; return; }
  const before = lastSnap; lastSnap = null;
  if (before !== snapshot()) commitUndo(before);     // beze změny nevzniká prázdný krok
}
function applySnap(s) {
  const o = JSON.parse(s);
  o.nodes.forEach((n) => { n.image = ImgPool.get(n.image); });
  App.doc.nodes = o.nodes; App.doc.edges = o.edges;
  if (o.title !== undefined) { App.doc.title = o.title; $('#docTitle').value = o.title; }
  App.sel.forEach((id) => { if (!getNode(id)) App.sel.delete(id); });
  App.selEdges.forEach((id) => { if (!getEdge(id)) App.selEdges.delete(id); });
  inspKey = '';
  renderNodes(); refreshSelection(); scheduleSave();
}
function undo() {
  if (!App.undoStack.length) return;
  lastSnap = null;
  App.redoStack.push(snapshot());
  applySnap(App.undoStack.pop());
  updateHistoryButtons();
}
function redo() {
  if (!App.redoStack.length) return;
  lastSnap = null;
  App.undoStack.push(snapshot());
  applySnap(App.redoStack.pop());
  updateHistoryButtons();
}
function updateHistoryButtons() {
  $('#btnUndo').disabled = !App.undoStack.length;
  $('#btnRedo').disabled = !App.redoStack.length;
}

/* ----------------------------- ukládání ---------------------------------- */
/** stav uložení v horní liště. kind: 'ok' | 'busy' | 'err' – liší se i tvarem značky,
 *  ne jen barvou (plné kolečko / prázdné kolečko / čtvereček) */
function setSaveState(txt, dirty, kind) {
  const el = els.saveState;
  el.dataset.kind = kind || (dirty ? 'busy' : 'ok');
  el.classList.toggle('dirty', !!dirty);
  el.title = txt;
  (els.saveTxt || el).textContent = txt;
}

/* Ukládání řídí jediná fronta:
   · ukládá se až po chvilce klidu (na Disk 2,5 s, do složky 0,6 s), při souvislé práci
     nejpozději po 20 s,
   · nikdy neběží dvě nahrávání téhož souboru přes sebe – další změna si počká,
   · když se obsah od posledního uložení nezměnil, nic se neposílá,
   · po chybě se zkouší znovu s delší a delší pauzou a úpravy mezitím leží v zařízení. */
const Saver = {
  DELAY_DRIVE: 2500,
  DELAY_LOCAL: 600,
  MAX_WAIT: 20000,
  timer: null, retryTimer: null, since: 0,
  busy: false, again: false, level: 0, current: null,
  fails: 0,

  delay() { const e = App.entry; return e && (e.driveId || Store.drive) ? this.DELAY_DRIVE : this.DELAY_LOCAL; },
  pending() { return !!(this.timer || this.busy || this.retryTimer); },

  /** obsah mapy se změnil – naplánuj uložení */
  touch() {
    if (!App.entry || App.suppressSave) return;
    App.dirty = true;
    if (this.busy) this.again = true;
    if (!this.fails) setSaveState('Ukládám…', true, 'busy');
    if (this.retryTimer) return;                  // čeká se na další pokus po chybě – vezme i tohle
    const now = Date.now();
    if (!this.since) this.since = now;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.run(), Math.max(0, Math.min(this.delay(), this.since + this.MAX_WAIT - now)));
  },

  /** Uloží hned, pokud je co. Vrací příslib: true = na úložišti je aktuální stav.
   *  mode 'always' = zapiš i beze změny (Ctrl+S), 'force' = zapiš a nekontroluj cizí verzi */
  flush(mode) { return this.run(mode); },

  /** počká, až doběhne rozdělané ukládání (nic nového nespouští) */
  async settle() { try { if (this.current) await this.current; } catch (e) { /* nevadí */ } },

  run(mode) {
    clearTimeout(this.timer); this.timer = null;
    clearTimeout(this.retryTimer); this.retryTimer = null;
    const entry = App.entry;
    if (!entry || !entry.doc || entry.doc.locked || App.suppressSave) return Promise.resolve(true);
    this.level = Math.max(this.level, mode === 'force' ? 2 : mode === 'always' ? 1 : 0);
    if (this.busy) { this.again = true; return this.current; }
    if (!App.dirty && !this.level) return Promise.resolve(true);
    this.busy = true;
    const done = (v) => { this.busy = false; this.current = null; return v; };
    this.current = this.loop(entry).then(done, () => done(false));
    return this.current;
  },

  async loop(entry) {
    let ok = true;
    do {
      this.again = false;
      const level = this.level; this.level = 0;
      ok = await this.once(entry, level);
    } while (ok && this.again && App.entry === entry);
    return ok;
  },

  async once(entry, level) {
    const mine = () => App.entry === entry;
    /* dokud uživatel nerozhodne, čí verze platí, nic nepřepisujeme */
    if (level < 2 && Sync.conflict && Sync.conflict.entry === entry) {
      if (mine()) setSaveState('Čeká na tvoje rozhodnutí', true, 'err');
      return false;
    }
    try {
      if (mine()) syncSizes();
      const key = contentKey(entry.doc);
      if (level || !entry.savedKey || key !== entry.savedKey) {
        if (mine()) setSaveState('Ukládám…', true, 'busy');
        await Store.write(entry, { guard: level < 2 });
        entry.savedKey = key;
      }
      this.fails = 0; this.since = 0;
      Draft.clear(entry.key);
      if (mine()) {
        if (Sync.barKind === 'save') Sync.hideBar();
        if (entry.recreated) {
          entry.recreated = false;
          toast('Soubor na Disku chyběl – mapa je uložená jako nový soubor', 4500);
        }
        if (!this.again) {
          App.dirty = false;
          setSaveState('Uloženo ' + fmtDate(Date.now()), false, 'ok');
        }
      }
      return true;
    } catch (err) {
      console.error('uložení selhalo', err);
      const backed = !!(entry.driveId || entry.handle);
      Draft.write(entry);                         // úpravy přežijí i zavření záložky
      if (!mine()) {
        toast('Mapu „' + (entry.title || entry.name) + '“ se nepodařilo uložit' +
          (backed ? ' – úpravy zůstaly v tomhle zařízení a nabídnou se při otevření' : ''), 6500);
        return false;
      }
      App.dirty = true;
      if (err && err.conflict) {
        setSaveState('Neuloženo – změna odjinud', true, 'err');
        setTimeout(() => Sync.now(true, true), 60);
        return false;
      }
      if (err && err.auth) {
        setSaveState('Neuloženo – přihlas se', true, 'err');
        Sync.authLost = true; Sync.stop(); Sync.showAuthBar();
        return false;
      }
      this.fails++;
      const wait = Math.min(60, 5 * Math.pow(2, this.fails - 1));      // 5, 10, 20, 40, 60 s
      setSaveState('Neuloženo! (' + this.fails + '. pokus)', true, 'err');
      const why = err && err.network ? (err.message + '.')
        : err && err.transient ? 'Google Disk je teď přetížený (' + err.status + ').'
          : 'Uložení se nepovedlo: ' + String((err && err.message) || err).slice(0, 140) + '.';
      Sync.barKind = 'save';
      Sync.bar(esc(why) + (backed ? ' Úpravy jsou zatím schované v tomhle zařízení.' : '') +
        ' Další pokus za ' + wait + ' s.', [
        { label: 'Zkusit hned', primary: true, fn: () => { Sync.hideBar(); this.run(); } },
        { label: 'Stáhnout kopii', fn: () => downloadDoc(entry.doc, entry.name) }
      ]);
      this.retryTimer = setTimeout(() => { this.retryTimer = null; this.run(); }, wait * 1000);
      return false;
    }
  }
};

function scheduleSave() { Saver.touch(); }

/** jednorázové vysvětlení, jak se na dotyku posouvají buňky */
function hintTouchDrag() {
  try {
    if (localStorage.getItem('mm.hint.touchdrag')) return;
    localStorage.setItem('mm.hint.touchdrag', '1');
  } catch (e) { /* soukromé okno */ }
  toast('Vybranou buňku teď posuneš tažením za kteroukoli její část', 4000);
}

/* ----------------------------- operace ----------------------------------- */
function addNode(x, y, opts) {
  pushUndo();
  const n = newNode(x, y, (opts && opts.title) !== undefined ? opts.title : '');
  App.doc.nodes.push(n);
  renderNodes();
  setSel(n.id);
  scheduleSave();
  return n;
}
/** spojí všechny zdrojové buňky s cílovou; vrací počet nově vzniklých vazeb */
function addEdges(fromIds, to) {
  const list = fromIds.filter((f) => f !== to && getNode(f));
  const fresh = list.filter((f) => !App.doc.edges.some(
    (e) => (e.from === f && e.to === to) || (e.from === to && e.to === f)));
  if (!fresh.length) return 0;
  pushUndo();
  fresh.forEach((f) => App.doc.edges.push(newEdge(f, to)));
  renderEdges(); scheduleSave();
  return fresh.length;
}

function addEdge(from, to) {
  if (from === to) return null;
  if (App.doc.edges.some((e) => (e.from === from && e.to === to) || (e.from === to && e.to === from))) {
    toast('Tyhle buňky už jsou spojené');
    return null;
  }
  pushUndo();
  const e = newEdge(from, to);
  App.doc.edges.push(e);
  renderEdges(); scheduleSave();
  return e;
}
function deleteSelection() {
  if (!App.sel.size && !App.selEdges.size) return;
  pushUndo();
  const ids = new Set(App.sel);
  const eids = new Set(App.selEdges);
  if (ids.size) App.doc.nodes = App.doc.nodes.filter((n) => !ids.has(n.id));
  App.doc.edges = App.doc.edges.filter(
    (e) => !eids.has(e.id) && !ids.has(e.from) && !ids.has(e.to));
  App.sel.clear(); App.selEdges.clear();
  renderNodes(); refreshSelection(); scheduleSave();
}

/** vybere všechny vazby, které se dotýkají daných buněk */
function selectEdgesOf(nodeIds) {
  const set = new Set(nodeIds);
  const ids = App.doc.edges.filter((e) => set.has(e.from) || set.has(e.to)).map((e) => e.id);
  if (!ids.length) { toast('Tyhle buňky nemají žádnou vazbu'); return; }
  setSelEdges(ids, false);
  openInspector();
  toast(ids.length + ' ' + plural(ids.length, 'vazba', 'vazby', 'vazeb') + ' vybráno');
}
function duplicateSelection() {
  if (!App.sel.size) return;
  pushUndo();
  const map = {}; const added = [];
  App.doc.nodes.filter((n) => App.sel.has(n.id)).forEach((n) => {
    const c = clone(n); c.id = uid('n'); c.x += 26; c.y += 26;
    map[n.id] = c.id; App.doc.nodes.push(c); added.push(c.id);
  });
  App.doc.edges.slice().forEach((e) => {
    if (map[e.from] && map[e.to]) {
      const c = clone(e); c.id = uid('e'); c.from = map[e.from]; c.to = map[e.to];
      App.doc.edges.push(c);
    }
  });
  renderNodes(); setSel(added); scheduleSave();
}
function toggleContent(n, force) {
  pushUndo();
  n.open = force === undefined ? !n.open : force;
  paintNode(n); measure(); scheduleSave();
}
function toggleAllContent(open) {
  pushUndo();
  App.doc.nodes.forEach((n) => { n.open = open && !!n.content; });
  renderNodes(); scheduleSave();
}

/* --------- protíná úsečka obdélník? (výběr vazeb rámečkem) --------- */
function segmentHitsRect(p1, p2, r) {
  const x1 = Math.min(r.x1, r.x2), x2 = Math.max(r.x1, r.x2);
  const y1 = Math.min(r.y1, r.y2), y2 = Math.max(r.y1, r.y2);
  if (Math.max(p1.x, p2.x) < x1 || Math.min(p1.x, p2.x) > x2) return false;
  if (Math.max(p1.y, p2.y) < y1 || Math.min(p1.y, p2.y) > y2) return false;
  const inside = (p) => p.x >= x1 && p.x <= x2 && p.y >= y1 && p.y <= y2;
  if (inside(p1) || inside(p2)) return true;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const hits = (a, b, c, d) => {
    const d1 = cross(a, b, c), d2 = cross(a, b, d), d3 = cross(c, d, a), d4 = cross(c, d, b);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  };
  const c1 = { x: x1, y: y1 }, c2 = { x: x2, y: y1 }, c3 = { x: x2, y: y2 }, c4 = { x: x1, y: y2 };
  return hits(p1, p2, c1, c2) || hits(p1, p2, c2, c3) || hits(p1, p2, c3, c4) || hits(p1, p2, c4, c1);
}

/* ----------------------------- editace názvu ----------------------------- */
let editingEl = null, editingOrig = '';
function editTitle(n) {
  const el = nodeEls.get(n.id); if (!el) return;
  const t = el.querySelector('.n-title');
  editingEl = t; editingOrig = n.title;
  t.textContent = n.title;
  t.setAttribute('contenteditable', 'true');
  t.focus();
  const r = document.createRange(); r.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  lastSnap = snapshot();
}
function stopEditTitle(save) {
  if (!editingEl) return;
  const el = editingEl; editingEl = null;
  const host = el.closest('.node');
  if (!host) return;
  const n = getNode(host.dataset.id);
  const val = el.textContent.replace(/\s+$/, '');
  el.removeAttribute('contenteditable');
  if (n) {
    if (save && val !== editingOrig) { pushUndo(); n.title = val; scheduleSave(); }
    else { n.title = editingOrig; lastSnap = null; }
    paintNode(n); measure();
  } else lastSnap = null;
  updateInspector();
}

/* ============================================================
   Ukazovátko (myš i dotyk)
   ============================================================ */
/** poznáme, že zařízení opravdu používá dotyk (některé prohlížeče pointerType zamlčí) */
let SAW_TOUCH = false;
try {
  window.addEventListener('touchstart', () => { SAW_TOUCH = true; }, { capture: true, passive: true });
} catch (e) { /* starý prohlížeč */ }

/** dotyk nebo pero (na nich platí „nejdřív vyber, pak posouvej“) */
function isTouchPointer(ev) {
  if (ev.pointerType === 'mouse') return false;
  if (ev.pointerType === 'touch' || ev.pointerType === 'pen') return true;
  if (SAW_TOUCH) return true;
  try { return matchMedia('(any-pointer: coarse)').matches; } catch (e) { return false; }
}

const pointers = new Map();
let gesture = null;   // {type, ...}
let pinch = null;
let spaceDown = false;

function initCanvasEvents() {
  const c = els.canvas;

  c.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove, { passive: false });
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  c.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    if (ev.ctrlKey || ev.metaKey || !ev.shiftKey) {
      zoomAt(ev.clientX, ev.clientY, Math.pow(0.9988, ev.deltaY));
    } else {
      const v = view(); v.x -= ev.deltaY; applyView(); viewChanged();
    }
  }, { passive: false });

  c.addEventListener('dblclick', (ev) => {
    const nodeEl = ev.target.closest('.node');
    if (nodeEl) {
      if (ev.target.closest('.n-title')) { editTitle(getNode(nodeEl.dataset.id)); return; }
      if (ev.target.closest('.n-body')) { openInspector('content'); return; }
      return;
    }
    if (ev.target.closest('.toolbar,.zoombar,.inspector,.syncbar')) return;
    const p = screenToWorld(ev.clientX, ev.clientY);
    const n = addNode(p.x - NODE_W / 2, p.y - 20, { title: '' });
    setTimeout(() => editTitle(n), 10);
  });

  c.addEventListener('contextmenu', (ev) => {
    if (ev.target.closest('.toolbar,.zoombar,.syncbar')) return;
    ev.preventDefault();
    const nodeEl = ev.target.closest('.node');
    if (nodeEl && !App.sel.has(nodeEl.dataset.id)) setSel(nodeEl.dataset.id);
    showContextMenu(ev.clientX, ev.clientY, !!nodeEl);
  });

  /* přetažení obrázku do buňky (nebo na volné místo = nová buňka) */
  c.addEventListener('dragover', (ev) => { ev.preventDefault(); });
  c.addEventListener('drop', async (ev) => {
    ev.preventDefault();
    const files = ev.dataTransfer && ev.dataTransfer.files ? Array.from(ev.dataTransfer.files) : [];
    if (!files.length) return;
    const nodeEl = ev.target.closest('.node');
    await insertImageFiles(files, {
      nodeId: nodeEl ? nodeEl.dataset.id : null,
      at: screenToWorld(ev.clientX, ev.clientY)
    });
  });
}

/** Dokončí rozdělané gesto a uklidí po něm. Volá se při puštění prstu i tehdy, když gesto
 *  přeruší druhý prst (štípnutí) – dřív po něm zůstal viset rámeček výběru nebo čára
 *  nové vazby a posun buňky se neuložil. */
function finishGesture() {
  const g = gesture;
  gesture = null;
  if (!g) return;
  els.canvas.classList.remove('panning', 'linking');
  if (g.type === 'pan') {
    if (g.moved || !g.tapNode) viewChanged();
  } else if (g.type === 'drag') {
    const el = nodeEls.get(g.id); if (el) el.classList.remove('dragging');
    if (g.moved) { if (lastSnap) commitUndo(lastSnap); App.lastDragAt = Date.now(); scheduleSave(); }
    lastSnap = null;
  } else if (g.type === 'resize') {
    if (g.moved) { if (lastSnap) commitUndo(lastSnap); App.lastDragAt = Date.now(); measure(); scheduleSave(); }
    lastSnap = null;
  } else if (g.type === 'link') {
    $$('.node.drop').forEach((e) => e.classList.remove('drop'));
    if (App.tempWire) { App.tempWire.remove(); App.tempWire = null; }
  } else if (g.type === 'marquee') {
    g.box.remove();
  }
}

function onPointerDown(ev) {
  if (ev.target.closest('.toolbar,.zoombar,.inspector,.syncbar')) return;
  /* nový „první“ dotyk znamená, že žádný jiný prst na obrazovce není – případný zapomenutý
     (po systémovém dialogu, výběru fotky…) zahodíme, jinak by se jeden prst tvářil jako dva */
  if (ev.isPrimary) { pointers.clear(); pinch = null; }
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  if (pointers.size === 2) {           // pinch
    finishGesture();
    const [a, b] = Array.from(pointers.values());
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2,
      vx: view().x, vy: view().y, z: view().zoom };
    return;
  }
  if (pointers.size > 2) return;

  endTextEdit();                       // rozepsané pole v panelu – uzavři jeho krok zpět
  if (editingEl && !ev.target.closest('.n-title')) stopEditTitle(true);

  const port = ev.target.closest('.port');
  const resize = ev.target.closest('.n-resize');
  const nodeEl = ev.target.closest('.node');
  const hit = ev.target.closest('#edges g');

  /* 1) tažení nové vazby z uzlového bodu */
  if (port && nodeEl) {
    ev.preventDefault();
    const n = getNode(nodeEl.dataset.id);
    gesture = { type: 'link', from: n.id, sx: ev.clientX, sy: ev.clientY, moved: false };
    App.tempWire = svgEl('path', { class: 'wire', stroke: 'var(--accent)', 'stroke-width': 2,
      'stroke-dasharray': '6 5', d: '' });
    els.svg.appendChild(App.tempWire);
    els.canvas.classList.add('linking');
    return;
  }
  /* 2) změna šířky */
  if (resize && nodeEl) {
    ev.preventDefault();
    const n = getNode(nodeEl.dataset.id);
    lastSnap = snapshot();
    gesture = { type: 'resize', id: n.id, sx: ev.clientX, w0: n.w, moved: false };
    return;
  }
  /* 3) vazba – výběr */
  if (hit) {
    const eid = hit.dataset.id;
    if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
      if (App.selEdges.has(eid)) App.selEdges.delete(eid); else App.selEdges.add(eid);
      refreshSelection();
    } else {
      setSelEdges(eid, false);
    }
    gesture = { type: 'none' };
    return;
  }
  /* 4) buňka */
  if (nodeEl) {
    const id = nodeEl.dataset.id;
    if (App.tool === 'link') {
      const src = App.linkGroup || [];
      if (!src.length) {
        App.linkGroup = [id]; App.linkSticky = false;
        setSel(id); refreshSelection();
        toast('Teď klepni na buňku, se kterou se má spojit');
      } else if (src.length === 1 && src[0] === id) {
        App.linkGroup = []; refreshSelection(); toast('Spojování zrušeno');
      } else {
        const n = addEdges(src, id);
        if (!n) toast('Tyhle buňky už jsou spojené');
        else toast(n + ' ' + plural(n, 'nová vazba', 'nové vazby', 'nových vazeb') +
          (App.linkSticky ? ' · klepni na další buňku nebo Esc' : ''));
        if (App.linkSticky) { renderNodes(); refreshSelection(); }
        else { App.linkGroup = []; setSel(id); }
      }
      gesture = { type: 'none' };
      return;
    }
    if (ev.target.closest('.n-toggle')) { gesture = { type: 'none' }; return; }
    if (ev.target.closest('a')) { gesture = { type: 'none' }; return; }
    if (ev.target.closest('.md-cb')) { gesture = { type: 'none' }; return; }

    /* Myš a prst se chovají každý po svém – rozlišujeme podle typu události. */
    const touch = isTouchPointer(ev);
    const selected = App.sel.has(id);

    const beginDrag = () => {
      ev.preventDefault();
      try { const sel = getSelection(); if (sel && sel.removeAllRanges) sel.removeAllRanges(); } catch (e) {}
      lastSnap = snapshot();
      const start = {};
      App.sel.forEach((sid) => { const n = getNode(sid); if (n) start[sid] = { x: n.x, y: n.y }; });
      gesture = { type: 'drag', sx: ev.clientX, sy: ev.clientY, start, moved: false, id };
      nodeEl.classList.add('dragging');
    };

    /* ============ PRST / PERO ============
       Nevybraná buňka se chová jako plátno (tažením se posouvá mapa, ťuknutí ji vybere),
       vybranou buňku pak jde chytit kdekoli – za nadpis, poznámku i obrázek. */
    if (touch) {
      if (!selected) {
        gesture = { type: 'pan', sx: ev.clientX, sy: ev.clientY,
          vx: view().x, vy: view().y, tapNode: id, moved: false };
        els.canvas.classList.add('panning');
        return;
      }
      if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
        App.sel.delete(id); refreshSelection();
        gesture = { type: 'none' };
        return;
      }
      if (editingEl) { gesture = { type: 'none' }; return; }
      beginDrag();
      return;
    }

    /* ============ MYŠ ============
       Buňka se dá táhnout rovnou a za kteroukoli část – za nadpis, poznámku i obrázek.
       Alt + tažení nechá v poznámce označovat text. */
    if (ev.altKey && ev.target.closest('.n-body')) {
      if (!selected) setSel(id, ev.shiftKey);
      gesture = { type: 'none' };
      return;
    }
    if (ev.shiftKey || ev.metaKey || ev.ctrlKey) {
      if (selected) App.sel.delete(id); else App.sel.add(id);
      refreshSelection();
    } else if (!selected) {
      setSel(id);
    }
    if (editingEl) return;
    beginDrag();
    return;
  }
  /* 5) prázdné plátno */
  const marquee = (App.tool === 'select' || ev.shiftKey) && !spaceDown;
  if (marquee) {
    ev.preventDefault();
    const box = document.createElement('div');
    box.className = 'marquee';
    els.canvas.appendChild(box);
    gesture = { type: 'marquee', sx: ev.clientX, sy: ev.clientY, box,
      base: ev.shiftKey ? Array.from(App.sel) : [],
      baseE: ev.shiftKey ? Array.from(App.selEdges) : [] };
  } else {
    if (!ev.shiftKey) { clearSel(); App.linkGroup = []; }
    gesture = { type: 'pan', sx: ev.clientX, sy: ev.clientY, vx: view().x, vy: view().y };
    els.canvas.classList.add('panning');
  }
}

function onPointerMove(ev) {
  App.lastPointer = { x: ev.clientX, y: ev.clientY };
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  if (pinch && pointers.size === 2) {
    const [a, b] = Array.from(pointers.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const v = view();
    const z = clamp(pinch.z * (d / pinch.d), 0.12, 3.5);
    const r = els.canvas.getBoundingClientRect();
    v.x = (cx - r.left) - ((pinch.cx - r.left) - pinch.vx) * (z / pinch.z);
    v.y = (cy - r.top) - ((pinch.cy - r.top) - pinch.vy) * (z / pinch.z);
    v.zoom = z;
    applyView();
    return;
  }
  if (!gesture) return;
  const g = gesture;

  if (g.type === 'pan') {
    const v = view();
    if (Math.abs(ev.clientX - g.sx) + Math.abs(ev.clientY - g.sy) > 8) g.moved = true;
    v.x = g.vx + (ev.clientX - g.sx);
    v.y = g.vy + (ev.clientY - g.sy);
    applyView();
  } else if (g.type === 'drag') {
    const z = view().zoom;
    const dx = (ev.clientX - g.sx) / z, dy = (ev.clientY - g.sy) / z;
    if (Math.abs(dx) + Math.abs(dy) > 1) g.moved = true;
    for (const id in g.start) {
      const n = getNode(id); if (!n) continue;
      n.x = Math.round(g.start[id].x + dx);
      n.y = Math.round(g.start[id].y + dy);
      const el = nodeEls.get(id);
      if (el) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    }
    renderEdges();
  } else if (g.type === 'resize') {
    const z = view().zoom;
    const n = getNode(g.id); if (!n) return;
    n.w = clamp(Math.round(g.w0 + (ev.clientX - g.sx) / z), 90, 900);
    g.moved = true;
    const el = nodeEls.get(n.id); el.style.width = n.w + 'px';
    App.sizes[n.id] = { w: el.offsetWidth, h: el.offsetHeight };
    renderEdges();
  } else if (g.type === 'link') {
    g.moved = true;
    const from = getNode(g.from);
    const p = screenToWorld(ev.clientX, ev.clientY);
    const a = anchor(nodeRect(from), p.x, p.y, nodeRadius(from));
    App.tempWire.setAttribute('d', 'M' + a.x + ',' + a.y + ' L' + p.x + ',' + p.y);
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const t = over && over.closest('.node');
    $$('.node.drop').forEach((e) => e.classList.remove('drop'));
    if (t && t.dataset.id !== g.from) t.classList.add('drop');
  } else if (g.type === 'marquee') {
    const x1 = Math.min(g.sx, ev.clientX), y1 = Math.min(g.sy, ev.clientY);
    const x2 = Math.max(g.sx, ev.clientX), y2 = Math.max(g.sy, ev.clientY);
    const r = els.canvas.getBoundingClientRect();
    Object.assign(g.box.style, {
      left: (x1 - r.left) + 'px', top: (y1 - r.top) + 'px',
      width: (x2 - x1) + 'px', height: (y2 - y1) + 'px'
    });
    const a = screenToWorld(x1, y1), b = screenToWorld(x2, y2);
    const hits = App.doc.nodes.filter((n) => {
      const s = nodeSize(n);
      return n.x < b.x && n.x + s.w > a.x && n.y < b.y && n.y + s.h > a.y;
    }).map((n) => n.id);
    const rect = { x1: a.x, y1: a.y, x2: b.x, y2: b.y };
    const hitsE = App.doc.edges.filter((e) => {
      const geo = edgeGeometry(e);
      return geo && segmentHitsRect(geo.p1, geo.p2, rect);
    }).map((e) => e.id);
    setSel(g.base.concat(hits), false);
    App.selEdges = new Set(g.baseE.concat(hitsE));
    refreshSelection();
  }
}

function onPointerUp(ev) {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2 && pinch) { pinch = null; viewChanged(); }
  const g = gesture;
  if (!g) return;
  const cancelled = ev.type === 'pointercancel';
  finishGesture();

  if (g.type === 'pan') {
    if (g.tapNode && !g.moved && !cancelled) { setSel(g.tapNode); hintTouchDrag(); }
  } else if (g.type === 'link' && !cancelled) {
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const t = over && over.closest('.node');
    if (t && t.dataset.id !== g.from) {
      addEdge(g.from, t.dataset.id);
    } else if (g.moved && !t && over && over.closest('#canvas') && !over.closest('.toolbar,.zoombar,.syncbar')) {
      const p = screenToWorld(ev.clientX, ev.clientY);
      pushUndo();
      const n = newNode(p.x - NODE_W / 2, p.y - 18, '');
      App.doc.nodes.push(n);
      App.doc.edges.push(newEdge(g.from, n.id));
      renderNodes(); setSel(n.id); scheduleSave();
      setTimeout(() => editTitle(n), 10);
    }
  }
}

/* ============================================================
   Klávesnice
   ============================================================ */
function isTyping(t) {
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
}

function initKeys() {
  window.addEventListener('keydown', (ev) => {
    if (ev.key === ' ' && !isTyping(ev.target)) { spaceDown = true; }
    const mod = ev.ctrlKey || ev.metaKey;

    if (editingEl) {
      if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); stopEditTitle(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); stopEditTitle(false); }
      return;
    }
    if (mod && ev.key.toLowerCase() === 's') { ev.preventDefault(); manualSave(); return; }
    if (isTyping(ev.target)) return;
    if ($('#editor').classList.contains('hidden')) return;

    if (mod && ev.key.toLowerCase() === 'z') {
      ev.preventDefault(); ev.shiftKey ? redo() : undo(); return;
    }
    if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
    if (mod && ev.key.toLowerCase() === 'd') { ev.preventDefault(); duplicateSelection(); return; }
    if (mod && ev.key.toLowerCase() === 'a') {
      ev.preventDefault();
      setSel(App.doc.nodes.map((n) => n.id));
      App.selEdges = new Set(App.doc.edges.map((e) => e.id));
      refreshSelection();
      return;
    }
    if (mod && ev.key.toLowerCase() === 'i') { ev.preventDefault(); toggleInspector(); return; }

    switch (ev.key) {
      case 'Delete': case 'Backspace':
        ev.preventDefault(); deleteSelection(); break;
      case 'Escape':
        hideContextMenu();
        if (App.linkGroup && App.linkGroup.length) {
          App.linkGroup = []; App.linkSticky = false; refreshSelection(); toast('Spojování zrušeno');
        } else clearSel();
        break;
      case 'Enter': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) { ev.preventDefault(); editTitle(n); }
        break;
      }
      case 'Tab': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) {
          ev.preventDefault();
          pushUndo();
          const s = nodeSize(n);
          const child = newNode(n.x + s.w + 70, n.y, '');
          App.doc.nodes.push(child);
          App.doc.edges.push(newEdge(n.id, child.id));
          renderNodes(); setSel(child.id); scheduleSave();
          setTimeout(() => editTitle(child), 10);
        }
        break;
      }
      case 'f': case 'F': fitView(true); break;
      case 'e': case 'E': {
        const n = getNode(Array.from(App.sel)[0]);
        if (n) toggleContent(n);
        break;
      }
      case '+': case '=': { const c = canvasCenter(); zoomAt(c.x, c.y, 1.2); break; }
      case '-': case '_': { const c = canvasCenter(); zoomAt(c.x, c.y, 1 / 1.2); break; }
      case '0': if (!mod) { const c = canvasCenter(); zoomAt(c.x, c.y, 1 / view().zoom); } break;
      case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': {
        if (!App.sel.size) return;
        ev.preventDefault();
        const step = ev.shiftKey ? 1 : 10;
        const dx = (ev.key === 'ArrowLeft' ? -step : ev.key === 'ArrowRight' ? step : 0);
        const dy = (ev.key === 'ArrowUp' ? -step : ev.key === 'ArrowDown' ? step : 0);
        pushUndo();
        App.sel.forEach((id) => { const n = getNode(id); if (n) { n.x += dx; n.y += dy; } });
        renderNodes(); scheduleSave();
        break;
      }
    }
  });
  window.addEventListener('keyup', (ev) => { if (ev.key === ' ') spaceDown = false; });
}

/* ---- 45-images.js ---- */
/* ============================================================
   Obrázky: vkládání do buněk a výběr z telefonu
   ------------------------------------------------------------
   Jedna cesta pro všechny zdroje (galerie, foťák, schránka,
   přetažení, Ctrl+V, „Sdílet“ z jiné aplikace):
     soubor -> zmenšení -> do vybrané buňky, jinak nová buňka.

   Webová stránka nesmí sama nahlížet do galerie telefonu. Jsou
   proto tři způsoby, jak se k čerstvé fotce dostat:
   1) Galerie – systémový výběr Androidu, nejnovější snímky
      (i snímky obrazovky) jsou v něm nahoře.
   2) Připojená složka s fotkami – stačí ji jednou povolit a
      poslední snímky se pak ukazují rovnou v nabídce.
   3) Sdílet -> Myšlenkové mapy (když je aplikace nainstalovaná
      na ploše) – obrázek počká v nabídce jako „přijatý“.
   ============================================================ */

const IMG_EXT = /\.(png|jpe?g|webp|gif|avif|bmp|svg)$/i;
function isImageFile(f) { return !!f && (/^image\//.test(f.type || '') || IMG_EXT.test(f.name || '')); }

/** vloží hotové obrázky (data URL): první do cílové buňky, ostatní jako nové buňky vedle */
async function insertImageData(urls, opts) {
  opts = opts || {};
  if (!urls.length || !App.doc) return 0;
  const dims = [];
  for (const u of urls) dims.push(await imageDims(u));
  const target = opts.nodeId ? getNode(opts.nodeId) : null;
  pushUndo();
  const made = [];
  let i = 0, x, y, centered = false;
  if (target) {
    target.image = urls[0]; i = 1;
    const s = nodeSize(target);
    x = target.x + s.w + 40; y = target.y;
  } else {
    let at = opts.at;
    if (!at) { const c = canvasCenter(); at = screenToWorld(c.x, c.y); }
    x = at.x; y = at.y - 60; centered = true;
  }
  for (; i < urls.length; i++) {
    const w = widthForImage(dims[i]);
    const n = newNode(centered ? x - w / 2 : x, y, (opts.titles && opts.titles[i]) || '');
    centered = false;
    n.image = urls[i]; n.w = w;
    App.doc.nodes.push(n);
    made.push(n.id);
    x = n.x + w + 30;
  }
  renderNodes();
  if (target) { if (!App.sel.has(target.id)) setSel(target.id); }
  else setSel(made);
  scheduleSave();
  updateInspector(true);
  return urls.length;
}

/** soubory (nebo Bloby) -> zmenšit -> vložit. Vrací počet vložených obrázků. */
async function insertImageFiles(files, opts) {
  opts = opts || {};
  const all = Array.from(files || []);
  const list = all.filter(isImageFile).slice(0, 12);
  if (!list.length) { if (all.length) toast('Tohle není obrázek, který umím vložit', 3500); return 0; }
  toast(list.length > 1 ? 'Zpracovávám ' + list.length + ' ' + plural(list.length, 'obrázek', 'obrázky', 'obrázků') + '…'
    : 'Zpracovávám obrázek…', 20000);
  const urls = [], titles = [];
  let bad = 0;
  for (const f of list) {
    try {
      urls.push(await imageToDataURL(f));
      titles.push(opts.useNames ? String(f.name || '').replace(/\.[^.]+$/, '') : '');
    } catch (e) { console.warn('obrázek se nepodařilo načíst', f && f.name, e); bad++; }
  }
  if (!urls.length) {
    toast('Obrázek se nepodařilo načíst – tenhle formát prohlížeč neumí (HEIC?). Zkus snímek obrazovky nebo JPG.', 6000);
    return 0;
  }
  const single = urls.length === 1;
  const intoNode = !!(opts.nodeId && getNode(opts.nodeId));
  await insertImageData(urls, { nodeId: opts.nodeId, at: opts.at, titles });
  toast((single ? (intoNode ? 'Obrázek je v buňce' : 'Obrázek vložen jako nová buňka')
    : 'Vloženo ' + urls.length + ' ' + plural(urls.length, 'obrázek', 'obrázky', 'obrázků')) +
    (bad ? ' · ' + bad + ' se nepodařilo načíst' : ''), 3000);
  return urls.length;
}

/* ------------------------------------------------------------
   Obrázky přijaté přes „Sdílet“ (ukládá je service worker)
   ------------------------------------------------------------ */
const Inbox = {
  NAME: 'mm-shared',
  ok() { return typeof caches !== 'undefined'; },
  async list() {
    if (!this.ok()) return [];
    try {
      const c = await caches.open(this.NAME);
      const keys = await c.keys();
      return keys.slice().sort((a, b) => (a.url < b.url ? 1 : -1));
    } catch (e) { return []; }
  },
  async blob(req) {
    const c = await caches.open(this.NAME);
    const r = await c.match(req);
    return r ? r.blob() : null;
  },
  async remove(req) { try { const c = await caches.open(this.NAME); await c.delete(req); } catch (e) { /* nevadí */ } },
  async clear() { try { await caches.delete(this.NAME); } catch (e) { /* nevadí */ } }
};

/* ------------------------------------------------------------
   Připojené složky s fotkami (File System Access API)
   ------------------------------------------------------------ */
const PHOTO_EXT = /\.(png|jpe?g|webp|gif|avif|bmp)$/i;

/** datum schované ve jméně souboru (IMG_20261010_175745.jpg, Screenshot_2026-10-10-17-57-45.png…) */
function photoNameKey(name) {
  const m = /(20\d\d)[-_. ]?([01]\d)[-_. ]?([0-3]\d)(?:[-_. T]?([0-2]\d)[-_.: ]?([0-5]\d)[-_.: ]?([0-5]\d))?/.exec(name);
  return m ? m[1] + m[2] + m[3] + (m[4] || '00') + (m[5] || '00') + (m[6] || '00') : '';
}

const PhotoDirs = {
  supported: typeof window.showDirectoryPicker === 'function',
  dirs: null,                   // [{handle, name}]
  SCAN_MS: 3500,                // déle než tohle se složkou nezdržujeme
  SCAN_MAX: 8000,
  EXACT_MAX: 250,               // do tolika souborů čteme přesné datum u všech

  async load() {
    if (this.dirs) return this.dirs;
    let d = null;
    try { d = await IDB.get('kv', 'photoDirs'); } catch (e) { d = null; }
    this.dirs = Array.isArray(d) ? d.filter((x) => x && x.handle) : [];
    return this.dirs;
  },
  async save() { await IDB.set('kv', 'photoDirs', this.dirs); },

  async add() {
    let h;
    try { h = await window.showDirectoryPicker({ id: 'mm-photos', mode: 'read', startIn: 'pictures' }); }
    catch (e) {
      if (e && e.name === 'AbortError') throw e;
      h = await window.showDirectoryPicker({ mode: 'read' });       // některá zařízení neznají startIn
    }
    await this.load();
    for (const d of this.dirs) {
      try { if (await d.handle.isSameEntry(h)) return d; } catch (e) { /* nevadí */ }
    }
    const item = { handle: h, name: h.name };
    this.dirs.push(item);
    await this.save();
    return item;
  },
  async remove(i) { await this.load(); this.dirs.splice(i, 1); await this.save(); },

  /** 'none' = žádná složka, 'prompt' = je potřeba znovu povolit, 'granted' = můžeme číst */
  async state(ask) {
    await this.load();
    if (!this.dirs.length) return 'none';
    let granted = 0;
    for (const d of this.dirs) {
      try {
        let p = d.handle.queryPermission ? await d.handle.queryPermission({ mode: 'read' }) : 'granted';
        if (p !== 'granted' && ask && d.handle.requestPermission) p = await d.handle.requestPermission({ mode: 'read' });
        d.ok = p === 'granted';
        if (d.ok) granted++;
      } catch (e) { d.ok = false; }
    }
    return granted ? 'granted' : 'prompt';
  },

  /** nejnovější snímky ze všech povolených složek */
  async recent(max) {
    await this.load();
    const N = max || 24;
    const picked = [];
    let truncated = false;
    for (const d of this.dirs) {
      if (!d.ok) continue;
      const names = [];
      const t0 = performance.now();
      try {
        for await (const [name, h] of d.handle.entries()) {
          if (h.kind !== 'file' || !PHOTO_EXT.test(name) || name.charAt(0) === '.') continue;
          names.push([name, h]);
          if (names.length >= this.SCAN_MAX || performance.now() - t0 > this.SCAN_MS) { truncated = true; break; }
        }
      } catch (e) { console.warn('složku s fotkami se nepodařilo přečíst', d.name, e); continue; }
      if (names.length > this.EXACT_MAX) {
        /* velká složka: zeptat se na datum každého souboru by trvalo dlouho. Foťák i snímky
           obrazovky mají datum ve jméně, takže kandidáty vybereme podle něj. */
        names.sort((a, b) => {
          const ka = photoNameKey(a[0]), kb = photoNameKey(b[0]);
          if (ka !== kb) return ka < kb ? 1 : -1;
          return a[0] < b[0] ? 1 : -1;
        });
        names.length = Math.min(names.length, N * 2);
      }
      const files = await Promise.all(names.map(async (p) => {
        try { const f = await p[1].getFile(); return { name: p[0], file: f, t: f.lastModified, dir: d.name }; }
        catch (e) { return null; }
      }));
      files.forEach((f) => { if (f && f.file.size > 0) picked.push(f); });
    }
    picked.sort((a, b) => b.t - a.t);
    return { items: picked.slice(0, N), truncated };
  }
};

};

const ImageSheet = {
  el: null,
  nodeId: null,
  at: null,
  run: 0,                         // číslo otevření – starší načítání náhledů se podle něj zahodí
  busy: false,
  thumbCache: new Map(),

  isOpen() { return !!(this.el && !this.el.classList.contains('hidden')); },

  build() {
    const el = document.createElement('div');
    el.className = 'sheet-scrim hidden';
    el.id = 'imgSheet';
    el.innerHTML =
      '<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="isTitle">' +
        '<div class="drag-handle"></div>' +
        '<header class="sheet-head">' +
          '<div class="sheet-ttl"><div class="eyebrow" id="isEyebrow"></div><h2 id="isTitle">Vložit obrázek</h2></div>' +
          '<button class="btn ghost icon" id="isClose" title="Zavřít" aria-label="Zavřít">' + SHEET_ICONS.close + '</button>' +
        '</header>' +
        '<div class="sheet-body">' +
          '<div class="picks">' +
            '<button class="pick" id="isGallery" type="button"><i class="mark sq">' + SHEET_ICONS.gallery + '</i><b>Galerie</b><span>fotky a snímky obrazovky</span></button>' +
            '<button class="pick" id="isCamera" type="button"><i class="mark">' + SHEET_ICONS.camera + '</i><b>Vyfotit</b><span>otevře fotoaparát</span></button>' +
            '<button class="pick" id="isClip" type="button"><i class="mark sq">' + SHEET_ICONS.clip + '</i><b>Ze schránky</b><span>zkopírovaný obrázek</span></button>' +
          '</div>' +
          '<div id="isInbox"></div>' +
          '<div id="isRecent"></div>' +
          '<p class="tiny sheet-note" id="isNote"></p>' +
        '</div>' +
      '</section>';
    document.body.appendChild(el);
    this.el = el;

    el.addEventListener('click', (e) => { if (e.target === el) this.close(); });
    el.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.stopPropagation(); this.close(); } });
    $('#isClose', el).addEventListener('click', () => this.close());

    /* systémový výběr: na Androidu je to galerie s nejnovějšími snímky nahoře */
    const pick = $('#imgPick'), cam = $('#imgCamera');
    $('#isGallery', el).addEventListener('click', () => {
      pick.value = '';
      pick.multiple = !this.nodeId;          // do jedné buňky jeden obrázek, na plátno klidně víc
      pick.click();
    });
    $('#isCamera', el).addEventListener('click', () => { cam.value = ''; cam.click(); });
    const onPicked = (inp) => async () => {
      const files = Array.from(inp.files || []);
      inp.value = '';
      if (files.length) await this.use(files);
    };
    pick.addEventListener('change', onPicked(pick));
    cam.addEventListener('change', onPicked(cam));

    $('#isClip', el).addEventListener('click', async () => {
      try {
        const items = await navigator.clipboard.read();
        for (const it of items) {
          const type = it.types.find((t) => /^image\//.test(t));
          if (type) { await this.use([await it.getType(type)]); return; }
        }
        toast('Ve schránce teď není žádný obrázek', 3500);
      } catch (e) {
        toast('Ke schránce se nedostanu – povol ji v prohlížeči, nebo použij Galerii', 4500);
      }
    });
  },

  open(nodeId, at) {
    if (!App.doc) return;
    if (!this.el) this.build();
    if (nodeId === undefined) nodeId = App.sel.size === 1 ? Array.from(App.sel)[0] : null;
    const n = nodeId ? getNode(nodeId) : null;
    this.nodeId = n ? n.id : null;
    this.at = at || null;
    this.run++;
    const name = n ? (n.title || '').trim().replace(/\s+/g, ' ') : '';
    $('#isEyebrow', this.el).textContent = n
      ? (name ? 'Do buňky „' + (name.length > 28 ? name.slice(0, 27) + '…' : name) + '“' : 'Do vybrané buňky')
      : 'Nová buňka s obrázkem';
    $('#isTitle', this.el).textContent = n && n.image ? 'Vyměnit obrázek' : 'Vložit obrázek';
    const coarse = isCoarse();
    $('#isCamera', this.el).classList.toggle('hidden', !coarse);
    $('#isClip', this.el).classList.toggle('hidden', !(navigator.clipboard && navigator.clipboard.read));
    $('#isGallery b', this.el).textContent = coarse ? 'Galerie' : 'Vybrat soubor';
    $('#isGallery span', this.el).textContent = coarse ? 'fotky a snímky obrazovky' : 'obrázek z počítače';
    $('#isNote', this.el).textContent = coarse ? ''
      : 'Obrázek jde do mapy i přetáhnout myší nebo vložit přes Ctrl+V.';
    this.el.classList.remove('hidden');
    document.body.classList.add('sheet-open');
    Nav.push('sheet');
    this.renderInbox();
    this.renderRecent(false);
    setTimeout(() => { const b = $('#isGallery', this.el); if (b && !isCoarse()) b.focus(); }, 40);
  },

  /** zavření z rozhraní – přes historii, ať tlačítko Zpět dělá totéž */
  close() {
    this.hide();
    if (Nav.is('sheet')) { Nav.skip = true; history.back(); }
  },
  hide() {
    if (this.el) this.el.classList.add('hidden');
    document.body.classList.remove('sheet-open');
    this.run++; this.busy = false;
  },

  /** vloží vybrané soubory a nabídku zavře */
  async use(files) {
    if (this.busy) return 0;
    this.busy = true;
    let n = 0;
    try { n = await insertImageFiles(files, { nodeId: this.nodeId, at: this.at }); }
    finally { this.busy = false; }
    if (n) this.close();
    return n;
  },

  heading(txt, extra) {
    const h = document.createElement('div');
    h.className = 'sheet-h';
    const s = document.createElement('span'); s.textContent = txt; h.appendChild(s);
    if (extra) h.appendChild(extra);
    return h;
  },

  /** dlaždice s náhledem; fetchBlob se zavolá až při klepnutí nebo kreslení náhledu */
  tile(key, label, getBlob, onUse) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'thumb loading';
    b.title = label; b.setAttribute('aria-label', label);
    const run = this.run;
    const paint = (src) => {
      if (run !== this.run) return;
      const img = document.createElement('img');
      img.alt = ''; img.decoding = 'async'; img.src = src;
      b.appendChild(img); b.classList.remove('loading');
    };
    b._load = async () => {
      if (this.thumbCache.has(key)) { paint(this.thumbCache.get(key)); return; }
      try {
        const blob = await getBlob();
        if (!blob) throw new Error('prázdný');
        const src = await imageThumb(blob, 200);
        if (this.thumbCache.size > 120) this.thumbCache.clear();
        this.thumbCache.set(key, src);
        paint(src);
      } catch (e) { b.classList.remove('loading'); b.classList.add('broken'); b.disabled = true; }
    };
    b.addEventListener('click', async () => {
      if (this.busy) return;
      b.classList.add('picked');
      try {
        const blob = await getBlob();
        const n = blob ? await this.use([blob]) : 0;
        if (n && onUse) onUse();
      } finally { b.classList.remove('picked'); }
    });
    return b;
  },

  /** náhledy kreslíme postupně po dvou, ať telefon nedekóduje třicet fotek naráz */
  async loadTiles(tiles) {
    const run = this.run;
    let i = 0;
    const worker = async () => {
      while (i < tiles.length && run === this.run) { const t = tiles[i++]; await t._load(); }
    };
    await Promise.all([worker(), worker()]);
  },

  async renderInbox() {
    const box = $('#isInbox', this.el);
    const run = this.run;
    const reqs = await Inbox.list();
    if (run !== this.run) return;
    box.textContent = '';
    if (!reqs.length) return;
    const clear = document.createElement('button');
    clear.type = 'button'; clear.className = 'btn ghost sm'; clear.textContent = 'Zahodit';
    clear.addEventListener('click', async () => { await Inbox.clear(); this.renderInbox(); });
    box.appendChild(this.heading('Přijaté přes Sdílet', clear));
    const grid = document.createElement('div');
    grid.className = 'thumbgrid';
    const tiles = reqs.slice(0, 12).map((req) => {
      let cached = null;
      const get = async () => {
        if (!cached) {
          const b = await Inbox.blob(req);
          /* typ si bereme z hlavičky uložené odpovědi; když chybí, je to pořád obrázek */
          cached = b && !/^image\//.test(b.type) ? new Blob([b], { type: 'image/jpeg' }) : b;
        }
        return cached;
      };
      return this.tile(req.url, 'Přijatý obrázek', get, () => Inbox.remove(req));
    });
    tiles.forEach((t) => grid.appendChild(t));
    box.appendChild(grid);
    this.loadTiles(tiles);
  },

  async renderRecent(ask) {
    const box = $('#isRecent', this.el);
    const run = this.run;
    if (!PhotoDirs.supported) { box.textContent = ''; return; }
    let st = 'none';
    try { st = await PhotoDirs.state(ask); } catch (e) { st = 'none'; }
    if (run !== this.run) return;
    box.textContent = '';

    const addBtn = (label, cls) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ' + (cls || ''); b.textContent = label;
      b.addEventListener('click', async () => {
        try { await PhotoDirs.add(); this.run++; this.renderRecent(true); }
        catch (e) {
          if (!(e && e.name === 'AbortError')) toast('Složku se nepodařilo připojit – zkus jinou (třeba Pictures/Screenshots)', 5000);
        }
      });
      return b;
    };

    if (st === 'none') {
      if (!isCoarse()) return;                  // na počítači stačí výběr souboru, přetažení a Ctrl+V
      const hint = document.createElement('div');
      hint.className = 'box fill sheet-hint';
      hint.innerHTML = '<h4>Poslední fotky rovnou tady</h4>' +
        '<p>Jednou vyber složku, kam telefon ukládá snímky (třeba <b>DCIM/Camera</b> nebo ' +
        '<b>Pictures/Screenshots</b>). Příště tu uvidíš ty nejnovější a vložíš je jedním klepnutím.</p>';
      hint.appendChild(addBtn('Připojit složku s fotkami', ''));
      box.appendChild(hint);
      return;
    }

    const manage = document.createElement('button');
    manage.type = 'button'; manage.className = 'btn ghost sm'; manage.textContent = 'Složky';
    manage.addEventListener('click', () => this.renderFolders());
    box.appendChild(this.heading('Poslední fotky a snímky obrazovky', manage));

    if (st === 'prompt') {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn'; b.style.width = '100%';
      b.textContent = 'Zobrazit poslední fotky';
      b.addEventListener('click', () => { this.run++; this.renderRecent(true); });
      box.appendChild(b);
      const p = document.createElement('p');
      p.className = 'tiny'; p.textContent = 'Prohlížeč chce přístup ke složce po každém spuštění potvrdit znovu.';
      box.appendChild(p);
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'thumbgrid';
    for (let k = 0; k < 8; k++) { const ph = document.createElement('div'); ph.className = 'thumb loading'; grid.appendChild(ph); }
    box.appendChild(grid);
    let res;
    try { res = await PhotoDirs.recent(24); } catch (e) { res = { items: [], truncated: false }; }
    if (run !== this.run) return;
    grid.textContent = '';
    if (!res.items.length) {
      grid.remove();
      const p = document.createElement('p');
      p.className = 'tiny'; p.textContent = 'V připojených složkách jsem nenašel žádné obrázky. Zkus přidat jinou složku.';
      box.appendChild(p);
      return;
    }
    const tiles = res.items.map((it) => this.tile(it.dir + '/' + it.name + ':' + it.t + ':' + it.file.size,
      it.name + ' · ' + fmtDate(it.t), async () => it.file));
    tiles.forEach((t) => grid.appendChild(t));
    if (res.truncated) {
      const p = document.createElement('p');
      p.className = 'tiny'; p.textContent = 'Složka je hodně velká, prošel jsem jen její část. Rychlejší bývá menší složka (třeba jen Screenshots).';
      box.appendChild(p);
    }
    this.loadTiles(tiles);
  },

  /** správa připojených složek */
  async renderFolders() {
    const box = $('#isRecent', this.el);
    this.run++;
    await PhotoDirs.load();
    box.textContent = '';
    const back = document.createElement('button');
    back.type = 'button'; back.className = 'btn ghost sm'; back.textContent = 'Hotovo';
    back.addEventListener('click', () => { this.run++; this.renderRecent(false); });
    box.appendChild(this.heading('Složky s fotkami', back));
    const list = document.createElement('div');
    list.className = 'folderlist';
    PhotoDirs.dirs.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'row';
      const nm = document.createElement('span');
      nm.className = 'spacer'; nm.textContent = d.name;
      const rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'btn sm'; rm.textContent = 'Odpojit';
      rm.addEventListener('click', async () => { await PhotoDirs.remove(i); this.renderFolders(); });
      row.innerHTML = SHEET_ICONS.folder;
      row.appendChild(nm); row.appendChild(rm);
      list.appendChild(row);
    });
    box.appendChild(list);
    const add = document.createElement('button');
    add.type = 'button'; add.className = 'btn'; add.style.width = '100%';
    add.textContent = 'Přidat další složku';
    add.addEventListener('click', async () => {
      try { await PhotoDirs.add(); this.renderFolders(); }
      catch (e) { if (!(e && e.name === 'AbortError')) toast('Složku se nepodařilo připojit', 4000); }
    });
    box.appendChild(add);
  }
};

/** nodeId: undefined = podle výběru, null = vždy nová buňka; at = kam (souřadnice mapy) */
function openImageSheet(nodeId, at) { ImageSheet.open(nodeId, at); }

/* ------------------------------------------------------------
   Tlačítko Zpět (hlavně na Androidu): zavře nabídku, z mapy vrátí do knihovny
   ------------------------------------------------------------ */
const Nav = {
  skip: false,
  push(name) { try { if (!this.is(name)) history.pushState({ mm: name }, ''); } catch (e) { /* nevadí */ } },
  is(name) { try { return !!(history.state && history.state.mm === name); } catch (e) { return false; } },
  back(name) { if (this.is(name)) { history.back(); return true; } return false; },
  init() {
    window.addEventListener('popstate', () => {
      if (this.skip) { this.skip = false; return; }      // zavření nabídky z rozhraní – už je hotovo
      if (ImageSheet.isOpen() && !this.is('sheet')) { ImageSheet.hide(); return; }
      if (!$('#editor').classList.contains('hidden') && !this.is('editor') && !this.is('sheet')) showLibrary(true);
    });
  }
};
/* ---- 50-inspector.js ---- */
/* ============================================================
   Panel detailu (buňka / vazba / mapa) + kontextová nabídka
   ============================================================ */

let inspKey = '';
let inspOpen = false;

const EDGE_STYLES = [{ id: 'solid', label: 'Plná' }, { id: 'dashed', label: 'Čárkovaná' }, { id: 'dotted', label: 'Tečkovaná' }];
const EDGE_ARROWS = [{ id: 'none', label: 'Bez' }, { id: 'to', label: 'Jedna' }, { id: 'both', label: 'Obě' }];

function toggleInspector(force) {
  inspOpen = force === undefined ? !inspOpen : force;
  $('#inspector').classList.toggle('hidden', !inspOpen);
  $('#editor').classList.toggle('panel-open', inspOpen);
  $('#tPanel').setAttribute('aria-pressed', String(inspOpen));
  if (inspOpen) { inspKey = ''; updateInspector(); revealSelected(); }
}

/** na mobilu odsune plátno tak, aby vybraná buňka nezůstala pod panelem */
function revealSelected() {
  if (innerWidth > 900 || App.sel.size !== 1) return;
  const n = getNode(Array.from(App.sel)[0]); if (!n) return;
  requestAnimationFrame(() => {
    const panel = $('#inspector').getBoundingClientRect();
    const canvas = els.canvas.getBoundingClientRect();
    const v = view(), s = nodeSize(n);
    const top = n.y * v.zoom + v.y;
    const bottom = top + s.h * v.zoom;
    const limit = panel.top - canvas.top - 12;
    if (bottom > limit) { v.y -= (bottom - limit); applyView(); }
    if (top < 12) { v.y += (12 - top); applyView(); }
  });
}
function openInspector(focus) {
  toggleInspector(true);
  if (focus === 'content') {
    const ta = $('#inspContent');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

function swatchRow(current, onPick) {
  const wrap = document.createElement('div');
  wrap.className = 'swatches';
  COLORS.forEach((c) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.type = 'button';
    b.title = c.label;
    b.setAttribute('aria-pressed', String(c.id === current));
    b.style.background = c.hex || 'var(--bg-3)';
    if (!c.hex) b.style.backgroundImage = 'linear-gradient(135deg,transparent 46%,var(--fg-3) 46%,var(--fg-3) 54%,transparent 54%)';
    b.addEventListener('click', () => {
      $$('.sw', wrap).forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onPick(c.id);
    });
    wrap.appendChild(b);
  });
  return wrap;
}

function segRow(options, current, onPick) {
  const seg = document.createElement('div');
  seg.className = 'seg';
  options.forEach((o) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = o.label;
    b.setAttribute('aria-pressed', String(o.id === current));
    b.addEventListener('click', () => {
      $$('button', seg).forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onPick(o.id);
    });
    seg.appendChild(b);
  });

}

function sectionHead(body, txt) {
  const d = document.createElement('div');
  d.className = 'label';
  d.textContent = txt; body.appendChild(d);
  return d;
}

function fieldWrap(label, control) {
  const l = document.createElement('label');
  l.className = 'field';
  const s = document.createElement('span'); s.textContent = label;
  l.appendChild(s); l.appendChild(control);
  return l;
}

function updateInspector(force) {
  if (!inspOpen || !App.doc) return;
  const body = $('#inspBody');
  const ns = Array.from(App.sel), es = Array.from(App.selEdges);
  const key = 'n:' + ns.join(',') + '|e:' + es.join(',');
  if (key === inspKey && !force) return;
  inspKey = key;
  if (!editingEl && !gesture) endTextEdit();        // rozepsané pole zmizí – uzavři jeho krok zpět
  body.textContent = '';

  const t = $('#inspTitle');
  if (!ns.length && !es.length) { t.textContent = 'Mapa'; buildDocInspector(body); return; }
  if (ns.length === 1 && !es.length) { t.textContent = 'Buňka'; buildNodeInspector(body, getNode(ns[0])); return; }
  if (!ns.length && es.length === 1) { t.textContent = 'Vazba'; buildEdgeInspector(body, getEdge(es[0])); return; }

  const parts = [];
  if (ns.length) parts.push(ns.length + ' ' + plural(ns.length, 'buňka', 'buňky', 'buněk'));
  if (es.length) parts.push(es.length + ' ' + plural(es.length, 'vazba', 'vazby', 'vazeb'));
  t.textContent = parts.join(' + ');
  buildBulkInspector(body, ns, es);
}

/* ---------- hromadná úprava výběru (buňky i vazby) ---------- */
function buildBulkInspector(body, ns, es) {
  const h = (txt) => {
    const d = document.createElement('div');
    d.className = 'label';
    d.textContent = txt; body.appendChild(d);
  };
  const mk = (label, fn, cls) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls || ''); b.style.width = '100%'; b.style.marginBottom = '8px';
    b.textContent = label; b.addEventListener('click', fn); body.appendChild(b);
  };

  if (ns.length) {
    if (es.length) h(ns.length + ' ' + plural(ns.length, 'buňka', 'buňky', 'buněk'));
    body.appendChild(fieldWrap('Barva buněk', swatchRow(null, (id) => {
      pushUndo(); ns.forEach((i) => { const n = getNode(i); if (n) n.color = id; });
      renderNodes(); scheduleSave();
    })));
    body.appendChild(fieldWrap('Tvar buněk', segRow(SHAPES, null, (id) => {
      pushUndo(); ns.forEach((i) => { const n = getNode(i); if (n) n.shape = id; });
      renderNodes(); scheduleSave();
    })));
    if (ns.length > 1) {
      mk('Spojit řetězem', () => {
        pushUndo();
        for (let i = 0; i < ns.length - 1; i++) {
          if (!App.doc.edges.some((e) => (e.from === ns[i] && e.to === ns[i + 1]) || (e.from === ns[i + 1] && e.to === ns[i])))
            App.doc.edges.push(newEdge(ns[i], ns[i + 1]));
        }
        renderEdges(); scheduleSave();
      });
      mk('Zarovnat vodorovně', () => {
        pushUndo();
        const y = Math.round(ns.reduce((a, i) => a + getNode(i).y, 0) / ns.length);
        ns.forEach((i) => { getNode(i).y = y; });
        renderNodes(); scheduleSave();
      });
      mk('Zarovnat svisle', () => {
        pushUndo();
        const x = Math.round(ns.reduce((a, i) => a + getNode(i).x, 0) / ns.length);
        ns.forEach((i) => { getNode(i).x = x; });
        renderNodes(); scheduleSave();
      });
      mk('Rozmístit do kruhu', () => {
        pushUndo();
        const cx = ns.reduce((a, i) => a + getNode(i).x, 0) / ns.length;
        const cy = ns.reduce((a, i) => a + getNode(i).y, 0) / ns.length;
        const r = Math.max(160, ns.length * 34);
        ns.forEach((i, k) => {
          const a = (k / ns.length) * Math.PI * 2 - Math.PI / 2;
          const n = getNode(i);
          n.x = Math.round(cx + Math.cos(a) * r); n.y = Math.round(cy + Math.sin(a) * r);
        });
        renderNodes(); scheduleSave();
      });
    }
    mk('Nastavit jako výchozí pro nové buňky', () => {
      const n = getNode(ns[0]); if (!n) return;
      App.doc.defaults.node = { color: n.color, shape: n.shape, w: n.w };
      scheduleSave(); toast('Nové buňky budou vypadat takhle');
    });
    mk('Vybrat jejich vazby', () => selectEdgesOf(ns));
  }

  if (es.length) {
    h(es.length + ' ' + plural(es.length, 'vybraná vazba', 'vybrané vazby', 'vybraných vazeb'));
    const each = (fn) => { pushUndo(); es.forEach((i) => { const e = getEdge(i); if (e) fn(e); }); renderEdges(); scheduleSave(); };
    body.appendChild(fieldWrap('Čára', segRow(EDGE_STYLES, null, (id) => each((e) => { e.style = id; }))));
    body.appendChild(fieldWrap('Šipka', segRow(EDGE_ARROWS, null, (id) => each((e) => { e.arrow = id; }))));
    body.appendChild(fieldWrap('Barva vazeb', swatchRow(null, (id) => each((e) => { e.color = id; }))));
    const lab = document.createElement('input');
    lab.className = 'input'; lab.placeholder = 'společný popisek (prázdné = beze změny)';
    lab.addEventListener('change', () => each((e) => { e.label = lab.value; }));
    body.appendChild(fieldWrap('Popisek všech', lab));
    mk('Otočit směr všech', () => each((e) => { const t = e.from; e.from = e.to; e.to = t; }));
    mk('Nastavit jako výchozí pro nové vazby', () => {
      const e = getEdge(es[0]); if (!e) return;
      App.doc.defaults.edge = { style: e.style, arrow: e.arrow, color: e.color };
      scheduleSave(); toast('Nové vazby budou vypadat takhle');
    });
  }

  const del = document.createElement('button');
  del.className = 'btn danger'; del.style.width = '100%'; del.style.marginTop = '6px';
  del.textContent = ns.length && es.length ? 'Smazat celý výběr'
    : ns.length ? 'Smazat vybrané buňky' : 'Smazat vybrané vazby';
  del.addEventListener('click', () => deleteSelection());
  body.appendChild(del);
}

  title.addEventListener('input', () => { n.title = title.value; paintNode(n); measure(); scheduleSave(); });
  title.addEventListener('focus', beginTextEdit);

  const ta = document.createElement('textarea');

  ta.rows = 9;
  ta.addEventListener('focus', beginTextEdit);
  ta.addEventListener('blur', endTextEdit);

  })));

  })));

  const wRow = document.createElement('input');
  wRow.type = 'range'; wRow.min = 110; wRow.max = 560; wRow.step = 5; wRow.value = n.w;

  });
  wRow.addEventListener('change', endTextEdit);
  wRow.addEventListener('blur', endTextEdit);

  const asDef = document.createElement('button');
  asDef.className = 'btn'; asDef.style.width = '100%'; asDef.style.marginBottom = '8px';
  asDef.textContent = 'Nastavit jako výchozí pro nové buňky';
  asDef.addEventListener('click', () => {
    App.doc.defaults.node = { color: n.color, shape: n.shape, w: n.w };
    scheduleSave(); toast('Nové buňky budou vypadat takhle');
  });
  body.appendChild(asDef);

  const del = document.createElement('button');
  del.className = 'btn danger'; del.style.width = '100%';
  del.textContent = 'Smazat buňku';
  del.addEventListener('click', () => deleteSelection());
  body.appendChild(del);

  const deg = App.doc.edges.filter((e) => e.from === n.id || e.to === n.id).length;
  const info = document.createElement('p');
  info.className = 'tiny'; info.style.marginTop = '12px';
  info.textContent = deg + ' ' + plural(deg, 'vazba', 'vazby', 'vazeb') + ' · pozice ' + Math.round(n.x) + ', ' + Math.round(n.y);
  body.appendChild(info);
}

function buildEdgeInspector(body, e) {
  if (!e) return;
  const a = getNode(e.from), b = getNode(e.to);
  const p = document.createElement('p');
  p.className = 'tiny'; p.style.marginTop = '0';
  p.textContent = (a ? a.title || 'Bez názvu' : '?') + '  →  ' + (b ? b.title || 'Bez názvu' : '?');
  body.appendChild(p);

  const lab = document.createElement('input');
  lab.className = 'input'; lab.value = e.label; lab.placeholder = 'např. „vede k“';
  lab.addEventListener('focus', beginTextEdit);
  lab.addEventListener('blur', endTextEdit);
  lab.addEventListener('input', () => { e.label = lab.value; renderEdges(); scheduleSave(); });
  body.appendChild(fieldWrap('Popisek vazby', lab));

  body.appendChild(fieldWrap('Čára', segRow(EDGE_STYLES, e.style,
    (id) => { pushUndo(); e.style = id; renderEdges(); scheduleSave(); })));

  body.appendChild(fieldWrap('Šipka', segRow(EDGE_ARROWS, e.arrow,
    (id) => { pushUndo(); e.arrow = id; renderEdges(); scheduleSave(); })));

  body.appendChild(fieldWrap('Barva', swatchRow(e.color, (id) => {
    pushUndo(); e.color = id; renderEdges(); scheduleSave();
  })));

  const dflt = document.createElement('button');

function buildDocInspector(body) {
  const d = App.doc;

  p.className = 'tiny'; p.style.marginTop = '0';
  p.innerHTML = esc(d.nodes.length + ' ' + plural(d.nodes.length, 'buňka', 'buňky', 'buněk') +
    ' · ' + d.edges.length + ' ' + plural(d.edges.length, 'vazba', 'vazby', 'vazeb')) +
    '<br>Soubor: <code>' + esc(App.entry ? App.entry.name : '—') + '</code>' +
    '<br>Změněno: ' + esc(fmtDate(d.modified));

  const hint = document.createElement('p');
  hint.className = 'tiny';
  hint.textContent = 'Vyber buňku nebo vazbu a tady se objeví její nastavení.';
  body.appendChild(hint);

  /* ---- výchozí vzhled nové buňky ---- */
  sectionHead(body, 'Výchozí vzhled nové buňky');

  const npv = document.createElement('div');
  npv.className = 'npreview';
  npv.innerHTML = '<i></i><b>Nová buňka</b>';

  const drawN = () => {
    const col = colorHex(dn.color);
    npv.className = 'npreview shape-' + dn.shape;
    npv.style.setProperty('--n-color', col || 'transparent');
    npv.style.borderColor = col || '';

  body.appendChild(fieldWrap('Barva', swatchRow(dn.color, (id) => setN('color', id))));
  body.appendChild(fieldWrap('Tvar', segRow(SHAPES, dn.shape, (id) => setN('shape', id))));
  const wr = document.createElement('input');
  wr.type = 'range'; wr.min = 110; wr.max = 560; wr.step = 5; wr.value = dn.w; wr.style.width = '100%';
  wr.addEventListener('input', () => setN('w', Number(wr.value)));
  body.appendChild(fieldWrap('Šířka', wr));

  const applyN = document.createElement('button');
  applyN.className = 'btn'; applyN.style.width = '100%'; applyN.style.marginBottom = '6px';
  applyN.textContent = 'Použít na všechny stávající buňky';
  applyN.addEventListener('click', () => {
    if (!App.doc.nodes.length) { toast('Mapa zatím nemá buňky'); return; }
    pushUndo();
    App.doc.nodes.forEach((n) => { n.color = dn.color; n.shape = dn.shape; n.w = dn.w; });
    renderNodes(); scheduleSave();
    toast('Upraveno ' + App.doc.nodes.length + ' ' + plural(App.doc.nodes.length, 'buňka', 'buňky', 'buněk'));
  });
  body.appendChild(applyN);

  const hd = sectionHead(body, 'Výchozí vzhled nové vazby');

  const de = d.defaults.edge;
  const prev = document.createElement('div');
  prev.style.cssText = 'margin:0 0 10px';
  const drawPrev = () => {
    const col = colorHex(de.color) || 'var(--line-2)';
    const dash = de.style === 'dashed' ? '7 6' : de.style === 'dotted' ? '1 6' : '';
    const head = (x, dir) => '<path d="M' + x + ',12 l' + (9 * dir) + ',-4.5 l0,9 Z" fill="' + col + '"/>';
    prev.innerHTML = '<svg viewBox="0 0 220 24" style="width:100%;height:26px">' +
      '<line x1="14" y1="12" x2="206" y2="12" stroke="' + col + '" stroke-width="2" stroke-linecap="round"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>' +
      (de.arrow === 'to' || de.arrow === 'both' ? head(206, -1) : '') +
      (de.arrow === 'both' ? head(14, 1) : '') + '</svg>';
  };
  drawPrev();
  body.appendChild(prev);

  const setD = (k, v) => { de[k] = v; drawPrev(); scheduleSave(); };
  body.appendChild(fieldWrap('Čára', segRow(EDGE_STYLES, de.style, (id) => setD('style', id))));
  body.appendChild(fieldWrap('Šipka', segRow(EDGE_ARROWS, de.arrow, (id) => setD('arrow', id))));
  body.appendChild(fieldWrap('Barva', swatchRow(de.color, (id) => setD('color', id))));

  const applyAll = document.createElement('button');
  applyAll.className = 'btn'; applyAll.style.width = '100%'; applyAll.style.marginBottom = '14px';
  applyAll.textContent = 'Použít na všechny stávající vazby';

  mk('Sbalit obsah všech buněk', () => toggleAllContent(false));
  mk('Vložit obrázek…', () => openImageSheet(null));
  mk('Uložit teď', () => manualSave());
  mk('Stáhnout jako soubor', () => downloadDoc(App.doc, App.entry ? App.entry.name : null));

}

/* ============================================================
   Kontextová nabídka
   ============================================================ */
let ctxEl = null;
function ctxOutside(ev) { if (ctxEl && !ctxEl.contains(ev.target)) hideContextMenu(); }
function hideContextMenu() {
  if (!ctxEl) return;
  ctxEl.remove(); ctxEl = null;
  document.removeEventListener('pointerdown', ctxOutside, true);
  window.removeEventListener('blur', hideContextMenu);
}

function showContextMenu(x, y, onNode, spot) {
  hideContextMenu();
  const m = document.createElement('div');
  m.className = 'ctxmenu';
  const item = (label, fn, danger) => {
    const b = document.createElement('button');
    b.textContent = label;
    if (danger) b.className = 'danger';
    b.addEventListener('click', () => { hideContextMenu(); fn(); });
    m.appendChild(b);
  };
  const sep = () => m.appendChild(document.createElement('hr'));

  if (App.selEdges.size && !App.sel.size) {
    const es = Array.from(App.selEdges);
    const many = es.length > 1;
    item(many ? 'Upravit ' + es.length + ' vazeb' : 'Upravit vazbu', () => openInspector());
    item('Otočit směr', () => {
      pushUndo();
      es.forEach((i) => { const e = getEdge(i); if (e) { const t = e.from; e.from = e.to; e.to = t; } });
      renderEdges(); scheduleSave();
    });
    if (!many) {
      const e = getEdge(es[0]);
      item('Vybrat všechny vazby těchto buněk', () => selectEdgesOf([e.from, e.to]));
      item('Nastavit jako výchozí pro nové vazby', () => {
        App.doc.defaults.edge = { style: e.style, arrow: e.arrow, color: e.color };
        scheduleSave(); toast('Nové vazby budou vypadat takhle');
      });
    }
    sep();
    item(many ? 'Smazat vazby' : 'Smazat vazbu', () => deleteSelection(), true);
  } else if (onNode && App.sel.size) {
    const single = App.sel.size === 1 ? getNode(Array.from(App.sel)[0]) : null;
    if (single) {
      item('Přejmenovat', () => editTitle(single));
      item(single.open ? 'Skrýt obsah' : 'Ukázat obsah', () => toggleContent(single));
      item('Upravit obsah…', () => openInspector('content'));
      item(single.image ? 'Vyměnit obrázek…' : 'Vložit obrázek…', () => openImageSheet(single.id));
      sep();
    }
    item(App.sel.size > 1 ? 'Vybrat vazby těchto buněk' : 'Vybrat vazby této buňky',
      () => selectEdgesOf(Array.from(App.sel)));
    item('Duplikovat', () => duplicateSelection());
    item('Dopředu', () => {
      pushUndo();
      const sel = App.doc.nodes.filter((n) => App.sel.has(n.id));
      App.doc.nodes = App.doc.nodes.filter((n) => !App.sel.has(n.id)).concat(sel);
      renderNodes(); scheduleSave();
    });
    item('Dozadu', () => {
      pushUndo();
      const sel = App.doc.nodes.filter((n) => App.sel.has(n.id));
      App.doc.nodes = sel.concat(App.doc.nodes.filter((n) => !App.sel.has(n.id)));
      renderNodes(); scheduleSave();
    });
    sep();
    item('Smazat', () => deleteSelection(), true);
  } else {
    const p = spot || screenToWorld(x, y);
    item('Nová buňka sem', () => { const n = addNode(p.x - NODE_W / 2, p.y - 20, { title: '' }); setTimeout(() => editTitle(n), 10); });
    item('Vložit obrázek…', () => openImageSheet(null, p));
    item('Vybrat vše', () => {
      setSel(App.doc.nodes.map((n) => n.id));
      App.selEdges = new Set(App.doc.edges.map((e) => e.id));
      refreshSelection();
    });
    item('Vybrat všechny vazby', () => {
      if (!App.doc.edges.length) { toast('Mapa zatím nemá vazby'); return; }
      setSelEdges(App.doc.edges.map((e) => e.id), false); openInspector();
    });
    sep();
    item('Vycentrovat mapu', () => fitView(true));
    item('Rozbalit vše', () => toggleAllContent(true));
    item('Sbalit vše', () => toggleAllContent(false));
  }

  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  ctxEl = m;
  document.addEventListener('pointerdown', ctxOutside, true);
  window.addEventListener('blur', hideContextMenu);
}
