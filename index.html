/* ============================================================
   Vzhled podle „Tadeášova designu“
   ------------------------------------------------------------
   · jedna akcentní barva: kobaltová #2A4B9B
   · text #14171f, tlumený #5a6172, linky #b9c0ce, podklad boxu #eef1f7
   · písmo Carlito, popisky a čísla DejaVu Sans Mono (prostrkané verzálky)
   · ostré rohy (2 px), tenké linky, silná linka 2,5 px jako oddělovač
     – výjimka na přání: buňky, dolní lišta a zoom mají zaoblené rohy jako v OrgPadu
   · význam nikdy nenese jen barva – vždy i tvar nebo text
   Barvy buněk a vazeb jsou obsah mapy, ne rozhraní – ty si volí uživatel.
   ============================================================ */
:root{
  --bg:#f6f7fa; --bg-2:#ffffff; --bg-3:#eef1f7;
  --fg:#14171f; --fg-2:#4b5262; --fg-3:#6b7385;
  --line:#c8cdd8; --line-2:#b9c0ce;
  --ink:#14171f; --ink-fg:#ffffff; --ink-soft:#9fb2e8;
  --accent:#2A4B9B; --accent-fg:#ffffff; --accent-soft:#dfe5f4;
  --danger:#14171f;
  --canvas:#f6f7fa; --dot:#cfd5e1;
  --shadow-1:none;
  --shadow-2:0 2px 8px rgba(20,23,31,.08);
  --shadow-3:0 14px 34px rgba(20,23,31,.16),0 2px 6px rgba(20,23,31,.08);
  --r-s:2px; --r-m:2px; --r-l:3px;
  --r-node:18px;            /* buňky, dolní lišta a zoom – zaoblení jako v OrgPadu (viz NODE_R ve skriptu) */
  --tap:40px;
  --font:"Carlito","Mapy Sans","Calibri","DejaVu Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"DejaVu Sans Mono","Mapy Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#0f1218; --bg-2:#14171f; --bg-3:#1f2533;
  --fg:#f2f4f8; --fg-2:#b9c0ce; --fg-3:#8a91a1;
  --line:#2c3445; --line-2:#3b4459;
  --ink:#f2f4f8; --ink-fg:#14171f; --ink-soft:#2A4B9B;
  --accent:#9fb2e8; --accent-fg:#14171f; --accent-soft:#263150;
  --danger:#f2f4f8;
  --canvas:#0c0f14; --dot:#252c3a;
  --shadow-2:0 2px 10px rgba(0,0,0,.45);
  --shadow-3:0 16px 38px rgba(0,0,0,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1218; --bg-2:#14171f; --bg-3:#1f2533;
    --fg:#f2f4f8; --fg-2:#b9c0ce; --fg-3:#8a91a1;
    --line:#2c3445; --line-2:#3b4459;
    --ink:#f2f4f8; --ink-fg:#14171f; --ink-soft:#2A4B9B;
    --accent:#9fb2e8; --accent-fg:#14171f; --accent-soft:#263150;
    --danger:#f2f4f8;
    --canvas:#0c0f14; --dot:#252c3a;
    --shadow-2:0 2px 10px rgba(0,0,0,.45);
    --shadow-3:0 16px 38px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-2);color:var(--fg);font-family:var(--font);
  font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;
  overscroll-behavior:none;
}
h1,h2,h3,h4{font-weight:700}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- stavební prvky ---------- */
.eyebrow,.label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);line-height:1.5;font-weight:400;
}
.label{display:block;letter-spacing:.1em;margin:18px 0 8px}
.label:first-child{margin-top:0}
.rule{border:0;border-top:2.5px solid var(--ink);margin:14px 0 18px}
.rule-thin{border:0;border-top:1px solid var(--line);margin:16px 0}
.box{border:1px solid var(--line-2);border-radius:var(--r-s);padding:12px 14px}
.box.fill{background:var(--bg-3)}
.box h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:400;margin:0 0 6px}
.box p{margin:0 0 10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:36px;padding:0 13px;border-radius:var(--r-s);
  background:var(--bg-2);border:1px solid var(--line-2);color:var(--fg);
  font-size:15px;font-weight:400;white-space:nowrap;line-height:1.2;
  transition:background .12s,border-color .12s,color .12s;
}
a.btn{text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--bg-3);border-color:var(--fg-3)}
.btn:active{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bg-3);border-color:transparent}
/* mazání: žádná červená – pozná se podle silného tmavého rámečku a textu */
.btn.danger{border-color:var(--ink);border-width:1.5px;font-weight:700}
.btn.danger:hover{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.ghost.danger{border-color:transparent;font-weight:400}
.btn.icon{width:36px;min-height:36px;padding:0}
.btn.sm{min-height:30px;font-size:14px;padding:0 10px}
.btn[aria-pressed="true"]{background:var(--bg-3);border-color:var(--accent);color:var(--accent);
  box-shadow:inset 0 -2.5px 0 var(--accent)}
.btn:disabled{opacity:.45;pointer-events:none}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.input,.textarea,.select{
  width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:8px 10px;font-size:15px;
}
.textarea{resize:vertical;min-height:120px;font-family:var(--mono);font-size:13px;line-height:1.55}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input[type=range]{accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.sep{width:1px;height:22px;background:var(--line-2);flex:none}
.muted{color:var(--fg-2)}
.tiny{font-size:13.5px;color:var(--fg-3);line-height:1.45}
.tiny strong,.tiny b{color:var(--fg)}
code{font-family:var(--mono);font-size:.84em;background:var(--bg-3);padding:.08em .35em;border-radius:var(--r-s)}

/* ---------- horní lišta ---------- */
.topbar{
  display:flex;align-items:center;gap:8px;padding:8px 12px;flex:none;
  background:var(--bg-2);border-bottom:2.5px solid var(--ink);z-index:30;
  padding-top:max(8px,env(safe-area-inset-top));
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.005em}
.brand svg{width:24px;height:24px;color:var(--accent)}
.doc-title{
  font-weight:700;font-size:16px;border:1px solid transparent;border-radius:var(--r-s);
  padding:5px 8px;background:transparent;max-width:34vw;min-width:60px;
  text-overflow:ellipsis;
}
.doc-title:hover{border-color:var(--line-2)}
.doc-title:focus{border-color:var(--accent);background:var(--bg-2);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
/* stav uložení: plné kolečko = uloženo, prázdné = ukládám, čtvereček = chyba */
.savestate{
  display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 6px;border-radius:var(--r-s);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg-3);white-space:nowrap;
}
.savestate .mark{width:9px;height:9px;flex:none;border:1.6px solid currentColor;border-radius:50%;background:currentColor}
.savestate[data-kind="busy"]{color:var(--accent)}
.savestate[data-kind="busy"] .mark{background:transparent;animation:mmblink 1s ease-in-out infinite}
.savestate[data-kind="err"]{color:var(--ink-fg);background:var(--ink)}
.savestate[data-kind="err"] .mark{border-radius:0}
@keyframes mmblink{50%{opacity:.25}}

/* ---------- knihovna ---------- */
.library{flex:1;overflow:auto;padding:26px 20px 60px;background:var(--bg-2)}
.library.dropping{outline:2.5px dashed var(--accent);outline-offset:-10px;background:var(--bg-3)}
.lib-inner{max-width:1180px;margin:0 auto}
.lib-hero{margin-bottom:0}
.lib-hero h1{font-size:clamp(26px,5vw,34px);line-height:1.2;margin:3px 0 6px;letter-spacing:-.01em}
.lib-hero p{margin:0;color:var(--fg-2);max-width:66ch;font-size:16px}
.folderbar{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-s);
  padding:10px 12px;margin-bottom:18px;
}
.folderbar .path{font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--fg-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.folderbar .path a{color:var(--accent)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-s);
  overflow:hidden;cursor:pointer;text-align:left;
  transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;
}
.card:hover{border-color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--ink)}
.card .thumb{aspect-ratio:16/10;background:var(--canvas);border-bottom:1px solid var(--line);
  display:block;width:100%}
.card .meta{padding:10px 12px 10px}
.card .meta h3{margin:0 0 4px;font-size:16px;font-weight:700;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta .sub{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg-3);display:flex;gap:4px 10px;flex-wrap:wrap}
.card .acts{display:flex;gap:2px;padding:0 6px 7px;flex-wrap:wrap}
.card .acts .btn{width:32px;min-height:32px;padding:0;color:var(--fg-3)}
.card .acts .btn:hover{color:var(--fg)}
.card.new{align-items:center;justify-content:center;min-height:190px;border-style:dashed;border-color:var(--fg-3);
  color:var(--accent);gap:10px;font-weight:700;background:transparent}
.card.new:hover{box-shadow:none;border-color:var(--accent);background:var(--bg-3)}
.card.new svg{width:38px;height:38px;padding:9px;border:1.6px solid var(--accent);border-radius:50%}
.empty{padding:50px 20px;text-align:center;color:var(--fg-2)}
.empty svg{width:46px;height:46px;opacity:.5;margin-bottom:10px;color:var(--accent)}

/* ---------- editor ---------- */
.editor{flex:1;display:flex;min-height:0;position:relative}
.canvas-wrap{
  flex:1;position:relative;overflow:hidden;background:var(--canvas);
  touch-action:none;-webkit-user-select:none;user-select:none;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:26px 26px;
}
.canvas-wrap.panning{cursor:grabbing}
.canvas-wrap.linking{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges .hit{stroke:transparent;stroke-width:18;fill:none;pointer-events:stroke;cursor:pointer}
.edges .wire{fill:none;stroke-linecap:round}
.edges g.sel .wire{stroke:var(--accent) !important;stroke-width:3.5}
.elabel{font-size:10px;letter-spacing:0;fill:var(--fg-2);paint-order:stroke;stroke:var(--canvas);
  stroke-width:4px;stroke-linejoin:round;text-anchor:middle;dominant-baseline:middle;
  pointer-events:none;font-family:var(--mono)}

/* ---------- buňka ---------- */
/* --nr = poloměr rohu, --bt = tloušťka horního okraje (barevná buňka ho má silnější) */
.node{
  --nr:var(--r-node); --bt:1.2px;
  position:absolute;touch-action:none;background:var(--bg-2);border:1.2px solid var(--line-2);
  border-radius:var(--nr);
  display:flex;flex-direction:column;
  transition:box-shadow .12s,border-color .12s;
}
/* barva buňky: silnější horní okraj, který se v rozích plynule ztenčí */
.node.has-color{--bt:5px;border-top-width:5px}
.node.shape-round{--nr:999px;--bt:1.2px;border-top-width:1.2px}
.node.shape-round .n-head{padding:12px 20px}
/* oválná buňka s obsahem nebo obrázkem: mírnější oblouk, ať se do ní všechno vejde.
   Plná „pilulka“ z vysoké buňky dělala elipsu, která ořízla obrázek a název nechala venku. */
.node.shape-round.open,.node.shape-round.has-img{--nr:30px}
.node.shape-round.open .n-body{padding-left:20px;padding-right:20px;padding-bottom:16px}
.node.shape-note{--bt:1.2px;border-top-width:1.2px;border-style:dashed;border-color:var(--fg-3)}
.node.shape-plain{--nr:var(--r-s);--bt:1.2px;border-top-width:1.2px;background:transparent;border-color:transparent}
.node.shape-plain .n-head{padding-left:2px;padding-right:2px}
.node:hover{box-shadow:var(--shadow-2)}
/* výběr se pozná podle silnějšího dvojitého rámečku, ne jen podle barvy */
.node.sel{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft)}
.node.drop{box-shadow:0 0 0 2px var(--accent),0 0 0 6px var(--accent-soft)}
.node.linksrc{outline:2px dashed var(--accent);outline-offset:4px}
.node .accent{display:none !important}
.n-head{display:flex;align-items:flex-start;gap:6px;padding:10px 14px;cursor:grab}
.node.dragging .n-head{cursor:grabbing}
.n-title{
  flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.3;
  letter-spacing:-.005em;word-break:break-word;white-space:pre-wrap;
  border-radius:var(--r-s);padding:1px 2px;
}
.n-title[contenteditable="true"]{background:var(--bg-2);outline:2px solid var(--accent);cursor:text;
  -webkit-user-select:text;user-select:text}
.n-title .ph{color:var(--fg-3);font-weight:400}
.n-toggle{
  flex:none;width:22px;height:22px;border-radius:var(--r-s);display:grid;place-items:center;
  color:var(--fg-3);margin-top:-1px;
}
.n-toggle:hover{background:var(--bg-3);color:var(--fg)}
.n-toggle svg{width:14px;height:14px;transition:transform .15s}
.node.open .n-toggle svg{transform:rotate(90deg)}
/* obrázek je v buňce nahoře – jeho horní rohy kopírují vnitřní oblouk okraje */
.n-img{display:block;width:100%;height:auto;object-fit:contain;background:var(--bg-3);
  border-radius:calc(var(--nr) - 1.2px) calc(var(--nr) - 1.2px) 0 0 / calc(var(--nr) - var(--bt)) calc(var(--nr) - var(--bt)) 0 0}
.n-body{
  border-top:1px solid var(--line);padding:10px 14px 13px;font-size:14.5px;
  color:var(--fg-2);overflow:auto;max-height:420px;cursor:grab;
}
.node.dragging .n-body,.node.dragging .n-head{cursor:grabbing}
.n-body.empty-hint{color:var(--fg-3);cursor:pointer}
.n-badge{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--fg-3)}
.n-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
  border-bottom-right-radius:inherit;
  opacity:0;background:
    linear-gradient(135deg,transparent 50%,var(--accent) 50%)}
.node.sel .n-resize{opacity:1}
.port{
  position:absolute;width:15px;height:15px;border-radius:50%;
  background:var(--bg-2);border:1.6px solid var(--accent);opacity:0;pointer-events:none;
  transition:opacity .12s,transform .12s;cursor:crosshair;touch-action:none;z-index:3;
}
.node.sel .port,.node:hover .port{opacity:1;pointer-events:auto}
.port:hover{transform:scale(1.35);background:var(--accent)}
.port.t{top:-8px;left:calc(50% - 7.5px)} .port.b{bottom:-8px;left:calc(50% - 7.5px)}
.port.l{left:-8px;top:calc(50% - 7.5px)} .port.r{right:-8px;top:calc(50% - 7.5px)}
/* na dotykových zařízeních nerolujeme uvnitř buňky – tah patří mapě nebo buňce,
   a buňka se místo toho roztáhne na celý obsah (pravidlo je až na konci souboru,
   aby ho nepřebilo nic z responzivní části) */
@media (pointer:coarse){
  /* vybranou buňku jde uchopit kdekoli, i za obsah */
  .node.sel .n-head,.node.sel .n-body,.node.sel .n-img{cursor:grab}
  .node.sel.dragging .n-head,.node.sel.dragging .n-body{cursor:grabbing}
  .node.sel .n-body{-webkit-user-select:none;user-select:none}
  .node.dragging{opacity:.92;box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft),var(--shadow-3)}
  .port{width:22px;height:22px;opacity:0;pointer-events:none}
  .node:hover .port{opacity:0;pointer-events:none}
  .node.sel .port{opacity:1;pointer-events:auto}
  .port.t{top:-12px;left:calc(50% - 11px)} .port.b{bottom:-12px;left:calc(50% - 11px)}
  .port.l{left:-12px;top:calc(50% - 11px)} .port.r{right:-12px;top:calc(50% - 11px)}
  .node:hover{box-shadow:none}
  .node.sel:hover{box-shadow:0 0 0 2px var(--accent),0 0 0 5px var(--accent-soft)}
}
/* markdown v buňce */
/* Dlouhé adresy, slova bez mezer a kód se musí zalomit uvnitř buňky. Na dotyku se obsah
   buňky nedá rolovat (tah patří mapě), takže co se nevejde, by jinak vylezlo ven. */
.md,.n-title{overflow-wrap:anywhere}
.md a,.md code{word-break:break-word}
.md>*:first-child{margin-top:0}
.md>*:last-child{margin-bottom:0}
.md h1,.md h2,.md h3{color:var(--fg);letter-spacing:-.005em;line-height:1.25;margin:.8em 0 .35em}
.md h1{font-size:1.28em}.md h2{font-size:1.14em}.md h3{font-size:1em}
.md p{margin:.45em 0}
.md ul,.md ol{margin:.45em 0;padding-left:1.25em}
.md li{margin:.2em 0}
.md code{font-family:var(--mono);font-size:.82em;background:var(--bg-3);
  padding:.1em .35em;border-radius:var(--r-s)}
.md pre{background:var(--bg-3);border:1px solid var(--line);padding:9px 11px;border-radius:var(--r-s);overflow:auto;margin:.5em 0;
  white-space:pre-wrap}
.md pre code{background:none;padding:0}
.md blockquote{margin:.5em 0;padding:.1em 0 .1em 10px;border-left:2.5px solid var(--accent);color:var(--fg-2);font-style:italic}
.md a{color:var(--accent)}
.md hr{border:0;border-top:1px solid var(--line);margin:.7em 0}
/* pevné rozvržení: sloupce se dělí o šířku buňky rovným dílem, takže tabulka nikdy nepřeteče
   a slova se lámou jen tehdy, když se do sloupce opravdu nevejdou */
.md table{border-collapse:collapse;margin:.5em 0;font-size:.95em;table-layout:fixed;width:100%}
.md th{text-align:left;font-family:var(--mono);font-size:.72em;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:400;border-bottom:1.5px solid var(--ink);padding:0 10px 4px 0}
.md td{border-bottom:1px solid var(--line);padding:5px 10px 5px 0;vertical-align:top;text-align:left}
.md img{max-width:100%;border-radius:var(--r-s)}
/* úkol: zaškrtávátko vlevo, text vedle něj běží jako obyčejný odstavec (odkaz v úkolu
   se tak zalomí spolu s textem a nestojí vedle něj jako zvláštní sloupec) */
.md li.task{list-style:none;margin-left:-1.15em;padding-left:22px;position:relative}
.md li.task.done{color:var(--fg-3);text-decoration:line-through;text-decoration-color:var(--line-2)}
.md input[type=checkbox]{margin:.2em 0 0;flex:none}
.md li.task>input{position:absolute;left:0;top:.22em;margin:0}
.md input.md-cb{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.md input.md-cb:not([disabled]):hover{transform:scale(1.15)}

/* ---------- nástrojové lišty ---------- */
.toolbar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:20;
  display:flex;gap:5px;align-items:center;padding:5px;
  background:var(--bg-2);border:1.5px solid var(--ink);border-radius:var(--r-node);
  box-shadow:var(--shadow-3);max-width:calc(100% - 20px);overflow-x:auto;
}
/* tlačítka v zaoblených lištách mají oblouk o odsazení menší než lišta */
.toolbar .btn,.zoombar .btn{border-radius:calc(var(--r-node) - 6px)}
.toolbar .btn[aria-pressed="true"]{box-shadow:none}
.toolbar .btn{border-color:transparent}
.toolbar .btn:hover{border-color:transparent}
.toolbar .btn[aria-pressed="true"]{border-color:var(--accent)}
.zoombar{position:absolute;right:14px;bottom:16px;z-index:20;display:flex;flex-direction:column;
  gap:2px;padding:4px;background:var(--bg-2);border:1.5px solid var(--ink);
  border-radius:var(--r-node);box-shadow:var(--shadow-2)}
.zoomval{font-family:var(--mono);font-size:10px;text-align:center;color:var(--fg-3);padding:2px 0}

/* ---------- panel detailu ---------- */
.inspector{
  width:330px;flex:none;background:var(--bg-2);border-left:1px solid var(--line-2);
  display:flex;flex-direction:column;min-height:0;z-index:25;
}
.insp-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2.5px solid var(--ink)}
/* štítek jako „praporek“ sekce */
.insp-head h2{font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;
  margin:0;background:var(--ink);color:var(--ink-fg);padding:4px 9px}
.insp-body{overflow:auto;padding:16px 14px 30px;flex:1}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bg-2);box-shadow:0 0 0 1px var(--line-2)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.npreview{position:relative;border:1.2px solid var(--line-2);border-radius:var(--r-node);
  background:var(--bg-2);overflow:hidden;margin:0 0 12px;min-width:90px}
.npreview i{display:block;height:4px;background:var(--n-color,transparent)}
.npreview b{display:block;padding:8px 10px;font-size:15px;font-weight:700}
.npreview.shape-round{border-radius:999px}
.npreview.shape-round b{padding:10px 18px}
.npreview.shape-round i{display:none !important}
.npreview.shape-note{border-style:dashed;border-color:var(--fg-3)}
.npreview.shape-plain{background:transparent;border-color:transparent}
.npreview.shape-plain b{padding-left:2px}

.seg{display:flex;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-s);padding:0;overflow:hidden}
.seg button{flex:1;min-height:32px;font-size:14px;color:var(--fg-2);border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--bg-3);color:var(--accent);font-weight:700;
  box-shadow:inset 0 -2.5px 0 var(--accent)}
.drag-handle{display:none}

/* ---------- dialogy, hlášky ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,23,31,.5);z-index:60;
  display:grid;place-items:center;padding:16px}
.modal{background:var(--bg-2);border-radius:var(--r-l);box-shadow:var(--shadow-3);
  width:min(580px,100%);max-height:86dvh;overflow:auto;border:1.5px solid var(--ink)}
.modal header{margin:18px 18px 0;padding-bottom:10px;font-size:22px;font-weight:700;letter-spacing:-.01em;
  line-height:1.2;border-bottom:2.5px solid var(--ink)}
.modal .mbody{padding:14px 18px}
.modal footer{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.kbd-list{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14.5px;align-items:center}
kbd{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;background:var(--bg-3);border:1px solid var(--line-2);
  border-radius:var(--r-s);padding:2px 6px;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--ink-fg);padding:9px 14px;border-radius:var(--r-s);font-size:14.5px;
  z-index:90;box-shadow:var(--shadow-3);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
  max-width:min(560px,calc(100% - 24px));text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* když je dole otevřená nabídka, hláška se ukáže nahoře, ať ji nezakrývá */
.sheet-open .toast{bottom:auto;top:calc(64px + env(safe-area-inset-top))}
.ctxmenu{position:fixed;z-index:70;background:var(--bg-2);border:1.5px solid var(--ink);
  border-radius:var(--r-l);box-shadow:var(--shadow-3);padding:4px;min-width:200px}
.ctxmenu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;
  border-radius:var(--r-s);font-size:15px;text-align:left}
.ctxmenu button:hover{background:var(--bg-3)}
.ctxmenu button.danger{font-weight:700}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
/* hlášení o ukládání a synchronizaci: jediný tmavý box na obrazovce – nejde přehlédnout */
.syncbar{
  position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:26;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  background:var(--ink);color:var(--ink-fg);border-radius:var(--r-s);
  padding:10px 12px;box-shadow:var(--shadow-3);width:max-content;max-width:min(640px,calc(100% - 24px));
  font-size:14.5px;line-height:1.35;
}
.syncbar span{flex:1 1 240px;min-width:0}
.syncbar .btn{flex:0 0 auto;background:transparent;color:var(--ink-fg);border-color:var(--ink-fg)}
.syncbar .btn:hover{background:var(--ink-fg);color:var(--ink)}
.syncbar .btn.primary{background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg);filter:none}
.syncbar.hidden{display:none}
@keyframes mmspin{to{transform:rotate(360deg)}}
#btnSync.spin .ico{animation:mmspin .9s linear infinite;transform-origin:50% 50%}

.marquee{position:absolute;border:1.5px dashed var(--accent);background:var(--accent-soft);
  opacity:.55;pointer-events:none;z-index:5}

/* ---------- nabídka „Vložit obrázek“ ---------- */
.sheet-scrim{position:fixed;inset:0;z-index:65;background:rgba(20,23,31,.5);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:min(640px,100%);max-height:88dvh;display:flex;flex-direction:column;
  background:var(--bg-2);border-top:2.5px solid var(--ink);
  box-shadow:var(--shadow-3);padding-bottom:env(safe-area-inset-bottom);
  animation:mmsheet .18s ease-out;
}
@keyframes mmsheet{from{transform:translateY(24px);opacity:0}}
.sheet .drag-handle{display:block;width:40px;height:4px;background:var(--line-2);margin:8px auto 0}
.sheet-head{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 0}
.sheet-ttl{flex:1;min-width:0}
.sheet-ttl .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head h2{margin:2px 0 0;font-size:24px;line-height:1.2;letter-spacing:-.01em}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.pick{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  border:1px solid var(--line-2);border-radius:var(--r-s);padding:12px 12px 11px;min-height:112px;
  background:var(--bg-2);transition:background .12s,border-color .12s;
}
.pick:hover{background:var(--bg-3);border-color:var(--fg-3)}
.pick:active{background:var(--accent-soft);border-color:var(--accent)}
.pick .mark{width:40px;height:40px;border:1.6px solid var(--accent);border-radius:50%;color:var(--accent);
  display:grid;place-items:center;margin-bottom:8px}
.pick .mark.sq{border-radius:0}
.pick .mark .ico{width:20px;height:20px}
.pick b{font-size:16.5px;line-height:1.2}
.pick span{font-size:13px;color:var(--fg-3);line-height:1.25}
.sheet-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.sheet-h span{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.sheet-h .btn{min-height:26px;margin:-4px 0}
.sheet-hint{margin-top:16px}
.sheet-hint p{font-size:14.5px;color:var(--fg-2)}
.sheet-note{margin:14px 0 0}
.sheet-note:empty{display:none}
.thumbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:var(--r-s);overflow:hidden;background:var(--bg-3);
  border:1px solid var(--line);padding:0;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.loading{animation:mmblink 1.2s ease-in-out infinite}
.thumb.broken{opacity:.35}
.thumb:not(.loading):not(.broken):hover{border-color:var(--ink)}
.thumb.picked{outline:3px solid var(--accent);outline-offset:-3px}
.folderlist{margin:0 0 10px}
.folderlist .row{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.folderlist .ico{color:var(--accent)}
@media (min-width:600px){
  .thumbgrid{grid-template-columns:repeat(6,1fr)}
}
@media (min-width:901px){
  .sheet-scrim{align-items:center;padding:16px}
  .sheet{border:1.5px solid var(--ink);border-top-width:2.5px;border-radius:var(--r-l)}
  .sheet .drag-handle{display:none}
  .sheet-head{padding-top:16px}
}

/* ---------- menší obrazovky ---------- */
@media (max-width:900px){
  .doc-title{max-width:30vw}
  .inspector{
    position:absolute;left:0;right:0;bottom:0;width:auto;max-height:64dvh;
    border-left:0;border-top:2.5px solid var(--ink);
    box-shadow:var(--shadow-3);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .inspector .insp-head{border-bottom:1px solid var(--line)}
  .drag-handle{display:block;width:40px;height:4px;background:var(--line-2);
    margin:7px auto 1px}
  .toolbar{bottom:calc(12px + env(safe-area-inset-bottom))}
  .toolbar .lbl{display:none}
  .toolbar .btn{min-width:42px;min-height:42px;padding:0 10px}
  .zoombar{bottom:calc(72px + env(safe-area-inset-bottom));right:10px}
  .editor.panel-open .toolbar,.editor.panel-open .zoombar{display:none}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom))}
  .library{padding:18px 14px 50px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .folderbar .lbl{display:none}
}
@media (max-width:520px){
  .topbar{padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));gap:4px}
  .brand span{display:none}
  .topbar .sep{display:none}
  /* na telefonu zůstane ze stavu uložení jen značka (klepnutím se ukáže text) */
  .savestate{padding:0 9px;min-width:30px;justify-content:center}
  .savestate .txt{display:none}
  .savestate .mark{width:11px;height:11px}
  .toolbar{gap:2px;padding:4px}
  .toolbar .sep{display:none}
  .toolbar .btn{min-width:40px;padding:0 9px}
  .pick{min-height:104px;padding:10px 10px 9px}
  .syncbar{width:calc(100% - 20px);justify-content:flex-start}
  .syncbar span{flex-basis:100%}
}
@media print{
  .topbar,.toolbar,.zoombar,.inspector,.port,.n-resize,.syncbar,.toast,.sheet-scrim{display:none !important}
  .canvas-wrap{overflow:visible;background:none}
  .node,.node.sel{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ---------- buňka na dotyku: žádné vnitřní rolování, roste podle obsahu ---------- */
@media (any-pointer:coarse){
  .n-body{max-height:none;overflow:visible}
}
</style>

<script>
/* ---- 00-util.js ---- */
/* ============================================================
   Myšlenkové mapy – utilitky
   ============================================================ */
'use strict';

/* verze sestavení – pomůže poznat, jestli prohlížeč nemá načtenou starou kopii */
const APP_VERSION = '11. 10. 2026 · v11.2';

const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = (p) => (p || 'x') + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** velikost textu v bajtech (UTF-8) – ne v počtu znaků */
function byteLen(s) {
  try { return new Blob([s]).size; } catch (e) { return String(s).length * 2; }
}

/** rychlý otisk textu (FNV-1a) – stačí na otázku „změnilo se něco?“ */
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + '.' + s.length.toString(36);
}

/** je zařízení hlavně dotykové? (telefon, tablet) */
function isCoarse() {
  try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; }
}

function debounce(fn, ms) {
  let t; const f = function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
  f.cancel = () => clearTimeout(t);
  f.flush = function (...a) { clearTimeout(t); fn.apply(this, a); };
  return f;
}

let toastTimer = null;
function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2600);
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const p = (n) => String(n).padStart(2, '0');
  if (sameDay) return 'dnes ' + p(d.getHours()) + ':' + p(d.getMinutes());
  return p(d.getDate()) + '. ' + p(d.getMonth() + 1) + '. ' + d.getFullYear();
}

function plural(n, one, few, many) {
  if (n === 1) return one;
  if (n >= 2 && n <= 4) return few;
  return many;
}

function slugify(s) {
  return (s || 'mapa').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'mapa';
}

/* ---------- obrázky ---------- */
function loadImage(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

function fileToDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result); r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* Obrázek je uložený přímo v souboru mapy, takže s každým uložením cestuje na Disk.
   Proto má každý obrázek strop – zhruba 420 kB textu – a velké fotky se k němu
   postupně zmenšují. Malé obrázky (ikony, ostré výřezy) zůstávají beze změny. */
const IMG_MAX_PIX = 2.6e6;          // ~2,6 Mpx: snímek obrazovky 1080×2400 zůstane ostrý, fotka se zmenší
const IMG_MAX_SIDE = 2600;
const IMG_BUDGET = 420 * 1024;
const IMG_STEPS = [[2.6e6, 0.82], [2.6e6, 0.7], [1.6e6, 0.7], [1.0e6, 0.62], [0.6e6, 0.55]];

function drawScaled(img, maxPix, quality) {
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  const scale = Math.min(1, Math.sqrt(maxPix / (w0 * h0)), IMG_MAX_SIDE / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w0 * scale));
  c.height = Math.max(1, Math.round(h0 * scale));
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, c.width, c.height);
  let out = '';
  try { out = c.toDataURL('image/webp', quality); } catch (e) { /* starší prohlížeč */ }
  if (!out || out.indexOf('data:image/webp') !== 0) {
    /* JPEG neumí průhlednost – podložíme bílou, ať z ní není černá */
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', quality);
  }
  c.width = c.height = 1;                       // hned uvolnit paměť (mobil)
  return out;
}

/** načte obrázek ze souboru (nebo Blobu) a velké fotky zmenší, ať mapa nenabobtná */
async function imageToDataURL(file) {
  const url = URL.createObjectURL(file);
  try {
    let img;
    try { img = await loadImage(url); }
    catch (e) { throw new Error('Tenhle formát obrázku prohlížeč neumí otevřít'); }
    const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
    const vector = /svg/i.test(file.type || '');
    const anim = /gif/i.test(file.type || '');
    const fits = w0 * h0 <= IMG_MAX_PIX * 1.05 && Math.max(w0, h0) <= IMG_MAX_SIDE;
    /* malé obrázky, animace a vektory necháme být */
    if ((vector || anim) && file.size <= IMG_BUDGET * 0.7) return await fileToDataURL(file);
    if (file.size <= 160 * 1024 && fits) return await fileToDataURL(file);
    if (!w0 || !h0) throw new Error('Obrázek nemá rozměry');
    let best = '';
    for (const st of IMG_STEPS) {
      const out = drawScaled(img, st[0], st[1]);
      if (!best || out.length < best.length) best = out;
      if (best.length <= IMG_BUDGET) break;
    }
    /* plochý snímek obrazovky v PNG bývá menší než jeho překódování – pak nech originál */
    if (fits && file.size * 1.37 < best.length && file.size <= IMG_BUDGET * 0.72) return await fileToDataURL(file);
    return best;
  } finally { URL.revokeObjectURL(url); }
}

/** malý čtvercový náhled (pro výběr obrázků) – nikdy nedrží velkou fotku v paměti */
async function imageThumb(blob, size) {
  const S = size || 220;
  let bmp = null;
  try {
    if (window.createImageBitmap) {
      try { bmp = await createImageBitmap(blob, { resizeWidth: S * 2, resizeQuality: 'low' }); }
      catch (e) { bmp = await createImageBitmap(blob); }
    }
  } catch (e) { bmp = null; }
  let src = bmp, url = null;
  if (!src) { url = URL.createObjectURL(blob); try { src = await loadImage(url); } catch (e) { URL.revokeObjectURL(url); throw e; } }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const side = Math.min(w, h);
  const c = document.createElement('canvas');
  c.width = c.height = S;
  c.getContext('2d').drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, S, S);
  if (bmp && bmp.close) bmp.close();
  if (url) URL.revokeObjectURL(url);
  let out = '';
  try { out = c.toDataURL('image/webp', 0.7); } catch (e) { /* nevadí */ }
  if (!out || out.indexOf('data:image/webp') !== 0) out = c.toDataURL('image/jpeg', 0.7);
  return out;
}

function dataURLToBlob(dataURL) {
  const m = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(dataURL);
  if (!m) return new Blob([]);
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: m[1] || 'application/octet-stream' });
}

/** rozměry obrázku z data URL (pro rozumnou šířku nové buňky) */
async function imageDims(src) {
  try { const i = await loadImage(src); return { w: i.naturalWidth || i.width, h: i.naturalHeight || i.height }; }
  catch (e) { return null; }
}

/** šířka buňky, aby se obrázek hezky vešel: široký snímek dostane širší buňku */
function widthForImage(dim) {
  if (!dim || !dim.w || !dim.h) return 260;
  const ratio = dim.w / dim.h;
  if (ratio >= 1.6) return 420;      // panorama / snímek obrazovky na šířku
  if (ratio >= 1) return 340;
  if (ratio >= 0.7) return 280;
  return 230;                        // na výšku – užší, ať buňka není obří
}

/* ---------- theme ---------- */
function initTheme() {
  const saved = localStorage.getItem('mm.theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  $('#btnTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    const now = cur ? cur : (sysDark ? 'dark' : 'light');
    const next = now === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('mm.theme', next);
  });
}

/* ============================================================
   Mini-Markdown (offline, bez knihoven)
   ============================================================ */
/** adresa z cizí mapy nesmí spustit skript (javascript:, vbscript:, data:text/html…) */
function safeUrl(u, forImage) {
  const s = String(u || '').trim();
  const probe = s.replace(/&amp;/g, '&').replace(/[\u0000- ]/g, '').toLowerCase();
  if (/^(https?:|mailto:|tel:)/.test(probe)) return s;
  if (forImage && /^data:image\/(png|jpe?g|gif|webp|avif|bmp)[;,]/.test(probe)) return s;
  if (/^[a-z][a-z0-9+.-]*:/.test(probe)) return '';         // jiné schéma nepouštíme
  return s;                                                  // relativní odkaz nebo #kotva
}

function mdInline(s) {
  let t = esc(s);
  // kód
  t = t.replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>');
  // obrázek ![alt](src)
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, a, u) => {
    const ok = safeUrl(u, true);
    return ok ? '<img src="' + ok + '" alt="' + a + '" loading="lazy">' : a;
  });
  // odkaz [text](url)
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, a, u) => {
    const ok = safeUrl(u, false);
    return ok ? '<a href="' + ok + '" target="_blank" rel="noopener noreferrer">' + a + '</a>' : a;
  });
  // tučné / kurzíva / škrtnuté
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // automatické odkazy
  t = t.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<)]+)/g,
    (m, pre, u) => pre + '<a href="' + (u.startsWith('www.') ? 'https://' + u : u) +
      '" target="_blank" rel="noopener noreferrer">' + u + '</a>');
  return t;
}

let _mdCb = 0, _mdDepth = 0;
/** markdown(src, true) = zaškrtávátka jsou klikací (v buňce na plátně) */
function markdown(src, interactive) {
  if (!src || !src.trim()) return '';
  if (_mdDepth === 0) _mdCb = 0;
  _mdDepth++;
  try { return markdownBody(src, interactive); } finally { _mdDepth--; }
}

function markdownBody(src, interactive) {
  const lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0, listStack = [];

  const closeLists = (toDepth) => {
    while (listStack.length > toDepth) out.push(listStack.pop() === 'ol' ? '</ol>' : '</ul>');
  };

  while (i < lines.length) {
    let line = lines[i];

    // blok kódu
    if (/^```/.test(line)) {
      closeLists(0);
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(esc(lines[i])); i++; }
      i++;
      out.push('<pre><code>' + buf.join('\n') + '</code></pre>');
      continue;
    }
    // vodorovná čára
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { closeLists(0); out.push('<hr>'); i++; continue; }
    // nadpis
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if (m) {
      closeLists(0);
      const lvl = Math.min(m[1].length, 3);
      out.push('<h' + lvl + '>' + mdInline(m[2]) + '</h' + lvl + '>');
      i++; continue;
    }
    // citace
    if (/^\s*>\s?/.test(line)) {
      closeLists(0);
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, '')); i++; }
      out.push('<blockquote>' + markdownBody(buf.join('\n'), interactive) + '</blockquote>');
      continue;
    }
    // tabulka
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      closeLists(0);
      const cells = (r) => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map((c) => c.trim());
      const head = cells(line); i += 2;
      let html = '<table><thead><tr>' + head.map((c) => '<th>' + mdInline(c) + '</th>').join('') + '</tr></thead><tbody>';
      while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
        html += '<tr>' + cells(lines[i]).map((c) => '<td>' + mdInline(c) + '</td>').join('') + '</tr>';
        i++;
      }
      out.push(html + '</tbody></table>');
      continue;
    }
    // seznamy (včetně zanoření po 2 mezerách)
    m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(line);
    if (m) {
      const depth = Math.floor(m[1].replace(/\t/g, '  ').length / 2) + 1;
      const type = /\d/.test(m[2]) ? 'ol' : 'ul';
      while (listStack.length > depth) out.push(listStack.pop() === 'ol' ? '</ol>' : '</ul>');
      if (listStack.length < depth) {
        while (listStack.length < depth) { listStack.push(type); out.push('<' + type + '>'); }
      }
      let txt = m[3];
      const cb = /^\[( |x|X)\]\s*/.exec(txt);
      let prefix = '', liCls = '';
      if (cb) {
        const done = cb[1].toLowerCase() === 'x';
        prefix = '<input type="checkbox" class="md-cb" data-i="' + (_mdCb++) + '"' +
          (done ? ' checked' : '') + (interactive ? '' : ' disabled') + '>';
        liCls = ' class="task' + (done ? ' done' : '') + '"';
        txt = txt.slice(cb[0].length);
      }
      out.push('<li' + liCls + '>' + prefix + mdInline(txt) + '</li>');
      i++; continue;
    }
    // prázdný řádek
    if (!line.trim()) { closeLists(0); i++; continue; }
    // odstavec
    closeLists(0);
    const para = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*>|```|\s*([-*+]|\d+[.)])\s)/.test(lines[i])) {
      para.push(lines[i]); i++;
    }
    out.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
  }
  closeLists(0);
  return out.join('\n');
}

/** přepne N-té zaškrtávátko ve zdrojovém textu (- [ ] <-> - [x]) */
function toggleTask(src, index) {
  let k = 0;
  return String(src).replace(
    /^([ \t]*(?:>[ \t]*)*(?:[-*+]|\d+[.)])[ \t]+)\[([ xX])\]/gm,
    (m, pre, ch) => (k++ === index ? pre + '[' + (ch === ' ' ? 'x' : ' ') + ']' : m)
  );
}

/* prostý text z markdownu – pro miniatury a hledání */
function mdPlain(src) {
  return String(src || '').replace(/```[\s\S]*?```/g, ' ')
    .replace(/[#>*_`~\[\]()!-]/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ---- 10-model.js ---- */
/* ============================================================
   Datový model a formát souboru (.mapa.json)
   ------------------------------------------------------------
   Soubor je čitelný JSON. Kromě obsahu ukládá i KOMPLETNÍ
   rozmístění: souřadnice a šířku každé buňky, stav rozbalení
   obsahu, pořadí vykreslení i výřez plátna (posun + zoom).
   Po znovuotevření tedy mapa vypadá naprosto stejně.
   ============================================================ */

const FORMAT = 'volna-mysl-mapa';
const FORMAT_VERSION = 1;
const FILE_EXT = '.mapa.json';

const COLORS = [
  { id: 'none',   label: 'Bez barvy', hex: '' },
  { id: 'blue',   label: 'Kobaltová', hex: '#2A4B9B' },
  { id: 'indigo', label: 'Modrofialová', hex: '#4b4fa6' },
  { id: 'teal',   label: 'Tyrkysová', hex: '#0f7f78' },
  { id: 'green',  label: 'Zelená',    hex: '#2f7d46' },
  { id: 'lime',   label: 'Limetková', hex: '#6c8f1a' },
  { id: 'amber',  label: 'Žlutá',     hex: '#b9820f' },
  { id: 'orange', label: 'Oranžová',  hex: '#c2571f' },
  { id: 'red',    label: 'Červená',   hex: '#b8382f' },
  { id: 'purple', label: 'Fialová',   hex: '#6d4bb5' },
  { id: 'pink',   label: 'Růžová',    hex: '#b43e78' },
  { id: 'gray',   label: 'Šedá',      hex: '#5a6172' }
];
const colorHex = (id) => (COLORS.find((c) => c.id === id) || COLORS[0]).hex;

const SHAPES = [
  { id: 'card',  label: 'Karta' },
  { id: 'round', label: 'Oválná' },
  { id: 'note',  label: 'Lísteček' },
  { id: 'plain', label: 'Jen text' }
];

const NODE_W = 210;

/* Zaoblení rohů buňky – musí sedět s --r-node a s oválnou buňkou v CSS.
   Podle něj se počítá, kde vazba končí na obrysu buňky, a kreslí se miniatury. */
const NODE_R = 18;          // karta, lísteček
const NODE_R_ROUND = 30;    // oválná buňka s obsahem nebo obrázkem
function nodeRadius(n) {
  if (n.shape === 'plain') return 0;
  if (n.shape === 'round') return (n.open || n.image) ? NODE_R_ROUND : 9999;   // jinak „pilulka“
  return NODE_R;
}

const NODE_DEFAULT = { color: 'none', shape: 'card', w: NODE_W };

/** výchozí vzhled nové buňky – uložený v dokumentu */
function nodeDefaults() {
  const d = (typeof App !== 'undefined' && App.doc && App.doc.defaults && App.doc.defaults.node) || null;
  return {
    color: (d && d.color) || NODE_DEFAULT.color,
    shape: (d && d.shape) || NODE_DEFAULT.shape,
    w: (d && d.w) || NODE_DEFAULT.w
  };
}

function newNode(x, y, title) {
  const d = nodeDefaults();
  return {
    id: uid('n'),
    title: title === undefined ? 'Nová buňka' : title,
    content: '',
    open: false,          // je obsah viditelný?
    x: Math.round(x), y: Math.round(y),
    w: d.w, h: 0,
    color: d.color,
    shape: d.shape,
    image: null           // data URI nebo URL
  };
}

const EDGE_DEFAULT = { style: 'solid', arrow: 'none', color: 'none' };

/** výchozí vzhled nové vazby – uložený v dokumentu */
function edgeDefaults() {
  const d = (typeof App !== 'undefined' && App.doc && App.doc.defaults && App.doc.defaults.edge) || null;
  return {
    style: (d && d.style) || EDGE_DEFAULT.style,
    arrow: (d && d.arrow) || EDGE_DEFAULT.arrow,
    color: (d && d.color) || EDGE_DEFAULT.color
  };
}

function newEdge(from, to) {
  const d = edgeDefaults();
  return { id: uid('e'), from, to, label: '', style: d.style, arrow: d.arrow, color: d.color };
}

function newDoc(title) {
  const now = Date.now();
  return {
    format: FORMAT,
    version: FORMAT_VERSION,
    id: uid('map'),
    title: title || 'Nová mapa',
    created: now,
    modified: now,
    view: { x: 0, y: 0, zoom: 1 },      // přesný výřez plátna
    defaults: { edge: Object.assign({}, EDGE_DEFAULT), node: Object.assign({}, NODE_DEFAULT) },
    nodes: [],
    edges: []
  };
}

/** Doplní chybějící pole, ověří formát. Vrací null, když to není mapa. */
function normalizeDoc(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (!Array.isArray(raw.nodes)) return null;
  const d = {
    format: FORMAT,
    version: FORMAT_VERSION,
    id: raw.id || uid('map'),
    title: typeof raw.title === 'string' && raw.title.trim() ? raw.title : 'Bez názvu',
    created: raw.created || Date.now(),
    modified: raw.modified || Date.now(),
    view: {
      x: Number(raw.view && raw.view.x) || 0,
      y: Number(raw.view && raw.view.y) || 0,
      zoom: clamp(Number(raw.view && raw.view.zoom) || 1, 0.1, 4)
    },
    defaults: {
      edge: {
        style: ['solid', 'dashed', 'dotted'].includes(raw.defaults && raw.defaults.edge && raw.defaults.edge.style)
          ? raw.defaults.edge.style : 'solid',
        arrow: ['none', 'to', 'both'].includes(raw.defaults && raw.defaults.edge && raw.defaults.edge.arrow)
          ? raw.defaults.edge.arrow : 'none',
        color: COLORS.some((c) => c.id === (raw.defaults && raw.defaults.edge && raw.defaults.edge.color))
          ? raw.defaults.edge.color : 'none'
      },
      node: {
        color: COLORS.some((c) => c.id === (raw.defaults && raw.defaults.node && raw.defaults.node.color))
          ? raw.defaults.node.color : 'none',
        shape: SHAPES.some((c) => c.id === (raw.defaults && raw.defaults.node && raw.defaults.node.shape))
          ? raw.defaults.node.shape : 'card',
        w: clamp(Number(raw.defaults && raw.defaults.node && raw.defaults.node.w) || NODE_W, 90, 900)
      }
    },
    nodes: [],
    edges: []
  };
  const ids = new Set();
  raw.nodes.forEach((n) => {
    if (!n || typeof n !== 'object') return;
    const id = n.id && !ids.has(n.id) ? n.id : uid('n');
    ids.add(id);
    d.nodes.push({
      id,
      title: typeof n.title === 'string' ? n.title : '',
      content: typeof n.content === 'string' ? n.content : '',
      open: !!(n.open !== undefined ? n.open : n.expanded),
      x: Number(n.x) || 0,
      y: Number(n.y) || 0,
      w: clamp(Number(n.w) || NODE_W, 90, 900),
      h: Number(n.h) > 0 ? clamp(Number(n.h), 20, 4000) : 0,
      color: COLORS.some((c) => c.id === n.color) ? n.color : 'none',
      shape: SHAPES.some((s) => s.id === n.shape) ? n.shape : 'card',
      image: typeof n.image === 'string' && n.image ? n.image : null
    });
  });
  (Array.isArray(raw.edges) ? raw.edges : []).forEach((e) => {
    if (!e || !ids.has(e.from) || !ids.has(e.to) || e.from === e.to) return;
    d.edges.push({
      id: e.id || uid('e'),
      from: e.from, to: e.to,
      label: typeof e.label === 'string' ? e.label : '',
      style: ['solid', 'dashed', 'dotted'].includes(e.style) ? e.style : 'solid',
      arrow: ['none', 'to', 'both'].includes(e.arrow) ? e.arrow : 'none',
      color: COLORS.some((c) => c.id === e.color) ? e.color : 'none'
    });
  });
  return d;
}

function serialize(doc) {
  return JSON.stringify(doc, null, 2);
}

/** Otisk obsahu mapy. Záměrně vynechává výřez plátna, datum změny a naměřené výšky
 *  buněk – ty se liší zařízení od zařízení a samy o sobě nejsou důvod nic ukládat. */
function contentKey(doc) {
  if (!doc || !doc.nodes) return '';
  return hashStr(JSON.stringify([doc.title, doc.defaults, doc.edges, doc.nodes],
    (k, v) => (k === 'h' ? undefined : v)));
}

function docBounds(doc, estH) {
  if (!doc.nodes.length) return { x: 0, y: 0, w: 1, h: 1 };
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  doc.nodes.forEach((n) => {
    const h = estH ? estH(n) : (n.open ? 120 : 44);
    x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
    x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + h);
  });
  return { x: x1, y: y1, w: Math.max(1, x2 - x1), h: Math.max(1, y2 - y1) };
}

/* ---------- miniatura listu jako SVG (kreslí se ze skutečného rozmístění) ---------- */
function thumbEstH(n) {
  return n.h || ((n.image ? 78 : 0) + (n.open ? 76 : 0) + 34);
}

function thumbSVG(doc, W, H) {
  W = W || 320; H = H || 200;
  const pad = 12;
  const b = docBounds(doc, thumbEstH);
  const s = Math.min((W - pad * 2) / b.w, (H - pad * 2) / b.h, 1);
  const ox = pad + (W - pad * 2 - b.w * s) / 2 - b.x * s;
  const oy = pad + (H - pad * 2 - b.h * s) / 2 - b.y * s;
  const X = (v) => +(v * s + ox).toFixed(1);
  const Y = (v) => +(v * s + oy).toFixed(1);
  const pos = {};
  doc.nodes.forEach((n) => { pos[n.id] = { cx: n.x + n.w / 2, cy: n.y + thumbEstH(n) / 2 }; });

  let g = '';
  doc.edges.forEach((e) => {
    const a = pos[e.from], c = pos[e.to];
    if (!a || !c) return;
    const col = colorHex(e.color);
    g += '<line x1="' + X(a.cx) + '" y1="' + Y(a.cy) + '" x2="' + X(c.cx) + '" y2="' + Y(c.cy) +
      '" style="stroke:' + (col || 'currentColor') + ';stroke-opacity:' + (col ? '.75' : '.38') +
      '" stroke-width="1.1"' + (e.style === 'dashed' ? ' stroke-dasharray="3 3"' :
        e.style === 'dotted' ? ' stroke-dasharray="1 3"' : '') + '/>';
  });

  let imgs = 0;
  doc.nodes.slice(0, 120).forEach((n) => {
    const h = thumbEstH(n), w = n.w;
    const x = X(n.x), y = Y(n.y), pw = +(w * s).toFixed(1), ph = +(h * s).toFixed(1);
    const col = colorHex(n.color);
    const rx = Math.min(nodeRadius(n) * s, pw / 2, ph / 2);
    const plain = n.shape === 'plain';
    if (!plain) {
      g += '<rect x="' + x + '" y="' + y + '" width="' + pw + '" height="' + ph + '" rx="' + rx +
        '" style="fill:var(--bg-2);stroke:' + (col || 'var(--line-2)') + ';stroke-opacity:' +
        (col ? '.95' : '.7') + '" stroke-width="1"' + (n.shape === 'note' ? ' stroke-dasharray="3 2"' : '') + '/>';
    }
    let cy = y + 2;
    if (n.image && imgs < 6 && pw > 16) {
      /* když je buňka hlavně obrázek, ať ho tak ukáže i náhled */
      const textRoom = (n.title ? 14 : 0) + (n.open && n.content ? 22 : 0);
      const ih = Math.max(6, Math.min(ph - 4, ph - textRoom * s));
      g += '<image href="' + esc(n.image) + '" x="' + (x + 1) + '" y="' + (cy) + '" width="' + (pw - 2) +
        '" height="' + ih.toFixed(1) + '" preserveAspectRatio="xMidYMid slice"/>';
      cy += ih + 2;
      imgs++;
    }
    const title = (n.title || '').trim();
    if (title && pw >= 46) {
      const fs = Math.max(5.5, Math.min(10, 13 * s));
      const max = Math.max(3, Math.floor((pw - 8) / (fs * 0.52)));
      const txt = title.length > max ? title.slice(0, max - 1) + '…' : title;
      g += '<text x="' + (x + 4) + '" y="' + (cy + fs) + '" style="fill:var(--fg);font-weight:700;' +
        'font-size:' + fs.toFixed(1) + 'px;font-family:Carlito,Calibri,sans-serif">' + esc(txt) + '</text>';
      cy += fs + 3;
    } else if (title) {
      g += '<rect x="' + (x + 2) + '" y="' + (cy + 2) + '" width="' + Math.max(4, pw * 0.62) +
        '" height="' + Math.max(1.6, 3 * s) + '" rx="1" style="fill:' + (col || 'var(--fg-2)') +
        ';fill-opacity:.85"/>';
      cy += Math.max(3, 5 * s);
    }
    if (n.open && n.content) {
      const lines = Math.min(4, Math.max(1, Math.round((y + ph - cy) / Math.max(3, 6 * s))));
      for (let i = 0; i < lines; i++) {
        const lw = pw * (i === lines - 1 ? 0.45 : 0.8) - 8;
        if (lw < 3 || cy + 2 > y + ph - 2) break;
        g += '<rect x="' + (x + 4) + '" y="' + cy.toFixed(1) + '" width="' + lw.toFixed(1) +
          '" height="' + Math.max(1.2, 2 * s).toFixed(1) + '" rx="1" style="fill:var(--fg-3);fill-opacity:.5"/>';
        cy += Math.max(3, 6 * s);
      }
    }
  });

  if (!doc.nodes.length) {
    g = '<text x="' + (W / 2) + '" y="' + (H / 2) + '" text-anchor="middle" font-size="13" ' +
      'style="fill:var(--fg-3);fill-opacity:.7" font-family="sans-serif">prázdná mapa</text>';
  }
  return '<svg class="thumb" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" ' +
    'style="color:var(--fg-3)" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
}

/* ---- 12-import.js ---- */
/* ============================================================
   Import map z jiných programů
   ------------------------------------------------------------
   *.orgpage / *.edn  – export z OrgPadu ve formátu EDN (věrnější)
   *.canvas           – JSON Canvas (Obsidian a spol.)
   ============================================================ */

/* ---------------------- čtečka EDN ---------------------- */
function parseEDN(src) {
  let i = 0;
  const isWs = (c) => c === ' ' || c === '\n' || c === '\t' || c === '\r' || c === ',';
  const isDelim = (c) => c === undefined || isWs(c) || '()[]{}"'.indexOf(c) >= 0 || c === ';';

  function skipWs() {
    for (;;) {
      while (i < src.length && isWs(src[i])) i++;
      if (src[i] === ';') { while (i < src.length && src[i] !== '\n') i++; continue; }
      if (src[i] === '#' && src[i + 1] === '_') { i += 2; readValue(); continue; }
      return;
    }
  }
  function readString() {
    i++; let out = '';
    while (i < src.length && src[i] !== '"') {
      if (src[i] === '\\') {
        i++;
        const e = src[i];
        if (e === 'n') out += '\n';
        else if (e === 't') out += '\t';
        else if (e === 'r') out += '\r';
        else if (e === 'u') { out += String.fromCharCode(parseInt(src.substr(i + 1, 4), 16)); i += 4; }
        else out += e;
        i++;
      } else { out += src[i]; i++; }
    }
    i++;
    return out;
  }
  function readToken() { const s = i; while (!isDelim(src[i])) i++; return src.slice(s, i); }
  function readSeq(close) {
    const a = [];
    for (;;) {
      skipWs();
      if (i >= src.length) break;
      if (src[i] === close) { i++; break; }
      a.push(readValue());
    }
    return a;
  }
  function readValue() {
    skipWs();
    const c = src[i];
    if (c === undefined) return undefined;
    if (c === '"') return readString();
    if (c === '[') { i++; return readSeq(']'); }
    if (c === '(') { i++; return readSeq(')'); }
    if (c === '{') {
      i++;
      const o = Object.create(null);
      for (;;) {
        skipWs();
        if (i >= src.length) break;
        if (src[i] === '}') { i++; break; }
        const k = readValue();
        const v = readValue();
        o[String(k)] = v;
      }
      return o;
    }
    if (c === '#') {
      i++;
      if (src[i] === '{') { i++; return readSeq('}'); }      // množina
      readToken();                                            // #uuid, #inst … značku zahodíme
      return readValue();
    }
    if (c === ':') { i++; return ':' + readToken(); }
    const tok = readToken();
    if (tok === 'nil') return null;
    if (tok === 'true') return true;
    if (tok === 'false') return false;
    if (/^[-+]?(\d|\.\d)/.test(tok)) {
      const n = Number(tok.replace(/[NM]$/, ''));
      if (!isNaN(n)) return n;
    }
    return tok;
  }
  return readValue();
}

/* ---------------------- hiccup -> Markdown ---------------------- */
function hicAttrs(n) {
  return (n[1] && typeof n[1] === 'object' && !Array.isArray(n[1])) ? n[1] : null;
}
function hicKids(n) { return n.slice(hicAttrs(n) ? 2 : 1); }

function hiccupInline(n) {
  if (n == null) return '';
  if (typeof n === 'string') return n;
  if (typeof n === 'number') return String(n);
  if (!Array.isArray(n)) return '';
  const tag = n[0];
  const at = hicAttrs(n) || {};
  const kids = hicKids(n).map(hiccupInline).join('');
  switch (tag) {
    case ':a': {
      const href = at[':href'] || at.href || '';
      const label = kids.trim() || href;
      return href ? '[' + label + '](' + href + ')' : label;
    }
    case ':b': case ':strong': return kids ? '**' + kids + '**' : '';
    case ':i': case ':em': return kids ? '*' + kids + '*' : '';
    case ':code': case ':kbd': return kids ? '`' + kids + '`' : '';
    case ':del': case ':s': return kids ? '~~' + kids + '~~' : '';
    case ':br': return '\n';
    case ':img': return '![](' + (at[':src'] || at.src || '') + ')';
    default: return kids;
  }
}

function hiccupBlocks(list, indent) {
  const out = [];
  const pad = '  '.repeat(indent || 0);
  (Array.isArray(list) ? list : [list]).forEach((n) => {
    if (n == null) return;
    if (typeof n === 'string') { if (n.trim()) out.push(pad + n.trim()); return; }
    if (!Array.isArray(n)) return;
    const tag = n[0];
    const kids = hicKids(n);
    if (tag === ':ul' || tag === ':ol') {
      let k = 0;
      kids.forEach((li) => {
        if (!Array.isArray(li)) return;
        const inline = [], nested = [];
        hicKids(li).forEach((ch) => {
          if (Array.isArray(ch) && (ch[0] === ':ul' || ch[0] === ':ol')) nested.push(ch);
          else inline.push(ch);
        });
        k++;
        const bullet = tag === ':ol' ? k + '. ' : '- ';
        const txt = inline.map(hiccupInline).join('').replace(/\s+$/, '');
        out.push(pad + bullet + txt);
        nested.forEach((nn) => { const s = hiccupBlocks([nn], (indent || 0) + 1); if (s) out.push(s); });
      });
    } else if (/^:h[1-6]$/.test(tag)) {
      out.push(pad + '#'.repeat(Math.min(3, Number(tag[2]))) + ' ' + kids.map(hiccupInline).join('').trim());
    } else if (tag === ':blockquote') {
      out.push(pad + '> ' + kids.map(hiccupInline).join('').trim());
    } else if (tag === ':pre') {
      out.push('```\n' + kids.map(hiccupInline).join('') + '\n```');
    } else if (tag === ':hr') {
      out.push('---');
    } else if (tag === ':table') {
      out.push(kids.map(hiccupInline).join(' ').trim());
    } else if (tag === ':p' || tag === ':div' || tag === ':span') {
      const t = kids.map(hiccupInline).join('').trim();
      if (t) out.push(pad + t);
    } else {
      const t = hiccupInline(n).trim();
      if (t) out.push(pad + t);
    }
  });
  return out.join('\n').replace(/\n{3,}/g, '\n\n');
}

/* ---------------------- barvy ---------------------- */
const ORG_COLORS = {
  ':color/lime': 'lime', ':color/green': 'green', ':color/teal': 'teal', ':color/mint': 'teal',
  ':color/blue': 'blue', ':color/sky': 'blue', ':color/blueberry': 'indigo', ':color/indigo': 'indigo',
  ':color/purple': 'purple', ':color/violet': 'purple', ':color/magenta': 'pink', ':color/pink': 'pink',
  ':color/red': 'red', ':color/ruby': 'red', ':color/orange': 'orange', ':color/amber': 'amber',
  ':color/yellow': 'amber', ':color/gold': 'amber', ':color/gray': 'gray', ':color/grey': 'gray',
  ':color/silver': 'gray', ':color/black': 'gray', ':color/white': 'none'
};
function orgColor(c) { return (c && ORG_COLORS[c]) || 'none'; }

const CANVAS_PRESET = { '1': 'red', '2': 'orange', '3': 'amber', '4': 'green', '5': 'teal', '6': 'purple' };
/* barvy, které používá export z OrgPadu – ať .canvas vyjde stejně jako .orgpage */
const KNOWN_HEX = {
  '#677f05': 'lime', '#a3cb04': 'lime', '#7654ad': 'purple', '#a46bff': 'purple',
  '#2f7ba7': 'blue', '#4aa3d8': 'blue', '#545ca8': 'indigo', '#6f79e0': 'indigo',
  '#a7362f': 'red', '#d94f45': 'red', '#b06a12': 'orange', '#e0912b': 'orange',
  '#1f7a63': 'teal', '#2fae8f': 'teal', '#a33a6d': 'pink', '#d4629b': 'pink',
  '#6b7280': 'gray', '#9aa3ae': 'gray'
};
function nearestColor(hex) {
  const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return 'none';
  let h = m[1];
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  let best = 'none', bestD = Infinity;
  COLORS.forEach((c) => {
    if (!c.hex) return;
    const cr = parseInt(c.hex.slice(1, 3), 16), cg = parseInt(c.hex.slice(3, 5), 16), cb = parseInt(c.hex.slice(5, 7), 16);
    const d = (r - cr) * (r - cr) * 0.3 + (g - cg) * (g - cg) * 0.59 + (b - cb) * (b - cb) * 0.11;
    if (d < bestD) { bestD = d; best = c.id; }
  });
  return best;
}
function canvasColor(c) {
  if (!c) return 'none';
  const key = String(c).trim().toLowerCase();
  if (CANVAS_PRESET[key]) return CANVAS_PRESET[key];
  if (KNOWN_HEX[key]) return KNOWN_HEX[key];
  return nearestColor(c);
}

/* ---------------------- OrgPad (.orgpage / EDN) ---------------------- */
function orgpageToDoc(text, fallbackName) {
  let root;
  try { root = parseEDN(text); } catch (e) { return null; }
  const units = root && root[':orgpage/units'];
  if (!units || typeof units !== 'object') return null;

  const doc = newDoc(root[':orgpage/title'] || fallbackName || 'Mapa z OrgPadu');
  const idMap = Object.create(null);
  const books = [];

  Object.keys(units).forEach((uid) => {
    const u = units[uid];
    if (!u || u[':unit/type'] !== ':unit/book') return;
    books.push(uid);
    const pos = Array.isArray(u[':unit/pos']) ? u[':unit/pos'] : [0, 0];
    const n = newNode(Math.round(pos[0]), Math.round(pos[1]), u[':unit/title'] || '');
    n.shape = 'card';
    n.w = 240;

    const parts = [];
    const kids = u[':unit/child-unit-ids'] || [];
    kids.forEach((kid) => {
      const pg = units[kid];
      if (pg && pg[':unit/content']) {
        const md = hiccupBlocks(pg[':unit/content'], 0).replace(/^\n+|\s+$/g, '');
        if (md) parts.push(md);
      }
    });
    if (u[':unit/content']) {
      const md = hiccupBlocks(u[':unit/content'], 0).replace(/^\n+|\s+$/g, '');
      if (md) parts.push(md);
    }
    n.content = parts.join('\n\n').trim();
    n.open = !!n.content;

    const props = u[':unit/props'] || {};
    n.color = orgColor(props[':props/color']);
    if (props[':props/title-size'] === ':props/h1') n.w = 280;

    idMap[uid] = n.id;
    doc.nodes.push(n);
  });

  /* vazby */
  const links = root[':orgpage/links'] || {};
  Object.keys(links).forEach((lid) => {
    const l = links[lid];
    const ep = l && l[':link/endpoint-ids'];
    if (!Array.isArray(ep) || ep.length < 2) return;
    const a = idMap[ep[0]], b = idMap[ep[1]];
    if (!a || !b || a === b) return;
    const e = newEdge(a, b);
    const props = l[':link/props'] || {};
    const head = props[':props/arrowhead'];
    e.arrow = head === ':props/single' ? 'to' : (head === ':props/double' || head === ':props/both') ? 'both' : 'none';
    e.style = props[':props/dashed'] ? 'dashed' : 'solid';
    e.color = orgColor(props[':props/color']);
    if (typeof l[':link/title'] === 'string') e.label = l[':link/title'];
    doc.edges.push(e);
  });

  /* zanořené jednotky v OrgPadu spojíme čárou rodič -> dítě */
  books.forEach((uid) => {
    const u = units[uid];
    const par = u[':unit/parent-id'];
    if (!par || !idMap[par] || !idMap[uid]) return;
    const a = idMap[par], b = idMap[uid];
    if (doc.edges.some((e) => (e.from === a && e.to === b) || (e.from === b && e.to === a))) return;
    const e = newEdge(a, b);
    e.style = 'solid'; e.arrow = 'to'; e.color = 'none';
    doc.edges.push(e);
  });

  return doc.nodes.length ? doc : null;
}

/* ---------------------- JSON Canvas (.canvas) ---------------------- */
function canvasToDoc(text, fallbackName) {
  let o;
  try { o = JSON.parse(text); } catch (e) { return null; }
  if (!o || !Array.isArray(o.nodes)) return null;

  const doc = newDoc(fallbackName || 'Mapa z Canvasu');
  const idMap = Object.create(null);

  o.nodes.forEach((cn) => {
    if (!cn || typeof cn !== 'object') return;
    let title = '', content = '';
    if (cn.type === 'file') {
      title = String(cn.file || '').split('/').pop().replace(/\.[^.]+$/, '');
      content = cn.file ? '`' + cn.file + '`' : '';
    } else if (cn.type === 'link') {
      title = String(cn.url || '').replace(/^https?:\/\//, '').split('/')[0];
      content = cn.url ? '[' + cn.url + '](' + cn.url + ')' : '';
    } else if (cn.type === 'group') {
      title = cn.label || 'Skupina';
    } else {
      const t = String(cn.text || '').replace(/\r\n?/g, '\n').trim();
      const lines = t.split('\n');
      const h = /^(#{1,6})\s+(.*)$/.exec(lines[0] || '');
      if (h) { title = h[2].trim(); content = lines.slice(1).join('\n').trim(); }
      else if (lines.length === 1) { title = t.slice(0, 140); }
      else if (lines[0].length <= 70) { title = lines[0].trim(); content = lines.slice(1).join('\n').trim(); }
      else { content = t; }
    }
    const n = newNode(Math.round(Number(cn.x) || 0), Math.round(Number(cn.y) || 0), title);
    n.shape = cn.type === 'group' ? 'plain' : 'card';
    n.content = content;
    n.open = !!content;
    const w = Number(cn.width) || 0;
    n.w = w >= 110 ? clamp(Math.round(w), 110, 560) : 240;
    n.color = canvasColor(cn.color);
    idMap[cn.id] = n.id;
    doc.nodes.push(n);
  });

  (Array.isArray(o.edges) ? o.edges : []).forEach((ce) => {
    if (!ce) return;
    const a = idMap[ce.fromNode], b = idMap[ce.toNode];
    if (!a || !b || a === b) return;
    const e = newEdge(a, b);
    const toArrow = ce.toEnd !== 'none';       // podle specifikace je výchozí šipka na cíli
    const fromArrow = ce.fromEnd === 'arrow';
    e.arrow = (toArrow && fromArrow) ? 'both' : toArrow ? 'to' : 'none';
    e.style = 'solid';
    e.label = typeof ce.label === 'string' ? ce.label : '';
    e.color = canvasColor(ce.color);
    doc.edges.push(e);
  });

  return doc.nodes.length ? doc : null;
}

/* ---------------------- rozcestník ---------------------- */
const IMPORT_EXT = /\.(json|mapa\.json|canvas|orgpage|edn)$/i;

/** rozpozná formát a vrátí dokument, nebo null */
async function importAnyToDoc(text, filename) {
  const base = String(filename || '').replace(/\.[^.]+$/, '');
  const t = text.replace(/^﻿/, '').trim();

  if (/\.orgpage$|\.edn$/i.test(filename || '') || /^\{\s*:orgpage\//.test(t)) {
    return orgpageToDoc(t, base);
  }
  if (/\.canvas$/i.test(filename || '')) {
    return canvasToDoc(t, base);
  }
  /* .json – nejdřív náš formát, pak Canvas */
  const own = await textToDoc(t);
  if (own && (own.locked || own.nodes)) return own;
  return canvasToDoc(t, base);
}

/* ---- 15-crypt.js ---- */
/* ============================================================
   Volitelné šifrování map heslem (AES-GCM 256 + PBKDF2)
   ------------------------------------------------------------
   Soubor se uloží jako JSON obálka:
   { "enc":"AES-GCM", "v":1, "kdf":"PBKDF2-SHA256", "iter":210000,
     "salt":"…base64…", "iv":"…base64…", "data":"…base64…" }
   Heslo se nikam neukládá – žije jen v paměti záložky.
   ============================================================ */

const B64 = {
  enc(buf) {
    /* po kouscích – mapa s fotkami má i několik MB */
    const b = new Uint8Array(buf); let s = '';
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(s);
  },
  dec(str) {
    const s = atob(str); const b = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b;
  }
};

const Crypt = {
  ITER: 210000,
  on: false,          // má se šifrovat při ukládání?
  salt: null,         // Uint8Array
  key: null,          // CryptoKey (jen v paměti)
  _cache: Object.create(null),

  get ready() { return !!this.key; },
  supported() { return !!(window.crypto && crypto.subtle); },

  /* nastavení pro aktuální zdroj (složka / Disk) si pamatujeme v prohlížeči */
  storeKey() { return 'mm.crypt.' + (Store.sourceId ? Store.sourceId() : 'default'); },
  loadSettings() {
    try {
      const raw = localStorage.getItem(this.storeKey());
      if (!raw) { this.on = false; this.salt = null; this.key = null; return; }
      const o = JSON.parse(raw);
      this.on = !!o.on;
      this.salt = o.salt ? B64.dec(o.salt) : null;
      this.key = null;
    } catch (e) { this.on = false; }
  },
  saveSettings() {
    try {
      localStorage.setItem(this.storeKey(), JSON.stringify({
        on: this.on, salt: this.salt ? B64.enc(this.salt) : null
      }));
    } catch (e) { /* soukromé okno – nevadí */ }
  },

  async derive(pass, salt, iter) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
      'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter || this.ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },

  /** zapne šifrování novým heslem */
  async enable(pass) {
    this.salt = crypto.getRandomValues(new Uint8Array(16));
    this.key = await this.derive(pass, this.salt, this.ITER);
    this.on = true;
    this.saveSettings();
  },
  /** odemkne existující šifrované mapy; vrací true při správném heslu */
  async unlock(pass, salt, iter) {
    const s = salt || this.salt;
    if (!s) return false;
    this.key = await this.derive(pass, s, iter || this.ITER);
    this.salt = s;
    return true;
  },
  lock() { this.key = null; },
  disable() { this.on = false; this.key = null; this.salt = null; this.saveSettings(); },

  isEncrypted(o) { return !!(o && typeof o === 'object' && o.enc === 'AES-GCM' && o.data); },

  async encrypt(text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key,
      new TextEncoder().encode(text));
    return JSON.stringify({
      enc: 'AES-GCM', v: 1, kdf: 'PBKDF2-SHA256', iter: this.ITER,
      salt: B64.enc(this.salt), iv: B64.enc(iv), data: B64.enc(ct)
    }, null, 1);
  },

  async decrypt(o) {
    if (!this.key) throw new Error('LOCKED');
    const txt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: B64.dec(o.iv) }, this.key, B64.dec(o.data));
    return new TextDecoder().decode(txt);
  }
};

/** text -> dokument (rozšifruje, když je potřeba); vrací null u cizích souborů,
 *  nebo {locked:true, meta} když chybí heslo */
async function textToDoc(text) {
  let raw;
  try { raw = JSON.parse(text); } catch (e) { return null; }
  if (Crypt.isEncrypted(raw)) {
    if (!Crypt.key) {
      if (!Crypt.salt) { Crypt.salt = B64.dec(raw.salt); Crypt.on = true; Crypt.saveSettings(); }
      return { locked: true, iter: raw.iter, salt: B64.dec(raw.salt) };
    }
    try {
      return normalizeDoc(JSON.parse(await Crypt.decrypt(raw)));
    } catch (e) { return { locked: true, iter: raw.iter, salt: B64.dec(raw.salt) }; }
  }
  return normalizeDoc(raw);
}

/** dokument -> text pro uložení (zašifruje, když je zapnuté šifrování) */
async function docToText(doc) {
  const plain = serialize(doc);
  if (Crypt.on && Crypt.key) return Crypt.encrypt(plain);
  return plain;
}

/* ---- 20-store.js ---- */
/* ============================================================
   Úložiště: složka v počítači (File System Access API)
   + záložní režim pro prohlížeče, které ji neumí (Safari, mobil)
   ============================================================ */

const HAS_FS = typeof window.showDirectoryPicker === 'function';

/* ---------------- IndexedDB (ukazatel na složku + záloha map) ------------- */
/* Dvě databáze: původní „mysli-mapy“ drží mapy uložené v prohlížeči a ukazatel na složku
   (na tu se nesahá, ať se při aktualizaci aplikace nic nerozbije). Nová „mysli-mapy-disk“
   je jen pomocná – mezipaměť stažených map a záloha neodeslaných úprav. */
const IDB = (() => {
  const DBS = {
    'mysli-mapy': ['kv', 'maps'],
    'mysli-mapy-disk': ['cache', 'drafts']
  };
  const where = {};
  Object.keys(DBS).forEach((name) => DBS[name].forEach((s) => { where[s] = name; }));
  const opened = {};
  function open(name) {
    if (opened[name]) return opened[name];
    opened[name] = new Promise((res, rej) => {
      const r = indexedDB.open(name, 1);
      r.onupgradeneeded = () => {
        const db = r.result;
        DBS[name].forEach((s) => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); });
      };
      r.onsuccess = () => {
        const db = r.result;
        db.onversionchange = () => { db.close(); opened[name] = null; };
        res(db);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('databáze je zamčená jinou záložkou'));
    });
    opened[name].catch(() => { opened[name] = null; });
    return opened[name];
  }
  async function tx(store, mode, fn) {
    try {
      const db = await open(where[store]);
      return await new Promise((res, rej) => {
        const t = db.transaction(store, mode);
        const req = fn(t.objectStore(store));
        t.oncomplete = () => res(req && req.result);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error('transakce zrušena'));
      });
    } catch (e) { console.warn('IndexedDB nedostupná', e); return null; }
  }
  return {
    get: (s, k) => tx(s, 'readonly', (o) => o.get(k)),
    set: (s, k, v) => tx(s, 'readwrite', (o) => o.put(v, k)),
    del: (s, k) => tx(s, 'readwrite', (o) => o.delete(k)),
    all: (s) => tx(s, 'readonly', (o) => o.getAll()),
    keys: (s) => tx(s, 'readonly', (o) => o.getAllKeys())
  };
})();

/* ------------------ mezipaměť map stažených z Disku ---------------------- */
/* Při každém připojení se dřív stahovaly všechny mapy znovu. Teď se stáhne jen to,
   co má na Disku jiné datum změny – zbytek se vezme odsud. Ukládá se přesně ten text,
   který leží na Disku (u šifrovaných map tedy šifrovaný). */
const DocCache = {
  async get(id, stamp) {
    const c = await IDB.get('cache', id);
    return c && c.stamp === stamp && typeof c.text === 'string' ? c.text : null;
  },
  put(id, stamp, text) { if (id && stamp) return IDB.set('cache', id, { stamp, text, t: Date.now() }); },
  del(id) { return IDB.del('cache', id); },
  async prune(keep) {
    const keys = (await IDB.keys('cache')) || [];
    keys.forEach((k) => { if (!keep.has(k)) IDB.del('cache', k); });
  }
};

/* ------------------ záloha neodeslaných úprav ----------------------------- */
/* Když se uložení na Disk nepovede nebo telefon aplikaci uspí dřív, než se stihne
   odeslat, zůstane poslední stav tady. Při dalším otevření mapy se nabídne. */
const Draft = {
  has: Object.create(null),
  async write(entry) {
    if (!entry || !entry.doc || entry.doc.locked) return;
    if (!(entry.driveId || entry.handle)) return;     // lokální mapy jdou do IndexedDB rovnou
    try {
      const text = await docToText(entry.doc);
      await IDB.set('drafts', entry.key, {
        base: entry.remoteMod != null ? entry.remoteMod : String(entry.modified || ''),
        saved: Date.now(), title: entry.doc.title, text
      });
      this.has[entry.key] = 1;
    } catch (e) { console.warn('záloha úprav selhala', e); }
  },
  async read(entry) { return entry ? IDB.get('drafts', entry.key) : null; },
  async clear(key, always) {
    if (!key || !(always || this.has[key])) return;
    delete this.has[key];
    await IDB.del('drafts', key);
  }
};

/* ---------------------------- Store -------------------------------------- */
/* Tři možné zdroje map:
     'fs'    – složka v počítači (File System Access API)
     'drive' – složka na Google Disku
     'local' – jen paměť prohlížeče (záloha pro Safari a mobily)          */

const Store = {
  dir: null,          // FileSystemDirectoryHandle
  dirName: '',
  drive: false,       // pracujeme s Google Diskem?
  entries: [],
  locked: 0,          // kolik map je zamčených (chybí heslo)
  scanErrors: 0,      // kolik map se při posledním načtení nepodařilo stáhnout
  GUARD_AGE: 8000,    // po kolika ms si před zápisem znovu ověřit, že soubor nezměnil někdo jiný

  sourceId() {
    if (this.drive) return 'drive:' + (Drive.folderId || '?');
    if (this.dir) return 'fs:' + this.dirName;
    return 'local';
  },
  get mode() { return this.drive ? 'drive' : (this.dir ? 'fs' : 'local'); },

  /* --- oprávnění ke složce --- */
  async ensurePermission(handle, write) {
    if (!handle || !handle.queryPermission) return true;
    const opts = { mode: write ? 'readwrite' : 'read' };
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  },

  /* --- výběr složky v počítači --- */
  async pickFolder() {
