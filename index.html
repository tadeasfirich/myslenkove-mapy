function modal(html, onReady) {
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.addEventListener('click', (e) => { if (e.target === scrim) close(); });
  scrim.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  if (onReady) onReady(scrim, close);
  const first = scrim.querySelector('input,button.primary');
  if (first) setTimeout(() => first.focus(), 30);
  return { el: scrim, close };
}

/* ---------------------- nastavení ---------------------- */
function showSettings() {
  Drive.loadConfig();
  const originOk = Drive.originOk();
  const cryptOn = Crypt.on;

  const html =
    '<header>Nastavení</header>' +
    '<div class="mbody">' +
      '<div class="label">Google Disk</div>' +
      (originOk
        ? '<p class="tiny" style="margin-top:0">Vlož ID klienta OAuth ze svého projektu v Google Cloud. ' +
          'Aplikace si řekne jen o oprávnění <code>drive.file</code> – vidí tedy výhradně soubory, které sama vytvoří.</p>' +
          '<label class="field"><span>ID klienta</span>' +
          '<input class="input" id="setClientId" placeholder="123456789-abc.apps.googleusercontent.com" spellcheck="false"></label>' +
          '<p class="tiny">Do <strong>Authorized JavaScript origins</strong> v Google Cloud patří přesně: <code>' +
          esc(location.origin) + '</code></p>'
        : '<p class="tiny" style="margin-top:0"><strong>Tady Disk nepůjde.</strong> ' +
          'Google povoluje přihlášení jen na adrese <code>https://…</code> nebo <code>http://localhost</code>. ' +
          'Tenhle soubor běží jako <code>' + esc(location.protocol) + '</code>, takže Disk se dá použít až ' +
          'z verze nahrané na web (např. GitHub Pages).</p>') +

      '<hr class="rule-thin">' +
      '<div class="label">Šifrování map</div>' +
      (Crypt.supported()
        ? '<p class="tiny" style="margin-top:0">Mapy se před uložením zašifrují heslem (AES-GCM 256, klíč z hesla přes PBKDF2). ' +
          'Kdo se dostane k souborům, uvidí jen nesmyslná data.<br>' +
          '<strong>Heslo nikde neleží a nejde obnovit – když ho zapomeneš, mapy jsou nenávratně pryč.</strong></p>' +
          (cryptOn
            ? '<p class="tiny" style="color:var(--accent)">Šifrování je <strong>zapnuté</strong>' +
              (Crypt.ready ? ' a odemčené.' : ', ale mapy jsou v téhle záložce zamčené.') + '</p>' +
              '<button class="btn" id="setCryptOff" style="width:100%">Vypnout šifrování (mapy se uloží čitelně)</button>'
            : '<label class="field"><span>Heslo</span><input class="input" type="password" id="setPass1" autocomplete="new-password"></label>' +
              '<label class="field"><span>Heslo znovu</span><input class="input" type="password" id="setPass2" autocomplete="new-password"></label>' +
              '<button class="btn" id="setCryptOn" style="width:100%">Zapnout šifrování</button>')
        : '<p class="tiny">Tenhle prohlížeč neumí WebCrypto, šifrování není k dispozici.</p>') +
      '<p class="tiny" id="setMsg" style="margin-top:10px"></p>' +
    '</div>' +
    '<footer><span class="tiny" style="margin-right:auto">Verze ' + esc(APP_VERSION) + '</span>' +
    '<button class="btn primary" id="setOk">Hotovo</button></footer>';

  modal(html, (root, close) => {
    const msg = $('#setMsg', root);
    const ci = $('#setClientId', root);
    if (ci) ci.value = Drive.clientId || '';

    $('#setOk', root).addEventListener('click', () => {
      if (ci) Drive.saveConfig(ci.value);
      close(); renderLibrary();
    });

    const on = $('#setCryptOn', root);
    if (on) on.addEventListener('click', async () => {
      const a = $('#setPass1', root).value, b = $('#setPass2', root).value;
      if (a.length < 6) { msg.textContent = 'Heslo musí mít aspoň 6 znaků.'; return; }
      if (a !== b) { msg.textContent = 'Hesla se neshodují.'; return; }
      msg.textContent = 'Šifruji mapy…';
      if (ci) Drive.saveConfig(ci.value);
      on.disabled = true;
      try {
        await Saver.settle();
        await Crypt.enable(a);
        await Store.rewriteAll((i, n) => { msg.textContent = 'Šifruji mapy… ' + i + ' / ' + n; });
      } catch (err) {
        console.error(err);
        on.disabled = false;
        msg.textContent = 'Některé mapy se nepodařilo přepsat (' + String((err && err.message) || err).slice(0, 80) +
          '). Šifrování zůstává zapnuté – zkus to znovu, až bude úložiště dostupné.';
        return;
      }
      close(); renderLibrary();
      toast('Mapy jsou od teď šifrované heslem');
    });

    const off = $('#setCryptOff', root);
    if (off) off.addEventListener('click', async () => {
      if (!Crypt.ready) { msg.textContent = 'Nejdřív mapy odemkni heslem.'; return; }
      if (!confirm('Opravdu vypnout šifrování? Mapy se uloží čitelně.')) return;
      msg.textContent = 'Přepisuji mapy…';
      off.disabled = true;
      Crypt.on = false; Crypt.saveSettings();
      try {
        await Saver.settle();
        await Store.rewriteAll((i, n) => { msg.textContent = 'Přepisuji mapy… ' + i + ' / ' + n; });
      } catch (err) {
        console.error(err);
        Crypt.on = true; Crypt.saveSettings();          // nedokončeno – nech šifrování zapnuté
        off.disabled = false;
        msg.textContent = 'Nepodařilo se přepsat všechny mapy (' + String((err && err.message) || err).slice(0, 80) + '). Zkus to znovu.';
        return;
      }
      Crypt.disable();
      close(); renderLibrary();
      toast('Šifrování vypnuto');
    });
  });
}

/* ---------------------- odemknutí ---------------------- */
function showUnlock(after) {
  const locked = Store.entries.find((e) => e.doc && e.doc.locked);
  const html =
    '<header>Zadej heslo k mapám</header>' +
    '<div class="mbody">' +
      '<p class="tiny" style="margin-top:0">Mapy v tomhle úložišti jsou zašifrované. Bez hesla je nejde otevřít ani zobrazit náhled.</p>' +
      '<label class="field"><span>Heslo</span><input class="input" type="password" id="unlockPass" autocomplete="current-password"></label>' +
      '<p class="tiny" id="unlockMsg"></p>' +
    '</div>' +
    '<footer><button class="btn" id="unlockCancel">Zrušit</button>' +
    '<button class="btn primary" id="unlockOk">Odemknout</button></footer>';

  modal(html, (root, close) => {
    const inp = $('#unlockPass', root), msg = $('#unlockMsg', root);
    const go = async () => {
      msg.textContent = 'Ověřuji…';
      const salt = locked && locked.doc.salt ? locked.doc.salt : Crypt.salt;
      const iter = locked && locked.doc.iter ? locked.doc.iter : Crypt.ITER;
      await Crypt.unlock(inp.value, salt, iter);
      Crypt.on = true; Crypt.saveSettings();
      if (Store.drive) await Store.scan();
      else if (Store.dir) await Store.scan();
      else await Store.loadLocal();
      if (Store.locked) {
        Crypt.lock();
        msg.textContent = 'Špatné heslo.';
        return;
      }
      close(); renderLibrary();
      toast('Mapy odemčené');
      if (after) after();
    };
    $('#unlockOk', root).addEventListener('click', go);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
    $('#unlockCancel', root).addEventListener('click', close);
  });
}

/* ---- 57-sync.js ---- */
/* ============================================================
   Průběžná synchronizace – změny z jiného zařízení
   ------------------------------------------------------------
   Každých pár desítek vteřin (a hned po návratu do záložky)
   se zeptáme úložiště, jestli se něco nezměnilo. Je to jeden
   malý dotaz na seznam souborů; stahuje se jen to, co má jiné
   datum změny.
   ============================================================ */

const Sync = {
  INTERVAL: 20000,       // jak často kontrolovat (ms)
  MIN_GAP: 4000,         // minimální odstup dvou kontrol
  timer: null,
  busy: false,
  last: 0,
  authLost: false,
  barKind: '',           // 'save' | 'conflict' | 'auth' | 'draft'
  conflict: null,        // {entry, doc} – dokud je nastavené, automatické ukládání stojí

  start() {
    this.stop();
    if (!Store.drive && !Store.dir) return;
    this.timer = setInterval(() => this.now(), this.INTERVAL);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },

  setStatus(txt) {
    const el = $('#syncState');
    if (!el) return;
    el.textContent = txt || '';
    el.classList.toggle('hidden', !txt);
  },

  /** force = hned a i na pozadí; quiet = bez hlášky „nic nového“ */
  async now(force, quiet) {
    if (this.busy || this.authLost) return;
    if (!Store.drive && !Store.dir) return;
    if (!force && document.hidden) return;
    if (!force && Date.now() - this.last < this.MIN_GAP) return;
    /* zrovna se ukládá – seznam z Disku by byl o krok pozadu a vlastní zápis by vypadal
       jako cizí změna. Počkáme (ruční kontrola), nebo to necháme na příště. */
    if (Saver.busy) { if (!force) return; await Saver.settle(); }
    this.busy = true;
    const btn = $('#btnSync');
    if (btn) btn.classList.add('spin');
    try {
      const openEntry = $('#editor').classList.contains('hidden') ? null : App.entry;
      const res = await Store.poll(openEntry);
      this.last = Date.now();
      if (res && (res.changed.length || res.added.length || res.removed.length)) {
        this.apply(res);
      } else if (force && !quiet) {
        toast('Nic nového, všechno je aktuální');
      }
    } catch (err) {
      const msg = String((err && err.message) || err);
      if (err && err.auth) {
        this.authLost = true; this.stop(); this.showAuthBar();
      } else {
        console.warn('synchronizace:', msg);
        if (force && !quiet) toast('Nepodařilo se zkontrolovat změny: ' + msg.slice(0, 120), 4000);
      }
    } finally {
      this.busy = false;
      if (btn) btn.classList.remove('spin');
    }
  },

  apply(res) {
    const inEditor = !$('#editor').classList.contains('hidden');
    const mine = App.entry;

    if (mine && res.removed.indexOf(mine) >= 0) {
      if (inEditor && App.dirty) {
        /* soubor zmizel, ale na obrazovce jsou neuložené úpravy – nezahodíme je */
        mine.driveId = null; mine.handle = null; mine.remoteMod = null;
        if (Store.entries.indexOf(mine) < 0) Store.entries.unshift(mine);
        toast('Tahle mapa byla jinde smazaná – tvoje úpravy ji ukládám jako nový soubor', 6000);
        Saver.flush('always');
      } else {
        if (inEditor) toast('Tahle mapa byla smazaná na jiném zařízení', 5000);
        App.entry = null; App.doc = null;
        if (inEditor) { showLibrary(); return; }
      }
    }

    const hit = res.changed.find((c) => c.entry === mine && c.doc);
    if (inEditor && hit) {
      if (App.dirty || Saver.pending()) { this.showConflict(hit.entry, hit.doc); }
      else { this.adopt(hit.entry, hit.doc); toast('Mapa aktualizovaná podle jiného zařízení'); }
    }

    if (!inEditor) {
      renderLibrary();
      const n = res.changed.length + res.added.length + res.removed.length;
      this.setStatus('');
      toast(n === 1 ? 'Knihovna aktualizovaná' : 'Knihovna aktualizovaná (' + n + ' ' + plural(n, 'změna', 'změny', 'změn') + ')');
    }
  },

  /** převezme cizí verzi otevřené mapy, ale nechá uživateli jeho výřez plátna */
  adopt(entry, doc, keepDraft) {
    this.conflict = null;
    if (doc.locked) { showLibrary(); return; }
    const keepView = clone(App.doc.view);
    const selNodes = Array.from(App.sel), selEdges = Array.from(App.selEdges);
    App.suppressSave = true;
    clearTimeout(Saver.timer); Saver.timer = null;
    clearTimeout(Saver.retryTimer); Saver.retryTimer = null;
    Saver.fails = 0; Saver.since = 0;
    lastSnap = null;
    entry.doc = doc;
    entry.title = doc.title;
    entry.savedKey = contentKey(doc);
    App.doc = doc;
    App.doc.view = keepView;
    App.sizes = Object.create(null);
    nodeEls.forEach((el) => el.remove()); nodeEls.clear();
    App.undoStack.length = 0; App.redoStack.length = 0; updateHistoryButtons();
    ImgPool.reset();
    $('#docTitle').value = doc.title;
    renderNodes();
    applyView();
    App.sel = new Set(selNodes.filter((id) => getNode(id)));
    App.selEdges = new Set(selEdges.filter((id) => getEdge(id)));
    inspKey = '';
    refreshSelection();
    App.dirty = false;
    if (!keepDraft) Draft.clear(entry.key, true);
    setSaveState('Načteno z úložiště ' + fmtDate(Date.now()), false, 'ok');
    this.hideBar();
    requestAnimationFrame(() => { measure(); App.suppressSave = false; });
  },

  /* ---------------- lišta s hlášením ---------------- */
  bar(html, actions) {
    let b = $('#syncBar');
    if (!b) {
      b = document.createElement('div');
      b.id = 'syncBar'; b.className = 'syncbar';
      b.setAttribute('role', 'status');
      els.canvas.appendChild(b);
    }
    b.innerHTML = '<span>' + html + '</span>';
    (actions || []).forEach((a) => {
      const btn = document.createElement('button');
      btn.className = 'btn sm' + (a.primary ? ' primary' : '');
      btn.textContent = a.label;
      btn.addEventListener('click', a.fn);
      b.appendChild(btn);
    });
    b.classList.remove('hidden');
    return b;
  },
  hideBar() { const b = $('#syncBar'); if (b) b.classList.add('hidden'); this.barKind = ''; },

  showConflict(entry, doc) {
    this.conflict = { entry, doc };
    this.barKind = 'conflict';
    if (App.entry === entry) setSaveState('Čeká na tvoje rozhodnutí', true, 'err');
    this.bar('Mapa se mezitím změnila na jiném zařízení a ty tu máš neuložené úpravy. Dokud nevybereš, nic se nepřepíše.', [
      { label: 'Načíst jejich verzi', fn: () => this.adopt(entry, doc) },
      { label: 'Nechat moji', primary: true, fn: async () => {
        this.conflict = null;
        this.hideBar();
        App.dirty = true;
        const ok = await Saver.flush('force');
        toast(ok ? 'Uloženo – tvoje verze přepsala tu druhou' : 'Uložení se nepovedlo, zkusím to znovu', 4000);
      } }
    ]);
  },

  showAuthBar() {
    this.barKind = 'auth';
    this.bar('Přihlášení ke Google Disku vypršelo.' + (App.dirty ? ' Úpravy počkají v tomhle zařízení.' : ''), [
      { label: 'Přihlásit znovu', primary: true, fn: async () => {
        try {
          await Drive.signIn(true);
          this.authLost = false; this.hideBar(); this.start();
          toast('Připojeno');
          if (this.conflict) this.showConflict(this.conflict.entry, this.conflict.doc);
          else if (App.dirty) Saver.run();
          else this.now(true, true);
        } catch (e) { toast('Přihlášení se nezdařilo: ' + String((e && e.message) || e).slice(0, 90), 5000); }
      } }
    ]);
    if ($('#library').classList.contains('hidden')) return;
    toast('Přihlášení ke Google Disku vypršelo – klepni na Google Disk', 5000);
  },

  /* token si obnovíme potichu při běžném kliknutí uživatele, ať nic neblokuje popup */
  hookGestureRefresh() {
    let running = false;
    const h = async () => {
      /* při každém doteku zkontrolujeme, jestli nám něco neuteklo */
      if (Date.now() - this.last > this.INTERVAL) this.now();
      if (running || !Store.drive || !Drive.connected) return;
      if (Date.now() < Drive.expiresAt - 10 * 60 * 1000) return;
      running = true;
      try {
        await Drive.signIn(false);
        const was = this.authLost;
        this.authLost = false;
        if (this.barKind === 'auth') this.hideBar();
        this.start();
        if (was && App.dirty) Saver.run();
      } catch (e) { /* zkusíme příště */ }
      finally { running = false; }
    };
    document.addEventListener('pointerdown', h, true);
    document.addEventListener('keydown', h, true);
  }
};

function showLibrary(fromPop) {
  if (App.entry) {
    endTextEdit();
    if (App.dirty) { Draft.write(App.entry); Saver.flush(); }
  }
  if (!fromPop) {
    /* odchod z mapy tlačítkem v aplikaci – srovnáme i historii prohlížeče */
    if (ImageSheet.isOpen()) ImageSheet.hide();
    if (Nav.is('sheet')) history.go(-2);
    else if (Nav.is('editor')) history.back();
  }
  hideContextMenu();
  $('#library').classList.remove('hidden');
  $('#editor').classList.add('hidden');
  $$('.editor-only').forEach((e) => e.classList.add('hidden'));
  Sync.hideBar();
  renderLibrary();
  setTimeout(() => Sync.now(), 200);
}

function showEditor() {
  $('#library').classList.add('hidden');
  $('#editor').classList.remove('hidden');
  $$('.editor-only').forEach((e) => e.classList.remove('hidden'));
}

let libFilter = '';

function renderLibrary() {
  const grid = $('#libGrid');
  grid.textContent = '';

  if (oldBanner) oldBanner.remove();
  const q = libFilter.trim().toLowerCase();
  const list = !q ? Store.entries : Store.entries.filter((e) => {
    if ((e.title || e.name || '').toLowerCase().includes(q)) return true;
    if (!e.doc || e.doc.locked) return false;
    return e.doc.nodes.some((n) => (n.title + ' ' + n.content).toLowerCase().includes(q));
  });

  const addCard = document.createElement('button');
  addCard.className = 'card new';
  addCard.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
    'stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Nová mapa</span>';
  addCard.addEventListener('click', createMap);
  grid.appendChild(addCard);

  list.forEach((entry) => {
    const card = document.createElement('div');
    card.className = 'card';
    if (entry.doc && entry.doc.locked) {
      card.innerHTML =
        '<div class="thumb" style="display:grid;place-items:center">' +
        '<svg viewBox="0 0 24 24" style="width:34px;height:34px;fill:none;stroke:var(--fg-3);stroke-width:1.6">' +
        '<rect x="5" y="10.5" width="14" height="9" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg></div>' +
        '<div class="meta"><h3></h3><div class="sub"><span>zašifrovaná mapa</span><span>' +
        esc(fmtDate(entry.modified)) + '</span></div></div>';
      card.querySelector('h3').textContent = entry.name;
      card.addEventListener('click', () => showUnlock());
      grid.appendChild(card);
      return;
    }
    const nodes = entry.doc.nodes.length, edges = entry.doc.edges.length;
    card.innerHTML =
      thumbSVG(entry.doc, 320, 200) +
      '<div class="meta"><h3></h3><div class="sub"><span>' +
      nodes + ' ' + plural(nodes, 'buňka', 'buňky', 'buněk') + '</span><span>' +
      edges + ' ' + plural(edges, 'vazba', 'vazby', 'vazeb') + '</span><span>' +
      esc(fmtDate(entry.modified)) + '</span></div></div>' +
      '<div class="acts"></div>';
    card.querySelector('h3').textContent = entry.doc.title;
    card.querySelector('h3').title = entry.path || entry.name;

    const acts = card.querySelector('.acts');
    const mk = (icon, title, fn, danger) => {
      const b = document.createElement('button');
      b.className = 'btn ghost sm' + (danger ? ' danger' : '');
      b.innerHTML = icon; b.title = title; b.setAttribute('aria-label', title);
      b.addEventListener('click', (ev) => { ev.stopPropagation(); fn(); });
      acts.appendChild(b);
    };
    const fail = (what, err) => {
      console.error(err);
      if (err && err.auth) { Sync.authLost = true; Sync.stop(); }
      toast(what + ': ' + String((err && err.message) || err).slice(0, 120), 5000);
      renderLibrary();
    };
    mk(ICONS.pencil, 'Přejmenovat mapu i soubor', async () => {
      const t = prompt('Nový název mapy:', entry.doc.title);
      if (t === null || !t.trim() || t.trim() === entry.doc.title) return;
      const old = entry.doc.title;
      try {
        await Saver.settle();
        entry.doc.title = t.trim();
        await Store.write(entry, { guard: true });
        entry.savedKey = contentKey(entry.doc);
        await Store.renameFile(entry);
        renderLibrary();
      } catch (err) { entry.doc.title = old; entry.title = old; fail('Přejmenování se nepovedlo', err); }
    });
    mk(ICONS.copy, 'Vytvořit kopii', async () => {
      try { await Store.duplicate(entry); renderLibrary(); toast('Kopie vytvořena'); }
      catch (err) { fail('Kopii se nepodařilo vytvořit', err); }
    });
    mk(ICONS.download, 'Stáhnout soubor mapy', () => downloadDoc(entry.doc, entry.name));
    mk(ICONS.trash, 'Smazat mapu', async () => {
      if (!confirm('Opravdu smazat mapu „' + entry.doc.title + '“?\nSoubor ' + entry.name +
        (entry.driveId ? ' se přesune do koše na Disku.' : ' bude odstraněn.'))) return;
      try {
        await Saver.settle();
        if (App.entry === entry) { App.entry = null; App.doc = null; App.dirty = false; }
        await Store.remove(entry); renderLibrary(); toast('Mapa smazána');
      } catch (err) { fail('Mapu se nepodařilo smazat', err); }
    }, true);

    card.addEventListener('click', () => openMap(entry));
    grid.appendChild(card);
  });

  $('#libEmpty').classList.toggle('hidden', list.length > 0);

  const fp = $('#folderPath');
  const count = Store.entries.length + ' ' + plural(Store.entries.length, 'mapa', 'mapy', 'map');
  const lock = (Crypt.on ? (Crypt.ready ? '  ·  šifrováno' : '  ·  zamčeno') : '') +
    (Store.drive && Store.scanErrors ? '  ·  ' + Store.scanErrors + ' ' +
      plural(Store.scanErrors, 'mapu', 'mapy', 'map') + ' se nepodařilo načíst' : '');
  const checked = Sync.last ? '  ·  ověřeno ' + fmtDate(Sync.last).replace('dnes ', '') : '';
  if (Store.drive) fp.innerHTML = 'Google Disk › <a href="' + Drive.folderUrl() +
    '" target="_blank" rel="noopener">' + esc(Drive.folderName) + '</a>  ·  ' + count + lock + checked;
  else if (Store.dir) fp.textContent = 'Složka: ' + Store.dirName + '  ·  ' + count + lock + checked;
  else if (!HAS_FS) fp.textContent = 'Mapy se ukládají do prohlížeče (tento prohlížeč neumí zapisovat přímo do složky).';
  else fp.textContent = 'Žádná složka není vybraná';

  /* naposledy se pracovalo s Diskem (nebo složky tenhle prohlížeč neumí) -> Disk je hlavní tlačítko.
     Přihlášení se z bezpečnostních důvodů neukládá, proto ho po spuštění jedno klepnutí obnoví. */
  const wantDrive = !Store.drive && !Store.dir && Drive.originOk() && !!Drive.clientId &&
    (localStorage.getItem('mm.drive.last') === '1' || !HAS_FS || isCoarse());
  $('#btnDrive').classList.toggle('primary', wantDrive);
  $('#btnPickFolder').classList.toggle('primary', !wantDrive && !Store.drive);

  const emptyP = $('#libEmpty p');
  if (emptyP) emptyP.textContent = q ? 'Hledání nic nenašlo.'
    : wantDrive && localStorage.getItem('mm.drive.last') === '1' ? 'Tvoje mapy čekají na Google Disku – připoj ho tlačítkem nahoře.'
      : (Store.drive || Store.dir) ? 'Ve složce zatím není žádná mapa. Založ první list.'
        : 'Zatím tu není žádná mapa. Založ první list.';

  const eb = $('#libEyebrow');
  if (eb) eb.textContent = 'Myšlenkové mapy · ' + (Store.drive ? 'Google Disk' : Store.dir ? 'složka v počítači' : 'paměť prohlížeče');

  const lead = $('#libLead');
  if (lead) {
    if (wantDrive && localStorage.getItem('mm.drive.last') === '1')
      lead.textContent = 'Minule jsi pracoval s Google Diskem. Klepni na Připojit Google Disk a mapy se načtou – stáhne se jen to, co se od minula změnilo.';
    else if (Store.drive) lead.textContent = 'Mapy se ukládají do složky na tvém Google Disku a jsou tak dostupné z každého počítače, kde se přihlásíš.';
    else if (Store.dir) lead.textContent = 'Mapy se ukládají do vybrané složky v počítači. Změny se zapisují průběžně samy.';
    else if (HAS_FS) lead.textContent = 'Vyber složku v počítači nebo se připoj ke Google Disku – aplikace v ní najde všechny mapy, zobrazí je jako miniatury a změny do nich průběžně ukládá.';
  }

  checkLeftovers();

  const od = $('#btnOpenDrive');
  if (od) {
    od.classList.toggle('hidden', !Store.drive);
    if (Store.drive) od.href = Drive.folderUrl();
  }

  const dl = $('#driveLabel');
  if (dl) dl.textContent = Store.drive ? 'Odpojit Disk'
    : (!Drive.originOk() ? 'Google Disk (jen na webu)' : wantDrive ? 'Připojit Google Disk' : 'Google Disk');
  $('#btnDrive').setAttribute('aria-pressed', String(Store.drive));

  if (Store.locked && !Crypt.ready) {
    const b = document.createElement('div');
    b.className = 'empty'; b.id = 'lockBanner';
    b.innerHTML = '<p>Zašifrovaných map: ' + Store.locked + '. Zadej heslo a uvidíš je.</p>';
    const btn = document.createElement('button');
    btn.className = 'btn primary'; btn.textContent = 'Odemknout heslem';
    btn.addEventListener('click', () => showUnlock());
    b.appendChild(btn);
    $('#libEmpty').classList.add('hidden');
    grid.parentElement.appendChild(b);
  }
}

/** mapy, které zůstaly jen v prohlížeči, i když jsme připojení k Disku/složce */

    btn.disabled = true; btn.textContent = 'Nahrávám…';

      renderLibrary();
      toast('Přeneseno: ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map'));
    } catch (err) {
      toast('Přenos selhal: ' + (err && err.message ? err.message : err), 5000);
      btn.disabled = false; btn.textContent = 'Zkusit znovu';
    }
  });
  bar.appendChild(btn);
  const fb = $('.folderbar');
  fb.parentElement.insertBefore(bar, fb.nextSibling);
}

/* ----------------------------- otevření mapy ----------------------------- */
async function openMap(entry) {
  if (entry.doc && entry.doc.locked) { showUnlock(); return; }
  await Saver.settle();                         // ať doběhne ukládání předchozí mapy
  Sync.hideBar(); Sync.conflict = null;
  clearTimeout(Saver.timer); Saver.timer = null;
  clearTimeout(Saver.retryTimer); Saver.retryTimer = null;
  Saver.fails = 0; Saver.since = 0; Saver.level = 0;
  App.entry = entry;
  App.doc = entry.doc;
  App.dirty = false;
  entry.savedKey = contentKey(entry.doc);       // tenhle stav je na úložišti – není co ukládat
  const myView = ViewStore.load(App.doc);       // výřez plátna si pamatuje každé zařízení zvlášť
  if (myView) App.doc.view = myView;
  App.sel.clear(); App.selEdges.clear();
  App.linkGroup = []; App.linkSticky = false;
  if (App.tool === 'link') { App.tool = 'pan'; syncTools(); }
  App.undoStack.length = 0; App.redoStack.length = 0;
  lastSnap = null; ImgPool.reset();
  App.sizes = Object.create(null);
  nodeEls.forEach((el) => el.remove()); nodeEls.clear();
  updateHistoryButtons();
  $('#docTitle').value = App.doc.title;
  showEditor();
  Nav.push('editor');
  App.suppressSave = true;
  renderNodes();
  // přesně obnovíme uložený výřez plátna
  applyView();
  requestAnimationFrame(() => {
    if (App.entry !== entry) return;
    measure();
    if (!App.doc.nodes.length) { fitView(false); }
    else if (entry.fresh) {
      /* nová mapa: první buňka patří doprostřed, ne napůl za levý horní roh */
      entry.fresh = false;
      const n = App.doc.nodes[0], s = nodeSize(n), v = view();
      v.zoom = 1;
      v.x = Math.round(els.canvas.clientWidth / 2 - (n.x + s.w / 2));
      v.y = Math.round(els.canvas.clientHeight / 3 - (n.y + s.h / 2));
      applyView();
    }
    else if (!anythingVisible()) {
      fitView(false);
      if (!myView) toast('Uložený výřez byl mimo obrazovku – mapa je vycentrovaná', 3200);
    }
    App.suppressSave = false;
    setSaveState('Uloženo ' + fmtDate(entry.modified), false, 'ok');
    inspKey = ''; updateInspector();
    checkDraft(entry);
    /* obrázek poslaný přes „Sdílet“ čeká na vložení – nabídneme ho hned */
    if (App.sharedPending) {
      App.sharedPending = false;
      Inbox.list().then((l) => { if (l.length && App.entry === entry) openImageSheet(null); });
    }
  });
}

/** Zůstaly v zařízení úpravy, které se minule nestihly odeslat? Když se mapa mezitím
 *  jinde nezměnila, rovnou je vrátíme; jinak se zeptáme. */
async function checkDraft(entry) {
  let d = null;
  try { d = await Draft.read(entry); } catch (e) { return; }
  if (!d || !d.text || App.entry !== entry) return;
  let doc = null;
  try { doc = await textToDoc(d.text); } catch (e) { doc = null; }
  if (App.entry !== entry) return;
  if (!doc || doc.locked || !doc.nodes || contentKey(doc) === contentKey(entry.doc)) {
    Draft.clear(entry.key, true);
    return;
  }
  const base = entry.remoteMod != null ? entry.remoteMod : String(entry.modified || '');
  const when = fmtDate(d.saved);
  const use = () => {
    const storedKey = entry.savedKey;
    Sync.adopt(entry, doc, true);
    entry.savedKey = storedKey;                 // na úložišti je pořád stará verze
    Draft.has[entry.key] = 1;
    requestAnimationFrame(() => { App.dirty = true; Saver.touch(); });
  };
  if (d.base === base) {
    use();
    toast('Vrátil jsem úpravy z ' + when + ', které se minule nestihly uložit', 5000);
    return;
  }
  Sync.barKind = 'draft';
  Sync.bar('V tomhle zařízení zůstaly neodeslané úpravy téhle mapy (' + esc(when) +
    '), ale mapa se mezitím změnila i jinde.', [
    { label: 'Zahodit je', fn: () => { Draft.clear(entry.key, true); Sync.hideBar(); } },
    { label: 'Použít moje úpravy', primary: true, fn: () => { Sync.hideBar(); use(); } }
  ]);
}

/** je v aktuálním výřezu vidět aspoň kus mapy? (např. po otevření na mobilu) */
function anythingVisible() {
  const v = view(), cw = els.canvas.clientWidth, ch = els.canvas.clientHeight;
  return App.doc.nodes.some((n) => {
    const s = nodeSize(n);
    const x = n.x * v.zoom + v.x, y = n.y * v.zoom + v.y;
    return x < cw - 20 && x + s.w * v.zoom > 20 && y < ch - 20 && y + s.h * v.zoom > 20;
  });
}

async function createMap() {
  try {
    /* mapu založíme rovnou i s první buňkou – jeden zápis na Disk místo dvou */
    const doc = newDoc('Nová mapa');
    const n1 = newNode(-105, -20, 'Ústřední téma');
    n1.color = 'blue';
    doc.nodes.push(n1);
    const entry = await Store.createFrom(doc);
    entry.fresh = true;                         // první buňku po otevření vystředíme
    await openMap(entry);
    setTimeout(() => { setSel(n1.id); editTitle(n1); }, 60);
  } catch (err) {
    console.error(err);
    toast('Nepodařilo se vytvořit mapu: ' + err.message, 4000);
  }
}

async function manualSave() {
  if (!App.entry) return;
  endTextEdit();
  const ok = await Saver.flush('always');
  if (!ok) { if (!Sync.barKind) toast('Uložení se nepovedlo – zkusím to znovu', 4000); return; }
  if (App.entry.driveId) toast('Uloženo na Google Disk (' + App.entry.name + ')');
  else if (App.entry.handle) toast('Uloženo do souboru ' + App.entry.name);
  else { toast('Uloženo do prohlížeče – stahuji kopii'); downloadDoc(App.doc, App.entry.name); }
}

async function doImport(files) {
  if (!files || !files.length) return;
  toast('Načítám ' + files.length + ' ' + plural(files.length, 'soubor', 'soubory', 'souborů') + '…');
  let n = 0;
  try { n = await Store.importFiles(files); }
  catch (err) { toast('Import selhal: ' + (err && err.message ? err.message : err), 5000); return; }
  renderLibrary();
  if (n) toast('Naimportováno ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map'));
  else toast('V souborech nebyla nalezena žádná mapa (umím .mapa.json, .canvas, .orgpage, .edn)', 5000);
}

/* ----------------------------- Google Disk -------------------------------- */
async function connectDrive() {
  if (Store.drive) {
    await Saver.flush();
    Sync.stop();
    Store.disconnectDrive();
    localStorage.removeItem('mm.drive.last');
    await Store.loadLocal(true);
    renderLibrary();
    toast('Google Disk odpojen');
    return;
  }
  Drive.loadConfig();
  if (!Drive.originOk()) {
    toast('Přihlášení Googlem funguje jen na https nebo localhost – viz Nastavení', 5000);
    showSettings();
    return;
  }
  if (!Drive.clientId) { showSettings(); return; }
  const btn = $('#btnDrive');
  btn.disabled = true;
  $('#driveLabel').textContent = 'Připojuji…';
  try {
    await Store.connectDrive();
    localStorage.setItem('mm.drive.last', '1');
    Drive.rememberAccount();
    Sync.authLost = false; Sync.last = Date.now(); Sync.start();
    renderLibrary();
    toast(Store.scanErrors
      ? 'Připojeno, ale ' + Store.scanErrors + ' ' + plural(Store.scanErrors, 'mapu', 'mapy', 'map') +
        ' se nepodařilo načíst – zkus Obnovit'
      : 'Připojeno – složka „' + Drive.folderName + '“ na Google Disku', Store.scanErrors ? 6000 : 2600);
    if (Store.locked && !Crypt.ready) showUnlock();
  } catch (err) {
    console.error(err);
    toast('Disk se nepřipojil: ' + (err && err.message ? err.message : err), 6000);
    renderLibrary();
  } finally {
    btn.disabled = false;
    renderLibrary();
  }
}

/* ----------------------------- složka ------------------------------------ */
async function pickFolder() {
  if (!HAS_FS) { $('#dirImport').click(); return; }
  try {
    await Store.pickFolder();
    $('#btnReconnect').classList.add('hidden');

    console.error(err);

  }
}

/* --------------------- vkládání ze schránky (Ctrl+V) ---------------------- */
/** kam vložit novou buňku – pod ukazatel, jinak doprostřed plátna */
function pasteSpot() {
  const r = els.canvas.getBoundingClientRect();
  const p = App.lastPointer && App.lastPointer.x > r.left && App.lastPointer.x < r.right &&
    App.lastPointer.y > r.top && App.lastPointer.y < r.bottom
    ? App.lastPointer
    : { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  return screenToWorld(p.x, p.y);
}

async function onPaste(ev) {
  if ($('#editor').classList.contains('hidden')) return;
  const t = ev.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const dt = ev.clipboardData;
  if (!dt) return;

  /* --- obrázek --- */
  let file = null;
  const items = dt.items ? Array.from(dt.items) : [];
  for (const it of items) {
    if (it.kind === 'file' && /^image\//.test(it.type)) { file = it.getAsFile(); break; }
  }
  if (!file && dt.files && dt.files.length && /^image\//.test(dt.files[0].type)) file = dt.files[0];

  if (file) {
    ev.preventDefault();
    const sel = Array.from(App.sel);
    await insertImageFiles([file], {
      nodeId: sel.length === 1 && getNode(sel[0]) ? sel[0] : null,
      at: pasteSpot()
    });
    return;
  }

  /* --- text --- */
  const text = (dt.getData('text/plain') || '').replace(/\r\n?/g, '\n').trim();
  if (!text) return;
  ev.preventDefault();
  const sel = Array.from(App.sel);
  pushUndo();
  if (sel.length === 1 && getNode(sel[0])) {
    const n = getNode(sel[0]);
    n.content = n.content ? n.content + '\n' + text : text;
    n.open = true;
    paintNode(n); measure();
    toast('Text přidán do obsahu buňky');
  } else {
    const p = pasteSpot();
    const lines = text.split('\n');
    const n = newNode(Math.round(p.x - 120), Math.round(p.y - 30),
      lines[0].slice(0, 120) || 'Vložený text');
    const rest = lines.slice(1).join('\n').trim();
    if (rest) { n.content = rest; n.open = true; }
    App.doc.nodes.push(n);
    renderNodes(); setSel(n.id);
    toast('Vložený text jako nová buňka');
  }
  scheduleSave(); updateInspector(true);
}

/* ----------------------------- start ------------------------------------- */
async function init() {
  console.log('Myšlenkové mapy – verze ' + APP_VERSION);
  cacheEls();
  initTheme();
  initCanvasEvents();
  initKeys();

  /* horní lišta */
  $('#btnHome').addEventListener('click', () => showLibrary());
  els.saveState.addEventListener('click', () => {
    if (!App.entry) return;
    if (App.dirty && !Saver.busy) Saver.run();
    toast(els.saveState.title || 'Uloženo');
  });
  $('#btnUndo').addEventListener('click', undo);
  $('#btnRedo').addEventListener('click', redo);
  $('#btnHelp').addEventListener('click', showHelp);
  $('#btnSync').addEventListener('click', () => Sync.now(true));

  const dt = $('#docTitle');
  dt.addEventListener('focus', beginTextEdit);
  dt.addEventListener('input', () => { if (!App.doc) return; App.doc.title = dt.value; scheduleSave(); });
  dt.addEventListener('blur', async () => {
    endTextEdit();
    const entry = App.entry;
    if (!entry) return;
    /* nejdřív uložit obsah, teprve pak přejmenovat soubor – ne obojí naráz */
    const ok = await Saver.flush();
    if (ok && App.entry === entry) { await Store.renameFile(entry); inspKey = ''; updateInspector(); }
  });
  dt.addEventListener('keydown', (e) => { if (e.key === 'Enter') dt.blur(); });

  /* knihovna */
  $('#btnPickFolder').addEventListener('click', pickFolder);
  $('#btnReconnect').addEventListener('click', async () => {
    if (await Store.reconnect()) { $('#btnReconnect').classList.add('hidden'); renderLibrary(); }
  });
  $('#btnRescan').addEventListener('click', async () => {
    const btn = $('#btnRescan');
    btn.disabled = true;
    try {
      if (Store.drive || Store.dir) {
        await Store.scan();
        Sync.last = Date.now();
        toast(Store.drive ? 'Načteno z Google Disku (' + Store.entries.length + ' ' +
          plural(Store.entries.length, 'mapa', 'mapy', 'map') + ')' : 'Složka načtena znovu');
      } else {
        await Store.loadLocal(true);
        toast('Obnoveno');
      }
    } catch (err) {
      console.error(err);
      toast('Obnovení selhalo: ' + (err && err.message ? err.message : err), 5000);
    } finally {
      btn.disabled = false;
      renderLibrary();
    }
  });
  $('#libFilter').addEventListener('input', (e) => { libFilter = e.target.value; renderLibrary(); });
  $('#btnSettings').addEventListener('click', showSettings);
  $('#btnDrive').addEventListener('click', connectDrive);
  $('#btnImport').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', async (e) => {
    await doImport(e.target.files);
    e.target.value = '';
  });

  /* přetažení souborů rovnou do knihovny */
  const lib = $('#library');
  lib.addEventListener('dragover', (ev) => { ev.preventDefault(); lib.classList.add('dropping'); });
  lib.addEventListener('dragleave', (ev) => { if (ev.target === lib) lib.classList.remove('dropping'); });
  lib.addEventListener('drop', async (ev) => {
    ev.preventDefault(); lib.classList.remove('dropping');
    if (ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) await doImport(ev.dataTransfer.files);
  });
  $('#dirImport').addEventListener('change', async (e) => {
    const n = await Store.importFiles(e.target.files);
    e.target.value = '';
    renderLibrary();
    toast(n ? 'Načteno ' + n + ' ' + plural(n, 'mapa', 'mapy', 'map') + ' ze složky' : 'Ve složce nejsou mapy');
  });

  /* nástrojová lišta */
  $('#tAdd').addEventListener('click', () => {
    const r = els.canvas.getBoundingClientRect();
    const p = screenToWorld(r.left + r.width / 2, r.top + r.height / 3);
    const n = addNode(p.x - NODE_W / 2, p.y, { title: '' });
    setTimeout(() => editTitle(n), 10);
  });
  $('#tLink').addEventListener('click', () => {
    App.tool = App.tool === 'link' ? 'pan' : 'link';
    if (App.tool === 'link') {
      App.linkGroup = Array.from(App.sel);
      App.linkSticky = App.linkGroup.length > 1;
      toast(App.linkGroup.length > 1
        ? 'Klepni na buňku, se kterou se spojí všech ' + App.linkGroup.length + ' vybraných'
        : (App.linkGroup.length === 1
            ? 'Klepni na buňku, se kterou se má vybraná spojit'
            : 'Klepni na dvě buňky a spojí se'));
    } else { App.linkGroup = []; App.linkSticky = false; }
    refreshSelection(); syncTools();
  });
  $('#tSelect').addEventListener('click', () => {
    App.tool = App.tool === 'select' ? 'pan' : 'select';
    syncTools();
  });
  $('#tFit').addEventListener('click', () => fitView(true));
  $('#tPanel').addEventListener('click', () => toggleInspector());
  $('#tMore').addEventListener('click', (ev) => {
    const r = ev.currentTarget.getBoundingClientRect();
    const c = canvasCenter();
    showContextMenu(r.left - 40, r.top - 12, App.sel.size > 0, screenToWorld(c.x, c.y));
  });
  $('#inspClose').addEventListener('click', () => toggleInspector(false));
  $('#tImage').addEventListener('click', () => openImageSheet());
  $('#zIn').addEventListener('click', () => { const c = canvasCenter(); zoomAt(c.x, c.y, 1.25); });
  $('#zOut').addEventListener('click', () => { const c = canvasCenter(); zoomAt(c.x, c.y, 1 / 1.25); });

  /* odškrtnutí úkolu přímo v buňce */
  els.nodes.addEventListener('click', (ev) => {
    const cb = ev.target.closest('.md-cb');
    if (!cb) return;
    ev.preventDefault(); ev.stopPropagation();
    const host = cb.closest('.node'); if (!host) return;
    const n = getNode(host.dataset.id); if (!n) return;
    pushUndo();
    n.content = toggleTask(n.content, Number(cb.dataset.i));
    paintNode(n); measure(); scheduleSave();
    const ta = $('#inspContent');
    if (ta && App.sel.size === 1 && App.sel.has(n.id)) ta.value = n.content;
  });

  /* klik na šipku v buňce */
  els.nodes.addEventListener('click', (ev) => {
    const tog = ev.target.closest('.n-toggle');
    if (!tog) return;
    ev.stopPropagation();
    const n = getNode(tog.closest('.node').dataset.id);
    if (!n) return;
    if (!n.content && !n.open) { setSel(n.id); openInspector('content'); n.open = true; paintNode(n); measure(); scheduleSave(); return; }
    toggleContent(n);
  });
  /* „Zatím bez obsahu – klepni sem a piš“ má opravdu fungovat na jedno klepnutí */
  els.nodes.addEventListener('click', (ev) => {
    const hint = ev.target.closest('.n-body.empty-hint');
    if (!hint || App.tool === 'link' || Date.now() - (App.lastDragAt || 0) < 350) return;
    const host = hint.closest('.node'); if (!host) return;
    if (isCoarse() && !App.sel.has(host.dataset.id)) return;   // na dotyku první klepnutí jen vybírá
    setSel(host.dataset.id);
    openInspector('content');
  });
  els.nodes.addEventListener('blur', (ev) => {
    if (ev.target.classList && ev.target.classList.contains('n-title') && editingEl === ev.target) stopEditTitle(true);
  }, true);

  window.addEventListener('paste', onPaste);
  window.addEventListener('resize', debounce(() => { measure(); }, 150));
  /* Aplikace jde do pozadí (na telefonu ji systém může kdykoli ukončit): úpravy nejdřív
     schováme do zařízení – to je hotové hned – a teprve pak je pošleme na úložiště. */
  const stash = () => {
    pointers.clear(); pinch = null; finishGesture();
    if (!App.entry || !App.dirty) return;
    endTextEdit();
    Draft.write(App.entry);
    Saver.flush();
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stash();
    else setTimeout(() => Sync.now(), 300);
  });
  window.addEventListener('focus', () => setTimeout(() => Sync.now(), 300));
  window.addEventListener('online', () => { if (App.dirty && !Saver.busy) Saver.run(); else Sync.now(); });
  Sync.hookGestureRefresh();
  window.addEventListener('pagehide', stash);
  window.addEventListener('beforeunload', (e) => {
    if (App.entry && (App.dirty || Saver.busy)) { stash(); e.preventDefault(); e.returnValue = ''; }
  });
  Nav.init();
  try { if (history.state && history.state.mm) history.replaceState(null, ''); } catch (e) { /* nevadí */ }

  Drive.loadConfig();
  Crypt.loadSettings();

  /* obnovení posledně použité složky */
  if (!HAS_FS) {
    $('#pickLabel').textContent = 'Načíst složku s mapami';
    $('#libLead').textContent = 'Tento prohlížeč neumí zapisovat přímo do složky, proto se mapy ukládají ' +
      'do prohlížeče a kdykoli je můžeš stáhnout jako soubor. Pro plnou práci se složkou použij Chrome nebo Edge na počítači.';
    await Store.loadLocal();
  } else {
    const r = await Store.restoreFolder();
    if (r === 'needs-permission') {
      $('#btnReconnect').classList.remove('hidden');
      $('#folderPath').textContent = 'Složka „' + Store.dirName + '“ – potvrď prosím přístup';
    }
    if (!Store.dir) await Store.loadLocal(true);
  }
  if (Store.locked && !Crypt.ready) setTimeout(() => showUnlock(), 400);
  syncTools();
  showLibrary(true);
  Sync.start();
  initPWA();
}

/* ----------------------------- PWA ---------------------------------------- */
/** Service worker (start bez sítě, instalace na plochu) a obrázky poslané přes „Sdílet“.
 *  Když soubory sw.js / manifest chybí nebo stránka běží ze souboru, nic se neděje. */
async function initPWA() {
  try {
    const q = new URLSearchParams(location.search);
    if (q.has('shared')) {
      history.replaceState(history.state, '', location.pathname + location.hash);
      const waiting = await Inbox.list();
      if (waiting.length) {
        App.sharedPending = true;
        toast(waiting.length === 1 ? 'Obrázek přijat – otevři mapu a nabídne se ke vložení'
          : 'Přijato ' + waiting.length + ' ' + plural(waiting.length, 'obrázek', 'obrázky', 'obrázků') +
            ' – otevři mapu a nabídnou se ke vložení', 6000);
      } else if (q.get('shared') === '0') {
        toast('Sdílet sem jde jen obrázky', 4000);
      }
    }
  } catch (e) { /* nevadí */ }
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  try { await navigator.serviceWorker.register('sw.js'); }
  catch (e) { console.info('service worker se nezaregistroval (aplikace funguje i bez něj)', e && e.message); }
}

function syncTools() {
  $('#tLink').setAttribute('aria-pressed', String(App.tool === 'link'));
  $('#tSelect').setAttribute('aria-pressed', String(App.tool === 'select'));
}

document.addEventListener('DOMContentLoaded', init);
